# mutmut 3 configuration (spec 087, research R4).
[mutmut]
source_paths = src/homelab_proxmox_orchestrator
also_copy =
	python/tests
	python/pytest.ini
	scripts
	terraform
	Taskfile.yml
pytest_add_cli_args =
	-c
	python/pytest.ini
	-o
	addopts=
	-o
	pythonpath=src
pytest_add_cli_args_test_selection =
	python/tests
	--ignore=python/tests/guardrails
	--ignore=python/tests/workflows
