# Sudoers policy for ci user (homelab-proxmox automation)
# Install to /etc/sudoers.d/ci-homelab with mode 440

Defaults:ci !requiretty

Cmnd_Alias PVE_CMDS = /usr/sbin/qm, /usr/sbin/pct, /usr/sbin/pvesh, /usr/sbin/pveversion
Cmnd_Alias SYS_CMDS = /usr/bin/systemctl, /usr/bin/journalctl
Cmnd_Alias FS_CMDS  = /bin/mkdir, /bin/chown, /bin/chmod, /usr/bin/tee

ci ALL=(ALL) NOPASSWD: PVE_CMDS, SYS_CMDS, FS_CMDS
