# Sudoers policy for ci user (homelab-proxmox automation)
# Install to /etc/sudoers.d/ci-homelab with mode 440

Defaults:ci !requiretty

Cmnd_Alias PVE_CMDS = /usr/sbin/qm, /usr/sbin/pct, /usr/sbin/pvesm, /usr/bin/pvesh, /usr/bin/pveversion
Cmnd_Alias SYS_CMDS = /usr/bin/systemctl, /usr/bin/journalctl, /usr/sbin/visudo
Cmnd_Alias FS_CMDS  = /bin/mkdir, /usr/bin/mkdir, /bin/chown, /usr/bin/chown, /bin/chmod, /usr/bin/chmod, /bin/tee, /usr/bin/tee
Cmnd_Alias CI_FIXUP = /bin/rm -f /etc/sudoers.d/ci, /usr/bin/rm -f /etc/sudoers.d/ci

ci ALL=(ALL) NOPASSWD: PVE_CMDS, SYS_CMDS, FS_CMDS, CI_FIXUP
