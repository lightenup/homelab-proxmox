version: '3'

# Homelab Proxmox Taskfile
# Operator commands for service lifecycle, infrastructure management, and disaster recovery.
# Default environment: LAB (10.99.0.10) unless specified otherwise
# Production requires explicit confirmation strings

env:
  PYTHONPATH: python/src

tasks:
  default:
    desc: Show available commands with usage examples
    silent: true
    cmds:
      - |
        echo "Homelab Proxmox Tasks"
        echo "====================="
        echo ""
        echo "Quick Start:"
        echo "  task ansible:mounts          # Deploy NFS mounts to PROD (192.168.1.112)"
        echo "  task rebuild:plan            # Test rebuild orchestrator (safe)"
        echo "  task healthcheck:run         # Run health checks"
        echo ""
        echo "Common Workflows:"
        echo "  task ansible:host            # Configure Proxmox host (PROD)"
        echo "  task lifecycle:plan          # Plan LXC changes (requires ENVIRONMENT= SERVICE=)"
        echo "  task terraform:plan          # Terraform infrastructure plan"
        echo ""
        echo "Run 'task --list' for all available tasks"
        echo "Run 'task <task-name> --help' for detailed help (if supported)"

  service:add:
    desc: "[LAB] Add a new service to the service catalog"
    summary: |
      Add a service definition to the catalog for deployment.
      Environment: LAB
      Example: task service:add -- --name myservice --type lxc
    cmds:
      - python3 -m homelab_proxmox_orchestrator.ops_cli service add {{.CLI_ARGS}}

  service:change:
    desc: "[LAB] Modify an existing service configuration"
    summary: |
      Update service parameters in the catalog.
      Environment: LAB
      Example: task service:change -- --name myservice --cpu 4
    cmds:
      - python3 -m homelab_proxmox_orchestrator.ops_cli service change {{.CLI_ARGS}}

  service:remove:
    desc: "[LAB] Remove a service from the catalog"
    summary: |
      Delete a service definition (with verification).
      Environment: LAB
      Example: task service:remove -- --name myservice
    cmds:
      - python3 -m homelab_proxmox_orchestrator.ops_cli service remove --verify {{.CLI_ARGS}}

  inventory:update:
    desc: "Regenerate Ansible inventory from Proxmox state"
    summary: |
      Query Proxmox and update Ansible inventory files.
      Used by: Ansible playbooks, rebuild orchestrator
      Example: task inventory:update
    cmds:
      - python3 -m homelab_proxmox_orchestrator.ops_cli inventory update {{.CLI_ARGS}}

  healthcheck:run:
    desc: "Run service health checks across all environments"
    summary: |
      Execute health check suite against deployed services.
      Targets: All registered services
      Example: task healthcheck:run
      With drift: task healthcheck:run -- --check-drift
    cmds:
      - python3 -m homelab_proxmox_orchestrator.ops_cli healthcheck run {{.CLI_ARGS}}

  terraform:validate:
    desc: "[SAFE] Validate Terraform configuration (fmt + validate)"
    summary: |
      Run terraform fmt and validate checks.
      Safe: Does not modify infrastructure
      Example: task terraform:validate
    cmds:
      - python3 -m homelab_proxmox_orchestrator.ops_cli terraform validate {{.CLI_ARGS}}

  terraform:plan:
    desc: "[SAFE] Generate Terraform execution plan"
    summary: |
      Create plan for infrastructure changes.
      Safe: Does not apply changes
      Example: task terraform:plan
    cmds:
      - python3 -m homelab_proxmox_orchestrator.ops_cli terraform plan {{.CLI_ARGS}}

  terraform:apply:
    desc: "[DESTRUCTIVE] Apply Terraform changes (requires CONFIRM=yes)"
    summary: |
      Execute infrastructure changes from Terraform plan.
      Requires: CONFIRM=yes
      Example: task terraform:apply CONFIRM=yes
    preconditions:
      - sh: 'test "{{.CONFIRM}}" = "yes"'
        msg: "Refusing to run terraform apply without explicit confirmation. Re-run with: task terraform:apply CONFIRM=yes -- [args]"
    cmds:
      - python3 -m homelab_proxmox_orchestrator.ops_cli terraform apply --confirm {{.CLI_ARGS}}

  lifecycle:plan:
    desc: "[SAFE] Plan LXC lifecycle changes (requires ENVIRONMENT= SERVICE=)"
    summary: |
      Generate plan for LXC create/destroy/update operations.
      Requires: ENVIRONMENT=<lab|static> SERVICE=<service-name>
      Safe: Does not apply changes
      Example: task lifecycle:plan ENVIRONMENT=lab SERVICE=immich
    cmds:
      - scripts/lifecycle/terraform_plan_apply.sh plan --environment {{.ENVIRONMENT}} --service {{.SERVICE}} {{.CLI_ARGS}}

  lifecycle:apply:
    desc: "[DESTRUCTIVE] Apply LXC lifecycle changes (requires CONFIRM=yes)"
    summary: |
      Execute LXC lifecycle plan.
      Requires: CONFIRM=yes ENVIRONMENT= SERVICE= PLAN_RUN_ID=
      Example: task lifecycle:apply CONFIRM=yes ENVIRONMENT=lab SERVICE=immich PLAN_RUN_ID=<run-id>
    preconditions:
      - sh: 'test "{{.CONFIRM}}" = "yes"'
        msg: "Refusing to run lifecycle:apply without explicit confirmation. Re-run with: task lifecycle:apply CONFIRM=yes -- [args]"
    cmds:
      - scripts/lifecycle/terraform_plan_apply.sh apply --environment {{.ENVIRONMENT}} --service {{.SERVICE}} --from-plan-run-id {{.PLAN_RUN_ID}} {{.CLI_ARGS}}

  lifecycle:verify:
    desc: "Verify LXC state matches expected (inventory + health checks)"
    summary: |
      Update inventory and run health checks to detect drift.
      Example: task lifecycle:verify
    cmds:
      - python3 -m homelab_proxmox_orchestrator.ops_cli inventory update
      - python3 -m homelab_proxmox_orchestrator.ops_cli healthcheck run -- --check-drift

  rebuild:plan:
    desc: "[SAFE] [LAB] Test rebuild orchestrator (non-destructive)"
    summary: |
      Execute rebuild orchestrator in plan-only mode.
      Target: LAB environment (10.99.0.10)
      Safe: Does not modify infrastructure
      Examples:
        task rebuild:plan                                    # All phases
        task rebuild:plan -- --phase mounts                   # Single phase
        task rebuild:plan -- --phase restore --backup-dir /path/to/backup
    cmds:
      - scripts/rebuild/run-rebuild.sh --mode plan {{.CLI_ARGS}}

  rebuild:apply:
    desc: "[DESTRUCTIVE] Apply rebuild changes (requires CONFIRM=<string>)"
    summary: |
      Execute rebuild orchestrator with actual changes.
      Requires: CONFIRM=<environment-specific-string>
        LAB: CONFIRM=rebuild-lab
        PROD: CONFIRM=rebuild-prod
      Example: task rebuild:apply CONFIRM=rebuild-lab -- --phase restore --backup-dir /path/to/backup
    preconditions:
      - sh: 'test -n "{{.CONFIRM}}"'
        msg: "Refusing to run rebuild apply without explicit confirmation. Re-run with: task rebuild:apply CONFIRM=<confirm-string> -- [args]"
    cmds:
      - scripts/rebuild/run-rebuild.sh --mode apply --confirm {{.CONFIRM}} {{.CLI_ARGS}}

  deploy:lab:
    desc: "[LAB] Deploy/update a service in lab environment"
    summary: |
      Full deployment workflow for lab services.
      Target: LAB (10.99.0.10)
      Example: task deploy:lab -- --service immich
    cmds:
      - python3 -m homelab_proxmox_orchestrator.ops_cli deploy lab {{.CLI_ARGS}}

  summary:render:
    desc: "Convert deployment evidence to human-readable summary"
    summary: |
      Generate markdown/text summary from evidence artifacts.
      Use after: Any task that generates evidence (rebuild, lifecycle, deploy)
      Example: task summary:render -- --run-id <run-id>
    cmds:
      - python3 -m homelab_proxmox_orchestrator.ops_cli summary render {{.CLI_ARGS}}

  dr:hetzner:list:
    desc: "[DR] List backup objects in Hetzner storage"
    summary: |
      Query Hetzner Object Storage for disaster recovery backups.
      Use for: DR drill planning, backup verification
      Example: task dr:hetzner:list
    dir: scripts/dr
    cmds:
      - bash ./hetzner_list.sh {{.CLI_ARGS}}

  dr:hetzner:download:
    desc: "[DR] Download backup objects from Hetzner storage"
    summary: |
      Retrieve DR backups from Hetzner Object Storage.
      Example: task dr:hetzner:download -- <backup-object-name>
    dir: scripts/dr
    cmds:
      - bash ./hetzner_download.sh {{.CLI_ARGS}}

  dr:verify-restore:
    desc: "[DR] Verify integrity of extracted backup data"
    summary: |
      Validate restored photos/data after DR recovery.
      Example: task dr:verify-restore -- --restore-dir /path/to/extracted
    dir: scripts/dr
    cmds:
      - bash ./verify_restore.sh {{.CLI_ARGS}}

  ansible:host:
    desc: "[PROD] Configure Proxmox host (mounts, packages, Tailscale)"
    summary: |
      Full Proxmox host configuration via Ansible.
      Target: PROD (192.168.1.112)
      Includes: NFS mounts, base packages, Tailscale
      Example: task ansible:host
      Check mode: task ansible:host -- --check
    dir: ansible
    cmds:
      - ansible-playbook -i inventories/prod/hosts.yml playbooks/host_proxmox.yml --vault-password-file .vault-pass.txt {{.CLI_ARGS}}

  ansible:mounts:
    desc: "[PROD] Configure NAS NFS mounts on Proxmox host"
    summary: |
      Deploy/update NAS NFS mount configuration via IaC.
      Target: PROD (192.168.1.112)
      Manages: every NAS mount in /mnt/nas/* (roles/proxmox_mounts)
      Example: task ansible:mounts
      Check mode: task ansible:mounts -- --check
    dir: ansible
    cmds:
      - ansible-playbook -i inventories/prod/hosts.yml playbooks/host_proxmox.yml --vault-password-file .vault-pass.txt --tags mounts {{.CLI_ARGS}}

  ansible:backup:
    desc: "[PROD] Deploy/update Proxmox backup system"
    summary: |
      Configure automated Proxmox configuration backups.
      Target: PROD (192.168.1.112)
      Includes: Backup script, systemd timer, NAS mount
      Example: task ansible:backup
      Check mode: task ansible:backup -- --check
    dir: ansible
    cmds:
      - ansible-playbook -i inventories/prod/hosts.yml playbooks/backup_proxmox.yml --vault-password-file .vault-pass.txt {{.CLI_ARGS}}

  ansible:alloy:
    desc: "[PROD] Roll the Alloy log collector to every service LXC and pve"
    summary: |
      Apply only the alloy role everywhere (config or version change). Alloy is PROD-only.
      Target: PROD (all service LXCs + 192.168.1.112)
      A discovery-label change makes each host re-send container logs once: silence the
      log-pipeline alerts first (docs/operations/monitoring/logging.md section 7).
      Example: task ansible:alloy
      One host: task ansible:alloy -- --limit hermes
    dir: ansible
    cmds:
      - ansible-playbook -i inventories/prod/hosts.yml playbooks/alloy.yml --vault-password-file .vault-pass.txt {{.CLI_ARGS}}

  ansible:heartbeat:
    desc: "[PROD] Deploy the alerting-path heartbeat timer on pve"
    summary: |
      Out-of-band check of the alerting path: pages Pushover directly if the Watchdog alert
      is missing from Alertmanager (docs/operations/monitoring/alerting-heartbeat.md).
      Target: PROD (192.168.1.112)
      Example: task ansible:heartbeat
    dir: ansible
    cmds:
      - ansible-playbook -i inventories/prod/hosts.yml playbooks/host_proxmox.yml --vault-password-file .vault-pass.txt --tags alerting_heartbeat {{.CLI_ARGS}}

  mutmut:pull:
    desc: "[LOCAL] Pull main's published mutation results from the NAS via ci@pve (spec 087)"
    summary: |
      Pulls the nightly's published mutation result set for main (contracts/published-results.md)
      from /mnt/nas/homelab_ci/mutmut/main on ci@pve into the local mutants/ directory, replacing
      only the result files (never mutants/ wholesale, so also_copy'd sources are untouched).
      Prints the commit, age and score, then the next commands for the Mac loop
      (docs/operations/mutation-testing.md): mutmut run, mutmut run "<module>*", mutmut browse.
      Example: task mutmut:pull
      Alternate host: MUTMUT_PULL_HOST=ci@pve task mutmut:pull
    cmds:
      - |
        set -euo pipefail
        host="${MUTMUT_PULL_HOST:-ci@pve}"
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT

        if ! rsync -a "$host:/mnt/nas/homelab_ci/mutmut/main/" "$tmp/"; then
          echo "error: could not pull from $host:/mnt/nas/homelab_ci/mutmut/main/ (is pve reachable and has a nightly published?)" >&2
          exit 1
        fi

        if ! python3 -c "
        import json, sys
        with open('$tmp/report.json') as f:
            r = json.load(f)
        sys.exit(0 if r.get('schema') == 1 else 1)
        " 2>/dev/null; then
          echo "error: $tmp/report.json is missing or not schema 1" >&2
          exit 1
        fi

        mkdir -p mutants
        rm -f mutants/mutmut-stats.json mutants/mutmut-cicd-stats.json
        find mutants -name '*.meta' -delete
        rsync -a "$tmp/" mutants/

        python3 -c "
        import json
        from datetime import datetime, timezone
        with open('mutants/report.json') as f:
            r = json.load(f)
        finished = datetime.strptime(r['finished_at'], '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=timezone.utc)
        age_hours = (datetime.now(timezone.utc) - finished).total_seconds() / 3600
        print(f\"commit {r['commit']}\")
        print(f\"finished_at {r['finished_at']}  (age {age_hours:.1f}h)\")
        print(f\"score {r['score']:.2f}%  gate {r['gate']:.2f}%\")
        "
        echo ""
        echo "Next:"
        mutmut_bin=".venv/bin/mutmut"
        [ -x "$mutmut_bin" ] || mutmut_bin=".venv-mutmut/bin/mutmut"
        echo "  task mutmut:run                                          # re-test local source changes"
        echo "  task mutmut:run -- \"homelab_proxmox_orchestrator.<module>*\"  # after editing a module's tests"
        echo "  task mutmut:browse                                       # inspect survivors"
        echo "  (or directly: $mutmut_bin run / browse)"

  mutmut:run:
    desc: "[LOCAL] Run mutmut against the local mutants/ (pulled or gate-produced) (spec 087)"
    summary: |
      Thin wrapper that finds the mutmut venv (.venv, else .venv-mutmut) and runs `mutmut run`.
      The venv must be Python 3.11, the nightly's version: mutmut's per-function cache keys on
      ast.dump, so on another version the first run after a pull re-tests everything (~2 min).

      With no args, re-tests only what changed since the last run (mutmut 3's per-function
      caching) — cheap after `task mutmut:pull`. mutmut 3 does NOT notice a test-only edit on its
      own (research R3): after editing a test, pass the module pattern explicitly, or nothing
      will re-test.
      Example: task mutmut:run
      One module after editing its tests: task mutmut:run -- "homelab_proxmox_orchestrator.version_currency*"
    cmds:
      - |
        set -euo pipefail
        mutmut_bin=".venv/bin/mutmut"
        [ -x "$mutmut_bin" ] || mutmut_bin=".venv-mutmut/bin/mutmut"
        if [ ! -x "$mutmut_bin" ]; then
          echo "error: no mutmut binary in .venv or .venv-mutmut. See docs/operations/mutation-testing.md (Python 3.11 note)." >&2
          exit 1
        fi
        py="$(dirname "$mutmut_bin")/python"
        if [ "$("$py" -c 'import sys; print("%d.%d" % sys.version_info[:2])')" != "3.11" ]; then
          echo "warning: $mutmut_bin is not Python 3.11 (the nightly's version); pulled results will all re-test." >&2
          echo "         See docs/operations/mutation-testing.md (Python 3.11 note)." >&2
        fi
        "$mutmut_bin" run {{.CLI_ARGS}}

  mutmut:browse:
    desc: "[LOCAL] Open mutmut's survivor browser on the local mutants/ (spec 087)"
    summary: |
      Thin wrapper, same venv detection as mutmut:run. Refuses to start when mutants/ holds no
      results: mutmut browse would otherwise show 0 for every module, which looks like real data.
      Example: task mutmut:browse
    cmds:
      - |
        set -euo pipefail
        mutmut_bin=".venv/bin/mutmut"
        [ -x "$mutmut_bin" ] || mutmut_bin=".venv-mutmut/bin/mutmut"
        if [ ! -x "$mutmut_bin" ]; then
          echo "error: no mutmut binary in .venv or .venv-mutmut. See docs/operations/mutation-testing.md (Python 3.11 note)." >&2
          exit 1
        fi
        if ! find mutants/src -name '*.meta' 2>/dev/null | grep -q .; then
          echo "error: no mutation results in mutants/. Run 'task mutmut:pull' (main's nightly) or 'task mutmut:gate' first." >&2
          exit 1
        fi
        "$mutmut_bin" browse

  mutmut:gate:
    desc: "[LOCAL] Run the full mutation gate exactly as CI does (spec 087, FR-001 parity)"
    summary: |
      Runs scripts/ci/mutmut-threshold.sh with PYTHON_BIN auto-detected the same way as
      mutmut:run. This is a FRESH FULL RUN every time (no incremental mode, spec Clarifications):
      it deletes mutants/ first, so it discards anything task mutmut:pull brought down. Use this
      to reproduce a CI score locally (parity check) or to measure a floor-raising change
      end to end; use mutmut:run for the fast local survivor loop instead.
      Takes roughly 2 minutes on the Mac.
      Example: task mutmut:gate
    cmds:
      - |
        set -euo pipefail
        python_bin=".venv/bin/python"
        if [ ! -x "$python_bin" ] || ! "$python_bin" -c 'import mutmut' 2>/dev/null; then
          python_bin=".venv-mutmut/bin/python"
        fi
        if [ ! -x "$python_bin" ]; then
          echo "error: no Python with mutmut installed in .venv or .venv-mutmut. See docs/operations/mutation-testing.md (Python 3.11 note)." >&2
          exit 1
        fi
        PYTHON_BIN="$python_bin" bash scripts/ci/mutmut-threshold.sh

  mutmut:status:
    desc: "[LOCAL] Print the local mutants/report.json summary without re-running anything (spec 087)"
    summary: |
      Reads mutants/report.json as-is (from the last mutmut:pull or mutmut:gate) and prints the
      same commit/age/score/gate summary mutmut:pull prints, plus the top 5 survivor modules.
      Fails clearly if mutants/report.json does not exist yet.
      Example: task mutmut:status
    cmds:
      - |
        set -euo pipefail
        if [ ! -f mutants/report.json ]; then
          echo "error: mutants/report.json not found. Run 'task mutmut:pull' or 'task mutmut:gate' first." >&2
          exit 1
        fi
        python3 -c "
        import json
        from datetime import datetime, timezone
        with open('mutants/report.json') as f:
            r = json.load(f)
        finished = datetime.strptime(r['finished_at'], '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=timezone.utc)
        age_hours = (datetime.now(timezone.utc) - finished).total_seconds() / 3600
        print(f\"commit {r['commit']}\")
        print(f\"finished_at {r['finished_at']}  (age {age_hours:.1f}h)\")
        print(f\"score {r['score']:.2f}%  gate {r['gate']:.2f}%  (floor {r['floor']:.2f}%  margin {r['margin']:.2f})\")
        print()
        print('Top survivor modules:')
        for m in r['survivors_by_module'][:5]:
            print(f\"  {m['survived']:>4}  {m['module']}\")
        "
