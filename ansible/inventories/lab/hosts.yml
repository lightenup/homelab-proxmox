all:
  vars:
    lab_inventory: true
  children:
    lab:
      hosts:
        lab-pve-01:
          ansible_host: 10.99.0.10
          ansible_user: ansible
          # CI/Lab: when running on the Proxmox host, connect directly to the VM.
          ansible_ssh_common_args: '-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null'
