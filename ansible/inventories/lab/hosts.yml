all:
  children:
    lab:
      hosts:
        lab-pve-01:
          ansible_host: 10.99.0.10
          ansible_user: ansible
          # ProxyJump via the production Proxmox host
          # Assumes 'proxmox' is resolvable and accessible via SSH keys for root
          ansible_ssh_common_args: '-o ProxyJump=root@192.168.1.112 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
