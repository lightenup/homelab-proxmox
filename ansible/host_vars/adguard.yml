healthcheck_url:
  scheme: http
  port: 3000
  path: /
healthcheck_profile: lan
healthcheck_expect_status: 200

# Monitoring contract for Prometheus self-registration (FR-013, US-3)
monitoring_contract:
  enabled: false  # Re-enable after candidate #8 (AdGuard LXC provisioning)
  scrape_targets:
    - job_name: "adguard-exporter"
      port: 9618
      path: "/metrics"
      scrape_interval: "30s"
  alert_rules:
    - alert: AdGuardHighBlockedRate
      expr: |
        adguard_blocked_filtered / adguard_queries > 0.5
      for: "10m"
      severity: "warning"
      summary: !unsafe "AdGuard block rate abnormally high on {{ $labels.instance }}"
      description: !unsafe "More than 50% of DNS queries are being blocked for 10 minutes (current: {{ $value | printf \"%.2f\" }}). Check filter lists for misconfiguration."
  dashboard_file: "grafana/dashboards/adguard-home.json"
