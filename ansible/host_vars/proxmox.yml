healthcheck_url:
  scheme: https
  port: 8006
  path: /api2/json/version
healthcheck_profile: lan
healthcheck_verify_ssl: false
healthcheck_expect_status: 401

# Alloy log collector (spec 092): pve has no Docker.
alloy_docker_logs: false

# ci (state-drift-check.service) writes state_drift.prom here via the node_exporter group (067).
node_exporter_textfile_directory_mode: "0775"
