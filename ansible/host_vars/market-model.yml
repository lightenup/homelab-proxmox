healthcheck_url:
  scheme: http
  port: 8000
  path: /healthz
healthcheck_profile: lan
healthcheck_expect_status: 200

monitoring_contract:
  enabled: true
  scrape_targets: []
  liveness_targets:
    - job_name: "market-model-api"
      url: "http://192.168.1.218:8000/healthz"
      module: http_2xx
  alert_rules:
    - alert: MarketModelDown
      expr: |
        probe_success{job="market-model-api"} == 0
      for: "5m"
      severity: critical
      summary: !unsafe "market-model is down on {{ $labels.instance }}"
      description: !unsafe "The market-model API has been unreachable for more than 5 minutes (instance: {{ $labels.instance }})."
