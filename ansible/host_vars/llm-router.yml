healthcheck_url:
  scheme: http
  port: 4000
  path: /health/readiness
healthcheck_profile: lan
healthcheck_expect_status: 200

# D-105 (verified empirically, see research.md): LiteLLM's OSS /metrics IS populated once
# `litellm_settings.callbacks: [prometheus]` is set (config.yaml.j2 does this). Real metric
# names confirmed against the pinned v1.83.3-stable image: litellm_deployment_state,
# litellm_deployment_success_responses_total, litellm_deployment_failure_responses_total,
# litellm_spend_metric_total, litellm_remaining_api_key_budget_metric,
# litellm_remaining_team_budget_metric. No bearer_token is set below — deliberately: LiteLLM's
# `require_auth_for_metrics_endpoint: true` hangs indefinitely on the master key against this
# pinned version (reproduced locally), so the endpoint is left at LiteLLM's own open default.
# See config.yaml.j2 and research.md D-105 for the full account.
monitoring_contract:
  enabled: true
  scrape_targets:
    - job_name: "llm-router"
      port: 4000
      path: /metrics/
  liveness_targets:
    - job_name: "llm-router-readiness"
      url: "http://192.168.1.220:4000/health/readiness"
      module: http_2xx
      # The apex /api/status endpoint is public and unauthenticated, and returns
      # probe_success with its instance label. Without this override that label is the raw
      # URL above, publishing an internal address and port to the internet (FR-008).
      instance_label: "llm-router-readiness"
  dashboard_file: "grafana/dashboards/llm-router.json"
  alert_rules:
    - alert: LlmRouterDown
      expr: |
        probe_success{job="llm-router-readiness"} == 0
      for: "5m"
      severity: critical
      summary: !unsafe "llm-router is down on {{ $labels.instance }}"
      description: !unsafe "The llm-router gateway (or its database) has been unreachable for more than 5 minutes (instance: {{ $labels.instance }})."
    - alert: LlmRouterLocalTierDown
      expr: |
        litellm_deployment_state{model_id=~".*-local"} != 0
      # 11m, raised from 5m on 2026-09-22 alongside llm_router_health_check_interval going
      # 60s -> 300s. The gauge only refreshes when a health check runs, so at the new cadence
      # ONE failed check holds it at 1 for a full 300s — which met the old `for: 5m` exactly
      # and would have made this rule strictly more trigger-happy than before. 11m needs two
      # consecutive failed checks, preserving what the rule meant at 60s/5m.
      for: "11m"
      severity: info
      summary: !unsafe "llm-router local tier (Mac) is down"
      description: !unsafe >-
        A local-tier deployment has left the healthy pool across two consecutive background
        health checks. This is expected when the Mac is asleep or off the tailnet —
        informational only, not an incident (FR-009). Routed to Pushover at priority -1, so
        it is delivered silently rather than as a notification (043 FR-016).
    - alert: LlmRouterAllBackendsFailing
      expr: |
        sum(rate(litellm_deployment_failure_responses_total[10m])) / (sum(rate(litellm_deployment_failure_responses_total[10m])) + sum(rate(litellm_deployment_success_responses_total[10m]))) > 0.9
      for: "10m"
      severity: critical
      summary: !unsafe "llm-router: over 90% of requests are failing across all deployments"
      description: !unsafe >-
        The gateway is up but every backend is failing under load — the readiness probe alone
        would miss this (FR-018). This alert requires client traffic to fire;
        LlmRouterCanaryFailing covers the no-traffic case.
    # warning, NOT critical — changed 2026-09-22, and the severity is the whole point of the
    # change. Alertmanager maps critical to Pushover priority 2 (emergency), which re-delivers
    # to the phone every 60s for up to an hour until acknowledged in the app. Paired with
    # `for: "0m"` and an hourly metric, ONE transient failure produced up to 60 phone alerts.
    #
    # What made that intolerable is that the failure is routine, not exceptional: the Mac's
    # oMLX returns 400 "prefill memory guard rejected this prompt" whenever GPU memory is
    # tight, and the guard's projection is dominated by a 20-37 GB KV/SDPA transient rather
    # than by prompt size — so even this canary's 14-token max_tokens:1 request gets refused.
    # Measured 2026-09-22: 244 such 400s in 24h, 488 of 503 against model group `fast`, which
    # is exactly what this canary calls.
    #
    # `for: "0m"` deliberately stays. The metric is a LEVEL refreshed hourly by a systemd
    # timer, so any `for:` is additive on top of an up-to-60-minute sampling gap and would
    # only delay SC-013 ("an alert fires within one canary interval") without suppressing
    # anything. Tolerance belongs at the source instead, and now lives there: canary.sh
    # retries llm_router_canary_attempts times before it writes a 0, so this firing means
    # three consecutive failures, not one blip.
    #
    # CONSEQUENCE, recorded so it is not rediscovered as a surprise: contracts/monitoring.md
    # relied on this rule to be the critical for "Mac away, no client traffic". Nothing pages
    # at emergency priority for that case any more. That is the account owner's decision of
    # 2026-09-22 (the Mac is a laptop that legitimately sleeps), and it settles FR-009's
    # flagged open question. LlmRouterAllBackendsFailing still raises a critical whenever real
    # traffic is broadly failing.
    - alert: LlmRouterCanaryFailing
      expr: |
        llm_router_canary_success == 0
      for: "0m"
      severity: warning
      summary: !unsafe "llm-router: synthetic canary request failed"
      description: !unsafe >-
        The low-cadence canary against {{ $labels.alias }} failed on every attempt. Unlike
        LlmRouterAllBackendsFailing, this fires even with zero client traffic (FR-018, SC-013)
        — the metric comes from a systemd-timer script via node_exporter's textfile collector,
        not from LiteLLM itself. The usual cause is oMLX's prefill memory guard refusing the
        request while the Mac is under memory pressure; check the gateway's 400 rate before
        assuming an outage.
    - alert: LlmRouterBudgetCapExhausted
      expr: |
        litellm_remaining_team_budget_metric{team_alias="llm-router-gateway-wide"} <= 0
      for: "1m"
      severity: critical
      summary: !unsafe "llm-router: gateway-wide spend cap exhausted"
      description: !unsafe >-
        The gateway-wide backstop budget is exhausted — every client is now refused, not just
        one (FR-010, SC-012). Distinguish this from a per-client budget breach, which is
        expected behaviour and not alerted.
    # FR-010's OTHER gateway-wide cap. Added 2026-09-20 with the rate limit itself
    # (backlog 071) — until then the team carried rpm=None and there was nothing to alert on.
    #
    # Why it counts DISTINCT clients rather than reading a limit directly: LiteLLM emits the
    # same metric and the same label set for a team-level refusal as for a key-level one
    # (verified 2026-09-20 — only the error BODY distinguishes them, saying "for team:"
    # instead of "for api_key:"). So there is no series that means "the gateway cap bound".
    #
    # What does separate them is blast radius: one client hitting its OWN limit produces 429s
    # under exactly one api_key_alias, which is working as designed and deliberately not
    # alerted. The shared cap binding starves whoever else is calling, so 429s appear under
    # two or more aliases at once. That is the signal.
    #
    # warning, not critical: the window resets every minute and the backstop is doing its job.
    # It means the homelab is running at its ceiling — worth knowing, not an outage.
    - alert: LlmRouterGatewayRateCapBinding
      expr: |
        count(count by (api_key_alias) (rate(litellm_proxy_failed_requests_metric_total{exception_status="429", team_alias="llm-router-gateway-wide"}[5m]) > 0)) > 1
      for: "5m"
      severity: warning
      summary: !unsafe "llm-router: the gateway-wide rate cap is refusing multiple clients"
      description: !unsafe >-
        More than one client is being refused with 429 at the same time. The usual cause is
        the shared gateway-wide rate cap binding (FR-010) — the homelab is at its ceiling, or
        one client's rpm_limit is too generous relative to
        llm_router_gateway_budget.rpm_limit. KNOWN AMBIGUITY, because LiteLLM gives metrics no
        label for which limit was hit: two clients independently breaching their OWN limits at
        the same moment produce the identical signal. To tell them apart, read a refusal body
        — it says "for team:" or "for api_key:". A single client over its own limit affects
        one api_key_alias only and does not fire this, which is the case worth excluding.
