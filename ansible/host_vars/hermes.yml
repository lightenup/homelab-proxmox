healthcheck_url:
  scheme: http
  port: 8080
  path: /health
healthcheck_profile: lan
healthcheck_expect_status: 200

# monitoring_contract (spec 065, contracts/monitoring.md § Signals).
#
# scrape_targets: [] — Open WebUI ships no Prometheus /metrics endpoint. Verified against
# upstream source, 2026-09-20: no prometheus/instrumentator dependency in
# backend/requirements.txt and no "metrics"/"prometheus" reference anywhere in
# backend/open_webui/main.py. FR-018's "if the application exposes one" clause is therefore
# answered — it does not, so there is nothing to add here (T087).
monitoring_contract:
  enabled: true
  scrape_targets: []
  liveness_targets:
    - job_name: "hermes"
      url: "https://hermes.{{ caddy_base_domain }}/"
      module: http_2xx
      # No instance_label override needed, unlike llm-router's internal-port probe: this URL
      # is already the public hostname, so relabeling the __param_target as `instance` here
      # publishes nothing that isn't already public (financial-scenario's own pattern).
  alert_rules:
    - alert: HermesDown
      expr: |
        probe_success{job="hermes"} == 0
      for: "5m"
      severity: critical
      summary: !unsafe "hermes is down on {{ $labels.instance }}"
      description: !unsafe >-
        Hermes has been unreachable for more than 5 minutes. This is also the signal the
        front-page card reads (FR-017) — the owner's only route in is gone.
    # Scheduler watchdog (US4, R-007). The heartbeat job refreshes the metric every 15 min; it
    # ages past 1 h only if the agent's scheduler stopped ticking. absent() covers a job that
    # was never created. Independent of ntfy: it goes through Alertmanager.
    - alert: HermesAgentCronStale
      expr: |
        time() - hermes_agent_heartbeat_timestamp_seconds > 3600 or absent(hermes_agent_heartbeat_timestamp_seconds)
      for: "5m"
      severity: warning
      summary: "Hermes agent scheduler is not ticking"
      description: >-
        The Hermes agent scheduler has not run its heartbeat for more than an hour. Scheduled
        jobs are not running; this is a stopped scheduler, not a job that found nothing to report.
  # Per-service log rules. The first is 092's error-rate rule (FR-008, research R8; WARNINGs are
  # not ERRORs, so ntfy stream errors never count here). The two `kind: event` rules are 095's:
  # they fire on any single matching line, so they carry no error-rate baseline.
  log_alert_rules:
    - alert: HermesErrorLogs
      expr: |
        sum(count_over_time({env="prod", host="hermes", container=~"hermes_open_webui|hermes_agent"} |~ "[| ](ERROR|CRITICAL)[ |]" [15m])) > 5
      for: "0m"
      severity: warning
      summary: !unsafe 'hermes is logging errors — Explore: {host="hermes", container=~"hermes_open_webui|hermes_agent"} |~ "[| ](ERROR|CRITICAL)[ |]"'
      description: >-
        More than 5 ERROR/CRITICAL log lines in 15 minutes from Open WebUI or hermes-agent.
        Grafana -> Explore -> Loki: {host="hermes"} |~ "[| ](ERROR|CRITICAL)[ |]".
      enabled: false
      disabled_reason: "awaiting 7-day baseline (SC-004)"
    # 095 T023 (FR-004/FR-005, research R-014): `/approve always` lets scheduled jobs run that
    # pattern until the agent restarts, and no config can remove the choice upstream. The line is
    # INFO, so it exists only in gateway.log (T072), never on container stdout (T008 step 2).
    - alert: HermesPermanentApprovalGranted
      kind: event
      expr: |
        sum(count_over_time({env="prod", host="hermes", source="file", filename="/var/log/hermes-agent/gateway.log"} |= "via /approve (always)" [5m])) > 0
      for: "0m"
      severity: warning
      summary: !unsafe 'A permanent command approval was granted on Hermes. Explore: {host="hermes", source="file"} |= "via /approve (always)"'
      description: >-
        Someone answered an approval prompt with /approve always (or a bare "always"/"remember").
        Scheduled jobs now skip their refusal for that command pattern until the agent restarts
        (spec 095 FR-004/FR-005, research R-014). If it was not intended, revoke it with
        `docker restart hermes_agent` on the hermes LXC.
      enabled: true
    # 095 T030 (FR-006, research R-007.2): after 095 the agent's token can read hermes-in, so
    # the 093 403 noise is gone and a sustained `Stream error` is a real outage of the phone
    # channel. The adapter backs off to one WARNING per 60 s (measured, T008 step 9), so [5m]
    # always sees one while it lasts; for: 10m ignores short blips. WARNINGs reach stdout.
    - alert: HermesNtfyStreamDown
      kind: event
      expr: |
        sum(count_over_time({env="prod", host="hermes", container="hermes_agent"} |= "Stream error" [5m])) > 0
      for: "10m"
      severity: warning
      summary: !unsafe 'Hermes cannot reach ntfy: phone chat is down. Explore: {host="hermes", container="hermes_agent"} |= "Stream error"'
      description: >-
        The Hermes agent has logged ntfy stream errors for over 10 minutes, so messages sent
        from the phone on hermes-in are not being received (spec 095 US3). Messages sent during
        the outage are not replayed. Check ntfy and the reverse proxy, then the agent's egress.
      enabled: true

# Alloy (spec 092): also collect Hermes's own gateway.log (095 T072). Its INFO lines are the
# audit trail for inbound messages, approvals, denials and refused commands (research R-008);
# container stdout carries WARNING and above only. Exact path, not a glob: alloy's readability
# check skips globs, and a glob would re-read rotated gateway.log.N files as new streams.
alloy_file_logs:
  - path_glob: "/var/log/hermes-agent/gateway.log"
