healthcheck_url:
  scheme: http
  port: 2021
  path: /healthz
healthcheck_profile: both
healthcheck_expect_status: 200

# fail2ban jail configuration (FR-009, FR-010)
# Feature: 042-monitoring-tier-c
fail2ban_jails:
  - name: sshd
    backend: systemd
    maxretry: 5
    bantime: 3600
    findtime: 600

# Monitoring contract for Prometheus self-registration (FR-007, US-4)
monitoring_contract:
  enabled: true
  scrape_targets:
    - job_name: "caddy"
      port: 9180
      path: "/metrics"
      scrape_interval: "30s"
    - job_name: "fail2ban-exporter-reverse-proxy"
      port: 9191
      path: "/metrics"
  alert_rules:
    - alert: CaddyHighErrorRate
      expr: |
        sum(rate(caddy_http_requests_total{code=~"5.."}[5m])) / sum(rate(caddy_http_requests_total[5m])) > 0.05
      for: "5m"
      severity: "warning"
      summary: "Caddy high 5xx error rate"
      description: !unsafe "More than 5% of Caddy responses are 5xx errors over the last 5 minutes (current: {{ $value | printf \"%.2f\" }}%)."
  dashboard_file: "grafana/dashboards/caddy-reverse-proxy.json"
