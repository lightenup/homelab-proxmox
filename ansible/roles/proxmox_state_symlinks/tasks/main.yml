---
# ansible/roles/proxmox_state_symlinks/tasks/main.yml
# Purpose: Create symlinks from legacy state paths to NAS for backward compatibility
# Task: D-007 from specs/033-idempotent-rebuild/plan-delta-state-storage.md

- name: Check if legacy state directory exists
  ansible.builtin.stat:
    path: /var/lib/homelab-proxmox/state/services
  register: legacy_state

- name: Create backup of legacy state directory if it exists and is not a symlink
  when:
    - legacy_state.stat.exists
    - not legacy_state.stat.islnk
    - proxmox_state_symlinks_enabled | default(false) | bool
  block:
    - name: Create backup directory
      ansible.builtin.file:
        path: /var/lib/homelab-proxmox/state-backup-{{ ansible_date_time.epoch }}
        state: directory
        mode: '0700'
      register: backup_dir

    - name: Copy legacy state to backup
      ansible.builtin.copy:
        src: /var/lib/homelab-proxmox/state/services/
        dest: "{{ backup_dir.path }}/services/"
        remote_src: true
        mode: preserve

    - name: Log backup location
      ansible.builtin.debug:
        msg: "Legacy state backed up to {{ backup_dir.path }}/services/"

- name: Create symlinks for backward compatibility
  when: proxmox_state_symlinks_enabled | default(false) | bool
  block:
    - name: Ensure legacy state root directory exists
      ansible.builtin.file:
        path: /var/lib/homelab-proxmox/state
        state: directory
        mode: '0700'
        owner: ci
        group: ci

    - name: Remove existing service directories (backups already created)
      ansible.builtin.file:
        path: "/var/lib/homelab-proxmox/state/services/{{ item }}"
        state: absent
      loop: "{{ proxmox_state_services | default([]) }}"
      loop_control:
        label: "{{ item }}"

    - name: Create service symlinks (lab environment - default)
      ansible.builtin.file:
        src: "/mnt/nas/homelab_ci/infra_state/{{ proxmox_state_environment | default('lab') }}/{{ item }}"
        dest: "/var/lib/homelab-proxmox/state/services/{{ item }}"
        state: link
        force: true
      loop: "{{ proxmox_state_services | default([]) }}"
      loop_control:
        label: "{{ item }}"

- name: Document symlink status
  ansible.builtin.debug:
    msg: |
      State symlinks status:
      - Enabled: {{ proxmox_state_symlinks_enabled | default(false) }}
      - Environment: {{ proxmox_state_environment | default('lab') }}
      - Services: {{ proxmox_state_services | default([]) | join(', ') }}
      - Legacy path: /var/lib/homelab-proxmox/state/services/<service>
      - Target: /mnt/nas/homelab_ci/infra_state/{{ proxmox_state_environment | default('lab') }}/<service>
