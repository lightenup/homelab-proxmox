---
- name: Ensure base packages on Proxmox host
  ansible.builtin.apt:
    name:
      - vim
      - htop
      - curl
      - unattended-upgrades
    state: present
    update_cache: true

- name: Enable unattended upgrades (basic)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: TODO - configure Proxmox-specific repos and upgrade policies
  ansible.builtin.debug:
    msg: "Configure Proxmox repos and update strategy here"

- name: Check if LXC template exists
  ansible.builtin.stat:
    path: /var/lib/vz/template/cache/debian-12-standard_12.7-1_amd64.tar.zst
  register: lxc_template_stat

- name: Download Debian 12 LXC template
  ansible.builtin.command:
    cmd: pveam download local debian-12-standard_12.7-1_amd64.tar.zst
  when: not lxc_template_stat.stat.exists
