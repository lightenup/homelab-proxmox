---
# `apply` passes the tags to the role's tasks. Tags on include_role alone mark only the include,
# so `--tags mounts` (task ansible:mounts) ran nothing inside the role (found 2026-10-31, 097).
- name: Configure NAS NFS mounts
  ansible.builtin.include_role:
    name: proxmox_mounts
    apply:
      tags:
        - mounts
        - nfs
  tags:
    - mounts
    - nfs

- name: Ensure base packages on Proxmox host
  ansible.builtin.apt:
    name:
      - vim
      - htop
      - curl
      - unattended-upgrades
    state: present
    update_cache: true

- name: Enable unattended upgrades (basic)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: TODO - configure Proxmox-specific repos and upgrade policies
  ansible.builtin.debug:
    msg: "Configure Proxmox repos and update strategy here"

- name: Check if LXC template exists
  ansible.builtin.stat:
    path: /var/lib/vz/template/cache/debian-12-standard_12.12-1_amd64.tar.zst
  register: lxc_template_stat

- name: Download Debian 12 LXC template
  ansible.builtin.command:
    cmd: pveam download local debian-12-standard_12.12-1_amd64.tar.zst
  when: not lxc_template_stat.stat.exists

- name: Check if Immich LXC config exists
  ansible.builtin.stat:
    path: "/etc/pve/lxc/{{ immich_vmid | default(101) }}.conf"
  register: immich_lxc_conf

- name: Add bind mount for Immich LXC
  ansible.builtin.lineinfile:
    path: "/etc/pve/lxc/{{ immich_vmid | default(101) }}.conf"
    regexp: '^mp0:'
    line: 'mp0: /mnt/nas/homelab_immich,mp=/mnt/immich'
    state: present
  register: immich_mount
  when: immich_lxc_conf.stat.exists

- name: Restart Immich LXC to apply mount
  ansible.builtin.command: "pct reboot {{ immich_vmid | default(101) }}"
  when: immich_mount.changed

# Nightly state-drift check (067). Apply on its own with: host_proxmox.yml --tags state-drift
- name: Let ci write the node_exporter textfile directory (state_drift.prom)
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_directory }}"
    state: directory
    owner: "{{ node_exporter_user }}"
    group: "{{ node_exporter_user }}"
    mode: "{{ node_exporter_textfile_directory_mode }}"
  tags: [state-drift]

- name: Install state-drift-check systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - state-drift-check.service
    - state-drift-check.timer
  register: state_drift_units
  tags: [state-drift]

- name: Enable the state-drift-check timer
  ansible.builtin.systemd:
    name: state-drift-check.timer
    enabled: true
    state: started
    daemon_reload: "{{ state_drift_units.changed }}"
  tags: [state-drift]
