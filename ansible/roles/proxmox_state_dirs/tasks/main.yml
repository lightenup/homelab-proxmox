---
# ansible/roles/proxmox_state_dirs/tasks/main.yml
# Purpose: local Terraform state roots and the lab scratch root on the PVE host (067)
#   state/prod  the one production state per service (backed up by proxmox_backup)
#   state/lab   exists only during lab runs; never backed up
#   lab-scratch bind-mount source for lab copies; the pipeline creates per-run dirs under it.
#               Owned by ci so the sweep can remove runs (after `sudo chown -R`; ci has no sudo rm).

- name: Create the state roots
  ansible.builtin.file:
    path: "/var/lib/homelab-proxmox/state/{{ item }}"
    state: directory
    owner: ci
    group: ci
    mode: '0700'
  loop:
    - prod
    - lab

- name: Create the lab scratch root
  ansible.builtin.file:
    path: /var/lib/homelab-proxmox/lab-scratch
    state: directory
    owner: ci
    group: ci
    mode: '0711'
