---
# node_exporter installation and configuration tasks
# Feature: 040-monitoring-overhaul

- name: Check if node_exporter is already installed at correct version
  ansible.builtin.stat:
    path: /usr/local/bin/node_exporter
  register: node_exporter_binary

- name: Get installed node_exporter version
  ansible.builtin.command:
    cmd: /usr/local/bin/node_exporter --version
  register: node_exporter_installed_version
  changed_when: false
  failed_when: false
  when: node_exporter_binary.stat.exists

- name: Set version mismatch fact
  ansible.builtin.set_fact:
    node_exporter_needs_install: >-
      {{
        not node_exporter_binary.stat.exists or
        (node_exporter_installed_version.rc | default(1)) != 0 or
        node_exporter_version not in (node_exporter_installed_version.stdout | default(''))
      }}

- name: Download node_exporter archive
  ansible.builtin.get_url:
    url: >-
      https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version
      }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    mode: '0644'
  when: node_exporter_needs_install

- name: Extract node_exporter archive
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: /tmp/
    remote_src: true
  # Skipped in check mode: the download above is a no-op under --check, so the
  # tarball does not exist and unarchive would fail on a dry run.
  when: node_exporter_needs_install and not ansible_check_mode

- name: Install node_exporter binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    mode: '0755'
    owner: root
    group: root
    remote_src: true
  # Skipped in check mode: depends on the extracted source, absent on a dry run.
  when: node_exporter_needs_install and not ansible_check_mode
  notify: Restart node_exporter

- name: Clean up downloaded archive
  ansible.builtin.file:
    path: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    state: absent
  when: node_exporter_needs_install

- name: Clean up extracted directory
  ansible.builtin.file:
    path: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64"
    state: absent
  when: node_exporter_needs_install

- name: Create node_exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
    comment: "node_exporter service user"

- name: Ensure textfile collector directory exists
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_directory }}"
    state: directory
    owner: "{{ node_exporter_user }}"
    group: "{{ node_exporter_user }}"
    mode: '0755'

- name: Deploy node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: '0644'
    owner: root
    group: root
  notify: Restart node_exporter

- name: Enable and start node_exporter service
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
