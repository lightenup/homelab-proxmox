---
# Pinned image repositories — tags come from ansible/group_vars/services/vars.yml
# (hermes_version, hermes_searxng_version).
hermes_image: "openwebui/open-webui"
hermes_searxng_image: "searxng/searxng"

# Local speech-to-text (FR-023). Left at Open WebUI's own default engine (AUDIO_STT_ENGINE
# unset -> faster-whisper, fully in-container) rather than an external one, so audio never
# leaves the estate (research.md, SC-012). "base" trades accuracy for latency on a 4-core
# LXC with no GPU; raise to "small" if quality is the bottleneck rather than speed.
hermes_whisper_model: "base"

# Local text-to-speech (FR-023). "transformers" is Open WebUI's own in-container HuggingFace
# SpeechT5 pipeline — verified against backend/open_webui/routers/audio.py, 2026-09-20: the
# empty-string default answers /speech with 404 rather than running anything locally, so this
# must be set explicitly for FR-023 to hold.
hermes_tts_engine: "transformers"

# Reverse-proxy origin. Used for WEBUI_URL (PWA manifest, email links) — never localhost or
# an internal IP, since the owner reaches this exclusively through hermes.hus-sky.no.
hermes_public_url: "https://hermes.{{ caddy_base_domain }}"

# FR-003: exactly one account may exist. A variable rather than a template literal so
# preflight has something to assert against — the upstream default is True, and a version
# bump (or an errant override somewhere) could otherwise reintroduce self-registration
# silently. Not meant to be overridden.
hermes_enable_signup: false

# Agent runtime (spec 083, R-002/R-004). The stock hermes-agent image running `gateway run`
# as a second compose service: cron scheduler + API server on :8642, no published ports.
# hermes_agent_version lives in the versions block of group_vars/services/vars.yml.
hermes_agent_image: "nousresearch/hermes-agent:{{ hermes_agent_version }}"
# Data (jobs, scripts, memory, scout state) under the workspace's data dir, owned by the
# agent's UID. The agent's own .env and the read-only config.yaml live in the install dir.
hermes_agent_data_dir: "{{ hermes_data_dir }}/agent"
hermes_agent_config_path: "{{ hermes_install_dir }}/agent-config.yaml"
hermes_agent_env_path: "{{ hermes_install_dir }}/agent.env"
# The image's `hermes` user (s6 drops from root to this UID at startup).
hermes_agent_uid: 10000
# The agent's OpenAI-compatible API server, as Open WebUI reaches it on the agent network.
hermes_agent_api_base_url: "http://hermes-agent:8642/v1"
# Default model for the agent; must exist in llm_router_aliases (preflight asserts it).
hermes_agent_default_model: "hermes-balanced"
# US4 (FR-016): host directory the heartbeat script writes its .prom file into; bind-mounted
# at /heartbeat in the agent container, exposed to node_exporter by symlink (R-007).
hermes_agent_heartbeat_dir: "/var/lib/hermes-agent-heartbeat"
# Host folder for Hermes's own logs (095 T072), bind-mounted at /opt/data/logs. Outside the
# 0750 agent state folder so alloy can read gateway.log (INFO audit lines, R-008) without being
# able to traverse into state.db, memory or .env. The same path is in host_vars/hermes.yml
# (alloy_file_logs) and playbooks/hermes.yml (pre_tasks); test_hermes_log_rules.py keeps them equal.
hermes_agent_log_dir: "/var/log/hermes-agent"
# Host directory for gateway hooks (095 T018: the gap-notice hook). Root-owned, outside the
# agent's data dir, bind-mounted read-only per hook.
hermes_agent_hooks_dir: "/opt/hermes-agent-hooks"
# Host directory for agent plugin overrides (095 R-018: the ntfy chunking shim). Root-owned,
# outside the agent's data dir, bind-mounted read-only.
hermes_agent_plugins_dir: "/opt/hermes-agent-plugins"

# Spec 097 (FR-001, FR-002, R-003): the Hindsight memory provider, fetched at deploy time from
# pinned, hashed sources and mounted read-only into the stock agent image. No runtime install:
# the agent never runs pip. hermes_hindsight_plugin_version lives in the versions block of
# group_vars/services/vars.yml; re-check these pins together with it and hermes_agent_version.
# The tarball is GitHub's archive of the plugin tag; the plugin is under
# hindsight-integrations/hermes/ inside it.
hermes_hindsight_plugin_url: "https://github.com/vectorize-io/hindsight/archive/refs/tags/integrations/hermes/v{{ hermes_hindsight_plugin_version }}.tar.gz"
hermes_hindsight_plugin_sha256: "845eb81934b5cefd0ce0b9170b2173ce144e5724cc736117d9a279e392bc466b"
# The three packages the stock image lacks (spike Dockerfile, 2026-10-30): pure-Python wheels
# inside plugin 1.2.3's hindsight-client/hindsight-embed >=0.10.1,<1 constraint. Their own
# dependencies (aiohttp, pydantic, rich, ...) ship in the image. URLs and hashes from
# https://pypi.org/pypi/<name>/<version>/json.
hermes_hindsight_plugin_wheels:
  - name: hindsight-client
    version: "==0.10.3"
    url: "https://files.pythonhosted.org/packages/54/31/5157bd9f73dca7ef2516470ff85818e03d6167f031cfcc96ff1c263ebc12/hindsight_client-0.10.3-py3-none-any.whl"
    sha256: "b4d0d1bbc29dcd4ef25a4a23a08a48046d5337b704bdafabb02d0010d299a068"
  - name: hindsight-embed
    version: "==0.10.3"
    url: "https://files.pythonhosted.org/packages/f3/c4/4854a2e245937026dcdf3291506dc51b16dc9dcb9e673c8f6c4668d76632/hindsight_embed-0.10.3-py3-none-any.whl"
    sha256: "290b81d8363e996f166f533d32c61e734af5d104695a252b0e0f729cf36eccf1"
  - name: aiohttp-retry
    version: "==2.9.1"
    url: "https://files.pythonhosted.org/packages/1a/99/84ba7273339d0f3dfa57901b846489d2e5c2cd731470167757f1935fffbd/aiohttp_retry-2.9.1-py3-none-any.whl"
    sha256: "66d2759d1921838256a05a3f80ad7e724936f083e35be5abb5e16eed6be6dc54"
# Root-owned host directories, mounted :ro (the agent can write /opt/data, so code it runs must
# not live there writable). The plugin config holds the memory key, so it is rendered to the
# install dir, not into the agent's data dir.
hermes_memory_plugin_dir: "{{ hermes_agent_plugins_dir }}/memory/hindsight"
hermes_memory_deps_dir: "{{ hermes_agent_plugins_dir }}/memory-deps"
hermes_memory_plugin_config_path: "{{ hermes_install_dir }}/hindsight-config.json"
# Downloads, kept so an unchanged pin is not fetched again. Outside the mounted directories.
hermes_memory_plugin_cache_dir: "/var/cache/hermes-memory-plugin"
# The memory service's API through Caddy (FR-010: never the direct port) and its one bank,
# the same as memory_bank_id in roles/memory/defaults/main.yml (guard test).
hermes_memory_api_url: "https://memory-api.{{ caddy_base_domain }}"
hermes_memory_bank_id: "owner"
# Host directory for the agent's /etc/profile.d drop-in (puts /opt/hermes/bin back on the
# terminal tool's login-shell PATH). Root-owned, outside the agent's data dir, mounted read-only.
hermes_agent_profile_dir: "/opt/hermes-agent-profile.d"
# Names of job secrets exposed to cron scripts through terminal.env_passthrough (R-004).
# Each name's value is read from the vault variable `name | lower` (the llm_router_clients
# key_env convention). A job that needs a secret is the one case where adding a job costs a
# deploy change (spec Edge Cases).
hermes_agent_env_passthrough:
  # Backlog 088: the scout-assess gate's router probe (llm_router_clients alias scout_probe).
  - LLM_ROUTER_CLIENT_SCOUT_PROBE_KEY
# R-011: operational when the deploy says PROD. The pipeline's LAB stage runs against the
# SAME inventory as PROD (backlog 067), passing only `-e deploy_environment=lab`, so that flag
# is the signal; `lab_inventory` (the 10.99.x rig) can only ever make it false. Gates the
# ntfy token, the heartbeat job and the heartbeat mount.
hermes_agent_operational: "{{ not (lab_inventory | default(false) | bool) and (deploy_environment | default('prod')) == 'prod' }}"
