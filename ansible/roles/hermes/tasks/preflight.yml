---
# Preflight validation for Hermes (spec 065-hermes-ai-workspace, data-model.md § Validation).
# Rendering docker-compose.yml.j2 is not attempted until all of these pass.

- name: Assert image versions are pinned
  ansible.builtin.assert:
    that:
      - hermes_version is defined
      - hermes_version != ""
      - hermes_version != "latest"
      - hermes_searxng_version is defined
      - hermes_searxng_version != ""
      - hermes_searxng_version != "latest"
    fail_msg: >-
      hermes_version and hermes_searxng_version must both be pinned tags, not empty or
      "latest" (data-model.md rule 1).

- name: Assert Docker daemon is running
  ansible.builtin.systemd:
    name: docker
    state: started
  check_mode: true
  register: hermes_docker_status
  failed_when: hermes_docker_status.failed

# hermes_data_dir does not exist yet on a first deploy (this task runs before "Ensure data
# directories exist" in main.yml), so findmnt can't target it directly. Walk up to the
# nearest existing ancestor instead — its filesystem is what hermes_data_dir will inherit.
- name: Determine the filesystem type backing hermes_data_dir
  ansible.builtin.shell: |
    set -eu
    path="{{ hermes_data_dir }}"
    while [ ! -d "$path" ]; do path="$(dirname "$path")"; done
    findmnt --noheadings --output FSTYPE --target "$path"
  register: hermes_data_dir_fstype
  changed_when: false

- name: Assert hermes_data_dir is not backed by NFS (FR-019, data-model.md rule 2)
  ansible.builtin.assert:
    that:
      - hermes_data_dir_fstype.stdout | trim | lower not in ['nfs', 'nfs4']
    fail_msg: >-
      hermes_data_dir ({{ hermes_data_dir }}) resolves onto an NFS-backed mount
      ({{ hermes_data_dir_fstype.stdout | trim }}). SQLite and the vector index must live on
      local disk — NFS invites locking failures and corruption, the same reason
      financial-scenario's state is split the same way.
    quiet: true

# --- Capability aliases (data-model.md rule 3) ---
#
# "Within the Hermes client key's permitted model scope" is automatically true once an
# alias exists here: ansible/roles/llm_router/tasks/virtual_keys.yml scopes EVERY client key
# to ALL llm_router_aliases names uniformly (there is no separate per-client allowlist), so
# existence in the mapping IS the scope check. This assertion is what remains to verify.
- name: Build the set of defined 064 alias names
  ansible.builtin.set_fact:
    hermes_gateway_alias_names: "{{ llm_router_aliases | map(attribute='name') | list }}"

- name: Assert every Hermes capability alias exists in 064's alias mapping
  ansible.builtin.assert:
    that:
      - item in hermes_gateway_alias_names
    fail_msg: >-
      '{{ item }}' is not a name defined in llm_router_aliases
      (ansible/group_vars/services/vars.yml). An alias Hermes calls but 064 does not define
      fails at first use, not at deploy, which is the worse failure (data-model.md rule 3).
    quiet: true
  loop:
    - "{{ hermes_task_alias }}"
    - "{{ hermes_embedding_alias }}"
    - "{{ hermes_reranking_alias }}"

# --- Credentials (data-model.md rule 4, Constitution II) ---

- name: Assert the gateway client credential is defined
  ansible.builtin.assert:
    that:
      - llm_router_client_hermes_key is defined
      - llm_router_client_hermes_key | length > 0
    fail_msg: >-
      Missing vault variable llm_router_client_hermes_key — the Hermes client's virtual key
      on the 064 gateway (llm_router_clients: alias hermes), provisioned by that role's
      virtual_keys.yml. Presenting exactly this one credential is what
      contracts/gateway-usage.md requires (FR-007).

- name: Assert Hermes' own vault-sourced credentials are defined
  ansible.builtin.assert:
    that:
      - hermes_webui_secret_key is defined
      - hermes_webui_secret_key | length > 0
      - hermes_admin_email is defined
      - hermes_admin_email | length > 0
      - hermes_admin_password_bootstrap is defined
      - hermes_admin_password_bootstrap | length > 0
      - hermes_searxng_secret is defined
      - hermes_searxng_secret | length > 0
    fail_msg: >-
      Missing one or more vault variables: hermes_webui_secret_key, hermes_admin_email,
      hermes_admin_password_bootstrap, hermes_searxng_secret — run 'ansible-vault edit
      group_vars/services/vault.yml' to add them (FR-003, FR-004, Constitution II). Never
      commit a value.
  no_log: true

# --- The RAG_OPENAI_* trap (data-model.md rule 5, research R-003, upstream open-webui#22084) ---

- name: Assert the retrieval backend is explicit and never api.openai.com
  ansible.builtin.assert:
    that:
      - hermes_gateway_base_url is defined
      - hermes_gateway_base_url | length > 0
      - "'api.openai.com' not in hermes_gateway_base_url"
      - llm_router_client_hermes_key | length > 0
    fail_msg: >-
      hermes_gateway_base_url must be explicitly set to the 064 gateway and must never be (or
      resolve through) api.openai.com. RAG_OPENAI_API_BASE_URL and RAG_OPENAI_API_KEY do NOT
      reliably inherit from OPENAI_API_BASE_URL/OPENAI_API_KEY (research R-003, upstream
      open-webui#22084) — left unset, retrieval silently reaches api.openai.com, which is
      both a broken feature and an FR-008 breach. This assertion is the difference between
      the two.
    quiet: true

# --- Self-registration (data-model.md rule 6, FR-003) ---

- name: Assert self-registration stays disabled
  ansible.builtin.assert:
    that:
      - hermes_enable_signup == false
    fail_msg: >-
      hermes_enable_signup must be false (FR-003) — exactly one account, the admin bootstrap,
      may exist. Asserted rather than assumed: Open WebUI's own upstream default is True, and
      a version bump (or an errant override) could reintroduce it silently.

# --- MCP server registrations (data-model.md § Entity: MCP server registration, FR-013) ---

- name: Assert every bearer-auth MCP server names a non-empty vault variable
  ansible.builtin.assert:
    that:
      - item.credential_env is defined and item.credential_env is string and item.credential_env | length > 0
      - lookup('vars', item.vault_var | default(item.credential_env | lower), default='') | length > 0
    fail_msg: >-
      MCP server '{{ item.name }}' declares auth: bearer but its vault variable
      ('{{ item.vault_var | default(item.credential_env | default('unset') | lower) }}') is not
      defined or is empty. This branch is deliberately validated even with no current consumer
      (research R-008) — it is what keeps adding a credentialed server a configuration
      change, not a code change (FR-013).
  loop: "{{ hermes_mcp_servers }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.auth == 'bearer'

# 083 research R-004: Hermes strips only AUXILIARY_*_API_KEY (plus fixed provider names) from
# the environment of every child it spawns. Any other name for a bearer token is readable by
# terminal commands and cron scripts.
- name: Assert every bearer-auth MCP token uses a name Hermes strips from child processes
  ansible.builtin.assert:
    that:
      - item.credential_env is match('^AUXILIARY_[A-Z0-9_]+_API_KEY$')
    fail_msg: >-
      MCP server '{{ item.name }}' has credential_env '{{ item.credential_env }}'. Bearer tokens
      must be named AUXILIARY_*_API_KEY (preferably AUXILIARY_MCP_<NAME>_API_KEY) so Hermes'
      subprocess filter keeps them out of terminal commands and cron scripts (083 R-004). Set
      vault_var to keep the vault variable's own name.
  loop: "{{ hermes_mcp_servers }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.auth == 'bearer'

# --- Agent runtime (spec 083, data-model.md § Agent) ---
#
# The agent must never start without its confinement in place (approvals, read-only config,
# egress allowlist, no ports — T012–T015). These checks are the deploy-time half of that
# guarantee; the compose-level half is the post-render assertion in main.yml.

- name: Assert the agent image version is pinned
  ansible.builtin.assert:
    that:
      - hermes_agent_version is defined
      - hermes_agent_version != ""
      - hermes_agent_version != "latest"
      - hermes_agent_version is match('^v\d+\.\d+\.\d+$')
    fail_msg: >-
      hermes_agent_version must be a plain vX.Y.Z pin (currently
      '{{ hermes_agent_version | default('unset') }}'). Never 'latest', a -desktop or rc
      variant — the upgrade procedure (research R-001) reads the upstream changelog for
      approvals/cron/ntfy before bumping.

- name: Assert the agent's default model exists in 064's alias mapping
  ansible.builtin.assert:
    that:
      - hermes_agent_default_model in hermes_gateway_alias_names
    fail_msg: >-
      hermes_agent_default_model ('{{ hermes_agent_default_model }}') is not a name defined
      in llm_router_aliases. The agent would fail at first turn, not at deploy.

- name: Assert the agent's vault-sourced credentials are defined
  ansible.builtin.assert:
    that:
      - llm_router_client_hermes_agent_key is defined
      - llm_router_client_hermes_agent_key | length > 0
      - hermes_agent_api_server_key is defined
      - hermes_agent_api_server_key | length >= 8
    fail_msg: >-
      Missing vault variables llm_router_client_hermes_agent_key (the agent's gateway client
      key, minted by the llm_router role) and/or hermes_agent_api_server_key (the API-server
      key Open WebUI authenticates with, >= 8 chars) — run 'ansible-vault edit
      group_vars/services/vault.yml' to add them (spec 083, Constitution II). Never commit a
      value.
  no_log: true

- name: Assert the agent's memory key is defined (spec 097 R-003)
  ansible.builtin.assert:
    that:
      - memory_client_hermes_key is defined
      - memory_client_hermes_key is match('^hmem_[A-Za-z0-9_-]{43,}$')
    fail_msg: >-
      memory_client_hermes_key is missing or not hmem_ plus 32 random bytes (URL-safe base64).
      Add it with 'ansible-vault edit group_vars/services/vault.yml' (097 T002).
  no_log: true

- name: Assert every enabled MCP server URL parses to host and port
  ansible.builtin.assert:
    that:
      - item.url is url
      - item.url | urlsplit('hostname') is defined
      - item.url | urlsplit('hostname') | length > 0
      - item.url | urlsplit('port') is not none
      - item.url | urlsplit('port') | int > 0
    fail_msg: >-
      MCP server '{{ item.name }}' has an enabled entry whose URL
      ('{{ item.url }}') does not parse to a host and a port. The egress allowlist derives
      one accept rule per enabled server from this list (FR-008), so an unparseable URL would
      silently drop a required destination.
  loop: "{{ hermes_mcp_servers | selectattr('enabled', 'defined') | selectattr('enabled') | rejectattr('via_proxy', 'defined') | list
          + hermes_mcp_servers | selectattr('enabled', 'defined') | selectattr('enabled') | selectattr('via_proxy', 'defined') | rejectattr('via_proxy') | list }}"
  loop_control:
    label: "{{ item.name }}"

# via_proxy entries get no derived egress rule: the agent reaches them through Caddy on
# reverse_proxy_ip:443 (rule 6), so they must be HTTPS on the default port (097 R-005).
- name: Assert every MCP server reached through the reverse proxy is HTTPS on port 443
  ansible.builtin.assert:
    that:
      - item.url is url
      - item.url | urlsplit('scheme') == 'https'
      - item.url | urlsplit('hostname') | length > 0
      - item.url | urlsplit('port') is none
    fail_msg: >-
      MCP server '{{ item.name }}' is marked via_proxy but its URL ('{{ item.url }}') is not
      https:// on the default port. The agent's egress allows only reverse_proxy_ip:443 for it.
  loop: "{{ hermes_mcp_servers | selectattr('via_proxy', 'defined') | selectattr('via_proxy') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Assert the ntfy token is defined when the agent is operational
  ansible.builtin.assert:
    that:
      - ntfy_hermes_token is defined
      - ntfy_hermes_token | length > 0
    fail_msg: >-
      hermes_agent_operational is true but ntfy_hermes_token (spec 082) is not defined or is
      empty — scheduled jobs would have no way to reach the phone (FR-012).
  when: hermes_agent_operational
  no_log: true

# The pipeline's LAB stage uses the prod inventory with -e deploy_environment=lab (backlog
# 067), so only the reverse mismatch is an error: the 10.99.x LAB-rig inventory paired with
# a prod deploy.
- name: Assert a LAB-rig inventory is not paired with a PROD deploy (R-011)
  ansible.builtin.assert:
    that:
      - not (lab_inventory | default(false) | bool and (deploy_environment | default('prod')) == 'prod')
    fail_msg: >-
      lab_inventory=true but deploy_environment is 'prod' (or unset). A LAB-rig inventory must
      be paired with -e deploy_environment=lab, otherwise the ntfy token and the heartbeat job
      would be rendered on the LAB rig.

- name: Assert every env-passthrough name has a defined, non-empty vault variable
  ansible.builtin.assert:
    that:
      - lookup('vars', item | lower, default='') | length > 0
    fail_msg: >-
      hermes_agent_env_passthrough names '{{ item }}', but the vault variable
      '{{ item | lower }}' is not defined or is empty. The agent .env renders the value from
      that variable (the llm_router_clients key_env convention).
  loop: "{{ hermes_agent_env_passthrough }}"
  loop_control:
    label: "{{ item }}"
  no_log: true

# --- Exposure precondition (spec 083 FR-017, research R-012) ---
#
# The agent's egress allowlist (FR-008) is only as strong as the assumption that the
# hus-sky.no names it may reach are NOT publicly resolvable — if any of them had a public
# A/AAAA record, the reverse proxy would be a front door and FR-017's manual router check
# would be insufficient. This assertion fails the deploy on any public answer; NXDOMAIN and
# empty answers pass. It queries two public resolvers so a single-resolver artefact cannot
# hide a record.

- name: Ensure dnsutils is installed for the exposure check
  ansible.builtin.package:
    name: dnsutils
    state: present

- name: Build the list of hus-sky.no names to check for public exposure
  ansible.builtin.set_fact:
    hermes_exposure_names: >-
      {{ (caddy_services | default([]) | map(attribute='host') | list)
         + [caddy_base_domain, (99999999 | random) ~ '-exposure-check.' ~ caddy_base_domain] }}

- name: Query public resolvers for A and AAAA answers on each hus-sky.no name
  ansible.builtin.command:
    argv:
      - dig
      - +short
      - "{{ item.1 }}"
      - "{{ item.0 }}"
      - "@{{ item.2 }}"
  loop: "{{ hermes_exposure_names | product(['A', 'AAAA'], ['1.1.1.1', '8.8.8.8']) | list }}"
  loop_control:
    label: "{{ item.0 }} {{ item.1 }} @{{ item.2 }}"
  register: hermes_exposure_answers
  changed_when: false

# Only address lines count: `dig +short` also prints CNAME targets (hostnames), which are
# ignored — the address they resolve to is printed as its own line. An address is acceptable
# when it is RFC 1918, tailnet (100.64/10) or ULA (fc00::/7); anything else is public.
- name: Fail the deploy if any hus-sky.no name resolves publicly (FR-017)
  ansible.builtin.assert:
    that:
      - hermes_exposure_offenders | length == 0
    fail_msg: >-
      Public DNS answers a non-private address for '{{ item.item.0 }}' ({{ item.item.1 }}
      @{{ item.item.2 }}): {{ hermes_exposure_offenders | join(', ') }}. The names served by
      the reverse proxy must not be publicly resolvable (FR-017) — the agent's egress
      allowlist assumes they are not. Remove the public record (and re-check the router's
      port forwards) before deploying.
  loop: "{{ hermes_exposure_answers.results }}"
  loop_control:
    label: "{{ item.item.0 }} {{ item.item.1 }} @{{ item.item.2 }}"
  vars:
    hermes_exposure_ip_re: '^(\d{1,3}(\.\d{1,3}){3}|[0-9a-fA-F]*:[0-9a-fA-F:.]*)$'
    hermes_exposure_private_re: '^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.|[fF][cCdD][0-9a-fA-F]{2}:)'
    hermes_exposure_offenders: >-
      {{ item.stdout_lines | map('trim') | select('match', hermes_exposure_ip_re)
         | reject('match', hermes_exposure_private_re) | list }}
