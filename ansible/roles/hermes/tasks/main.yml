---
- name: Include preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Ensure install directory exists
  ansible.builtin.file:
    path: "{{ hermes_install_dir }}"
    state: directory
    mode: '0755'

- name: Ensure SearXNG config directory exists
  ansible.builtin.file:
    path: "{{ hermes_searxng_install_dir }}"
    state: directory
    mode: '0755'

# Single bind-mounted volume, matching the upstream image's expectation of one DATA_DIR
# (/app/backend/data): SQLite, uploaded documents and the vector index all live under it
# (data-model.md § Workspace state), which is what makes hermes_backup's one bind-mount
# sufficient for all three.
- name: Ensure data directory exists
  ansible.builtin.file:
    path: "{{ hermes_data_dir }}/open-webui"
    state: directory
    mode: '0755'

- name: Deploy SearXNG settings
  ansible.builtin.template:
    src: searxng-settings.yml.j2
    dest: "{{ hermes_searxng_install_dir }}/settings.yml"
    mode: '0640'
  notify: Restart hermes

# Built once here, consumed BOTH by docker-compose.yml.j2 (which seeds Open WebUI on a first
# boot) and by the reconcile task at the end of this file (which is what makes a LATER edit
# take effect). Two renderings of the same intent would drift; one fact cannot.
#
# The shape is upstream's, not ours, and it is unforgiving: listing gates on
# `config.enable` (routers/tools.py) and execution matches on `info.id`
# (utils/middleware.py). An entry with `enabled`/`id`/`name` at the top level is silently
# dropped by both — no error, no log line. That was the original bug.
- name: Build the MCP tool-server connection list
  ansible.builtin.set_fact:
    hermes_tool_server_connections: >-
      {{ hermes_tool_server_connections | default([]) + [{
        'type': 'mcp',
        'url': item.url,
        'auth_type': item.auth,
        'key': (lookup('vars', item.credential_env | lower) if item.auth == 'bearer' else ''),
        'config': {'enable': item.enabled},
        'info': {
          'id': item.name | lower | regex_replace('[^a-z0-9]+', '-'),
          'name': item.name
        }
      }] }}
  loop: "{{ hermes_mcp_servers }}"
  loop_control:
    label: "{{ item.name }}"
  # Facts land in hostvars, and a future auth: bearer entry puts a real token in this one.
  no_log: true

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ hermes_install_dir }}/docker-compose.yml"
    mode: '0640'
  notify: Restart hermes
  no_log: true

- name: Ensure hermes stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ hermes_install_dir }}"
    state: present
    remove_orphans: true
    pull: always

- name: Wait for the workspace to be reachable
  ansible.builtin.wait_for:
    port: "{{ hermes_port }}"
    host: "127.0.0.1"
    delay: 5
    timeout: 180

- name: Verify the workspace is healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ hermes_port }}/health"
    method: GET
    status_code: 200
  register: hermes_health
  retries: 12
  delay: 10
  until: hermes_health.status == 200
  changed_when: false

# TOOL_SERVER_CONNECTIONS is a PersistentConfig: seed_defaults() inserts a key "only if the
# key is absent" — "Existing DB values take precedence over defaults." So the env var seeds
# the FIRST boot and is inert forever after, which would make every later edit to
# hermes_mcp_servers a silent no-op and break FR-013's promise that adding a tool service is
# a pure configuration change. This task is what keeps that promise.
#
# Runs after the readiness check on purpose: the database must exist and the app must have
# seeded before there is anything to compare against.
#
# Ansible OWNS this list, reconciled by info.id: declared servers have their managed fields
# merged in (unknown keys on an entry are preserved, so the task does not flap if the app or
# the admin UI adds one), and undeclared entries are removed — otherwise deleting a server
# from group_vars would do nothing. Consequence, accepted: a tool server added by hand in the
# admin UI is removed on the next deploy.
#
# The desired value goes in on STDIN, never argv: `docker exec … python3 -c "<json>"` would
# expose a bearer token to `ps` on the LXC. The script itself holds no secret.
#
# No `-u`: this container runs as root (uid=0) and the db/-wal/-shm files are root-owned, so
# root matches the app's UID. The opposite is the usual trap — a root-created -wal beside a
# non-root app silently breaks the app's writes, which is why roles/nextcloud uses
# `docker exec -u www-data`.
# The same PersistentConfig problem as the tool servers below, for scalar keys: Open WebUI
# seeds these from the environment on FIRST boot only, then its database wins, so editing the
# compose and redeploying is silently a no-op. Drill T040 proved it (compose said
# hermes-balanced, running system said hermes-fast) and it bit for real on the first PDF
# upload, where rag.embedding_batch_size was stuck at its default of 1 and one request per
# chunk exhausted the gateway allowance.
#
# Only the keys in hermes_managed_config are touched. Anything the operator changes in the
# admin UI that we do not declare keeps working and is never overwritten — that is the trade
# that kept persistence enabled instead of switching it off wholesale.
- name: Reconcile the persisted Open WebUI configuration we own
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "-i"
      - hermes_open_webui
      - python3
      - "-c"
      - |
        import json, sqlite3, sys, time

        desired = json.loads(sys.stdin.read())
        con = sqlite3.connect('/app/backend/data/webui.db', timeout=5)
        con.execute('PRAGMA busy_timeout=5000')

        cols = [r[1] for r in con.execute('PRAGMA table_info(config)')]
        if 'key' not in cols or 'value' not in cols:
            sys.exit('SCHEMA DRIFT: config table has columns %s; expected key/value. '
                     'Refusing to write.' % cols)

        changed = []
        now = int(time.time())
        for key, want in sorted(desired.items()):
            row = con.execute('SELECT value FROM config WHERE key=?', (key,)).fetchone()
            current = None
            if row and row[0] is not None:
                try:
                    current = json.loads(row[0])
                except (TypeError, ValueError):
                    current = row[0]
            if current == want:
                continue
            con.execute(
                'INSERT INTO config (key, value, updated_at) VALUES (?, ?, ?) '
                'ON CONFLICT(key) DO UPDATE SET value=excluded.value, '
                'updated_at=excluded.updated_at',
                (key, json.dumps(want), now),
            )
            changed.append(key)
        if changed:
            con.commit()
        con.close()
        print('CHANGED ' + ','.join(changed) if changed else 'UNCHANGED')
    stdin: "{{ hermes_managed_config | to_json }}"
  register: hermes_config_reconcile
  # Exact prefix, not `in`: 'CHANGED' is a substring of 'UNCHANGED'.
  changed_when: hermes_config_reconcile.stdout is match('^CHANGED')
  notify: Restart hermes

- name: Reconcile the persisted MCP tool-server registrations
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "-i"
      - hermes_open_webui
      - python3
      - "-c"
      - |
        import json, sqlite3, sys, time

        KEY = 'tool_server.connections'
        MANAGED = ('type', 'url', 'auth_type', 'key')
        desired = json.loads(sys.stdin.read())

        con = sqlite3.connect('/app/backend/data/webui.db', timeout=5)
        con.execute('PRAGMA busy_timeout=5000')

        cols = [r[1] for r in con.execute('PRAGMA table_info(config)')]
        if 'key' not in cols or 'value' not in cols:
            sys.exit('SCHEMA DRIFT: config table has columns %s; expected key/value. '
                     'Refusing to write.' % cols)

        row = con.execute('SELECT value FROM config WHERE key=?', (KEY,)).fetchone()
        try:
            current = json.loads(row[0]) if row and row[0] else []
        except (TypeError, ValueError):
            current = []
        if not isinstance(current, list):
            current = []

        by_id = {}
        for entry in current:
            eid = (entry.get('info') or {}).get('id')
            if eid:
                by_id[eid] = entry

        result = []
        for want in desired:
            wid = want['info']['id']
            merged = dict(by_id.get(wid, {}))
            for field in MANAGED:
                merged[field] = want[field]
            info = dict(merged.get('info') or {})
            info.update(want['info'])
            merged['info'] = info
            cfg = dict(merged.get('config') or {})
            cfg['enable'] = want['config']['enable']
            merged['config'] = cfg
            result.append(merged)

        changed = json.dumps(current, sort_keys=True) != json.dumps(result, sort_keys=True)
        if changed:
            con.execute(
                'INSERT INTO config (key, value, updated_at) VALUES (?, ?, ?) '
                'ON CONFLICT(key) DO UPDATE SET value=excluded.value, '
                'updated_at=excluded.updated_at',
                (KEY, json.dumps(result), int(time.time())),
            )
            con.commit()
        con.close()
        print('CHANGED' if changed else 'UNCHANGED')
    stdin: "{{ hermes_tool_server_connections | default([]) | to_json }}"
  register: hermes_mcp_reconcile
  # Exact match, NOT `'CHANGED' in stdout` — 'CHANGED' is a substring of 'UNCHANGED', so the
  # `in` form is always true and the task reported changed (and restarted the stack) on every
  # run. Caught by the idempotency check; the script itself was correct all along.
  changed_when: hermes_mcp_reconcile.stdout | trim == 'CHANGED'
  notify: Restart hermes
  # stdin carries the token for any auth: bearer entry, and Ansible echoes module args on
  # failure at higher verbosity. Debuggability is traded for not leaking it into CI logs.
  no_log: true
