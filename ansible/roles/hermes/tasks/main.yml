---
- name: Include preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Ensure install directory exists
  ansible.builtin.file:
    path: "{{ hermes_install_dir }}"
    state: directory
    mode: '0755'

- name: Ensure SearXNG config directory exists
  ansible.builtin.file:
    path: "{{ hermes_searxng_install_dir }}"
    state: directory
    mode: '0755'

# Single bind-mounted volume, matching the upstream image's expectation of one DATA_DIR
# (/app/backend/data): SQLite, uploaded documents and the vector index all live under it
# (data-model.md § Workspace state), which is what makes hermes_backup's one bind-mount
# sufficient for all three.
- name: Ensure data directory exists
  ansible.builtin.file:
    path: "{{ hermes_data_dir }}/open-webui"
    state: directory
    mode: '0755'

# --- Agent runtime (spec 083) ---
#
# The agent's data directory (jobs, scripts, memory, scout state) and its deploy-owned
# configuration. The config is mounted read-only over /opt/data/config.yaml (FR-002); the
# env file carries the vault-rendered secrets and is never backed up or restored (FR-010).

- name: Ensure the agent data directory exists
  ansible.builtin.file:
    path: "{{ hermes_agent_data_dir }}"
    state: directory
    owner: "{{ hermes_agent_uid }}"
    group: "{{ hermes_agent_uid }}"
    mode: '0750'

- name: Ensure the agent scripts directory exists
  ansible.builtin.file:
    path: "{{ hermes_agent_data_dir }}/scripts"
    state: directory
    owner: "{{ hermes_agent_uid }}"
    group: "{{ hermes_agent_uid }}"
    mode: '0750'

- name: Deploy the agent configuration (read-only mount source)
  ansible.builtin.template:
    src: agent-config.yaml.j2
    dest: "{{ hermes_agent_config_path }}"
    owner: root
    mode: '0644'
  notify: Restart hermes

- name: Deploy the agent environment (vault-rendered secrets)
  ansible.builtin.template:
    src: agent.env.j2
    dest: "{{ hermes_agent_env_path }}"
    owner: "{{ hermes_agent_uid }}"
    group: "{{ hermes_agent_uid }}"
    mode: '0600'
  notify: Restart hermes
  no_log: true

- name: Deploy SearXNG settings
  ansible.builtin.template:
    src: searxng-settings.yml.j2
    dest: "{{ hermes_searxng_install_dir }}/settings.yml"
    mode: '0640'
  notify: Restart hermes

# Built once here, consumed BOTH by docker-compose.yml.j2 (which seeds Open WebUI on a first
# boot) and by the reconcile task at the end of this file (which is what makes a LATER edit
# take effect). Two renderings of the same intent would drift; one fact cannot.
#
# The shape is upstream's, not ours, and it is unforgiving: listing gates on
# `config.enable` (routers/tools.py) and execution matches on `info.id`
# (utils/middleware.py). An entry with `enabled`/`id`/`name` at the top level is silently
# dropped by both — no error, no log line. That was the original bug.
- name: Build the MCP tool-server connection list
  ansible.builtin.set_fact:
    hermes_tool_server_connections: >-
      {{ hermes_tool_server_connections | default([]) + [{
        'type': 'mcp',
        'url': item.url,
        'auth_type': item.auth,
        'key': (lookup('vars', item.credential_env | lower) if item.auth == 'bearer' else ''),
        'config': {'enable': item.enabled},
        'info': {
          'id': item.name | lower | regex_replace('[^a-z0-9]+', '-'),
          'name': item.name
        }
      }] }}
  loop: "{{ hermes_mcp_servers }}"
  loop_control:
    label: "{{ item.name }}"
  # Facts land in hostvars, and a future auth: bearer entry puts a real token in this one.
  no_log: true

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ hermes_install_dir }}/docker-compose.yml"
    mode: '0640'
  notify: Restart hermes
  no_log: true

# --- Agent confinement (spec 083, FR-004, FR-007) ---
#
# The agent must never start without its confinement in place. Preflight checks the inputs
# (pin, credentials, URLs); this checks the OUTPUT — the rendered compose — so a template
# regression that re-adds a port, a privilege or a socket mount fails the deploy before
# docker_compose_v2 ever runs.
- name: Assert the rendered agent service is confined (FR-004, FR-007)
  ansible.builtin.assert:
    that:
      - "'hermes-agent' in (hermes_compose | from_yaml).services"
      - (hermes_compose | from_yaml).services['hermes-agent'].get('ports', []) | length == 0
      - (hermes_compose | from_yaml).services['hermes-agent'].get('privileged', false) in [false, none]
      - (hermes_compose | from_yaml).services['hermes-agent'].get('cap_add', []) | length == 0
      - (hermes_compose | from_yaml).services['hermes-agent'].volumes | map('string') | select('search', 'docker.sock') | list | length == 0
      - (hermes_compose | from_yaml).services['hermes-agent'].networks | list | sort == ['agent']
    fail_msg: >-
      The rendered hermes-agent service is not confined: it must have no published ports,
      no privileged mode, no cap_add, no Docker socket mount, and sit only on the `agent`
      network (spec 083 FR-004/FR-007/FR-008). Fix docker-compose.yml.j2 before deploying.
  vars:
    hermes_compose: "{{ lookup('ansible.builtin.file', hermes_install_dir ~ '/docker-compose.yml') }}"

# --- Egress allowlist (spec 083, FR-008) — must be live before the agent starts ---
#
# The script flushes and refills its own chain and is idempotent; the oneshot re-applies it
# on every Docker restart (PartOf), and we run it on every deploy. On a first deploy the
# DOCKER-USER chain may not exist until Docker starts — the script creates it if missing.

- name: Deploy the agent egress allowlist script
  ansible.builtin.template:
    src: hermes-agent-egress.sh.j2
    dest: /usr/local/sbin/hermes-agent-egress.sh
    owner: root
    mode: '0750'

- name: Install the agent egress systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/hermes-agent-egress.service
    owner: root
    mode: '0644'
    content: |
      [Unit]
      Description=Hermes agent egress allowlist (spec 083, FR-008)
      After=docker.service
      Wants=docker.service
      PartOf=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/hermes-agent-egress.sh

      [Install]
      WantedBy=docker.service

- name: Enable the agent egress systemd unit
  ansible.builtin.systemd:
    name: hermes-agent-egress
    enabled: true
    daemon_reload: true

- name: Apply the agent egress allowlist now
  ansible.builtin.command:
    cmd: /usr/local/sbin/hermes-agent-egress.sh
  changed_when: false

- name: Ensure hermes stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ hermes_install_dir }}"
    state: present
    remove_orphans: true
    pull: always

- name: Wait for the workspace to be reachable
  ansible.builtin.wait_for:
    port: "{{ hermes_port }}"
    host: "127.0.0.1"
    delay: 5
    timeout: 180

- name: Verify the workspace is healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ hermes_port }}/health"
    method: GET
    status_code: 200
  register: hermes_health
  retries: 12
  delay: 10
  until: hermes_health.status == 200
  changed_when: false

# --- Egress probe (spec 083, SC-009) ---
#
# The allowlist (FR-008) is only as good as its enforcement, so the deploy proves it from
# the agent's own network namespace: every allowlisted destination must connect, every
# blocked destination must fail. A mismatch names the offending destination and fails the
# deploy.
- name: Wait for the agent to be healthy
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{% raw %}{{ .State.Health.Status }}{% endraw %}"
      - hermes_agent
  register: hermes_agent_health
  until: hermes_agent_health.stdout == 'healthy'
  retries: 30
  delay: 10
  changed_when: false

- name: Build the egress probe destination list
  ansible.builtin.set_fact:
    hermes_agent_egress_probe_allowed: >-
      {%- set ns = namespace(dests=[
           {'name': 'searxng', 'host': 'searxng', 'port': 8080},
           {'name': 'llm-router', 'host': llm_router_ip, 'port': llm_router_port | int}]) -%}
      {%- for s in hermes_mcp_servers | selectattr('enabled', 'defined') | selectattr('enabled') -%}
      {%- set ns.dests = ns.dests + [{'name': 'mcp-' ~ s.name, 'host': s.url | urlsplit('hostname'), 'port': s.url | urlsplit('port') | int}] -%}
      {%- endfor -%}
      {{- ns.dests + [{'name': 'reverse-proxy', 'host': reverse_proxy_ip, 'port': 443}] -}}
    hermes_agent_egress_probe_blocked_full: >-
      {{ hermes_agent_egress_probe_blocked + [{'name': 'hermes-own-node-exporter', 'host': hermes_ip, 'port': 9100}] }}

- name: Probe allowlisted destinations from inside the agent (must connect)
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - hermes_agent
      - python3
      - -c
      - >-
        import socket, sys;
        host, port, timeout = sys.argv[1], int(sys.argv[2]), 3;
        s = socket.create_connection((host, port), timeout=timeout);
        s.close()
      - "{{ item.host }}"
      - "{{ item.port }}"
  loop: "{{ hermes_agent_egress_probe_allowed }}"
  loop_control:
    label: "{{ item.name }} ({{ item.host }}:{{ item.port }})"
  register: hermes_agent_egress_probe_allowed_results
  changed_when: false

- name: Assert every allowlisted egress destination connected (SC-009)
  ansible.builtin.assert:
    that:
      - item.rc == 0
    fail_msg: >-
      Egress probe: allowlisted destination '{{ item.item.name }}'
      ({{ item.item.host }}:{{ item.item.port }}) did NOT connect from inside the agent
      container (rc={{ item.rc }}: {{ item.stderr | default('') | trim }}). The egress
      allowlist is missing a required rule (FR-008).
  loop: "{{ hermes_agent_egress_probe_allowed_results.results }}"
  loop_control:
    label: "{{ item.item.name }} ({{ item.item.host }}:{{ item.item.port }})"

- name: Probe blocked destinations from inside the agent (must fail)
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - hermes_agent
      - python3
      - -c
      - >-
        import socket, sys;
        host, port, timeout = sys.argv[1], int(sys.argv[2]), 3;
        s = socket.create_connection((host, port), timeout=timeout);
        s.close()
      - "{{ item.host }}"
      - "{{ item.port }}"
  loop: "{{ hermes_agent_egress_probe_blocked_full }}"
  loop_control:
    label: "{{ item.name }} ({{ item.host }}:{{ item.port }})"
  register: hermes_agent_egress_probe_blocked_results
  changed_when: false
  failed_when: false

- name: Assert every blocked egress destination was refused (SC-009)
  ansible.builtin.assert:
    that:
      - item.rc != 0
    fail_msg: >-
      Egress probe: BLOCKED destination '{{ item.item.name }}'
      ({{ item.item.host }}:{{ item.item.port }}) CONNECTED from inside the agent container.
      The egress allowlist is leaking (FR-008) — fix the rules before the agent is trusted.
  loop: "{{ hermes_agent_egress_probe_blocked_results.results }}"
  loop_control:
    label: "{{ item.item.name }} ({{ item.item.host }}:{{ item.item.port }})"

# TOOL_SERVER_CONNECTIONS is a PersistentConfig: seed_defaults() inserts a key "only if the
# key is absent" — "Existing DB values take precedence over defaults." So the env var seeds
# the FIRST boot and is inert forever after, which would make every later edit to
# hermes_mcp_servers a silent no-op and break FR-013's promise that adding a tool service is
# a pure configuration change. This task is what keeps that promise.
#
# Runs after the readiness check on purpose: the database must exist and the app must have
# seeded before there is anything to compare against.
#
# Ansible OWNS this list, reconciled by info.id: declared servers have their managed fields
# merged in (unknown keys on an entry are preserved, so the task does not flap if the app or
# the admin UI adds one), and undeclared entries are removed — otherwise deleting a server
# from group_vars would do nothing. Consequence, accepted: a tool server added by hand in the
# admin UI is removed on the next deploy.
#
# The desired value goes in on STDIN, never argv: `docker exec … python3 -c "<json>"` would
# expose a bearer token to `ps` on the LXC. The script itself holds no secret.
#
# No `-u`: this container runs as root (uid=0) and the db/-wal/-shm files are root-owned, so
# root matches the app's UID. The opposite is the usual trap — a root-created -wal beside a
# non-root app silently breaks the app's writes, which is why roles/nextcloud uses
# `docker exec -u www-data`.
# The same PersistentConfig problem as the tool servers below, for scalar keys: Open WebUI
# seeds these from the environment on FIRST boot only, then its database wins, so editing the
# compose and redeploying is silently a no-op. Drill T040 proved it (compose said
# hermes-balanced, running system said hermes-fast) and it bit for real on the first PDF
# upload, where rag.embedding_batch_size was stuck at its default of 1 and one request per
# chunk exhausted the gateway allowance.
#
# Only the keys in hermes_managed_config are touched. Anything the operator changes in the
# admin UI that we do not declare keeps working and is never overwritten — that is the trade
# that kept persistence enabled instead of switching it off wholesale.
- name: Reconcile the persisted Open WebUI configuration we own
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "-i"
      - hermes_open_webui
      - python3
      - "-c"
      - |
        import json, sqlite3, sys, time

        desired = json.loads(sys.stdin.read())
        con = sqlite3.connect('/app/backend/data/webui.db', timeout=5)
        con.execute('PRAGMA busy_timeout=5000')

        cols = [r[1] for r in con.execute('PRAGMA table_info(config)')]
        if 'key' not in cols or 'value' not in cols:
            sys.exit('SCHEMA DRIFT: config table has columns %s; expected key/value. '
                     'Refusing to write.' % cols)

        changed = []
        now = int(time.time())
        for key, want in sorted(desired.items()):
            row = con.execute('SELECT value FROM config WHERE key=?', (key,)).fetchone()
            current = None
            if row and row[0] is not None:
                try:
                    current = json.loads(row[0])
                except (TypeError, ValueError):
                    current = row[0]
            if current == want:
                continue
            con.execute(
                'INSERT INTO config (key, value, updated_at) VALUES (?, ?, ?) '
                'ON CONFLICT(key) DO UPDATE SET value=excluded.value, '
                'updated_at=excluded.updated_at',
                (key, json.dumps(want), now),
            )
            changed.append(key)
        if changed:
            con.commit()
        con.close()
        print('CHANGED ' + ','.join(changed) if changed else 'UNCHANGED')
    stdin: "{{ hermes_managed_config | to_json }}"
  register: hermes_config_reconcile
  # Exact prefix, not `in`: 'CHANGED' is a substring of 'UNCHANGED'.
  changed_when: hermes_config_reconcile.stdout is match('^CHANGED')
  notify: Restart hermes

- name: Reconcile the persisted MCP tool-server registrations
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "-i"
      - hermes_open_webui
      - python3
      - "-c"
      - |
        import json, sqlite3, sys, time

        KEY = 'tool_server.connections'
        MANAGED = ('type', 'url', 'auth_type', 'key')
        desired = json.loads(sys.stdin.read())

        con = sqlite3.connect('/app/backend/data/webui.db', timeout=5)
        con.execute('PRAGMA busy_timeout=5000')

        cols = [r[1] for r in con.execute('PRAGMA table_info(config)')]
        if 'key' not in cols or 'value' not in cols:
            sys.exit('SCHEMA DRIFT: config table has columns %s; expected key/value. '
                     'Refusing to write.' % cols)

        row = con.execute('SELECT value FROM config WHERE key=?', (KEY,)).fetchone()
        try:
            current = json.loads(row[0]) if row and row[0] else []
        except (TypeError, ValueError):
            current = []
        if not isinstance(current, list):
            current = []

        by_id = {}
        for entry in current:
            eid = (entry.get('info') or {}).get('id')
            if eid:
                by_id[eid] = entry

        result = []
        for want in desired:
            wid = want['info']['id']
            merged = dict(by_id.get(wid, {}))
            for field in MANAGED:
                merged[field] = want[field]
            info = dict(merged.get('info') or {})
            info.update(want['info'])
            merged['info'] = info
            cfg = dict(merged.get('config') or {})
            cfg['enable'] = want['config']['enable']
            merged['config'] = cfg
            result.append(merged)

        changed = json.dumps(current, sort_keys=True) != json.dumps(result, sort_keys=True)
        if changed:
            con.execute(
                'INSERT INTO config (key, value, updated_at) VALUES (?, ?, ?) '
                'ON CONFLICT(key) DO UPDATE SET value=excluded.value, '
                'updated_at=excluded.updated_at',
                (KEY, json.dumps(result), int(time.time())),
            )
            con.commit()
        con.close()
        print('CHANGED' if changed else 'UNCHANGED')
    stdin: "{{ hermes_tool_server_connections | default([]) | to_json }}"
  register: hermes_mcp_reconcile
  # Exact match, NOT `'CHANGED' in stdout` — 'CHANGED' is a substring of 'UNCHANGED', so the
  # `in` form is always true and the task reported changed (and restarted the stack) on every
  # run. Caught by the idempotency check; the script itself was correct all along.
  changed_when: hermes_mcp_reconcile.stdout | trim == 'CHANGED'
  notify: Restart hermes
  # stdin carries the token for any auth: bearer entry, and Ansible echoes module args on
  # failure at higher verbosity. Debuggability is traded for not leaking it into CI logs.
  no_log: true
