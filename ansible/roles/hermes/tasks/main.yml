---
- name: Include preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Ensure install directory exists
  ansible.builtin.file:
    path: "{{ hermes_install_dir }}"
    state: directory
    mode: '0755'

- name: Ensure SearXNG config directory exists
  ansible.builtin.file:
    path: "{{ hermes_searxng_install_dir }}"
    state: directory
    mode: '0755'

# Single bind-mounted volume, matching the upstream image's expectation of one DATA_DIR
# (/app/backend/data): SQLite, uploaded documents and the vector index all live under it
# (data-model.md § Workspace state), which is what makes the service_backup role's one bind-mount
# sufficient for all three.
- name: Ensure data directory exists
  ansible.builtin.file:
    path: "{{ hermes_data_dir }}/open-webui"
    state: directory
    mode: '0755'

# --- Agent runtime (spec 083) ---
#
# The agent's data directory (jobs, scripts, memory, scout state) and its deploy-owned
# configuration. The config is mounted read-only over /opt/data/config.yaml (FR-002); the
# env file carries the vault-rendered secrets and is never backed up or restored (FR-010).

- name: Ensure the agent data directory exists
  ansible.builtin.file:
    path: "{{ hermes_agent_data_dir }}"
    state: directory
    owner: "{{ hermes_agent_uid }}"
    group: "{{ hermes_agent_uid }}"
    mode: '0750'

- name: Ensure the agent log directory exists (095 T072, mounted at /opt/data/logs)
  ansible.builtin.file:
    path: "{{ hermes_agent_log_dir }}"
    state: directory
    owner: "{{ hermes_agent_uid }}"
    group: "{{ hermes_agent_uid }}"
    mode: '0755'

- name: Ensure the agent scripts directory exists
  ansible.builtin.file:
    path: "{{ hermes_agent_data_dir }}/scripts"
    state: directory
    owner: "{{ hermes_agent_uid }}"
    group: "{{ hermes_agent_uid }}"
    mode: '0750'

# Scheduler heartbeat (US4, R-007): PROD only. The container writes into its own directory;
# node_exporter reads it through a symlink, so the agent never gets write access to the
# shared textfile directory.
- name: Ensure the agent heartbeat directory exists
  ansible.builtin.file:
    path: "{{ hermes_agent_heartbeat_dir }}"
    state: directory
    owner: "{{ hermes_agent_uid }}"
    group: "{{ hermes_agent_uid }}"
    mode: '0755'
  when: hermes_agent_operational

- name: Install the heartbeat script
  ansible.builtin.template:
    src: agent-heartbeat.sh.j2
    dest: "{{ hermes_agent_data_dir }}/scripts/heartbeat.sh"
    owner: "{{ hermes_agent_uid }}"
    group: "{{ hermes_agent_uid }}"
    mode: '0755'
  when: hermes_agent_operational

- name: Expose the heartbeat file to node_exporter
  ansible.builtin.file:
    src: "{{ hermes_agent_heartbeat_dir }}/hermes_agent.prom"
    # Same fallback as backup_hermes.sh.j2: node_exporter_textfile_directory is a default of
    # the node_exporter role, which this play does not include.
    dest: "{{ node_exporter_textfile_directory | default('/var/lib/node_exporter/textfile_collector') }}/hermes_agent.prom"
    state: link
    force: true
    follow: false
  when: hermes_agent_operational

- name: Deploy the agent configuration (read-only mount source)
  ansible.builtin.template:
    src: agent-config.yaml.j2
    dest: "{{ hermes_agent_config_path }}"
    owner: root
    mode: '0644'
  notify: Restart hermes

# ntfy chunking shim (095 R-018): overrides the bundled ntfy adapter so long replies are split,
# not cut at 4096 characters. Root-owned and mounted :ro into the agent, so the agent (which can
# write /opt/data) cannot change gateway-executed code. Remove with T076 (upstream fix released).
- name: Install the agent plugin overrides (read-only mount source)
  ansible.builtin.copy:
    src: plugins/
    dest: "{{ hermes_agent_plugins_dir }}/"
    owner: root
    group: root
    mode: u=rwX,g=rX,o=rX
    directory_mode: '0755'
  notify: Restart hermes

# Gateway hooks (095 T018/T029): Python the gateway runs on startup. Root-owned and mounted :ro,
# so the agent (which can write /opt/data) cannot rewrite gateway-executed code.
- name: Install the agent gateway hooks (read-only mount source)
  ansible.builtin.copy:
    src: hooks/
    dest: "{{ hermes_agent_hooks_dir }}/"
    owner: root
    group: root
    mode: u=rwX,g=rX,o=rX
    directory_mode: '0755'
  notify: Restart hermes

# Login-shell PATH drop-in: the terminal tool snapshots `bash -l`, and Debian's /etc/profile
# resets a non-root PATH, dropping /opt/hermes/bin, so the agent's own `hermes` CLI was "command
# not found" from its terminal. Root-owned and mounted :ro, same reason as the hooks above.
- name: Install the agent login-shell PATH drop-in (read-only mount source)
  ansible.builtin.copy:
    src: profile.d/
    dest: "{{ hermes_agent_profile_dir }}/"
    owner: root
    group: root
    mode: u=rw,g=r,o=r
    directory_mode: '0755'
  notify: Restart hermes

# Spec 097 (FR-001, R-003): the Hindsight memory provider and its packages, then its config.
- name: Install the memory provider plugin (read-only mount source)
  ansible.builtin.include_tasks: memory_plugin.yml

- name: Deploy the memory plugin configuration (read-only mount source)
  ansible.builtin.template:
    src: hindsight-config.json.j2
    dest: "{{ hermes_memory_plugin_config_path }}"
    owner: root
    group: root
    mode: '0644'
  no_log: true
  notify: Restart hermes

- name: Deploy the agent environment (vault-rendered secrets)
  ansible.builtin.template:
    src: agent.env.j2
    dest: "{{ hermes_agent_env_path }}"
    owner: "{{ hermes_agent_uid }}"
    group: "{{ hermes_agent_uid }}"
    mode: '0600'
  notify: Restart hermes
  no_log: true

# FR-014 (083) + FR-011 (095): the pipeline LAB stage must never hold the push credential;
# the LAB rig may only ever hold the scratch pair. Check the rendered file, not the inputs,
# so a template regression is caught. (LAB deploys the real LXC — backlog 067 — so this is
# also what removes a token left by an earlier PROD deploy: the template re-renders.)
- name: Read the rendered agent environment (LAB guards)
  ansible.builtin.slurp:
    src: "{{ hermes_agent_env_path }}"
  register: hermes_agent_env_rendered
  no_log: true

- name: Assert the pipeline LAB stage environment holds no push credential (083 FR-014)
  ansible.builtin.assert:
    that:
      - (hermes_agent_env_rendered.content | b64decode).splitlines() | select('match', '^\\s*NTFY_TOKEN\\s*=') | list | length == 0
      - (hermes_agent_env_rendered.content | b64decode).splitlines() | select('match', '^\\s*NTFY_TOPIC\\s*=') | list | length == 0
      - (hermes_agent_env_rendered.content | b64decode).splitlines() | select('match', '^\\s*NTFY_ALLOWED_USERS\\s*=') | list | length == 0
    fail_msg: >-
      The rendered agent environment contains NTFY_TOKEN, NTFY_TOPIC or NTFY_ALLOWED_USERS on
      a pipeline LAB deploy. The LAB stage must never be able to reach the phone
      (spec 083 FR-014, 095 FR-011: the ntfy platform stays off there).
  when: not hermes_agent_operational and not (lab_inventory | default(false) | bool)
  no_log: true

- name: Assert the LAB rig environment holds only the scratch pair (095 FR-011)
  ansible.builtin.assert:
    that:
      - env_lines | select('match', '^NTFY_TOPIC=hermes-lab-in$') | list | length == 1
      - env_lines | select('match', '^NTFY_PUBLISH_TOPIC=hermes-lab$') | list | length == 1
      - env_lines | select('match', '^NTFY_TOPIC=hermes-in$') | list | length == 0
      - env_lines | select('search', 'hermes-in') | list | length == 0
      - env_lines | select('search', ntfy_hermes_token) | list | length == 0
    fail_msg: >-
      The LAB rig agent environment is not the scratch pair (hermes-lab-in / hermes-lab), or
      leaks a production topic or the PROD token (spec 095 FR-011).
  vars:
    # Comment lines excluded (found 2026-10-26, T068 first real deploy to the rig): the
    # template's own header explains all three modes by name, so its prose necessarily
    # contains the literal text "hermes-in" when describing what the PROD branch does. An
    # unanchored `search` over the full file (comments included) therefore failed every
    # correct render, not just a leaking one. The anchored `match` conditions above were never
    # affected -- comment lines start with `#`, never with a bare variable name.
    env_lines: "{{ (hermes_agent_env_rendered.content | b64decode).splitlines() | reject('match', '^\\s*#') | list }}"
  when: not hermes_agent_operational and (lab_inventory | default(false) | bool)
  no_log: true

- name: Assert no allow-all variable ever appears in the agent environment (095 FR-003)
  ansible.builtin.assert:
    that:
      - env_lines | select('match', '^\\s*(NTFY_ALLOW_ALL_USERS|GATEWAY_ALLOW_ALL_USERS)\\s*=') | list | length == 0
    fail_msg: >-
      An *_ALLOW_ALL_USERS variable appears in the rendered agent environment. A topic that
      can talk to the agent would be a shell credential (spec 095 FR-003).
  vars:
    env_lines: "{{ (hermes_agent_env_rendered.content | b64decode).splitlines() | reject('match', '^\\s*#') | list }}"
  # Every mode, PROD included (095 T016): PROD is where hermes-in reaches the agent.
  no_log: true

- name: Deploy SearXNG settings
  ansible.builtin.template:
    src: searxng-settings.yml.j2
    dest: "{{ hermes_searxng_install_dir }}/settings.yml"
    mode: '0640'
  notify: Restart hermes

# Built once here, consumed BOTH by docker-compose.yml.j2 (which seeds Open WebUI on a first
# boot) and by the reconcile task at the end of this file (which is what makes a LATER edit
# take effect). Two renderings of the same intent would drift; one fact cannot.
#
# The shape is upstream's, not ours, and it is unforgiving: listing gates on
# `config.enable` (routers/tools.py) and execution matches on `info.id`
# (utils/middleware.py). An entry with `enabled`/`id`/`name` at the top level is silently
# dropped by both — no error, no log line. That was the original bug.
- name: Build the MCP tool-server connection list
  ansible.builtin.set_fact:
    hermes_tool_server_connections: >-
      {{ hermes_tool_server_connections | default([]) + [{
        'type': 'mcp',
        'url': item.url,
        'auth_type': item.auth,
        'key': (lookup('vars', item.vault_var | default(item.credential_env | lower)) if item.auth == 'bearer' and item.enabled else ''),
        'config': {'enable': item.enabled},
        'info': {
          'id': item.name | lower | regex_replace('[^a-z0-9]+', '-'),
          'name': item.name
        }
      }] }}
  loop: "{{ hermes_mcp_servers }}"
  loop_control:
    label: "{{ item.name }}"
  # Facts land in hostvars, and an auth: bearer entry puts a real token in this one. A
  # disabled entry carries no key, so a mode that switches a server off holds no token for it.
  no_log: true

# Retiring Open WebUI Automations (083 US3, FR-015): list any that exist and stop, rather than
# switch the feature off underneath them. Moving or deleting one is an owner decision. Skips on
# a first deploy (no container yet) and on a database without the table.
- name: List existing Open WebUI automations
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - hermes_open_webui
      - python3
      - "-c"
      - |
        import json, sqlite3
        con = sqlite3.connect('/app/backend/data/webui.db', timeout=5)
        if not con.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name='automation'").fetchone():
            print('[]')
        else:
            rows = con.execute('SELECT name, data, is_active FROM automation').fetchall()
            print(json.dumps([{'name': n, 'schedule': (json.loads(d or '{}').get('rrule') or ''),
                               'active': bool(a)} for n, d, a in rows]))
  register: hermes_automations
  changed_when: false
  failed_when:
    - hermes_automations.rc != 0
    - hermes_automations.stderr is not search('No such container|is not running')

- name: Assert no Open WebUI automations remain (FR-015)
  ansible.builtin.assert:
    that:
      - hermes_automations.stdout | from_json | length == 0
    fail_msg: >-
      Open WebUI still has {{ hermes_automations.stdout | from_json | length }} automation(s):
      {% for a in hermes_automations.stdout | from_json %}'{{ a.name }}'
      ({{ a.schedule | replace('\n', ' ') }}, active={{ a.active }}){{ '; ' if not loop.last }}{% endfor %}.
      Move each to an agent job (`hermes cron create`) or delete it in Open WebUI, then deploy
      again. The deploy will not disable Automations underneath them.
  when: hermes_automations.rc == 0

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ hermes_install_dir }}/docker-compose.yml"
    mode: '0640'
  notify: Restart hermes
  no_log: true

# --- Agent confinement (spec 083, FR-004, FR-007) ---
#
# The agent must never start without its confinement in place. Preflight checks the inputs
# (pin, credentials, URLs); this checks the OUTPUT — the rendered compose — so a template
# regression that re-adds a port, a privilege or a socket mount fails the deploy before
# docker_compose_v2 ever runs.
# slurp, not lookup('file'): lookups run on the controller, and the compose file was
# rendered on the target.
- name: Read the rendered compose file
  ansible.builtin.slurp:
    src: "{{ hermes_install_dir }}/docker-compose.yml"
  register: hermes_compose_rendered

- name: Assert the rendered agent service is confined (FR-004, FR-007)
  ansible.builtin.assert:
    that:
      - "'hermes-agent' in (hermes_compose | from_yaml).services"
      - (hermes_compose | from_yaml).services['hermes-agent'].get('ports', []) | length == 0
      - (hermes_compose | from_yaml).services['hermes-agent'].get('privileged', false) in [false, none]
      - (hermes_compose | from_yaml).services['hermes-agent'].get('cap_add', []) | length == 0
      - (hermes_compose | from_yaml).services['hermes-agent'].volumes | map('string') | select('search', 'docker.sock') | list | length == 0
      - (hermes_compose | from_yaml).services['hermes-agent'].networks | list | sort == ['agent']
      - (hermes_compose | from_yaml).services['hermes-agent'].volumes | map('string') | select('search', ':/opt/data/plugins') | reject('search', ':ro$') | list | length == 0
      - (hermes_compose | from_yaml).services['hermes-agent'].volumes | map('string') | select('search', ':/opt/data/hooks') | reject('search', ':ro$') | list | length == 0
      - (hermes_compose | from_yaml).services['hermes-agent'].volumes | map('string') | select('search', ':/opt/data/hindsight') | reject('search', ':ro$') | list | length == 0
      - (hermes_compose | from_yaml).services['hermes-agent'].volumes | map('string') | select('search', ':/opt/hermes-memory-deps') | reject('search', ':ro$') | list | length == 0
      - (hermes_compose | from_yaml).services['hermes-agent'].volumes | map('string') | select('search', ':/opt/hermes/') | reject('search', ':ro$') | list | length == 0
      - (hermes_compose | from_yaml).services['hermes-agent'].volumes | map('string') | select('search', ':/etc/') | reject('search', ':ro$') | list | length == 0
    fail_msg: >-
      The rendered hermes-agent service is not confined: it must have no published ports,
      no privileged mode, no cap_add, no Docker socket mount, and sit only on the `agent`
      network (spec 083 FR-004/FR-007/FR-008), and every /opt/data/plugins, /opt/data/hooks,
      /opt/data/hindsight, /opt/hermes-memory-deps, /opt/hermes and /etc mount must be :ro (095 R-018, R-007,
      097 R-003). Fix docker-compose.yml.j2 before deploying.
  vars:
    hermes_compose: "{{ hermes_compose_rendered.content | b64decode }}"

# --- Egress allowlist (spec 083, FR-008) — must be live before the agent starts ---
#
# The script flushes and refills its own chain and is idempotent; the oneshot re-applies it
# on every Docker restart (PartOf), and we run it on every deploy. On a first deploy the
# DOCKER-USER chain may not exist until Docker starts — the script creates it if missing.

- name: Deploy the agent egress allowlist script
  ansible.builtin.template:
    src: hermes-agent-egress.sh.j2
    dest: /usr/local/sbin/hermes-agent-egress.sh
    owner: root
    mode: '0750'

- name: Install the agent egress systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/hermes-agent-egress.service
    owner: root
    mode: '0644'
    content: |
      [Unit]
      Description=Hermes agent egress allowlist (spec 083, FR-008)
      After=docker.service
      Wants=docker.service
      PartOf=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/hermes-agent-egress.sh

      [Install]
      WantedBy=docker.service

- name: Enable the agent egress systemd unit
  ansible.builtin.systemd:
    name: hermes-agent-egress
    enabled: true
    daemon_reload: true

- name: Apply the agent egress allowlist now
  ansible.builtin.command:
    cmd: /usr/local/sbin/hermes-agent-egress.sh
  changed_when: false

- name: Ensure hermes stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ hermes_install_dir }}"
    state: present
    remove_orphans: true
    pull: always

- name: Wait for the workspace to be reachable
  ansible.builtin.wait_for:
    port: "{{ hermes_port }}"
    host: "127.0.0.1"
    delay: 5
    timeout: 180

- name: Verify the workspace is healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ hermes_port }}/health"
    method: GET
    status_code: 200
  register: hermes_health
  retries: 12
  delay: 10
  until: hermes_health.status == 200
  changed_when: false

# --- Egress probe (spec 083, SC-009) ---
#
# The allowlist (FR-008) is only as good as its enforcement, so the deploy proves it from
# the agent's own network namespace: every allowlisted destination must connect, every
# blocked destination must fail. A mismatch names the offending destination and fails the
# deploy.
- name: Wait for the agent to be healthy
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{% raw %}{{ .State.Health.Status }}{% endraw %}"
      - hermes_agent
  register: hermes_agent_health
  until: hermes_agent_health.stdout == 'healthy'
  retries: 30
  delay: 10
  changed_when: false

# 097 R-003: `hermes memory status` reports the provider available without importing its
# client, so a missing package only shows as a failed recall on every turn. Import it the way
# the gateway does: the image's venv, with the launcher's PYTHONPATH.
- name: Assert the agent can import the memory provider's packages
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -u
      - hermes
      - -e
      - PYTHONPATH=/opt/hermes/.:{{ hermes_agent_site_packages }}
      - hermes_agent
      - /opt/hermes/.venv/bin/python
      - -c
      - import hindsight_client, hindsight_embed, aiohttp_retry
  changed_when: false

- name: Build the egress probe destination list
  ansible.builtin.set_fact:
    hermes_agent_egress_probe_allowed: >-
      {%- set ns = namespace(dests=[
           {'name': 'searxng', 'host': 'searxng', 'port': 8080},
           {'name': 'llm-router', 'host': llm_router_ip, 'port': llm_router_port | int}]) -%}
      {%- for s in hermes_mcp_servers | selectattr('enabled', 'defined') | selectattr('enabled') -%}
      {%- set ns.dests = ns.dests + [{'name': 'mcp-' ~ s.name, 'host': s.url | urlsplit('hostname'), 'port': s.url | urlsplit('port') | int}] -%}
      {%- endfor -%}
      {{- ns.dests + [{'name': 'reverse-proxy', 'host': reverse_proxy_ip, 'port': 443}] -}}
    hermes_agent_egress_probe_blocked_full: >-
      {{ hermes_agent_egress_probe_blocked + [{'name': 'hermes-own-node-exporter', 'host': hermes_ip, 'port': 9100}] }}

# A lab copy holds only this service (067): the peers below do not exist there, so probing them
# would time out. Probe what the copy has (searxng) and record the rest (R-010).
- name: Set aside egress probes to peer services a lab copy does not have
  ansible.builtin.set_fact:
    hermes_agent_egress_probe_skipped: "{{ hermes_agent_egress_probe_allowed | rejectattr('host', 'equalto', 'searxng') | list }}"
  when: (deploy_environment | default('prod')) == 'lab'

- name: Keep only the in-copy destinations in the allowlist probe
  ansible.builtin.set_fact:
    hermes_agent_egress_probe_allowed: "{{ hermes_agent_egress_probe_allowed | selectattr('host', 'equalto', 'searxng') | list }}"
  when: (deploy_environment | default('prod')) == 'lab'

- name: Record the skipped lab checks
  ansible.builtin.lineinfile:
    path: "{{ evidence_dir }}/reports/lab/skipped-checks.txt"
    create: true
    mode: "0644"
    line: "hermes egress probe {{ item.name }} ({{ item.host }}:{{ item.port }}): peer service is not part of the lab copy"
  loop: "{{ hermes_agent_egress_probe_skipped | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
  become: false
  when:
    - (deploy_environment | default('prod')) == 'lab'
    - evidence_dir is defined

- name: Probe allowlisted destinations from inside the agent (must connect)
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - hermes_agent
      - python3
      - -c
      - >-
        import socket, sys;
        host, port, timeout = sys.argv[1], int(sys.argv[2]), 3;
        s = socket.create_connection((host, port), timeout=timeout);
        s.close()
      - "{{ item.host }}"
      - "{{ item.port }}"
  loop: "{{ hermes_agent_egress_probe_allowed }}"
  loop_control:
    label: "{{ item.name }} ({{ item.host }}:{{ item.port }})"
  register: hermes_agent_egress_probe_allowed_results
  changed_when: false

- name: Assert every allowlisted egress destination connected (SC-009)
  ansible.builtin.assert:
    that:
      - item.rc == 0
    fail_msg: >-
      Egress probe: allowlisted destination '{{ item.item.name }}'
      ({{ item.item.host }}:{{ item.item.port }}) did NOT connect from inside the agent
      container (rc={{ item.rc }}: {{ item.stderr | default('') | trim }}). The egress
      allowlist is missing a required rule (FR-008).
  loop: "{{ hermes_agent_egress_probe_allowed_results.results }}"
  loop_control:
    label: "{{ item.item.name }} ({{ item.item.host }}:{{ item.item.port }})"

- name: Probe blocked destinations from inside the agent (must fail)
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - hermes_agent
      - python3
      - -c
      - >-
        import socket, sys;
        host, port, timeout = sys.argv[1], int(sys.argv[2]), 3;
        s = socket.create_connection((host, port), timeout=timeout);
        s.close()
      - "{{ item.host }}"
      - "{{ item.port }}"
  loop: "{{ hermes_agent_egress_probe_blocked_full }}"
  loop_control:
    label: "{{ item.name }} ({{ item.host }}:{{ item.port }})"
  register: hermes_agent_egress_probe_blocked_results
  changed_when: false
  failed_when: false

- name: Assert every blocked egress destination was refused (SC-009)
  ansible.builtin.assert:
    that:
      - item.rc != 0
    fail_msg: >-
      Egress probe: BLOCKED destination '{{ item.item.name }}'
      ({{ item.item.host }}:{{ item.item.port }}) CONNECTED from inside the agent container.
      The egress allowlist is leaking (FR-008) — fix the rules before the agent is trusted.
  loop: "{{ hermes_agent_egress_probe_blocked_results.results }}"
  loop_control:
    label: "{{ item.item.name }} ({{ item.item.host }}:{{ item.item.port }})"

# The heartbeat job is Ansible-owned on PROD only (R-007, FR-014). Created only when absent,
# so it is idempotent and safe after a restore (which brings the job back). Every other job is
# owner content.
- name: List the agent's scheduled jobs
  ansible.builtin.command:
    argv: [docker, exec, -u, hermes, hermes_agent, hermes, cron, list]
  register: hermes_agent_jobs
  changed_when: false

- name: Create the heartbeat job (PROD only)
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -u
      - hermes
      - hermes_agent
      - hermes
      - cron
      - create
      - every 15m
      - --no-agent
      - --script
      - heartbeat.sh
      - --deliver
      - ntfy
      - --name
      - heartbeat
  when:
    - hermes_agent_operational
    - hermes_agent_jobs.stdout is not search('(?m)^\\s+Name:\\s+heartbeat\\s*$')
  changed_when: true

# Only on the LAB rig (lab_inventory). The pipeline's LAB stage deploys the PRODUCTION machine
# with deploy_environment=lab (backlog 067), where the PROD heartbeat job legitimately exists:
# asserting there failed LAB deploy 39092898788. On that stage the job keeps running but cannot
# write (no /heartbeat mount) or deliver (no NTFY_TOKEN), so the metric ages and
# HermesAgentCronStale fires until the PROD apply, which is the right signal.
- name: Assert no heartbeat job exists on the LAB rig (FR-014)
  ansible.builtin.assert:
    that:
      - hermes_agent_jobs.stdout is not search('(?m)^\\s+Name:\\s+heartbeat\\s*$')
    fail_msg: A heartbeat job exists on the LAB rig; remove it with `hermes cron remove`.
  when: lab_inventory | default(false) | bool

# --- Open WebUI memories: import once, then retire (097 FR-016, research R-008) ---
#
# Open WebUI's own `memory` table is retained once into the shared memory with the admin key
# (document_id owui-memory-<id>, so a re-run replaces and never duplicates; tags
# origin:open-webui-memory and client:open-webui, which the admin key may keep). It runs before
# "Reconcile the persisted Open WebUI configuration we own", which switches memories.enable off
# (hermes_managed_config), and only while that switch is still on: once retired, later deploys
# never call the memory API here. The import is skipped when the store already holds as many
# owui-memory-* documents as there are memories, and the counts must match afterwards, or the
# deploy stops with the switch still on. The table itself is left in place (R-008).
# PROD only: the lab copy has no memory service.
- name: Read Open WebUI's own memories for the one-shot import (097 R-008)
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - hermes_open_webui
      - python3
      - "-c"
      - "{{ lookup('ansible.builtin.file', 'open_webui/read_memories.py') }}"
  register: hermes_owui_memories
  changed_when: false
  when: (deploy_environment | default('prod')) != 'lab'
  # The owner's memories: personal, kept out of CI logs.
  no_log: true

- name: Decide whether Open WebUI's memories still need importing
  ansible.builtin.set_fact:
    hermes_owui_memory_items: "{{ hermes_owui_memories_read.memories }}"
    hermes_owui_memory_import_open: "{{ hermes_owui_memories_read.enabled is not false and hermes_owui_memories_read.memories | length > 0 }}"
  vars:
    hermes_owui_memories_read: "{{ hermes_owui_memories.stdout | from_json }}"
  when: (deploy_environment | default('prod')) != 'lab'
  no_log: true

- name: Count the Open WebUI memories already in the shared memory
  ansible.builtin.uri:
    url: "{{ hermes_memory_api_url }}/v1/default/banks/{{ hermes_memory_bank_id }}/documents?q=owui-memory-&limit=1000"
    headers:
      Authorization: "Bearer {{ memory_admin_key }}"
    return_content: true
  register: hermes_owui_memory_stored
  when:
    - (deploy_environment | default('prod')) != 'lab'
    - hermes_owui_memory_import_open | bool
  no_log: true

- name: Import Open WebUI's memories into the shared memory (admin key, synchronous)
  ansible.builtin.uri:
    url: "{{ hermes_memory_api_url }}/v1/default/banks/{{ hermes_memory_bank_id }}/memories"
    method: POST
    headers:
      Authorization: "Bearer {{ memory_admin_key }}"
    body_format: json
    body: "{{ {'items': [item], 'async': false} }}"
    timeout: 300
  # default([]): Ansible templates the loop before `when`, and the lab copy never reads the list.
  loop: "{{ hermes_owui_memory_items | default([]) }}"
  loop_control:
    label: "{{ item.document_id }}"
  vars:
    hermes_owui_memory_stored_count: >-
      {{ hermes_owui_memory_stored.json['items'] | map(attribute='id') | select('match', 'owui-memory-') | list | length }}
  changed_when: true
  when:
    - (deploy_environment | default('prod')) != 'lab'
    - hermes_owui_memory_import_open | bool
    - hermes_owui_memory_stored_count | int != hermes_owui_memory_items | length
  no_log: true

- name: Count the Open WebUI memories in the shared memory after the import
  ansible.builtin.uri:
    url: "{{ hermes_memory_api_url }}/v1/default/banks/{{ hermes_memory_bank_id }}/documents?q=owui-memory-&limit=1000"
    headers:
      Authorization: "Bearer {{ memory_admin_key }}"
    return_content: true
  register: hermes_owui_memory_stored_after
  when:
    - (deploy_environment | default('prod')) != 'lab'
    - hermes_owui_memory_import_open | bool
  no_log: true

- name: Assert every Open WebUI memory is in the shared memory (097 R-008)
  ansible.builtin.assert:
    that:
      - hermes_owui_memory_stored_count | int == hermes_owui_memory_items | length
    fail_msg: >-
      The shared memory holds {{ hermes_owui_memory_stored_count }} owui-memory-* documents, but
      Open WebUI has {{ hermes_owui_memory_items | length }} memories. Open WebUI's memories stay
      on until the import is complete; fix the import and deploy again (097 R-008).
    success_msg: "Imported {{ hermes_owui_memory_items | length }} Open WebUI memories."
  vars:
    hermes_owui_memory_stored_count: >-
      {{ hermes_owui_memory_stored_after.json['items'] | map(attribute='id') | select('match', 'owui-memory-') | list | length }}
  when:
    - (deploy_environment | default('prod')) != 'lab'
    - hermes_owui_memory_import_open | bool

- name: Record the skipped Open WebUI memories import (lab)
  ansible.builtin.lineinfile:
    path: "{{ evidence_dir }}/reports/lab/skipped-checks.txt"
    create: true
    mode: "0644"
    line: "hermes: Open WebUI memories import (097 R-008): the memory service is not part of the lab copy"
  delegate_to: localhost
  become: false
  when:
    - (deploy_environment | default('prod')) == 'lab'
    - evidence_dir is defined

# TOOL_SERVER_CONNECTIONS is a PersistentConfig: seed_defaults() inserts a key "only if the
# key is absent" — "Existing DB values take precedence over defaults." So the env var seeds
# the FIRST boot and is inert forever after, which would make every later edit to
# hermes_mcp_servers a silent no-op and break FR-013's promise that adding a tool service is
# a pure configuration change. This task is what keeps that promise.
#
# Runs after the readiness check on purpose: the database must exist and the app must have
# seeded before there is anything to compare against.
#
# Ansible OWNS this list, reconciled by info.id: declared servers have their managed fields
# merged in (unknown keys on an entry are preserved, so the task does not flap if the app or
# the admin UI adds one), and undeclared entries are removed — otherwise deleting a server
# from group_vars would do nothing. Consequence, accepted: a tool server added by hand in the
# admin UI is removed on the next deploy.
#
# The desired value goes in on STDIN, never argv: `docker exec … python3 -c "<json>"` would
# expose a bearer token to `ps` on the LXC. The script itself holds no secret.
#
# No `-u`: this container runs as root (uid=0) and the db/-wal/-shm files are root-owned, so
# root matches the app's UID. The opposite is the usual trap — a root-created -wal beside a
# non-root app silently breaks the app's writes, which is why roles/nextcloud uses
# `docker exec -u www-data`.
# The same PersistentConfig problem as the tool servers below, for scalar keys: Open WebUI
# seeds these from the environment on FIRST boot only, then its database wins, so editing the
# compose and redeploying is silently a no-op. Drill T040 proved it (compose said
# hermes-balanced, running system said hermes-fast) and it bit for real on the first PDF
# upload, where rag.embedding_batch_size was stuck at its default of 1 and one request per
# chunk exhausted the gateway allowance.
#
# Only the keys in hermes_managed_config are touched. Anything the operator changes in the
# admin UI that we do not declare keeps working and is never overwritten — that is the trade
# that kept persistence enabled instead of switching it off wholesale.
- name: Reconcile the persisted Open WebUI configuration we own
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "-i"
      - hermes_open_webui
      - python3
      - "-c"
      - "{{ lookup('ansible.builtin.file', 'reconcile_config.py') }}"
    stdin: "{{ hermes_managed_config | to_json }}"
  register: hermes_config_reconcile
  # Exact prefix, not `in`: 'CHANGED' is a substring of 'UNCHANGED'.
  changed_when: hermes_config_reconcile.stdout is match('^CHANGED')
  notify: Restart hermes


# The model connections (083 US2, R-010): the gateway stays at index 0 (the default) and the
# agent is the second. Same PersistentConfig problem and the same script, but the values
# include the connection keys, so this task is no_log and fed on stdin; Ansible would otherwise
# echo them on failure. The one exception to "secrets are absent from hermes_managed_config".
- name: Reconcile the Open WebUI model connections
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "-i"
      - hermes_open_webui
      - python3
      - "-c"
      - "{{ lookup('ansible.builtin.file', 'reconcile_config.py') }}"
    stdin: "{{ hermes_openai_connections | to_json }}"
  vars:
    hermes_openai_connections:
      openai.api_base_urls:
        - "{{ hermes_gateway_base_url }}"
        - "{{ hermes_agent_api_base_url }}"
      openai.api_keys:
        - "{{ llm_router_client_hermes_key }}"
        - "{{ hermes_agent_api_server_key }}"
  register: hermes_connections_reconcile
  changed_when: hermes_connections_reconcile.stdout is match('^CHANGED')
  notify: Restart hermes
  no_log: true

- name: Reconcile the persisted MCP tool-server registrations
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "-i"
      - hermes_open_webui
      - python3
      - "-c"
      - |
        import json, sqlite3, sys, time

        KEY = 'tool_server.connections'
        MANAGED = ('type', 'url', 'auth_type', 'key')
        desired = json.loads(sys.stdin.read())

        con = sqlite3.connect('/app/backend/data/webui.db', timeout=5)
        con.execute('PRAGMA busy_timeout=5000')

        cols = [r[1] for r in con.execute('PRAGMA table_info(config)')]
        if 'key' not in cols or 'value' not in cols:
            sys.exit('SCHEMA DRIFT: config table has columns %s; expected key/value. '
                     'Refusing to write.' % cols)

        row = con.execute('SELECT value FROM config WHERE key=?', (KEY,)).fetchone()
        try:
            current = json.loads(row[0]) if row and row[0] else []
        except (TypeError, ValueError):
            current = []
        if not isinstance(current, list):
            current = []

        by_id = {}
        for entry in current:
            eid = (entry.get('info') or {}).get('id')
            if eid:
                by_id[eid] = entry

        result = []
        for want in desired:
            wid = want['info']['id']
            merged = dict(by_id.get(wid, {}))
            for field in MANAGED:
                merged[field] = want[field]
            info = dict(merged.get('info') or {})
            info.update(want['info'])
            merged['info'] = info
            cfg = dict(merged.get('config') or {})
            cfg['enable'] = want['config']['enable']
            merged['config'] = cfg
            result.append(merged)

        changed = json.dumps(current, sort_keys=True) != json.dumps(result, sort_keys=True)
        if changed:
            con.execute(
                'INSERT INTO config (key, value, updated_at) VALUES (?, ?, ?) '
                'ON CONFLICT(key) DO UPDATE SET value=excluded.value, '
                'updated_at=excluded.updated_at',
                (KEY, json.dumps(result), int(time.time())),
            )
            con.commit()
        con.close()
        print('CHANGED' if changed else 'UNCHANGED')
    stdin: "{{ hermes_tool_server_connections | default([]) | to_json }}"
  register: hermes_mcp_reconcile
  # Exact match, NOT `'CHANGED' in stdout` — 'CHANGED' is a substring of 'UNCHANGED', so the
  # `in` form is always true and the task reported changed (and restarted the stack) on every
  # run. Caught by the idempotency check; the script itself was correct all along.
  changed_when: hermes_mcp_reconcile.stdout | trim == 'CHANGED'
  notify: Restart hermes
  # stdin carries the token for any auth: bearer entry, and Ansible echoes module args on
  # failure at higher verbosity. Debuggability is traded for not leaking it into CI logs.
  no_log: true

# The shared-memory filter (097 FR-019, research R-007): Open WebUI keeps functions only in the
# `function` table of webui.db, so the deploy upserts the row `shared_memory` (a global, active
# filter) with the content of files/open_webui/memory_filter.py and its valves. The script reads
# the agent's model ids from inside the container (it shares the compose network) and fails if
# there are none, because the filter must skip the agent's chats: the agent's plugin stores those.
#
# No restart: Open WebUI 0.11.3 re-reads a filter's content and valves from the database on every
# request (utils/plugin.py get_function_module_from_cache, utils/filter.py FilterContext), so a
# changed row is live at the next chat. The payload, with the memory key and the agent key, goes
# in on stdin, never argv. In the lab copy the memory API is unreachable and the filter fails open.
- name: Reconcile the shared memory filter (097 T042, R-007)
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "-i"
      - hermes_open_webui
      - python3
      - "-c"
      - "{{ lookup('ansible.builtin.file', 'open_webui/reconcile_filter.py') }}"
    stdin: "{{ hermes_memory_filter_payload | to_json }}"
  vars:
    hermes_memory_filter_payload:
      id: shared_memory
      name: Shared memory
      description: "Recall from and retain to the shared memory (spec 097). Managed by Ansible."
      content: "{{ lookup('ansible.builtin.file', 'open_webui/memory_filter.py') }}"
      valves:
        url: "{{ hermes_memory_api_url }}"
        key: "{{ memory_client_open_webui_key }}"
        bank: "{{ hermes_memory_bank_id }}"
      models_url: "{{ hermes_agent_api_base_url }}/models"
      models_key: "{{ hermes_agent_api_server_key }}"
  register: hermes_memory_filter_reconcile
  changed_when: hermes_memory_filter_reconcile.stdout is match('^CHANGED')
  no_log: true
