---
# The backup destination is a host-NFS-mount + bind-mount, NOT an in-guest NFS
# mount: an unprivileged LXC cannot issue the NFS mount syscall (kernel
# user-namespace restriction → EPERM), so the whole fleet mounts NFS on the PVE
# host and bind-mounts it in. Here the PVE host mounts the Synology share at
# /mnt/nas/homelab_financial_scenario (proxmox_mounts role) and the orchestrator
# bind-mounts it to {{ financial_scenario_backup_path }} via service_mountpoints
# in the environment tfvars. This role therefore only verifies the destination
# and installs the snapshot script + timer.
- name: Verify backup destination is the bind-mounted NAS share
  ansible.builtin.command: "findmnt --target {{ financial_scenario_backup_path }}"
  register: financial_scenario_backup_findmnt
  changed_when: false
  failed_when: financial_scenario_backup_findmnt.rc != 0

- name: Deploy backup script
  ansible.builtin.template:
    src: backup_financial_scenario.sh.j2
    dest: /usr/local/bin/backup_financial_scenario.sh
    mode: '0755'
    owner: root
    group: root

- name: Create systemd service for financial-scenario backup
  ansible.builtin.copy:
    dest: /etc/systemd/system/financial-scenario-backup.service
    content: |
      [Unit]
      Description=Financial Scenario Backup Service
      After=docker.service network.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/backup_financial_scenario.sh
      User=root
    mode: '0644'
  notify: Reload systemd

- name: Create systemd timer for financial-scenario backup
  ansible.builtin.copy:
    dest: /etc/systemd/system/financial-scenario-backup.timer
    content: |
      [Unit]
      Description=Run financial-scenario backup daily

      [Timer]
      OnCalendar={{ financial_scenario_backup_schedule }}
      Persistent=true

      [Install]
      WantedBy=timers.target
    mode: '0644'
  notify: Reload systemd

- name: Enable and start financial-scenario backup timer
  ansible.builtin.systemd:
    name: financial-scenario-backup.timer
    state: started
    enabled: true
