---
- name: Include preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Ensure install and extension directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ memory_install_dir }}"
    - "{{ memory_ext_dir }}"

- name: Ensure data directory exists
  ansible.builtin.file:
    path: "{{ memory_data_dir }}"
    state: directory
    mode: '0700'

# R-001: the policy module and the shim, mounted read-only into the stock image. The policy is
# the same file the unit and mutation tests cover.
- name: Install the access policy and the Hindsight shim
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ memory_ext_dir }}/"
    owner: root
    group: root
    mode: '0644'
  loop:
    - "{{ role_path }}/../../../python/src/homelab_proxmox_orchestrator/memory_access.py"
    - hindsight_ext/shim.py
  notify: Restart memory

- name: Deploy server.env, db.env and ui.env
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ memory_install_dir }}/{{ item }}"
    owner: root
    group: root
    mode: '0600'
  loop:
    - server.env
    - db.env
    - ui.env
  no_log: true
  notify: Restart memory

# Hashes only. Owned by the API container's user, which reads it once at start-up.
- name: Deploy clients.json
  ansible.builtin.template:
    src: clients.json.j2
    dest: "{{ memory_install_dir }}/clients.json"
    owner: "{{ memory_container_uid }}"
    group: root
    mode: '0400'
  no_log: true
  notify: Restart memory

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ memory_install_dir }}/docker-compose.yml"
    mode: '0644'
  notify: Restart memory

# The admin key for the nightly backup, the restore drill and the import (R-013). Root only.
- name: Write the backup key
  ansible.builtin.copy:
    content: "{{ memory_admin_key }}"
    dest: "{{ memory_install_dir }}/backup.key"
    owner: root
    group: root
    mode: '0400'
  no_log: true

- name: Ensure memory stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ memory_install_dir }}"
    state: present
    remove_orphans: true
    pull: always

# A changed config restarts the stack before the health wait, not at the end of the play.
- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Wait for memory API health endpoint
  ansible.builtin.uri:
    url: "http://{{ memory_ip }}:{{ memory_api_port }}/health"
    method: GET
    status_code: 200
  register: memory_health
  retries: 18
  delay: 10
  until: memory_health.status == 200
  changed_when: false

# R-020: /api/health needs no login. The UI starts after the API is healthy.
- name: Wait for the memory web UI health endpoint
  ansible.builtin.uri:
    url: "http://{{ memory_ip }}:{{ memory_ui_port }}/api/health"
    method: GET
    status_code: 200
  register: memory_ui_health
  retries: 18
  delay: 10
  until: memory_ui_health.status == 200
  changed_when: false

- name: Ensure banks and run the deploy probe
  ansible.builtin.include_tasks: bank.yml
