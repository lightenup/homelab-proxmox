---
- name: Destroy
  hosts: localhost
  gather_facts: false
  become: false

  environment:
    DOCKER_HOST: unix:///var/run/docker.sock

  vars:
    ansible_python_interpreter: >-
      {{ (lookup('env', 'VIRTUAL_ENV') ~ '/bin/python') if lookup('env', 'VIRTUAL_ENV') else ansible_playbook_python }}

    adguard_install_dir: "/tmp/molecule-adguardhome"

  tasks:
    - name: Stop stack (best-effort)
      community.docker.docker_compose_v2:
        project_src: "{{ adguard_install_dir }}"
        state: absent
        remove_orphans: true
      failed_when: false

    - name: Remove container (best-effort)
      community.docker.docker_container:
        name: adguardhome
        state: absent
        force_kill: true
      failed_when: false

    - name: Remove temp install dir
      ansible.builtin.file:
        path: "{{ adguard_install_dir }}"
        state: absent
      become: true
