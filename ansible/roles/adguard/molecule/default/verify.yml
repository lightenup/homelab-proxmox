---
- name: Verify
  hosts: localhost
  gather_facts: false
  become: false

  environment:
    DOCKER_HOST: unix:///var/run/docker.sock

  vars:
    ansible_python_interpreter: >-
      {{ (lookup('env', 'VIRTUAL_ENV') ~ '/bin/python') if lookup('env', 'VIRTUAL_ENV') else ansible_playbook_python }}

    adguard_port_setup: 53000

  tasks:
    - name: Container exists in docker ps
      ansible.builtin.command: docker ps --filter name=^/adguardhome$ --quiet
      register: adguard_ps
      changed_when: false

    - name: Assert container is running
      ansible.builtin.assert:
        that:
          - (adguard_ps.stdout | trim) != ""

    - name: Setup UI port is reachable
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ adguard_port_setup }}"
        delay: 2
        timeout: 120
