---
- name: Verify
  hosts: localhost
  gather_facts: false
  become: false

  environment:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_VERIFY: "0"

  vars:
    ansible_python_interpreter: >-
      {{ (lookup('env', 'VIRTUAL_ENV') ~ '/bin/python') if lookup('env', 'VIRTUAL_ENV') else ansible_playbook_python }}

    adguard_port_setup: 53000

  tasks:
    - name: Container is running
      community.docker.docker_container_info:
        name: adguardhome
      register: c

    - name: Assert container is running
      ansible.builtin.assert:
        that:
          - c.exists
          - c.container.State.Running

    - name: Setup UI port is reachable
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ adguard_port_setup }}"
        delay: 2
        timeout: 120
