---
dependency:
  name: galaxy
  options:
    role-file: ../../requirements.yml
    requirements-file: ../../requirements.yml

driver:
  name: delegated

platforms:
  - name: localhost

provisioner:
  name: ansible
  inventory:
    hosts:
      all:
        hosts:
          localhost:
            ansible_connection: local

  playbooks:
    converge: converge.yml
    verify: verify.yml
    destroy: destroy.yml

scenario:
  name: default
  test_sequence:
    - destroy
    - converge
    - verify
    - destroy

lint: |
  true
