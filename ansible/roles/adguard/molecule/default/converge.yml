---
- name: Converge
  hosts: localhost
  gather_facts: true
  become: false

  environment:
    DOCKER_HOST: unix:///var/run/docker.sock

  vars:
    ansible_python_interpreter: >-
      {{ (lookup('env', 'VIRTUAL_ENV') ~ '/bin/python') if lookup('env', 'VIRTUAL_ENV') else ansible_playbook_python }}

    adguard_install_dir: "/tmp/molecule-adguardhome"
    adguard_conf_dir: "/tmp/molecule-adguardhome/conf"
    adguard_work_dir: "/tmp/molecule-adguardhome/work"

    # Avoid privileged ports on the GitHub runner.
    adguard_port_dns: 55353
    adguard_port_http: 58080
    adguard_port_setup: 53000

  tasks:
    - name: Ensure Docker is reachable
      ansible.builtin.command: docker info
      changed_when: false

    - name: Include adguard role
      ansible.builtin.include_role:
        name: adguard
