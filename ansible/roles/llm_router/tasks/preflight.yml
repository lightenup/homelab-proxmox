---
# Preflight validation for the LLM Router (spec 064-llm-router).
# Rendering config.yaml.j2 is not attempted until all of these pass — a malformed alias
# mapping should fail the deploy, not produce a subtly wrong routing table
# (contracts/alias-mapping.md § Preflight assertions).

- name: Assert image version is pinned
  ansible.builtin.assert:
    that:
      - llm_router_version is defined
      - llm_router_version != ""
      - llm_router_version != "latest"
    fail_msg: >-
      llm_router_version must be a pinned tag (e.g. "v1.83.3-stable"), not empty or "latest" (FR-001).

- name: Assert the Postgres version is pinned
  ansible.builtin.assert:
    that:
      - llm_router_postgres_version is defined
      - llm_router_postgres_version != ""
      - llm_router_postgres_version != "latest"
    fail_msg: "llm_router_postgres_version must be a pinned, non-latest tag."

# Gateway-own credentials only. Per-deployment provider credentials are NOT listed here —
# they are asserted generically further down, from the api_key_env values the alias mapping
# actually declares. Naming them by hand here is what made this assertion demand
# openrouter_api_key and anthropic_api_key after the metered tiers were removed
# (amendment-drop-metered-tiers.md), which would have failed the deploy on vault variables
# that no deployment consumes.
- name: Assert the gateway's own vault-sourced credentials are defined
  ansible.builtin.assert:
    that:
      - litellm_master_key is defined
      - litellm_master_key | length > 0
      - litellm_db_password is defined
      - litellm_db_password | length > 0
    fail_msg: >-
      Missing vault variables: litellm_master_key and/or litellm_db_password — run
      'ansible-vault edit group_vars/services/vault.yml' to add them (FR-007, Constitution II).

# litellm_db_password is interpolated into DATABASE_URL, so it must survive URL parsing.
# A base64 password is NOT safe here: `openssl rand -base64 30` can emit `/`, which ends the
# authority component early — `postgresql://litellm:ab/cd@127.0.0.1:5432/litellm` parses as
# host `litellm`, port `ab`, and Prisma fails with "P1013: invalid port number in database
# URL", which reads like a config typo rather than a password character. Observed on the
# first 064 apply, 2026-09-19.
#
# Asserted rather than escaped on purpose: Jinja's `urlencode` leaves `/` untouched
# (safe="/"), so the obvious fix silently does nothing. Generate with `openssl rand -hex 24`.
- name: Assert litellm_db_password is URL-safe (it is interpolated into DATABASE_URL)
  ansible.builtin.assert:
    that:
      - litellm_db_password is not search('[/:@?#\[\]%\\\\ ]')
    fail_msg: >-
      litellm_db_password contains a character that breaks DATABASE_URL parsing (one of
      / : @ ? # [ ] % \ or a space). Generate a URL-safe one with 'openssl rand -hex 24'
      and update it in group_vars/services/vault.yml. NOTE: changing it also requires
      wiping {{ llm_router_data_dir }}/postgres, since initdb only applies
      POSTGRES_PASSWORD on the first start.
    quiet: true

- name: Assert Docker daemon is running
  ansible.builtin.systemd:
    name: docker
    state: started
  check_mode: true
  register: docker_status
  failed_when: docker_status.failed

# --- Alias mapping shape (data-model.md § Entity: Alias, § Entity: Deployment) ---

- name: Build the set of defined alias names
  ansible.builtin.set_fact:
    llm_router_alias_names: "{{ llm_router_aliases | map(attribute='name') | list }}"

- name: Assert at least one alias is defined
  ansible.builtin.assert:
    that:
      - llm_router_aliases | length > 0
    fail_msg: "llm_router_aliases must define at least one alias."

- name: Assert every fallback_to / context_window_fallback_to references a defined alias
  ansible.builtin.assert:
    that:
      - item.fallback_to is none or item.fallback_to in llm_router_alias_names
      - item.context_window_fallback_to is none or item.context_window_fallback_to in llm_router_alias_names
    fail_msg: >-
      Alias '{{ item.name }}' has a fallback_to or context_window_fallback_to that does not
      name a defined alias.
  loop: "{{ llm_router_aliases }}"
  loop_control:
    label: "{{ item.name }}"

- name: Assert the fallback graph terminates (no alias with a non-null fallback_to has an empty deployment list downstream forever)
  ansible.builtin.assert:
    that:
      # Every alias with fallback_to == null MUST exist and terminate the chain — a cycle
      # is only possible if EVERY alias has a non-null fallback_to, which this rules out.
      - llm_router_aliases | selectattr('fallback_to', 'none') | list | length > 0
    fail_msg: >-
      The alias fallback graph has no terminus — at least one alias must have
      fallback_to: null (contracts/alias-mapping.md).

- name: Assert exactly one local-tier deployment per alias at most
  ansible.builtin.assert:
    that:
      - (item.deployments | selectattr('tier', 'equalto', 'local') | list | length) <= 1
    fail_msg: "Alias '{{ item.name }}' declares more than one local-tier deployment."
  loop: "{{ llm_router_aliases }}"
  loop_control:
    label: "{{ item.name }}"

# FR-013 amended 2026-09-14: the local tier is addressed over the LAN by mDNS .local name,
# not over the tailnet by MagicDNS name. The invariant is unchanged — a stable name, never a
# DHCP-assigned IP — only the namespace moved. See specs/064-llm-router/amendment-local-tier-omlx.md.
- name: Assert local-tier deployments address the Mac by mDNS name, never an IP (FR-013)
  ansible.builtin.assert:
    that:
      - dep.api_base is defined and dep.api_base | length > 0
      - "'.local' in dep.api_base"
      - dep.api_base is not regex('^https?://\\d+\\.\\d+\\.\\d+\\.\\d+')
    fail_msg: >-
      Deployment '{{ dep.id }}' on alias '{{ alias_item.name }}' is tier:local but its
      api_base is not a *.local mDNS name, or looks like a bare IP literal (FR-013). A
      DHCP-assigned IP silently breaks on the next lease change.
  vars:
    alias_item: "{{ item.0 }}"
    dep: "{{ item.1 }}"
  loop: "{{ llm_router_aliases | subelements('deployments') }}"
  loop_control:
    label: "{{ item.1.id }}"
  when: item.1.tier == 'local'

# Every api_key_env a deployment names becomes `api_key: os.environ/<name>` in config.yaml
# and is passed into the container from the vault variable of the same name, lowercased.
# Asserting the two ends agree is what catches a deployment referencing a credential that
# is never supplied — LiteLLM would otherwise start clean and fail only on the first call
# to that backend, looking like a dead backend rather than a missing secret.
- name: Assert every deployment's api_key_env has a vault variable behind it (FR-007)
  ansible.builtin.assert:
    that:
      - lookup('vars', item | lower, default='') | length > 0
    fail_msg: >-
      A deployment in llm_router_aliases declares api_key_env '{{ item }}', but no vault
      variable named '{{ item | lower }}' is defined. The vault variable name is always the
      lowercased api_key_env — add it to group_vars/services/vault.yml (FR-007).
  loop: >-
    {{ llm_router_aliases | map(attribute='deployments') | flatten
       | selectattr('api_key_env', 'defined') | map(attribute='api_key_env')
       | unique | sort }}

- name: Assert non-local deployments name a credential env var
  ansible.builtin.assert:
    that:
      - dep.api_key_env is defined
      - dep.api_key_env | length > 0
    fail_msg: >-
      Deployment '{{ dep.id }}' on alias '{{ alias_item.name }}' is not tier:local but
      declares no api_key_env.
  vars:
    alias_item: "{{ item.0 }}"
    dep: "{{ item.1 }}"
  loop: "{{ llm_router_aliases | subelements('deployments') }}"
  loop_control:
    label: "{{ item.1.id }}"
  when: item.1.tier != 'local'

# --- Budgets (data-model.md § Entity: Gateway Budget) ---

- name: Assert every client's vault-sourced key is defined
  ansible.builtin.assert:
    that:
      - lookup('vars', item.key_env | lower, default='') | length > 0
    fail_msg: >-
      Client '{{ item.alias }}' declares key_env '{{ item.key_env }}', but no vault variable
      named '{{ item.key_env | lower }}' is defined. The vault variable name is always the
      lowercased key_env — add it to group_vars/services/vault.yml (FR-015).
  loop: "{{ llm_router_clients }}"
  loop_control:
    label: "{{ item.alias }}"

# Spec 097 R-011: a client's own `models` list narrows its key. A name that is not an alias
# would leave the key scoped to nothing the client needs, and fail only at first use.
- name: Assert every client's model scope names declared aliases only
  ansible.builtin.assert:
    that:
      - item.models | length > 0
      - item.models | difference(llm_router_aliases | map(attribute='name') | list) | length == 0
    fail_msg: >-
      Client '{{ item.alias }}' declares models {{ item.models }}, which must be a non-empty
      subset of the llm_router_aliases names.
  loop: "{{ llm_router_clients | selectattr('models', 'defined') | list }}"
  loop_control:
    label: "{{ item.alias }}"

- name: Assert the gateway-wide cap exceeds the sum of per-client budgets with headroom
  ansible.builtin.assert:
    that:
      - llm_router_gateway_budget.max_budget | float > (llm_router_clients | map(attribute='max_budget') | map('float') | sum)
    fail_msg: >-
      llm_router_gateway_budget.max_budget ({{ llm_router_gateway_budget.max_budget }}) must be
      strictly greater than the sum of llm_router_clients[*].max_budget
      ({{ llm_router_clients | map(attribute='max_budget') | map('float') | sum }}) — a cap at or
      below the client sum turns normal usage into a homelab-wide outage
      (data-model.md § Entity: Gateway Budget). This fails rather than warns deliberately.

# --- Gateway-wide RATE cap (FR-010's second level; added 2026-09-20, backlog 071) ---
#
# READ THE ASSERTION ABOVE, THEN THIS ONE. They point in opposite directions, and reusing
# the budget rule here would enforce exactly the wrong inequality:
#
#   budget:  gateway cap  >  sum(clients)   — a low cap is a self-inflicted outage
#   rate:    gateway cap  <  sum(clients)   — a high cap can never bind, so it is decoration
#
# The rate cap is the only gateway-wide guard that can actually fire (the spend cap is
# inert while every tier is local and unpriced), so a decorative one is worse than none:
# it reads as protection in group_vars and refuses nothing.

- name: Collect the declared per-client rate limits
  ansible.builtin.set_fact:
    llm_router_client_rpms: >-
      {{ llm_router_clients | selectattr('rpm_limit', 'defined') | map(attribute='rpm_limit') | map('int') | list }}
    llm_router_clients_without_rpm: >-
      {{ llm_router_clients | rejectattr('rpm_limit', 'defined') | map(attribute='alias') | list }}

- name: Assert a gateway-wide rate cap is declared (FR-010 requires TWO levels)
  ansible.builtin.assert:
    that:
      - llm_router_gateway_budget.rpm_limit is defined
      - llm_router_gateway_budget.rpm_limit | int > 0
    fail_msg: >-
      llm_router_gateway_budget declares no rpm_limit. FR-010 requires rate limits at two
      levels, and the gateway-wide SPEND cap cannot fire while every tier is local and
      unpriced — so without this there is no working gateway-wide backstop at all, and
      clients each inside their own limit can saturate the backend together (backlog 071).

- name: Assert the gateway-wide rate cap is at least the largest single client's
  ansible.builtin.assert:
    that:
      - llm_router_gateway_budget.rpm_limit | int >= (llm_router_client_rpms | max)
    fail_msg: >-
      llm_router_gateway_budget.rpm_limit ({{ llm_router_gateway_budget.rpm_limit }}) is below the
      largest per-client rpm_limit ({{ llm_router_client_rpms | max }}). One well-behaved client
      would then be refused by the GATEWAY cap before reaching its own, which makes FR-010's two
      levels indistinguishable in practice and the refusal misleading to whoever reads it.
  when: llm_router_client_rpms | length > 0

- name: Assert the gateway-wide rate cap is strictly below the sum of client rate limits
  ansible.builtin.assert:
    that:
      - llm_router_gateway_budget.rpm_limit | int < (llm_router_client_rpms | sum)
    fail_msg: >-
      llm_router_gateway_budget.rpm_limit ({{ llm_router_gateway_budget.rpm_limit }}) is at or above
      the sum of per-client rpm_limits ({{ llm_router_client_rpms | sum }}), so it can never bind —
      every client could run flat out without the gateway cap ever refusing anything. NOTE this is
      the OPPOSITE of the budget rule a few lines up, deliberately: a budget cap below the client
      sum is an outage, a rate cap above the client sum is decoration.
  when:
    - llm_router_client_rpms | length > 0
    - llm_router_clients_without_rpm | length == 0

- name: Warn when a client has no rate limit, which makes the gateway-wide band unenforceable
  ansible.builtin.debug:
    msg: >-
      Client(s) {{ llm_router_clients_without_rpm | join(', ') }} declare no rpm_limit, so the
      sum of client rates is unbounded and the "gateway cap < sum" check above is skipped. The
      gateway-wide cap still applies to them, but an unlimited client will always be the one
      that trips it — give every client an explicit rpm_limit if that is not intended.
  when: llm_router_clients_without_rpm | length > 0
