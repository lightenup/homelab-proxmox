---
# Provision the two-level budget structure (FR-010, FR-015) using LiteLLM's native team
# primitive rather than a bespoke object — verified live against the pinned v1.83.3-stable
# image during implementation:
#
#   - One LiteLLM TEAM ("llm-router-gateway-wide") carries the gateway-wide backstop cap.
#     Its remaining budget is what litellm_remaining_team_budget_metric reports, so this is
#     also what makes the metric usable for the LlmRouterBudgetCapExhausted alert
#     (contracts/monitoring.md) — a standalone /budget/new object (tried first) has NO
#     corresponding Prometheus metric, which is why this uses a team instead.
#   - Every client's virtual key is generated ON that team, with its own max_budget — this
#     is LiteLLM's documented "team member budget": an individual limit enforced within the
#     team's shared budget. One client breaching its own limit does not touch the others;
#     the team running out refuses everyone (exactly FR-010's two levels).
#
# Both /team/new and /key/generate are fast and correct (confirmed live); LiteLLM has no
# idempotent upsert for either, so idempotency here is achieved by looking up first.

- name: Look up the gateway-wide team by alias
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_port }}/team/list"
    method: GET
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
    status_code: 200
  register: llm_router_team_list
  changed_when: false

- name: Extract the gateway-wide team id, if it already exists
  ansible.builtin.set_fact:
    llm_router_gateway_team_id: >-
      {{ (llm_router_team_list.json | selectattr('team_alias', 'equalto', 'llm-router-gateway-wide') | list | first | default({})).get('team_id', '') }}

- name: Create the gateway-wide team, if it does not already exist
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_port }}/team/new"
    method: POST
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
    body_format: json
    body:
      team_alias: "llm-router-gateway-wide"
      max_budget: "{{ llm_router_gateway_budget.max_budget }}"
      budget_duration: "{{ llm_router_gateway_budget.budget_duration }}"
      rpm_limit: "{{ llm_router_gateway_budget.rpm_limit | default(omit) }}"
    status_code: 200
  register: llm_router_team_created
  when: llm_router_gateway_team_id == ""

- name: Resolve the team id for this run
  ansible.builtin.set_fact:
    llm_router_gateway_team_id: >-
      {{ llm_router_gateway_team_id if llm_router_gateway_team_id != '' else llm_router_team_created.json.team_id }}

# The team is created ONCE and then never touched again by the task above, because its
# `when` guard is "does the alias exist". That made every gateway-wide setting write-once:
# changing max_budget or rpm_limit in group_vars was a silent no-op on any gateway that had
# already been deployed, which is exactly how the rate cap came to be missing for a month
# (backlog 071 — the team carried rpm=None while group_vars looked correct).
#
# So reconcile explicitly, unconditionally, on every run. /team/update is an upsert on the
# fields provided and leaves the rest alone, so this is safe to run against a fresh team
# too — it just rewrites what /team/new already set.
#
# changed_when: false because this converges rather than mutates: LiteLLM has no way to
# report "already equal", and flagging every run as changed would make the play permanently
# noisy and hide the changes that are real.
- name: Reconcile the gateway-wide team's caps with group_vars (FR-010)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_port }}/team/update"
    method: POST
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
    body_format: json
    body:
      team_id: "{{ llm_router_gateway_team_id }}"
      max_budget: "{{ llm_router_gateway_budget.max_budget }}"
      budget_duration: "{{ llm_router_gateway_budget.budget_duration }}"
      rpm_limit: "{{ llm_router_gateway_budget.rpm_limit | default(omit) }}"
    status_code: 200
  changed_when: false

# Verify the reconcile actually took, rather than trusting a 200. This is the assertion the
# original code lacked: /team/update returning 200 while the field stayed null is precisely
# the failure mode backlog 071 describes, and it is invisible without reading the team back.
- name: Read the gateway-wide team back
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_port }}/team/list"
    method: GET
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
    status_code: 200
  register: llm_router_team_verify
  changed_when: false

- name: Assert the gateway-wide caps are live on the team, not merely declared
  ansible.builtin.assert:
    that:
      - live_team.max_budget | float == llm_router_gateway_budget.max_budget | float
      - llm_router_gateway_budget.rpm_limit is not defined
        or live_team.rpm_limit | default(None) | string == llm_router_gateway_budget.rpm_limit | string
    fail_msg: >-
      The gateway-wide team exists but its caps do not match group_vars — declared
      max_budget={{ llm_router_gateway_budget.max_budget }}
      rpm_limit={{ llm_router_gateway_budget.rpm_limit | default('(unset)') }}, live
      max_budget={{ live_team.max_budget | default('(none)') }}
      rpm_limit={{ live_team.rpm_limit | default('(none)') }}. A gateway-wide cap that is
      declared but not live is FR-010's backstop silently absent (backlog 071).
    quiet: true
  vars:
    live_team: >-
      {{ (llm_router_team_verify.json | selectattr('team_alias', 'equalto', 'llm-router-gateway-wide')
          | list | first | default({})) }}

# LiteLLM's /key/info looks a key up by `key` ONLY. `?key_alias=hermes` returns
# 404 "Key not found in database" for an alias that plainly exists — verified against the
# pinned v1.83.3-stable on 2026-09-19. The previous implementation here sent key_alias as a
# JSON body on a GET, which /key/info ignores outright, so every run concluded "not
# provisioned" and the SECOND apply died with:
#
#   400 Key with alias 'hermes' already exists. Unique key aliases across all keys are
#       required.
#
# So the role was applicable exactly once, against SC-004's idempotency requirement.
# /key/list is the endpoint that can actually answer the question, and it answers it for
# every client in one call rather than one call per client.
# FR-002 says a client addresses intent aliases and never a provider model ID. Nothing
# enforced that: a client key with no `models` scope could call `openai/fast` directly and
# get a real completion, bypassing the alias — and with it the context_window and fallback
# behaviour the alias declares. Found by fault injection 2026-09-19; the bare form (`fast`)
# was already refused, the qualified one was not.
#
# The enforcement is LiteLLM's own key scope, which is the same mechanism the Mac uses on
# the key it mints for this gateway. Scoped to the alias names, so adding an alias widens
# the scope automatically and no list is maintained twice.
- name: Define the model scope every client key is limited to
  ansible.builtin.set_fact:
    llm_router_client_allowed_models: "{{ llm_router_aliases | map(attribute='name') | list }}"

- name: List existing virtual keys
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_port }}/key/list?return_full_object=true&size={{ llm_router_key_list_page_size }}"
    method: GET
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
    status_code: 200
  register: llm_router_key_list
  changed_when: false
  no_log: true

# json['keys'], not json.keys — the latter resolves to the dict's own keys() method in
# Jinja and silently yields a bound method instead of the key list. Keys minted outside
# this role can carry a null alias, hence the select('string').
- name: Collect the aliases already provisioned
  ansible.builtin.set_fact:
    llm_router_existing_key_aliases: >-
      {{ llm_router_key_list.json['keys'] | default([]) | selectattr('key_alias', 'defined')
         | map(attribute='key_alias') | select('string') | list }}

- name: Generate a virtual key on the gateway-wide team for each client not already provisioned
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_port }}/key/generate"
    method: POST
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
    body_format: json
    body:
      key: "{{ lookup('vars', item.key_env | lower) }}"
      key_alias: "{{ item.alias }}"
      team_id: "{{ llm_router_gateway_team_id }}"
      models: "{{ llm_router_client_allowed_models }}"
      max_budget: "{{ item.max_budget }}"
      budget_duration: "{{ item.budget_duration }}"
      rpm_limit: "{{ item.rpm_limit | default(omit) }}"
    status_code: 200
  loop: "{{ llm_router_clients }}"
  loop_control:
    label: "{{ item.alias }}"
  when: item.alias not in llm_router_existing_key_aliases
  register: llm_router_key_created
  no_log: true

# Applied to EVERY client, not just the newly created ones: the keys provisioned before
# the scope existed are already in the database and the create loop correctly skips them,
# so without this they would stay unscoped forever. /key/update is idempotent, so this is
# a no-op once the scope matches.
- name: Ensure every client key is scoped to the declared aliases (FR-002)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_port }}/key/update"
    method: POST
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
    body_format: json
    body:
      key: "{{ lookup('vars', item.key_env | lower) }}"
      models: "{{ llm_router_client_allowed_models }}"
    status_code: 200
  loop: "{{ llm_router_clients }}"
  loop_control:
    label: "{{ item.alias }}"
  changed_when: false
  no_log: true
