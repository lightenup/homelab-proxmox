---
- name: Include preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Ensure install directory exists
  ansible.builtin.file:
    path: "{{ llm_router_install_dir }}"
    state: directory
    mode: '0755'

- name: Ensure data directories exist
  ansible.builtin.file:
    path: "{{ llm_router_data_dir }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - postgres

# The gateway addresses the Mac over TLS (FR-013 amended): plaintext inbound to the Mac is
# closed after ~300s of application silence by a control that is not ours to change, while
# the same request over TLS held 1800s of complete silence. Verification is against this
# certificate rather than disabled, so the leg is authenticated as well as encrypted — it
# carries mac_litellm_key, which used to cross the LAN in the clear.
- name: Deploy the Mac's CA certificate for TLS verification
  ansible.builtin.copy:
    src: "{{ llm_router_mac_ca_src }}"
    dest: "{{ llm_router_mac_ca_host_path }}"
    mode: '0644'
  notify: Restart llm-router

- name: Deploy config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ llm_router_install_dir }}/config.yaml"
    mode: '0640'
  notify: Restart llm-router

# The local tier is addressed by mDNS name (FR-013), and the litellm CONTAINER cannot
# resolve a .local name by any container-side configuration:
#
#   host  : getent hosts xmjdvvw39y2t.local -> 192.168.1.177     (avahi, via mdns_base)
#   inside: hosts: files dns / nameserver 1.1.1.1 -> gaierror    (no libnss-mdns, and no
#                                                                 public resolver knows .local)
#
# network_mode: host does NOT fix this — it shares the network namespace, not the
# filesystem, so the container keeps its own nsswitch.conf and NSS libraries. Measured on
# the LXC 2026-09-19: by IP the container reaches the Mac fine (HTTP 200); by name it
# fails, which surfaced as HTTP 500 "Connection error" on every alias.
#
# Nor can a resolver fix it: this Mac never ANSWERS an mDNS query, it only announces
# (see mac-mdns-announcer/README.md). Only avahi's cache on this host knows the mapping,
# so the mapping has to come from here.
#
# So resolve the name HERE, where mDNS works, and hand the container the result as
# extra_hosts. The api_base stays a name — no IP literal enters the repo — and the address
# is rediscovered on every deploy rather than pinned in git. The residual risk is an IP
# change between deploys; the gateway then fails clean against a stale address and the
# doctor's local-tier check catches it. A DHCP reservation for the Mac removes it entirely.
- name: Collect the local-tier backend hostnames from the alias mapping
  ansible.builtin.set_fact:
    llm_router_local_backend_hostnames: >-
      {{ llm_router_aliases | map(attribute='deployments') | flatten
         | selectattr('tier', 'equalto', 'local') | selectattr('api_base', 'defined')
         | map(attribute='api_base') | map('urlsplit', 'hostname') | unique | list }}

- name: Resolve each local-tier backend hostname on this host
  ansible.builtin.command:
    cmd: "getent hosts {{ item }}"
  register: llm_router_backend_resolution
  changed_when: false
  failed_when: false
  loop: "{{ llm_router_local_backend_hostnames }}"

- name: Assert every local-tier backend hostname resolved
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout | length > 0
    fail_msg: >-
      '{{ item.item }}' does not resolve on this host, so the container cannot be given a
      mapping for it and every alias would fail with a connection error. Check avahi here
      (`systemctl status avahi-daemon`, installed by mdns_base) and the Mac's announcer
      (`launchctl list | grep hermes` on the Mac) — the Mac only announces, it never
      answers queries, so a cold cache with a dead announcer resolves nothing. See
      specs/064-llm-router/mac-mdns-announcer/README.md.
    quiet: true
  loop: "{{ llm_router_backend_resolution.results }}"
  loop_control:
    label: "{{ item.item }}"

# getent prints "<ip>  <name> [aliases...]", so the first field is the address.
- name: Build the container host mappings for the local tier
  ansible.builtin.set_fact:
    llm_router_extra_hosts: >-
      {{ llm_router_backend_resolution.results | map(attribute='item')
         | zip(llm_router_backend_resolution.results | map(attribute='stdout')
               | map('split') | map('first'))
         | map('join', ':') | list }}

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ llm_router_install_dir }}/docker-compose.yml"
    mode: '0640'
  notify: Restart llm-router

- name: Ensure llm-router stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ llm_router_install_dir }}"
    state: present
    remove_orphans: true
    pull: always

- name: Wait for the gateway to be reachable
  ansible.builtin.wait_for:
    port: "{{ llm_router_port }}"
    host: "127.0.0.1"
    delay: 5
    timeout: 120

- name: Verify gateway readiness (covers gateway liveness AND database reachability — research D-103)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llm_router_port }}/health/readiness"
    method: GET
    status_code: 200
  register: llm_router_health
  retries: 12
  delay: 5
  until: llm_router_health.status == 200
  changed_when: false

- name: Include virtual key provisioning (FR-015, FR-010)
  ansible.builtin.include_tasks: virtual_keys.yml

- name: Resolve the canary client's vault-sourced key
  ansible.builtin.set_fact:
    llm_router_canary_key: "{{ lookup('vars', (llm_router_clients | selectattr('alias', 'equalto', 'canary') | first).key_env | lower) }}"

- name: Deploy the canary script
  ansible.builtin.template:
    src: canary.sh.j2
    dest: "{{ llm_router_install_dir }}/canary.sh"
    mode: '0700'  # contains the canary's vault-sourced key — root-readable only
  no_log: true

- name: Deploy the canary systemd service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: '0644'
  loop:
    - llm-router-canary.service
    - llm-router-canary.timer
  notify: Reload systemd for llm-router canary

- name: Enable and start the canary timer (FR-018)
  ansible.builtin.systemd:
    name: llm-router-canary.timer
    enabled: true
    state: started
    daemon_reload: true
