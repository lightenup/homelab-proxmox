---
# Defaults for nextcloud role
nextcloud_version: "32"
nextcloud_port: 8080
nextcloud_install_dir: "/opt/nextcloud"
nextcloud_data_dir: "/opt/nextcloud"
nextcloud_nfs_mount: "/mnt/nextcloud"
nextcloud_domain: "nextcloud.hus-sky.no"
nextcloud_trusted_domains_extra:
  - "nextcloud.local"
nextcloud_overwrite_protocol: "https"
nextcloud_require_nas_mount: true
nextcloud_admin_user: "admin"

# Container names
nextcloud_app_container_name: "nextcloud_app"
nextcloud_db_container_name: "nextcloud_db"

# Database defaults (passwords must be overridden in group_vars or vault)
nextcloud_db_name: "nextcloud"
nextcloud_db_user: "nextcloud"

# Backup configuration
nextcloud_backup_path: "/mnt/nextcloud/backups"
nextcloud_backup_retention_days: 7
nextcloud_backup_retention_weeks: 4
nextcloud_backup_retention_months: 6
nextcloud_backup_schedule: "*-*-* 04:00:00"

# PHP resource limits
nextcloud_php_memory_limit: "1024M"
nextcloud_php_upload_limit: "16G"

# Apps to install and enable
nextcloud_apps_enable:
  - richdocuments
  - richdocumentscode
  - deck
  - twofactor_totp
  - bruteforcesettings
  - calendar
  - weather_status

# Apps to disable
nextcloud_apps_disable:
  - photos
  - firstrunwizard
  - recommendations
  - contacts
