---
# Defaults for nextcloud role
nextcloud_exporter_port: 9205
nextcloud_port: 8080
nextcloud_install_dir: "/opt/nextcloud"
nextcloud_data_dir: "/opt/nextcloud"
nextcloud_nfs_mount: "/mnt/nextcloud"
nextcloud_domain: "nextcloud.hus-sky.no"
nextcloud_trusted_domains_extra:
  - "nextcloud.local"
  - "nextcloud_app"
nextcloud_overwrite_protocol: "https"
nextcloud_require_nas_mount: true
nextcloud_admin_user: "admin"

# Container names
nextcloud_app_container_name: "nextcloud_app"
nextcloud_db_container_name: "nextcloud_db"

# Database defaults (passwords must be overridden in group_vars or vault)
nextcloud_db_name: "nextcloud"
nextcloud_db_user: "nextcloud"

# PHP resource limits
nextcloud_php_memory_limit: "1024M"
nextcloud_php_upload_limit: "16G"

# Euro-Office connector configuration
# URLs reference central vars (eurooffice_ip defined in group_vars/services/vars.yml).
# jwt_secret must match eurooffice_jwt_secret in vault — shared between server and connector.
nextcloud_eurooffice_public_url: "https://eurooffice.hus-sky.no/"
nextcloud_eurooffice_internal_url: "http://{{ eurooffice_ip }}/"

# Apps to install and enable
nextcloud_apps_enable:
  - deck
  - twofactor_totp
  - bruteforcesettings
  - calendar
  - weather_status
  - eurooffice

# Apps to fully uninstall (disable then remove); order matters — connector before server
nextcloud_apps_remove:
  - richdocumentscode
  - richdocuments

# Apps to disable
nextcloud_apps_disable:
  - photos
  - firstrunwizard
  - recommendations
  - contacts
