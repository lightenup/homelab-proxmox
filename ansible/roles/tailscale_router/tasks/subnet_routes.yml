---
# T013: Configure subnet route advertisement
# Purpose: Advertise LAN subnet through Tailscale for remote access

- name: Get Tailscale status JSON
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_json
  changed_when: false
  failed_when: false

- name: Parse current advertised routes
  ansible.builtin.set_fact:
    current_routes: "{{ (tailscale_status_json.stdout | from_json).Self.AllowedIPs | default([]) }}"
  when: tailscale_status_json.rc == 0

- name: Advertise subnet route if not already configured
  ansible.builtin.command: "tailscale up --advertise-routes={{ tailscale_subnet_route }} --accept-routes"
  when:
    - tailscale_status_json.rc == 0
    - tailscale_subnet_route not in current_routes
  changed_when: tailscale_subnet_route not in current_routes
