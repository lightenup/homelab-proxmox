---
- name: Verify IPv4 forwarding
  ansible.builtin.command: sysctl -n net.ipv4.ip_forward
  register: ipv4_forward
  changed_when: false
  failed_when: ipv4_forward.stdout != '1'

- name: Verify IPv6 forwarding
  ansible.builtin.command: sysctl -n net.ipv6.conf.all.forwarding
  register: ipv6_forward
  changed_when: false
  failed_when: ipv6_forward.stdout != '1'

- name: Get Tailscale preferences
  ansible.builtin.command: tailscale debug prefs
  register: ts_prefs
  changed_when: false

- name: Assert subnet route is advertised
  ansible.builtin.assert:
    that:
      - tailscale_subnet_routes in (ts_prefs.stdout | from_json).AdvertiseRoutes
    fail_msg: "Subnet route {{ tailscale_subnet_routes }} is not in AdvertiseRoutes."
