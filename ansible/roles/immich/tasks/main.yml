---
- name: Ensure Immich data directories exist
  ansible.builtin.file:
    path: "{{ immich_data_dir }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - library
    - uploads
    - profile
    - thumbs
    - video
    - postgres
    - redis

- name: Ensure Immich install directory exists
  ansible.builtin.file:
    path: "{{ immich_install_dir }}"
    state: directory
    mode: '0755'

- name: Deploy Immich docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ immich_install_dir }}/docker-compose.yml"
    mode: '0644'
  notify: Restart immich

- name: Deploy Immich .env
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ immich_install_dir }}/.env"
    mode: '0600'
  notify: Restart immich

- name: Ensure Immich stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ immich_install_dir }}"
    state: present
    remove_orphans: true

- name: Wait for Immich to be reachable
  ansible.builtin.wait_for:
    port: "{{ immich_port }}"
    host: "127.0.0.1"
    delay: 10
    timeout: 300
