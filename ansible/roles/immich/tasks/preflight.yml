---
# Preflight checks for Immich deployment

- name: Check if NAS mount exists
  ansible.builtin.stat:
    path: /mnt/immich
  register: nas_mount

- name: Fail if NAS mount is required and missing
  ansible.builtin.fail:
    msg: "Immich NAS mount missing at /mnt/immich. Ensure the host bind mount is configured before deploy."
  when:
    - immich_require_nas_mount | bool
    - not nas_mount.stat.exists

- name: Create local Immich mount path when NAS is optional
  ansible.builtin.file:
    path: /mnt/immich
    state: directory
    mode: '0755'
  when:
    - not immich_require_nas_mount | bool
    - not nas_mount.stat.exists

- name: Verify Immich storage path is writable
  ansible.builtin.file:
    path: /mnt/immich/.ansible_test
    state: touch
    mode: '0644'
  register: write_test
  changed_when: false

- name: Remove test file
  ansible.builtin.file:
    path: /mnt/immich/.ansible_test
    state: absent
  changed_when: false

- name: Check Docker daemon is running
  ansible.builtin.systemd:
    name: docker
    state: started
  check_mode: true
  register: docker_status
  failed_when: docker_status.failed

- name: Check available disk space
  ansible.builtin.shell: df -BG / | tail -1 | awk '{print $4}' | sed 's/G//'
  register: disk_space
  changed_when: false
  failed_when: disk_space.stdout | int < 10

- name: Validate required variables are set
  ansible.builtin.assert:
    that:
      - immich_version is defined
      - immich_version != ""
      - immich_upload_location is defined
      - immich_data_dir is defined
      - immich_db_password is defined
    fail_msg: "Required Immich variables are not properly defined"
