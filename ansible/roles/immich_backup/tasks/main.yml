---
- name: Assert Immich backup location is on the NAS mount
  ansible.builtin.assert:
    that: (immich_backup_path | dirname) in (ansible_mounts | map(attribute='mount') | list)
    fail_msg: >-
      The NAS bind mount for {{ immich_backup_path | dirname }} is missing;
      the backup would write to the container's local disk.
    quiet: true
  when: immich_require_nas_mount | default(true) | bool

- name: Ensure backup directory exists
  ansible.builtin.file:
    path: "{{ immich_backup_path }}"
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Deploy backup script
  ansible.builtin.template:
    src: backup_immich.sh.j2
    dest: /usr/local/bin/backup_immich.sh
    mode: '0755'
    owner: root
    group: root

- name: Create systemd service for Immich backup
  ansible.builtin.copy:
    dest: /etc/systemd/system/immich-backup.service
    content: |
      [Unit]
      Description=Immich Backup Service
      After=docker.service network.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/backup_immich.sh
      User=root
    mode: '0644'
  notify: Reload systemd

- name: Create systemd timer for Immich backup
  ansible.builtin.copy:
    dest: /etc/systemd/system/immich-backup.timer
    content: |
      [Unit]
      Description=Run Immich backup daily

      [Timer]
      OnCalendar={{ immich_backup_schedule }}
      Persistent=true

      [Install]
      WantedBy=timers.target
    mode: '0644'
  notify: Reload systemd

- name: Enable and start Immich backup timer
  ansible.builtin.systemd:
    name: immich-backup.timer
    state: started
    enabled: true
