# Image: Euro-Office DocumentServer (AGPL fork of ONLYOFFICE). Public GHCR image, no auth needed.
# Tags are v-prefixed (e.g. v9.3.2). eurooffice_version is defined in group_vars/services/vars.yml
# — pin to a specific tag, not "latest".
eurooffice_install_dir: "/opt/eurooffice"
eurooffice_data_dir: "/opt/eurooffice-data"
eurooffice_image: "ghcr.io/euro-office/documentserver"
