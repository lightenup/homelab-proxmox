---
# Configure security-only apt repositories
# This role restricts systems to only security updates, disabling feature/bugfix updates
# Used for stable operations with minimal risk

- name: Gather facts if not already present
  ansible.builtin.setup:
  when: ansible_facts.distribution is not defined

- name: Detect if system uses DEB822 format (.sources files)
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/debian.sources
  register: deb822_sources

- name: Configure security-only repos (DEB822 format - Proxmox/Trixie)
  when: deb822_sources.stat.exists
  block:
    - name: Backup existing debian.sources
      ansible.builtin.copy:
        src: /etc/apt/sources.list.d/debian.sources
        dest: /etc/apt/sources.list.d/debian.sources.backup-{{ ansible_facts.date_time.iso8601_basic_short }}
        remote_src: yes
        mode: '0644'
      when: backup_sources | bool

    - name: Configure security-only debian.sources (DEB822 format)
      ansible.builtin.template:
        src: debian.sources.j2
        dest: /etc/apt/sources.list.d/debian.sources
        owner: root
        group: root
        mode: '0644'
        backup: yes
      notify: update apt cache

- name: Configure security-only repos (traditional format - LXCs/Bookworm)
  when: not deb822_sources.stat.exists
  block:
    - name: Backup existing sources.list
      ansible.builtin.copy:
        src: /etc/apt/sources.list
        dest: /etc/apt/sources.list.backup-{{ ansible_facts.date_time.iso8601_basic_short }}
        remote_src: yes
        mode: '0644'
      when: backup_sources | bool

    - name: Configure security-only sources.list (traditional format)
      ansible.builtin.template:
        src: sources.list.j2
        dest: /etc/apt/sources.list
        owner: root
        group: root
        mode: '0644'
        backup: yes
      notify: update apt cache

- name: Verify security repository is reachable
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 0
  register: apt_update_result
  failed_when: false
  changed_when: false

- name: Display repository configuration result
  ansible.builtin.debug:
    msg: >
      Security-only repositories configured for {{ ansible_facts.distribution }} {{ ansible_facts.distribution_release }}.
      System will now receive ONLY security updates. For feature/bugfix updates, use the manual upgrade playbook.
