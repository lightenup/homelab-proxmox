# ntfy — self-hosted push notifications (spec 082)
# Image: binwiederhier/ntfy. ntfy_version is defined in group_vars/services/vars.yml
# — pin to a specific tag, not "latest" (research R-001).
ntfy_install_dir: "/opt/ntfy"
ntfy_data_dir: "/opt/ntfy-data"
ntfy_image: "binwiederhier/ntfy"

# Publisher accounts (data-model.md § Account). One topic per publisher; no account
# has role admin. The owner account is kept separate because it reads * and has no
# topic of its own.
#
# spec 095 T004: grants move to an `access:` list of "<topic>:<perm>" strings so a
# publisher can hold read on inbound topics (hermes-in) alongside its write-only grant.
# Behaviour-preserving refactor: the rendered matrix is unchanged (guard test
# python/tests/guardrails/test_ntfy_acl.py, T003).
ntfy_owner_access:
  - "*:read-only"
  # 095 T007 (FR-011): read-write on the LAB scratch inbound topic (data-model § LAB pair).
  - "hermes-lab-in:read-write"
ntfy_users:
  - name: "alertmanager"
    access:
      - "alerts:write-only"
    password_hash: "{{ ntfy_alertmanager_password_hash }}"
    token: "{{ ntfy_alertmanager_token }}"
  - name: "hermes"
    access:
      - "hermes:write-only"
    password_hash: "{{ ntfy_hermes_password_hash }}"
    token: "{{ ntfy_hermes_token }}"
  - name: "pve_backup"
    access:
      - "pve-backup:write-only"
    password_hash: "{{ ntfy_pve_backup_password_hash }}"
    token: "{{ ntfy_pve_backup_token }}"
  - name: "version_check"
    access:
      - "versions:write-only"
    password_hash: "{{ ntfy_version_check_password_hash }}"
    token: "{{ ntfy_version_check_token }}"
  - name: "mutation"
    access:
      - "mutation:write-only"
    password_hash: "{{ ntfy_mutation_password_hash }}"
    token: "{{ ntfy_mutation_token }}"
  # 095 T007 (FR-011): LAB scratch pair. Rendered on every ntfy server (the ACL is
  # global), but the credential is only ever placed on the LAB rig (lab_inventory);
  # no production topic grant exists for this user (guard test test_ntfy_acl.py).
  - name: "hermes_lab"
    access:
      - "hermes-lab-in:read-only"
      - "hermes-lab:write-only"
    password_hash: "{{ ntfy_hermes_lab_password_hash }}"
    token: "{{ ntfy_hermes_lab_token }}"
