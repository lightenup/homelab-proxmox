---
- name: Assert image version is pinned
  ansible.builtin.assert:
    that:
      - ntfy_version is defined
      - ntfy_version != ""
      - ntfy_version != "latest"
    fail_msg: >-
      ntfy_version must be a pinned tag (e.g. "v2.28.0"), not empty or "latest".

- name: Assert the six vault secrets are defined and non-empty
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', item, default='') | length > 0
    fail_msg: >-
      One or more ntfy secrets are missing or empty ({{ item }}).
      Run 'ansible-vault edit group_vars/services/vault.yml' and add:
      ntfy_owner_password_hash, ntfy_owner_token,
      ntfy_alertmanager_password_hash, ntfy_alertmanager_token,
      ntfy_hermes_password_hash, ntfy_hermes_token.
  loop:
    - ntfy_owner_password_hash
    - ntfy_owner_token
    - ntfy_alertmanager_password_hash
    - ntfy_alertmanager_token
    - ntfy_hermes_password_hash
    - ntfy_hermes_token
  no_log: true

- name: Assert tokens match the ntfy token format (tk_ + 29 chars)
  ansible.builtin.assert:
    that:
      - item is match('^tk_[A-Za-z0-9]{29}$')
    fail_msg: >-
      An ntfy token does not match ^tk_[A-Za-z0-9]{29}$ (32 chars total).
      Regenerate with: docker run --rm binwiederhier/ntfy:v2.28.0 token generate
  loop:
    - "{{ ntfy_owner_token }}"
    - "{{ ntfy_alertmanager_token }}"
    - "{{ ntfy_hermes_token }}"
  no_log: true

- name: Assert password hashes are bcrypt with cost >= 10
  ansible.builtin.assert:
    that:
      - item is match('^\$2[aby]\$(1[0-9]|[2-3][0-9])\$')
    fail_msg: >-
      An ntfy password hash is not a valid bcrypt hash with cost >= 10.
      Regenerate with: docker run --rm -it binwiederhier/ntfy:v2.28.0 user hash
  loop:
    - "{{ ntfy_owner_password_hash }}"
    - "{{ ntfy_alertmanager_password_hash }}"
    - "{{ ntfy_hermes_password_hash }}"
  no_log: true

- name: Assert topic names in ntfy_users are unique
  ansible.builtin.assert:
    that:
      - ntfy_users | map(attribute='topic') | list | length == ntfy_users | map(attribute='topic') | list | unique | length
    fail_msg: >-
      Topic names in ntfy_users are not unique. A topic has exactly one publisher
      (data-model.md § Topic).

- name: Check Docker daemon is running
  ansible.builtin.systemd:
    name: docker
    state: started
  check_mode: true
  register: docker_status
  failed_when: docker_status.failed
