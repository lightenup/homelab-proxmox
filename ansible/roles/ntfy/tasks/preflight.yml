---
- name: Assert image version is pinned
  ansible.builtin.assert:
    that:
      - ntfy_version is defined
      - ntfy_version != ""
      - ntfy_version != "latest"
    fail_msg: >-
      ntfy_version must be a pinned tag (e.g. "v2.28.0"), not empty or "latest".

- name: Assert the ten vault secrets are defined and non-empty
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', item, default='') | length > 0
    fail_msg: >-
      One or more ntfy secrets are missing or empty ({{ item }}).
      Run 'ansible-vault edit group_vars/services/vault.yml' and add:
      ntfy_owner_password_hash, ntfy_owner_token,
      ntfy_alertmanager_password_hash, ntfy_alertmanager_token,
      ntfy_hermes_password_hash, ntfy_hermes_token,
      ntfy_pve_backup_password_hash, ntfy_pve_backup_token,
      ntfy_version_check_password_hash, ntfy_version_check_token,
      ntfy_mutation_password_hash, ntfy_mutation_token,
      ntfy_hermes_lab_password_hash, ntfy_hermes_lab_token.
  loop:
    - ntfy_owner_password_hash
    - ntfy_owner_token
    - ntfy_alertmanager_password_hash
    - ntfy_alertmanager_token
    - ntfy_hermes_password_hash
    - ntfy_hermes_token
    - ntfy_pve_backup_password_hash
    - ntfy_pve_backup_token
    - ntfy_version_check_password_hash
    - ntfy_version_check_token
    - ntfy_mutation_password_hash
    - ntfy_mutation_token
    - ntfy_hermes_lab_password_hash
    - ntfy_hermes_lab_token
  no_log: true

- name: Assert tokens match the ntfy token format (tk_ + 29 chars)
  ansible.builtin.assert:
    that:
      - item is match('^tk_[A-Za-z0-9]{29}$')
    fail_msg: >-
      An ntfy token does not match ^tk_[A-Za-z0-9]{29}$ (32 chars total).
      Regenerate with: docker run --rm binwiederhier/ntfy:v2.28.0 token generate
  loop:
    - "{{ ntfy_owner_token }}"
    - "{{ ntfy_alertmanager_token }}"
    - "{{ ntfy_hermes_token }}"
    - "{{ ntfy_pve_backup_token }}"
    - "{{ ntfy_version_check_token }}"
    - "{{ ntfy_mutation_token }}"
    - "{{ ntfy_hermes_lab_token }}"
  no_log: true

- name: Assert password hashes are bcrypt with cost >= 10
  ansible.builtin.assert:
    that:
      - item is match('^\$2[aby]\$(1[0-9]|[2-3][0-9])\$')
    fail_msg: >-
      An ntfy password hash is not a valid bcrypt hash with cost >= 10.
      Regenerate with: docker run --rm -it binwiederhier/ntfy:v2.28.0 user hash
  loop:
    - "{{ ntfy_owner_password_hash }}"
    - "{{ ntfy_alertmanager_password_hash }}"
    - "{{ ntfy_hermes_password_hash }}"
    - "{{ ntfy_pve_backup_password_hash }}"
    - "{{ ntfy_version_check_password_hash }}"
    - "{{ ntfy_mutation_password_hash }}"
    - "{{ ntfy_hermes_lab_password_hash }}"
  no_log: true

- name: Assert every writable topic has exactly one non-owner writer
  # spec 095 T006 (082 rule, data-model.md § Validation): a topic with a write grant
  # has exactly one non-owner writer. Computed from the ACL data, so it also covers
  # grants added via ntfy_owner_access or a user's multi-topic access list.
  ansible.builtin.assert:
    that:
      - writable | length == writable | unique | length
    fail_msg: >-
      A topic has more than one non-owner writer: {{ writable }}
      (data-model.md § Validation).
  vars:
    writable: >-
      {{ ntfy_users
         | map(attribute='access')
         | flatten
         | select('search', ':(write-only|read-write)$')
         | map('regex_replace', '^([^:]+):.*$', '\1')
         | list }}
  no_log: true

- name: Assert no non-owner user can write inbound or action topics
  # spec 095 FR-002 (data-model.md § Validation): hermes-in, actions and hermes-lab-in
  # are owner-writable only; a publisher grant there is a misconfiguration.
  ansible.builtin.assert:
    that:
      - offending | length == 0
    fail_msg: >-
      Non-owner write grant found on an inbound/action topic: {{ offending }}
      (FR-002: only the owner may write hermes-in, actions or hermes-lab-in).
  vars:
    offending: >-
      {{ ntfy_users
         | map(attribute='access')
         | flatten
         | select('search', ':(write-only|read-write)$')
         | map('regex_replace', '^([^:]+):.*$', '\1')
         | select('in', ['hermes-in', 'actions', 'hermes-lab-in'])
         | list }}
  no_log: true

- name: Check Docker daemon is running
  ansible.builtin.systemd:
    name: docker
    state: started
  check_mode: true
  register: docker_status
  failed_when: docker_status.failed
