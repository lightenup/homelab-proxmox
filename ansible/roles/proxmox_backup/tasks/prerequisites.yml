---
# ansible/roles/proxmox_backup/tasks/prerequisites.yml
# Install required packages for backup system
# Feature: 013-proxmox-config-backup

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags:
    - backup
    - prerequisites

- name: Install age encryption tool
  ansible.builtin.apt:
    name: age
    state: present
  tags:
    - backup
    - prerequisites

- name: Install zstd compression tool
  ansible.builtin.apt:
    name: zstd
    state: present
  tags:
    - backup
    - prerequisites

- name: Ensure NFS client utilities installed
  ansible.builtin.apt:
    name: nfs-common
    state: present
  tags:
    - backup
    - prerequisites

- name: Create age key directory
  ansible.builtin.file:
    path: "{{ proxmox_backup_age_key_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  tags:
    - backup
    - prerequisites

- name: Create staging base directory
  ansible.builtin.file:
    path: "{{ proxmox_backup_staging_base }}"
    state: directory
    owner: root
    group: root
    mode: '0750'
  tags:
    - backup
    - prerequisites

- name: Create NAS mount point
  ansible.builtin.file:
    path: "{{ proxmox_backup_nas_mount_point }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - backup
    - prerequisites

- name: Verify prerequisites installed
  ansible.builtin.command: "{{ item }} --version"
  register: prereq_check
  changed_when: false
  failed_when: prereq_check.rc != 0
  loop:
    - age
    - zstd
  tags:
    - backup
    - prerequisites
    - validate
