---
# ansible/roles/proxmox_backup/tasks/main.yml
# Main orchestration for Proxmox configuration backup automation
# Feature: 013-proxmox-config-backup
# Architecture: Choice 3, Option A - Deploys bash script, does NOT execute at runtime

- name: Discover current state
  ansible.builtin.include_tasks: discovery.yml
  tags:
    - backup
    - always

- name: Install backup prerequisites
  ansible.builtin.import_tasks: prerequisites.yml
  tags:
    - backup
    - prerequisites

- name: Sync IaC repository to PVE (for User Story 2)
  ansible.builtin.import_tasks: sync_repo.yml
  tags:
    - backup
    - repo

# State Machine: Email Configuration
- name: Enable Email Notifications (Legacy Mode)
  ansible.builtin.include_tasks: enable_email.yml
  when: proxmox_backup_email_mode == 'enabled'
  tags:
    - backup
    - smtp
    - email

- name: Disable Email Notifications
  ansible.builtin.include_tasks: disable_email.yml
  when: proxmox_backup_email_mode == 'disabled'
  tags:
    - backup
    - smtp
    - email

- name: Remove Email Packages
  ansible.builtin.include_tasks: remove_packages.yml
  when: proxmox_backup_email_mode == 'removed'
  tags:
    - backup
    - cleanup

- name: Deploy backup script
  ansible.builtin.import_tasks: deploy_script.yml
  tags:
    - backup
    - script

- name: Deploy systemd units
  ansible.builtin.import_tasks: systemd.yml
  tags:
    - backup
    - systemd
