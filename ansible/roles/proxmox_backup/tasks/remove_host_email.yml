---
# ansible/roles/proxmox_backup/tasks/remove_host_email.yml
# Safe decommissioning of host-level email notifications
# 
# Strategy: Disable-first approach (safe-by-default)
# - Disables email behavior in backup script
# - Removes SMTP configuration
# - Optionally uninstalls packages (only if explicitly enabled)
#
# Kuma monitoring must be configured separately to replace email notifications

- name: Discovery - Gather mail package facts
  ansible.builtin.package_facts:
    manager: apt
  when: proxmox_backup_remove_host_email | default(false)

- name: Discovery - Check for mail binaries
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/bin/mail
    - /usr/sbin/sendmail
    - /usr/bin/msmtp
  register: mail_binaries
  when: proxmox_backup_remove_host_email | default(false)

- name: Discovery - Check for mail configuration files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/msmtprc
    - /etc/postfix/main.cf
    - /etc/postfix/sasl_passwd
  register: mail_configs
  when: proxmox_backup_remove_host_email | default(false)

- name: Discovery - Check systemd mail services
  ansible.builtin.systemd:
    name: "{{ item }}"
  loop:
    - postfix
    - exim4
  register: mail_services
  failed_when: false
  when: proxmox_backup_remove_host_email | default(false)

- name: Discovery - Display mail infrastructure summary
  ansible.builtin.debug:
    msg: |
      Mail Infrastructure Discovery:
      {% if 'postfix' in ansible_facts.packages %}
      - Postfix: INSTALLED (version {{ ansible_facts.packages['postfix'][0].version }})
      {% endif %}
      {% if 'mailutils' in ansible_facts.packages %}
      - mailutils: INSTALLED (version {{ ansible_facts.packages['mailutils'][0].version }})
      {% endif %}
      {% if 'libsasl2-modules' in ansible_facts.packages %}
      - SASL modules: INSTALLED
      {% endif %}
      
      Binaries found: {{ mail_binaries.results | selectattr('stat.exists') | map(attribute='item') | list }}
      Config files found: {{ mail_configs.results | selectattr('stat.exists') | map(attribute='item') | list }}
      
      ⚠ Review above before proceeding with removal
  when: proxmox_backup_remove_host_email | default(false)

# ============================================================================
# Phase 1: DISABLE (Always safe, no package removal)
# ============================================================================

- name: Disable - Stop and disable Postfix service
  ansible.builtin.systemd:
    name: postfix
    state: stopped
    enabled: no
  failed_when: false
  when: proxmox_backup_remove_host_email | default(false)

- name: Disable - Remove SMTP block from Postfix main.cf
  ansible.builtin.blockinfile:
    path: /etc/postfix/main.cf
    marker: "# {mark} ANSIBLE MANAGED BLOCK - Gmail SMTP relay"
    state: absent
  when: 
    - proxmox_backup_remove_host_email | default(false)
    - mail_configs.results | selectattr('item', 'equalto', '/etc/postfix/main.cf') | selectattr('stat.exists') | list | length > 0

- name: Disable - Remove SASL password file
  ansible.builtin.file:
    path: /etc/postfix/sasl_passwd
    state: absent
  when: proxmox_backup_remove_host_email | default(false)

- name: Disable - Remove SASL password database
  ansible.builtin.file:
    path: /etc/postfix/sasl_passwd.db
    state: absent
  when: proxmox_backup_remove_host_email | default(false)

- name: Disable - Log decommissioning action
  ansible.builtin.shell: |
    logger -t proxmox-backup "Host-level email notifications decommissioned - Kuma monitoring now primary"
  when: proxmox_backup_remove_host_email | default(false)

# ============================================================================
# Phase 2: UNINSTALL (Only if explicitly enabled, requires careful review)
# ============================================================================

- name: Uninstall - Confirm explicit uninstall flag
  ansible.builtin.fail:
    msg: |
      ⚠ SAFETY CHECK FAILED
      
      proxmox_backup_remove_host_email_packages is set to true.
      
      This will UNINSTALL mail packages. Before proceeding:
      1. Verify discovery output shows ONLY backup-related mail usage
      2. Confirm no other system processes require mail sending
      3. Confirm Kuma monitoring is configured and working
      
      If you're certain, re-run with:
        -e proxmox_backup_uninstall_confirmed=true
  when:
    - proxmox_backup_remove_host_email_packages | default(false)
    - not (proxmox_backup_uninstall_confirmed | default(false))

- name: Uninstall - Remove mail packages (mailutils, libsasl2-modules)
  ansible.builtin.apt:
    name:
      - mailutils
      - bsd-mailx
      - libsasl2-modules
    state: absent
    purge: yes
    autoremove: yes
  when:
    - proxmox_backup_remove_host_email_packages | default(false)
    - proxmox_backup_uninstall_confirmed | default(false)

- name: Uninstall - Remove Postfix (only if explicitly requested)
  ansible.builtin.apt:
    name:
      - postfix
    state: absent
    purge: yes
    autoremove: yes
  when:
    - proxmox_backup_remove_host_email_packages | default(false)
    - proxmox_backup_uninstall_postfix | default(false)
    - proxmox_backup_uninstall_confirmed | default(false)

- name: Uninstall - Remove leftover Postfix configuration
  ansible.builtin.file:
    path: /etc/postfix
    state: absent
  when:
    - proxmox_backup_remove_host_email_packages | default(false)
    - proxmox_backup_uninstall_postfix | default(false)
    - proxmox_backup_uninstall_confirmed | default(false)

- name: Uninstall - Log package removal
  ansible.builtin.shell: |
    logger -t proxmox-backup "Mail packages removed: mailutils, libsasl2-modules{{ ', postfix' if (proxmox_backup_uninstall_postfix | default(false)) else '' }}"
  when:
    - proxmox_backup_remove_host_email_packages | default(false)
    - proxmox_backup_uninstall_confirmed | default(false)

# ============================================================================
# Phase 3: VERIFICATION
# ============================================================================

- name: Verify - Check mail binaries removed (if uninstalled)
  ansible.builtin.command: which mail
  register: mail_check
  failed_when: false
  changed_when: false
  when:
    - proxmox_backup_remove_host_email_packages | default(false)
    - proxmox_backup_uninstall_confirmed | default(false)

- name: Verify - Display post-removal status
  ansible.builtin.debug:
    msg: |
      Post-Decommissioning Status:
      
      {% if proxmox_backup_remove_host_email_packages | default(false) %}
      ✓ Mail packages: REMOVED
      {% else %}
      ✓ Mail services: DISABLED (packages retained)
      {% endif %}
      ✓ SMTP configuration: REMOVED
      ✓ Backup script: Email notifications disabled
      
      Next steps:
      1. Run backup manually: /usr/local/sbin/proxmox-config-backup
      2. Verify Kuma monitoring receives push/heartbeat
      3. Test failure scenario (break NAS mount, run backup)
      4. Confirm Kuma detects failure and sends notification
  when: proxmox_backup_remove_host_email | default(false)
