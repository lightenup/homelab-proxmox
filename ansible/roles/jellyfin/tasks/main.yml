---
- name: Install repo prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Download Jellyfin signing key
  ansible.builtin.get_url:
    url: "{{ jellyfin_apt_key_url }}"
    dest: /tmp/jellyfin_team.gpg.key
    mode: "0644"
  when: jellyfin_repo_enabled

- name: Install Jellyfin keyring
  ansible.builtin.command: >-
    gpg --dearmor -o {{ jellyfin_apt_keyring_path }} /tmp/jellyfin_team.gpg.key
  args:
    creates: "{{ jellyfin_apt_keyring_path }}"
  become: true
  when: jellyfin_repo_enabled

- name: Configure Jellyfin apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ jellyfin_apt_keyring_path }}] {{ jellyfin_repo_url }} {{ jellyfin_repo_suite }} {{ jellyfin_repo_components }}"
    filename: jellyfin
    state: present
  when: jellyfin_repo_enabled

- name: Install Jellyfin
  ansible.builtin.apt:
    name: "{{ jellyfin_packages }}"
    state: present
    update_cache: true

- name: Enable and start Jellyfin
  ansible.builtin.service:
    name: jellyfin
    enabled: true
    state: started

# Exporter deployment: verify vault key is present, then deploy binary + systemd service
# Feature: 041-monitoring-tier-b (FR-010, FR-028, T014, T022)
- name: Assert vault API key is defined for Jellyfin exporter
  ansible.builtin.assert:
    that:
      - jellyfin_api_key is defined
    fail_msg: >-
      Missing vault variable: jellyfin_api_key —
      run 'ansible-vault edit group_vars/services/vault.yml' to add it

- name: Ensure Jellyfin exporter install directory exists
  ansible.builtin.file:
    path: "{{ jellyfin_exporter_install_dir }}"
    state: directory
    mode: '0755'

- name: Download Jellyfin exporter binary archive
  ansible.builtin.get_url:
    url: "https://github.com/rebelcore/jellyfin_exporter/releases/download/v{{ jellyfin_exporter_version }}/jellyfin_exporter-{{ jellyfin_exporter_version }}.{{ jellyfin_exporter_arch }}.tar.gz"
    dest: "/tmp/jellyfin_exporter.tar.gz"
    mode: '0644'

- name: Extract Jellyfin exporter binary
  ansible.builtin.unarchive:
    src: "/tmp/jellyfin_exporter.tar.gz"
    dest: "{{ jellyfin_exporter_install_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: "{{ jellyfin_exporter_install_dir }}/jellyfin_exporter"

- name: Set executable permissions on Jellyfin exporter binary
  ansible.builtin.file:
    path: "{{ jellyfin_exporter_install_dir }}/jellyfin_exporter"
    mode: '0755'

- name: Deploy Jellyfin exporter systemd service
  ansible.builtin.template:
    src: jellyfin-exporter.service.j2
    dest: /etc/systemd/system/jellyfin-exporter.service
    mode: '0644'
  no_log: true
  notify:
    - Reload systemd daemon
    - Restart jellyfin exporter

- name: Enable and start Jellyfin exporter service
  ansible.builtin.service:
    name: jellyfin-exporter
    enabled: true
    state: started
