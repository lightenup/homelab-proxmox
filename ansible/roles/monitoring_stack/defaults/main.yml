---
# Monitoring Stack Default Configuration
# Feature: 017-synology-metrics
# Purpose: Version pins, ports, paths for Prometheus, Grafana, SNMP Exporter, Alertmanager

# Monitoring LXC
monitoring_ip: "{{ monitoring_host_ip }}"
monitoring_hostname: "monitoring"

# Synology NAS targets — synology_nas_ip lives in group_vars/all/vars.yml (central, spec
# 083); the hostname is monitoring-specific.
synology_nas_hostname: "nas.local"

# Prometheus configuration
prometheus_scrape_interval: "30s"
prometheus_scrape_timeout: "10s"
prometheus_retention_time: "15d"
prometheus_port: 9090

# Grafana configuration
grafana_port: 3000
grafana_domain: "monitoring.local"
grafana_datasource_name: "Prometheus"

# Telegraf configuration
telegraf_port: 9273

# Alertmanager configuration
alertmanager_port: 9093
alertmanager_group_wait: "30s"
alertmanager_group_interval: "5m"
alertmanager_repeat_interval: "4h"

# Docker compose paths
monitoring_install_dir: "/opt/monitoring"
compose_file_path: "{{ monitoring_install_dir }}/docker-compose.yml"
prometheus_config_path: "{{ monitoring_install_dir }}/prometheus"
grafana_provisioning_path: "{{ monitoring_install_dir }}/grafana/provisioning"
grafana_dashboards_path: "{{ monitoring_install_dir }}/grafana/dashboards"
telegraf_config_path: "{{ monitoring_install_dir }}/telegraf"
alertmanager_config_path: "{{ monitoring_install_dir }}/alertmanager"

# Blackbox exporter configuration
# Feature: 042-monitoring-tier-c (FR-001, FR-002)
blackbox_exporter_port: 9115
blackbox_config_path: "{{ monitoring_install_dir }}/blackbox"

# Timezone
timezone: "Europe/Copenhagen"

# Pushover push notification configuration
# Feature: 043-alerting-pushover (FR-011, FR-014)
pushover_enabled: false
pushover_retry_interval: "1m"
pushover_expire_duration: "1h"
pushover_grafana_url: "{{ grafana_protocol | default('https') }}://{{ grafana_domain }}"

# Escape hatch for the guard in tasks/main.yml. Rendering the monitoring config from an
# inventory with no service contracts overwrites the live scrape targets and alert rules
# with empty ones, so it is refused by default. Set true only for a genuinely standalone
# monitoring stack that is meant to watch nothing but itself.
monitoring_allow_empty_contracts: false

# Loki (spec 092)
loki_port: 3100
loki_config_path: "{{ monitoring_install_dir }}/loki"
loki_rules_path: "{{ monitoring_install_dir }}/loki/rules"
loki_retention_period: "720h"
loki_mem_limit: "1g"
lokitool_path: /usr/local/bin/lokitool
