---
# Deploy Docker Compose stack and configuration files
# Feature: 017-synology-metrics

- name: Deploy Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ compose_file_path }}"
    mode: '0644'
  notify: Restart monitoring stack

- name: Deploy Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_path }}/prometheus.yml"
    mode: '0644'
  notify: Reload prometheus

- name: Deploy infrastructure alert rules
  ansible.builtin.copy:
    src: prometheus/alerts/infrastructure_alerts.yml
    dest: "{{ prometheus_config_path }}/alerts/infrastructure_alerts.yml"
    mode: '0644'
  notify: Reload prometheus

- name: Deploy Synology alert rules
  ansible.builtin.copy:
    src: prometheus/alerts/synology_alerts.yml
    dest: "{{ prometheus_config_path }}/alerts/synology_alerts.yml"
    mode: '0644'
  notify: Reload prometheus

- name: Deploy security alert rules
  ansible.builtin.copy:
    src: prometheus/alerts/security_alerts.yml
    dest: "{{ prometheus_config_path }}/alerts/security_alerts.yml"
    mode: '0644'
  notify: Reload prometheus

- name: Deploy Blackbox exporter configuration
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: "{{ blackbox_config_path }}/blackbox.yml"
    mode: '0644'
  notify: Restart monitoring stack

- name: Deploy service alert rules from monitoring contracts
  ansible.builtin.template:
    src: service_alerts.yml.j2
    dest: "{{ prometheus_config_path }}/alerts/service_alerts.yml"
    mode: '0644'
  notify: Reload prometheus

- name: Deploy backup staleness alert rule
  ansible.builtin.template:
    src: backup_alerts.yml.j2
    dest: "{{ prometheus_config_path }}/alerts/backup_alerts.yml"
    mode: '0644'
  notify: Reload prometheus

- name: Deploy log pipeline alert rules
  ansible.builtin.template:
    src: log_pipeline_alerts.yml.j2
    dest: "{{ prometheus_config_path }}/alerts/log_pipeline_alerts.yml"
    mode: '0644'
  notify: Reload prometheus
  when: (deploy_environment | default('prod')) != 'lab'

- name: Deploy Loki configuration
  ansible.builtin.template:
    src: loki.yaml.j2
    dest: "{{ loki_config_path }}/loki.yaml"
    mode: '0644'
  notify: Restart monitoring stack

- name: Deploy Loki ruler rules
  ansible.builtin.template:
    src: log_alerts.yaml.j2
    dest: "{{ loki_rules_path }}/fake/log_alerts.yaml"
    mode: '0644'
  when: (deploy_environment | default('prod')) != 'lab'
  # No handler: the local ruler polls the rules directory every minute (R15).

- name: Deploy Telegraf configuration
  ansible.builtin.template:
    src: telegraf.conf.j2
    dest: "{{ telegraf_config_path }}/telegraf.conf"
    mode: '0644'
  no_log: true  # Contains SNMP credentials
  notify: Restart monitoring stack

- name: Deploy Alertmanager configuration
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ alertmanager_config_path }}/alertmanager.yml"
    mode: '0644'
  no_log: true  # Contains SMTP credentials
  notify: Restart monitoring stack

- name: Validate rendered configuration before (re)starting the stack
  ansible.builtin.include_tasks: validate_alerts.yml

- name: Start monitoring stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ monitoring_base_path }}"
  register: docker_compose_result
  changed_when: "'Created' in docker_compose_result.stdout or 'Started' in docker_compose_result.stdout"
