---
# Provision service-owned Grafana dashboards from monitoring contracts
# Feature: 040-monitoring-overhaul
# Traces to: FR-010, FR-011, US-4, SC-005
#
# Iterates over all inventory hosts, finds monitoring contracts with dashboard_file defined,
# and copies each dashboard JSON from the service role's files/ directory to the Grafana
# dashboards path on the monitoring host.
#
# The monitoring_stack role never references service names directly — it follows contract
# references via hostvars. The role path is derived from the inventory hostname, which
# matches the Ansible role name by project convention (e.g., host 'reverse_proxy' uses
# role 'reverse_proxy').

- name: Deploy service-owned Grafana dashboards from monitoring contracts
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../roles/{{ item }}/files/{{ (hostvars[item].monitoring_contract | default({})).dashboard_file }}"
    dest: "{{ grafana_dashboards_path }}/{{ ((hostvars[item].monitoring_contract | default({})).dashboard_file) | basename }}"
    mode: '0644'
  loop: "{{ groups['all'] | default([]) }}"
  when:
    - hostvars[item].monitoring_contract is defined
    - hostvars[item].monitoring_contract.enabled | default(false)
    - (hostvars[item].monitoring_contract | default({})).dashboard_file | default(none) is not none
    - (hostvars[item].monitoring_contract | default({})).dashboard_file | default('') | length > 0
  loop_control:
    # `| default({})` before the nested `.dashboard_file` access is required: some contracts
    # (e.g. financial-scenario) define monitoring_contract with no dashboard_file key at all,
    # and this label is templated for every loop item regardless of the `when:` result — a bare
    # `.dashboard_file` attribute access on such a dict raises AttributeError here (unlike in
    # the `when:` list, where Jinja's Undefined handling tolerates it).
    label: >-
      {{
        item + ': ' + ((hostvars[item].monitoring_contract | default({})).dashboard_file | default('no dashboard', true))
        if (hostvars[item].monitoring_contract is defined and (hostvars[item].monitoring_contract | default({})).dashboard_file | default(none) is not none)
        else item + ': no contract'
      }}
