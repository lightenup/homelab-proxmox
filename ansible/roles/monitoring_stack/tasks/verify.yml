---
- name: Verify monitoring containers are running
  ansible.builtin.shell:
    cmd: docker ps --filter name={{ item.name }} --format '{{"{{"}}.Status{{"}}"}}'
  register: container_status
  changed_when: false
  failed_when: "'Up' not in container_status.stdout"
  loop:
    - name: prometheus
    - name: grafana
    - name: telegraf
    - name: alertmanager
    - name: blackbox-exporter
    - name: loki

- name: Wait for monitoring ports to be listening
  ansible.builtin.wait_for:
    host: localhost
    port: "{{ item.port }}"
    timeout: 120
    state: started
  loop:
    - name: prometheus
      port: "{{ prometheus_port }}"
    - name: grafana
      port: "{{ grafana_port }}"
    - name: telegraf
      port: "{{ telegraf_port }}"
    - name: alertmanager
      port: "{{ alertmanager_port }}"
    - name: blackbox-exporter
      port: "{{ blackbox_exporter_port }}"

- name: Wait for monitoring HTTP endpoints to respond
  ansible.builtin.uri:
    url: "{{ item.url }}"
    method: GET
    status_code: 200
  register: http_response
  until: http_response.status == 200
  retries: 20
  delay: 3
  loop:
    - name: prometheus
      url: "http://localhost:{{ prometheus_port }}/-/ready"
    - name: grafana
      url: "http://localhost:{{ grafana_port }}/api/health"
    - name: telegraf
      url: "http://localhost:{{ telegraf_port }}/metrics"
    - name: alertmanager
      url: "http://localhost:{{ alertmanager_port }}/-/ready"
    - name: blackbox-exporter
      url: "http://localhost:{{ blackbox_exporter_port }}/metrics"

# Loki waits about 15s after /ready first answers before it is fully usable (research R2),
# so this gets its own retries/delay rather than joining the loop above.
- name: Wait for Loki to become ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ loki_port }}/ready"
    method: GET
    status_code: 200
  register: loki_ready
  until: loki_ready.status == 200
  retries: 30
  delay: 5
