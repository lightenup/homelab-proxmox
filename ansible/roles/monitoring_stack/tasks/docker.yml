---
- name: Install Docker
  ansible.builtin.import_role:
    name: geerlingguy.docker

- name: Verify Docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Install Python Docker SDK
  ansible.builtin.apt:
    name: python3-docker
    state: present
    update_cache: yes
