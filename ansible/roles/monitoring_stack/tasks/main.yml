---
# Monitoring Stack Main Task Orchestration
# Feature: 017-synology-metrics, 040-monitoring-overhaul
# Purpose: Orchestrate deployment of Prometheus, Grafana, SNMP Exporter, Alertmanager

- name: Clean up Uptime Kuma (decommission)
  ansible.builtin.include_tasks: kuma_cleanup.yml
  tags: [kuma_cleanup]

- name: Install Docker
  ansible.builtin.include_tasks: docker.yml
  tags: [docker]

- name: Create monitoring directories
  ansible.builtin.include_tasks: create_directories.yml
  tags: [directories]

- name: Configure NFS backup mount
  ansible.builtin.include_role:
    name: nfs_mount
  when: monitoring_nfs_enabled | default(true)
  tags: [nfs, backup]

- name: Validate Pushover credentials when enabled
  ansible.builtin.assert:
    that:
      - pushover_user_key is defined
      - pushover_user_key | length > 0
      - pushover_api_token is defined
      - pushover_api_token | length > 0
    fail_msg: >-
      Pushover is enabled (pushover_enabled=true) but credentials are missing.
      Add 'pushover_user_key' and 'pushover_api_token' to
      ansible/group_vars/monitoring/vault.yml.
  when: pushover_enabled | default(false) | bool
  no_log: true
  tags: [compose, pushover]

- name: Deploy Docker Compose stack
  ansible.builtin.include_tasks: compose_stack.yml
  tags: [compose]

- name: Validate alert rule syntax
  ansible.builtin.include_tasks: validate_alerts.yml
  tags: [validate_alerts]

- name: Provision Grafana datasources and dashboards
  ansible.builtin.include_tasks: grafana_provision.yml
  tags: [grafana]

- name: Configure backup cron job
  ansible.builtin.include_tasks: backup_cron.yml
  tags: [backup]

- name: Configure mDNS service announcements
  ansible.builtin.include_tasks: mdns.yml
  tags: [mdns]

- name: Verify monitoring stack
  ansible.builtin.include_tasks: verify.yml
  tags: [verify]
