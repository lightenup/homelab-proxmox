---
# Monitoring Stack Main Task Orchestration
# Feature: 017-synology-metrics, 040-monitoring-overhaul
# Purpose: Orchestrate deployment of Prometheus, Grafana, SNMP Exporter, Alertmanager

- name: Clean up Uptime Kuma (decommission)
  ansible.builtin.include_tasks: kuma_cleanup.yml
  tags: [kuma_cleanup]

- name: Install Docker
  ansible.builtin.include_tasks: docker.yml
  tags: [docker]

- name: Create monitoring directories
  ansible.builtin.include_tasks: create_directories.yml
  tags: [directories]

- name: Validate Pushover credentials when enabled
  ansible.builtin.assert:
    that:
      - pushover_user_key is defined
      - pushover_user_key | length > 0
      - pushover_api_token is defined
      - pushover_api_token | length > 0
    fail_msg: >-
      Pushover is enabled (pushover_enabled=true) but credentials are missing.
      Add 'pushover_user_key' and 'pushover_api_token' to
      ansible/group_vars/monitoring/vault.yml.
  when: pushover_enabled | default(false) | bool
  no_log: true
  tags: [compose, pushover]

# Guard added 2026-09-20 after a monitoring deploy wiped the live Prometheus config.
#
# Three things downstream iterate groups['all'] and read hostvars[h].monitoring_contract:
# templates/prometheus.yml.j2 (node-exporter, scrape and blackbox targets),
# templates/service_alerts.yml.j2 (every service alert group), and
# tasks/provision_dashboards.yml. The first two are TEMPLATES, so an empty iteration does
# not render nothing — it renders an empty config OVER the working one. (Dashboards
# survived precisely because that task only copies files.)
#
# So an inventory missing the service hosts does not fail, it silently un-monitors the
# estate: 16 scrape jobs and 5 alert groups gone, with the deploy reporting success,
# because verify.yml checks that containers are Up and /-/ready answers — both true of a
# Prometheus watching nothing.
#
# This runs before compose_stack (which renders both templates) rather than after, so the
# deploy stops while the live config is still intact.
# Initialised separately because the loop below sets nothing when no host matches, and
# `assert` resolves BOTH fail_msg and success_msg eagerly — so an undefined fact turns the
# intended explanation into a Jinja error, which is the least useful moment to lose it.
- name: Initialise the monitoring contract host list
  ansible.builtin.set_fact:
    monitoring_contract_hosts: []
  tags: [compose, always]

- name: Collect hosts that declare an enabled monitoring contract
  ansible.builtin.set_fact:
    monitoring_contract_hosts: "{{ monitoring_contract_hosts + [item] }}"
  loop: "{{ groups['all'] | default([]) | difference([inventory_hostname]) | list }}"
  loop_control:
    label: "{{ item }}"
  when: (hostvars[item].monitoring_contract | default({})).enabled | default(false) | bool
  tags: [compose, always]

- name: Assert the inventory carries service monitoring contracts
  ansible.builtin.assert:
    that:
      - monitoring_contract_hosts | length > 0
    fail_msg: >-
      Refusing to render the monitoring config: no host besides {{ inventory_hostname }}
      declares monitoring_contract.enabled, so every service's scrape targets and alert
      rules would render EMPTY and overwrite the live configuration, leaving Prometheus
      monitoring nothing. Inventory visible to this run:
      {{ groups['all'] | default([]) | length }} host(s) —
      {{ groups['all'] | default([]) | join(', ') }}. The usual cause is a per-service
      deploy whose inventory does not include the other services; see the committed
      inventory layering in scripts/lab/pve-service-deploy. Set
      monitoring_allow_empty_contracts=true only if a monitoring stack that monitors
      nothing is genuinely what you want.
    success_msg: >-
      {{ monitoring_contract_hosts | length }} service contract(s) visible:
      {{ monitoring_contract_hosts | sort | join(', ') }}
  when: not (monitoring_allow_empty_contracts | default(false) | bool)
  tags: [compose, always]

- name: Deploy Docker Compose stack
  ansible.builtin.include_tasks: compose_stack.yml
  tags: [compose]

- name: Provision Grafana datasources and dashboards
  ansible.builtin.include_tasks: grafana_provision.yml
  tags: [grafana]

- name: Configure mDNS service announcements
  ansible.builtin.include_tasks: mdns.yml
  tags: [mdns]

- name: Verify monitoring stack
  ansible.builtin.include_tasks: verify.yml
  tags: [verify]
