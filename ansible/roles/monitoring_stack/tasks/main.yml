---
# Monitoring Stack Main Task Orchestration
# Feature: 017-synology-metrics
# Purpose: Orchestrate deployment of Prometheus, Grafana, SNMP Exporter, Alertmanager

- name: Install Docker
  ansible.builtin.include_tasks: docker.yml
  tags: [docker]

- name: Create monitoring directories
  ansible.builtin.include_tasks: create_directories.yml
  tags: [directories]

- name: Configure NFS backup mount
  ansible.builtin.include_role:
    name: nfs_mount
  when: monitoring_nfs_enabled | default(true)
  tags: [nfs, backup]

- name: Deploy Docker Compose stack
  ansible.builtin.include_tasks: compose_stack.yml
  tags: [compose]

- name: Provision Grafana datasources and dashboards
  ansible.builtin.include_tasks: grafana_provision.yml
  tags: [grafana]

- name: Configure backup cron job
  ansible.builtin.include_tasks: backup_cron.yml
  tags: [backup]

- name: Configure mDNS service announcements
  ansible.builtin.include_tasks: mdns.yml
  tags: [mdns]

- name: Verify monitoring stack
  ansible.builtin.include_tasks: verify.yml
  tags: [verify]
