---
# Provision Grafana datasources and dashboards
# Feature: 017-synology-metrics
# Purpose: Auto-provision Prometheus datasource and Synology dashboard (zero clickops per US3)

# Grafana reads datasource provisioning only at startup, so a changed file needs a restart
# (found live in spec 092: the Loki datasource file landed but Grafana never loaded it).
- name: Deploy Prometheus datasource provisioning
  ansible.builtin.copy:
    src: grafana/provisioning/datasources/prometheus.yml
    dest: "{{ grafana_provisioning_path }}/datasources/prometheus.yml"
    mode: '0644'
  notify: Restart grafana

- name: Deploy Loki datasource provisioning
  ansible.builtin.copy:
    src: grafana/provisioning/datasources/loki.yml
    dest: "{{ grafana_provisioning_path }}/datasources/loki.yml"
    mode: '0644'
  notify: Restart grafana

- name: Deploy dashboard provider configuration
  ansible.builtin.copy:
    src: grafana/provisioning/dashboards/default.yml
    dest: "{{ grafana_provisioning_path }}/dashboards/default.yml"
    mode: '0644'

- name: Deploy Synology NAS dashboard
  ansible.builtin.copy:
    src: grafana/dashboards/synology-nas.json
    dest: "{{ grafana_dashboards_path }}/synology-nas.json"
    mode: '0644'

- name: Deploy infrastructure overview dashboard
  ansible.builtin.copy:
    src: grafana/dashboards/infrastructure-overview.json
    dest: "{{ grafana_dashboards_path }}/infrastructure-overview.json"
    mode: '0644'

- name: Deploy Security Overview dashboard
  ansible.builtin.copy:
    src: grafana/dashboards/security-overview.json
    dest: "{{ grafana_dashboards_path }}/security-overview.json"
    mode: '0644'

- name: Deploy service-owned dashboards from monitoring contracts
  ansible.builtin.include_tasks: provision_dashboards.yml
