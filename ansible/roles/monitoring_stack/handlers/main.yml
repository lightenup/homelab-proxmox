---
- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart monitoring stack
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_install_dir }}"
    state: restarted

- name: Restart avahi-daemon
  ansible.builtin.service:
    name: avahi-daemon
    state: restarted
