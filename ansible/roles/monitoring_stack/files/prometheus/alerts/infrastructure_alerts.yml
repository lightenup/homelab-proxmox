# Prometheus infrastructure alert rules
# Feature: 040-monitoring-overhaul
# Traces to: FR-012, FR-013, US-1, US-2

groups:
  - name: infrastructure_alerts
    interval: 30s
    rules:
      # FR-012: Generic service-down detection (replaces Uptime Kuma)
      # Targets labelled no_down_alert="true" are excluded: hosts that are expected to vanish
      # (the Mac's llm-queue, a laptop that sleeps) — set via prometheus_external_scrape_targets.
      - alert: ServiceDown
        expr: up{no_down_alert!="true"} == 0
        for: 2m
        labels:
          severity: critical
          component: availability
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
          description: "Scrape target {{ $labels.instance }} (job: {{ $labels.job }}) has been unreachable for more than 2 minutes."

      # FR-013: High CPU usage
      - alert: HighCPUUsage
        expr: |
          100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage on {{ $labels.instance }} has been above 85% for 10 minutes (current: {{ $value | printf \"%.1f\" }}%)."

      # FR-013: High memory usage
      - alert: HighMemoryUsage
        expr: |
          100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 85
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage on {{ $labels.instance }} has been above 85% for 5 minutes (current: {{ $value | printf \"%.1f\" }}%)."

      # FR-013: Disk space warning
      - alert: DiskSpaceWarning
        expr: |
          100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) > 85
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Disk space warning on {{ $labels.instance }}:{{ $labels.mountpoint }}"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | printf \"%.1f\" }}% full (threshold: 85%)."

      # FR-013: Disk space critical
      - alert: DiskSpaceCritical
        expr: |
          100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) > 95
        for: 2m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "CRITICAL: Disk space on {{ $labels.instance }}:{{ $labels.mountpoint }}"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | printf \"%.1f\" }}% full (threshold: 95%)."

      # Inodes (RCA 2026-10-27): pve's /tmp tmpfs ran out of inodes (1,048,576) from leaked
      # pytest dirs while 95% of its bytes were free, and a CI run failed with ENOSPC. No rule
      # watched inodes, and DiskSpace* skip every tmpfs. Unlike bytes, tmpfs inodes are a real
      # limit here, so tmpfs is included. node_filesystem_files == 0 (no inode accounting,
      # e.g. some FUSE/NFS mounts) is excluded to avoid dividing by zero.
      - alert: FilesystemInodesWarning
        expr: |
          100 * (1 - node_filesystem_files_free{fstype!~"overlay|squashfs|nsfs|autofs"} / node_filesystem_files{fstype!~"overlay|squashfs|nsfs|autofs"}) > 85
          and node_filesystem_files > 0
        for: 10m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Inodes running out on {{ $labels.instance }}:{{ $labels.mountpoint }}"
          description: "{{ $labels.mountpoint }} ({{ $labels.fstype }}) on {{ $labels.instance }} has used {{ $value | printf \"%.1f\" }}% of its inodes (threshold: 85%). Many small files; new files will fail with ENOSPC at 100% even with free space. On pve /tmp, look for leftover pytest-of-* dirs."

      - alert: FilesystemInodesCritical
        expr: |
          100 * (1 - node_filesystem_files_free{fstype!~"overlay|squashfs|nsfs|autofs"} / node_filesystem_files{fstype!~"overlay|squashfs|nsfs|autofs"}) > 95
          and node_filesystem_files > 0
        for: 2m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "CRITICAL: inodes nearly exhausted on {{ $labels.instance }}:{{ $labels.mountpoint }}"
          description: "{{ $labels.mountpoint }} ({{ $labels.fstype }}) on {{ $labels.instance }} has used {{ $value | printf \"%.1f\" }}% of its inodes (threshold: 95%). File creation is about to fail with ENOSPC."

      # /tmp is a RAM-backed tmpfs on pve (half of RAM); DiskSpace* skip tmpfs, so watch it here.
      - alert: TmpSpaceWarning
        expr: |
          100 * (1 - node_filesystem_avail_bytes{mountpoint="/tmp", fstype="tmpfs"} / node_filesystem_size_bytes{mountpoint="/tmp", fstype="tmpfs"}) > 85
        for: 10m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "/tmp is filling up on {{ $labels.instance }}"
          description: "/tmp (tmpfs, held in RAM) on {{ $labels.instance }} is {{ $value | printf \"%.1f\" }}% full (threshold: 85%)."
