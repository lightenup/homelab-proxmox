# Prometheus alert rules for Synology NAS monitoring
# Feature: 041-monitoring-tier-b (fixes for US-2: job label, metric names, integer comparison)
# Moved from alerts.yml to alerts/synology_alerts.yml (Feature 040-monitoring-overhaul)

groups:
  - name: synology_alerts
    interval: 30s
    rules:
      # FR-003: Storage capacity monitoring
      - alert: SynologyVolumeHighUsage
        expr: |
          100 * (1 - (snmp_synology_volume_available_bytes / snmp_synology_volume_size_bytes)) > 85
        for: 5m
        labels:
          severity: warning
          component: storage
        annotations:
          summary: "Synology volume {{ $labels.raidName }} usage high"
          description: "Volume {{ $labels.raidName }} is at {{ $value | humanize }}% capacity (threshold: 85%)"

      # FR-005: NAS availability monitoring
      - alert: SynologyNASDown
        expr: |
          up{job="telegraf-snmp"} == 0
        for: 2m
        labels:
          severity: critical
          component: availability
        annotations:
          summary: "Synology NAS unreachable"
          description: "SNMP scrape target {{ $labels.instance }} has been down for more than 2 minutes"

      # FR-008: Disk SMART status (integer comparison: 1=Normal)
      - alert: SynologyDiskSMARTWarning
        expr: |
          snmp_synology_disk_status != 1
        for: 5m
        labels:
          severity: warning
          component: disk_health
        annotations:
          summary: "Synology disk {{ $labels.diskID }} health issue"
          description: "Disk {{ $labels.diskID }} reports abnormal status (value: {{ $value }}, expected: 1=Normal)"
