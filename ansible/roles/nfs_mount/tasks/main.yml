---
# Feature 017: NFS Mount Role
# Purpose: Automated NFS client setup and mount configuration
# Idempotent and fully automated - no manual /etc/fstab editing required

- name: Install NFS client packages
  ansible.builtin.apt:
    name:
      - nfs-common
    state: present
    update_cache: yes
  tags: [nfs, packages]

- name: Create NFS mount point directory
  ansible.builtin.file:
    path: "{{ nfs_mount_point }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  tags: [nfs, directories]

- name: Check if NFS share is accessible
  ansible.builtin.command:
    cmd: "showmount -e {{ nfs_server }}"
  register: showmount_result
  changed_when: false
  failed_when: false
  tags: [nfs, validation]

- name: Verify NFS export exists
  ansible.builtin.assert:
    that:
      - showmount_result.rc == 0
      - "nfs_export_path in showmount_result.stdout"
    fail_msg: "NFS export {{ nfs_export_path }} not found on {{ nfs_server }}"
    success_msg: "NFS export {{ nfs_export_path }} verified on {{ nfs_server }}"
  tags: [nfs, validation]

- name: Configure NFS mount in /etc/fstab
  ansible.posix.mount:
    path: "{{ nfs_mount_point }}"
    src: "{{ nfs_server }}:{{ nfs_export_path }}"
    fstype: nfs
    opts: "{{ nfs_mount_options | default('defaults,_netdev') }}"
    state: mounted
  register: nfs_mount_result
  tags: [nfs, mount]

- name: Verify NFS mount is active
  ansible.builtin.command:
    cmd: "mountpoint -q {{ nfs_mount_point }}"
  register: mountpoint_check
  changed_when: false
  failed_when: mountpoint_check.rc != 0
  tags: [nfs, validation]

- name: Create backup subdirectory on NFS mount
  ansible.builtin.file:
    path: "{{ nfs_mount_point }}/{{ backup_subdir | default('monitoring') }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  when: backup_subdir is defined
  tags: [nfs, directories]

- name: Test write permissions on NFS mount
  ansible.builtin.copy:
    content: "NFS mount test - {{ ansible_date_time.iso8601 }}"
    dest: "{{ nfs_mount_point }}/.nfs_write_test"
    mode: '0644'
  register: write_test
  tags: [nfs, validation]

- name: Remove write test file
  ansible.builtin.file:
    path: "{{ nfs_mount_point }}/.nfs_write_test"
    state: absent
  when: write_test is succeeded
  tags: [nfs, validation]

- name: Display mount information
  ansible.builtin.debug:
    msg:
      - "NFS mount successful:"
      - "  Server: {{ nfs_server }}"
      - "  Export: {{ nfs_export_path }}"
      - "  Mount point: {{ nfs_mount_point }}"
      - "  Mount options: {{ nfs_mount_options | default('defaults,_netdev') }}"
      - "  Status: {{ 'Active and writable' if write_test is succeeded else 'Active (write test failed)' }}"
  tags: [nfs]
