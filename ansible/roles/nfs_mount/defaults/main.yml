---
# NFS Mount Role Defaults
# Override these in group_vars or playbook vars

# NFS server configuration
nfs_server: "192.168.1.109"  # Synology NAS IP
nfs_export_path: "/volume1/backups"  # NFS export path on server
nfs_mount_point: "/mnt/nas/backups"  # Local mount point on client

# Mount options (customize as needed)
nfs_mount_options: "defaults,_netdev,rw,hard,intr,timeo=600,retrans=2"

# Backup subdirectory (created automatically)
backup_subdir: "monitoring"

# NFS version (optional - auto-negotiated if not specified)
# nfs_version: "4"
