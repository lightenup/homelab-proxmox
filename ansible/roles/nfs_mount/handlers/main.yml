---
# NFS Mount Role Handlers

- name: Remount NFS share
  ansible.builtin.command:
    cmd: "mount -o remount {{ nfs_mount_point }}"
  when: nfs_mount_point is defined

- name: Reload NFS mount
  when: nfs_mount_point is defined
  block:
    - name: Unmount NFS share
      ansible.posix.mount:
        path: "{{ nfs_mount_point }}"
        state: unmounted
    
    - name: Remount NFS share
      ansible.posix.mount:
        path: "{{ nfs_mount_point }}"
        state: mounted
