---
- name: Include preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Ensure install and config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ homeassistant_install_dir }}"
    - "{{ homeassistant_config_dir }}"

# configuration.yaml and the three UI-edited include files are seeded once (force: false):
# Home Assistant's UI writes automations/scripts/scenes, and the owner may edit
# configuration.yaml by hand. Overwriting them on every deploy would erase that work.
- name: Seed configuration.yaml (first deploy only)
  ansible.builtin.template:
    src: configuration.yaml.j2
    dest: "{{ homeassistant_config_dir }}/configuration.yaml"
    mode: '0644'
    force: false
  notify: Restart homeassistant

- name: Seed the UI-managed include files (first deploy only)
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ homeassistant_config_dir }}/{{ item.file }}"
    mode: '0644'
    force: false
  loop:
    - { file: automations.yaml, content: "[]\n" }
    - { file: scripts.yaml, content: "" }
    - { file: scenes.yaml, content: "" }
  loop_control:
    label: "{{ item.file }}"

# The http: block is always rendered, unlike configuration.yaml: the reverse-proxy settings
# are infrastructure, not owner configuration, and must track reverse_proxy_ip.
- name: Deploy http.yaml (reverse-proxy trust)
  ansible.builtin.template:
    src: http.yaml.j2
    dest: "{{ homeassistant_config_dir }}/http.yaml"
    mode: '0644'
  notify: Restart homeassistant

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ homeassistant_install_dir }}/docker-compose.yml"
    mode: '0644'
  notify: Restart homeassistant

- name: Ensure Home Assistant stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ homeassistant_install_dir }}"
    state: present
    remove_orphans: true
    pull: always

- name: Apply pending restarts before the health wait
  ansible.builtin.meta: flush_handlers

# First start installs Python dependencies for the default integrations, so allow ~3 minutes.
- name: Wait for Home Assistant to serve its frontend
  ansible.builtin.uri:
    url: "http://{{ homeassistant_ip }}:{{ homeassistant_port }}/manifest.json"
    method: GET
    status_code: 200
  register: homeassistant_health
  retries: 18
  delay: 10
  until: homeassistant_health.status == 200
  changed_when: false
