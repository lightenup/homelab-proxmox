---
- name: Include preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Ensure install and config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ homeassistant_install_dir }}"
    - "{{ homeassistant_config_dir }}"

# configuration.yaml and the three UI-edited include files are seeded once (force: false):
# Home Assistant's UI writes automations/scripts/scenes, and the owner may edit
# configuration.yaml by hand. Overwriting them on every deploy would erase that work.
- name: Seed configuration.yaml (first deploy only)
  ansible.builtin.template:
    src: configuration.yaml.j2
    dest: "{{ homeassistant_config_dir }}/configuration.yaml"
    mode: '0644'
    force: false
  notify: Restart homeassistant

- name: Seed the UI-managed include files (first deploy only)
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ homeassistant_config_dir }}/{{ item.file }}"
    mode: '0644'
    force: false
  loop:
    - { file: automations.yaml, content: "[]\n" }
    - { file: scripts.yaml, content: "" }
    - { file: scenes.yaml, content: "" }
  loop_control:
    label: "{{ item.file }}"

# Since 2026.10 the http integration is configured in the UI (Settings > System > Network)
# and stored in .storage/http. YAML is imported once as a *pending* config that an admin must
# confirm within 5 minutes; on a fresh install there is no admin yet, so it is reverted and
# YAML is ignored from then on. The reverse-proxy trust (use_x_forwarded_for, trusted_proxies
# = reverse_proxy_ip) is therefore a one-time UI step after onboarding, not managed here.
# These two tasks remove the earlier YAML approach from instances that were deployed with it.
- name: Remove the http include from configuration.yaml (superseded by UI config)
  ansible.builtin.lineinfile:
    path: "{{ homeassistant_config_dir }}/configuration.yaml"
    regexp: '^http: !include http\.yaml$'
    state: absent
  notify: Restart homeassistant

- name: Remove the superseded http.yaml
  ansible.builtin.file:
    path: "{{ homeassistant_config_dir }}/http.yaml"
    state: absent

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ homeassistant_install_dir }}/docker-compose.yml"
    mode: '0644'
  notify: Restart homeassistant

- name: Ensure Home Assistant stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ homeassistant_install_dir }}"
    state: present
    remove_orphans: true
    pull: always

- name: Apply pending restarts before the health wait
  ansible.builtin.meta: flush_handlers

# First start installs Python dependencies for the default integrations, so allow ~3 minutes.
- name: Wait for Home Assistant to serve its frontend
  ansible.builtin.uri:
    url: "http://{{ homeassistant_ip }}:{{ homeassistant_port }}/manifest.json"
    method: GET
    status_code: 200
  register: homeassistant_health
  retries: 18
  delay: 10
  until: homeassistant_health.status == 200
  changed_when: false
