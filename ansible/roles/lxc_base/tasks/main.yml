---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages
  apt:
    upgrade: dist

- name: Install core packages
  apt:
    name:
      - python3
      - curl
      - wget
      - git
      - htop
      - vim
      - net-tools
    state: present
