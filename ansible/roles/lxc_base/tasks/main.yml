---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages
  apt:
    upgrade: dist

- name: Install core packages
  apt:
    name:
      - python3
      - curl
      - wget
      - git
      - htop
      - vim
      - net-tools
    state: present

- name: Deploy node_exporter metrics agent
  ansible.builtin.include_role:
    name: node_exporter
  when: node_exporter_enabled | default(true)
