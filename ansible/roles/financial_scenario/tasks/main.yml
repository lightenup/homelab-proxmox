---
- name: Include preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Ensure install directory exists
  ansible.builtin.file:
    path: "{{ financial_scenario_install_dir }}"
    state: directory
    mode: '0755'

- name: Ensure reference data directory exists
  ansible.builtin.file:
    path: "{{ financial_scenario_data_dir }}/reference_data"
    state: directory
    mode: '0755'

- name: Authenticate to GHCR
  community.docker.docker_login:
    registry_url: "{{ financial_scenario_ghcr_registry }}"
    username: "{{ ghcr_pull_username }}"
    password: "{{ ghcr_pull_token }}"
  no_log: true

# The compose bind-mount maps the host reference-data dir over the image's
# baked-in /app/config/reference_data, which would mask the defaults on a first
# deploy (empty host dir). Seed the host dir from the image once, so the app
# starts with its reference data and later operator/catalog edits persist.
- name: Detect whether reference data has been seeded
  ansible.builtin.find:
    paths: "{{ financial_scenario_data_dir }}/reference_data"
    patterns: "*.yaml,*.yml"
    recurse: true
  register: financial_scenario_refdata

- name: Pull api image for first-deploy reference-data seeding
  community.docker.docker_image:
    name: "{{ financial_scenario_api_image }}:{{ financial_scenario_version }}"
    source: pull
  when: financial_scenario_refdata.matched == 0

- name: Seed reference data from the image on first deploy
  community.docker.docker_container:
    name: financial-scenario-seed
    image: "{{ financial_scenario_api_image }}:{{ financial_scenario_version }}"
    command: ["sh", "-c", "cp -a /app/config/reference_data/. /seed/"]
    volumes:
      - "{{ financial_scenario_data_dir }}/reference_data:/seed"
    detach: false
    cleanup: true
  when: financial_scenario_refdata.matched == 0

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ financial_scenario_install_dir }}/docker-compose.yml"
    mode: '0644'
  notify: Restart financial-scenario

- name: Ensure financial-scenario stack is running
  community.docker.docker_compose_v2:
    project_src: "{{ financial_scenario_install_dir }}"
    state: present
    remove_orphans: true
    pull: always

- name: Wait for GUI to be reachable
  ansible.builtin.wait_for:
    port: "{{ financial_scenario_gui_port }}"
    host: "127.0.0.1"
    delay: 5
    timeout: 120

- name: Verify GUI health
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ financial_scenario_gui_port }}/"
    method: GET
    status_code: 200
  register: gui_health
  retries: 12
  delay: 5
  until: gui_health.status == 200
  changed_when: false
