---
# Same host-NFS-mount + bind-mount split as financial_scenario_backup (see that role's own
# comment): an unprivileged LXC cannot issue the NFS mount syscall itself, so the PVE host
# mounts the Synology share (proxmox_mounts role) and pve-service-deploy bind-mounts it to
# hermes_backup_path via service_mountpoints in the environment tfvars. This role only
# verifies the destination and installs the snapshot script + timer.
- name: Verify backup destination is the bind-mounted NAS share
  ansible.builtin.command: "findmnt --target {{ hermes_backup_path }}"
  register: hermes_backup_findmnt
  changed_when: false
  failed_when: hermes_backup_findmnt.rc != 0

- name: Deploy backup script
  ansible.builtin.template:
    src: backup_hermes.sh.j2
    dest: /usr/local/bin/backup_hermes.sh
    mode: '0755'
    owner: root
    group: root

- name: Create systemd service for hermes backup
  ansible.builtin.copy:
    dest: /etc/systemd/system/hermes-backup.service
    content: |
      [Unit]
      Description=Hermes Backup Service
      After=docker.service network.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/backup_hermes.sh
      User=root
    mode: '0644'
  notify: Reload systemd

- name: Create systemd timer for hermes backup
  ansible.builtin.copy:
    dest: /etc/systemd/system/hermes-backup.timer
    content: |
      [Unit]
      Description=Run hermes backup daily

      [Timer]
      OnCalendar={{ hermes_backup_schedule }}
      Persistent=true

      [Install]
      WantedBy=timers.target
    mode: '0644'
  notify: Reload systemd

- name: Enable and start hermes backup timer
  ansible.builtin.systemd:
    name: hermes-backup.timer
    state: started
    enabled: true
