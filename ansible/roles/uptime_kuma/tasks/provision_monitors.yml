---
- name: Provision monitors
  ansible.builtin.uri:
    url: "{{ uptime_kuma_api_url }}/api/monitor"
    method: POST
    headers:
      Authorization: "Bearer {{ uptime_kuma_auth_token }}"
    body_format: json
    body:
      name: "{{ item.name }}"
      type: "{{ item.type }}"
      url: "{{ item.url }}"
      interval: "{{ item.interval }}"
      maxretries: 3
      retryInterval: 60
      active: true
      notificationIDList:
        - 1  # Default SMTP notification
    status_code: 200
  loop: "{{ monitoring_targets }}"
  when: item.name not in existing_monitor_names
  no_log: false
