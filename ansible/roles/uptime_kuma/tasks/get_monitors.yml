---
- name: Get existing monitors
  ansible.builtin.uri:
    url: "{{ uptime_kuma_api_url }}/api/monitor"
    method: GET
    headers:
      Authorization: "Bearer {{ uptime_kuma_auth_token }}"
    return_content: true
  register: existing_monitors
  changed_when: false

- name: Extract monitor names
  ansible.builtin.set_fact:
    existing_monitor_names: "{{ existing_monitors.json | map(attribute='name') | list }}"
