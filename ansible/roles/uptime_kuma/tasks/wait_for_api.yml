---
- name: Wait for Uptime Kuma API to be ready
  ansible.builtin.uri:
    url: "{{ uptime_kuma_api_url }}/api/status"
    method: GET
    status_code: 200
  register: api_status
  until: api_status.status == 200
  retries: "{{ uptime_kuma_api_max_retries }}"
  delay: "{{ uptime_kuma_api_retry_delay }}"
