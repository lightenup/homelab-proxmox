---
- name: Check if Uptime Kuma setup is complete
  ansible.builtin.uri:
    url: "{{ uptime_kuma_api_url }}/api/status"
    method: GET
    return_content: true
    status_code: [200, -1]  # Accept any status
  register: setup_status
  changed_when: false
  failed_when: false  # Don't fail on errors

- name: Set setup status fact
  ansible.builtin.set_fact:
    uptime_kuma_needs_setup: "{{ (setup_status.json is not defined) or (setup_status.json.setupDone is not defined) or (not setup_status.json.setupDone) }}"
