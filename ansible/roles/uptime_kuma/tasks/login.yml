---
- name: Login to Uptime Kuma API
  ansible.builtin.uri:
    url: "{{ uptime_kuma_api_url }}/api/login"
    method: POST
    body_format: json
    body:
      username: "{{ uptime_kuma_admin_user }}"
      password: "{{ uptime_kuma_admin_password }}"
    status_code: 200
    return_content: true
  register: login_response
  no_log: true

- name: Extract auth token
  ansible.builtin.set_fact:
    uptime_kuma_auth_token: "{{ login_response.json.token }}"
  no_log: true
