---
- name: Get existing SMTP notifications
  ansible.builtin.uri:
    url: "{{ uptime_kuma_api_url }}/api/notification"
    method: GET
    headers:
      Authorization: "Bearer {{ uptime_kuma_auth_token }}"
    return_content: true
  register: existing_notifications
  changed_when: false

- name: Check if SMTP notification exists
  ansible.builtin.set_fact:
    smtp_notification_exists: "{{ existing_notifications.json | selectattr('type', 'equalto', 'smtp') | list | length > 0 }}"

- name: Configure SMTP notification
  ansible.builtin.uri:
    url: "{{ uptime_kuma_api_url }}/api/notification"
    method: POST
    headers:
      Authorization: "Bearer {{ uptime_kuma_auth_token }}"
    body_format: json
    body:
      name: "Email (SMTP)"
      type: "smtp"
      smtpHost: "{{ smtp_host }}"
      smtpPort: "{{ smtp_port }}"
      smtpSecure: "STARTTLS"
      smtpUsername: "{{ smtp_user }}"
      smtpPassword: "{{ smtp_password }}"
      smtpFrom: "{{ smtp_from }}"
      smtpTo: "{{ smtp_to }}"
      active: true
      default: true
    status_code: 200
  when: not smtp_notification_exists
  no_log: true
