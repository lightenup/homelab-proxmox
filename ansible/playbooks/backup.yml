---
- name: Configure and Run Immich Backup
  hosts: immich
  become: true
  roles:
    - immich_backup
  
  tasks:
    - name: Run backup script
      ansible.builtin.command: /usr/local/bin/backup_immich.sh
      register: backup_output
      changed_when: true
    
    - name: Display backup output
      ansible.builtin.debug:
        var: backup_output.stdout_lines
