---
- name: Configure base for financial-scenario
  hosts: financial-scenario
  become: true
  roles:
    - lxc_base

- name: Configure financial-scenario
  hosts: financial-scenario
  become: true
  roles:
    - geerlingguy.docker
    - financial_scenario
    - role: service_backup
      service_backup_name: financial-scenario
      when: (deploy_environment | default('prod')) != 'lab'
