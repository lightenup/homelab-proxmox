---
- name: Configure base for Reverse Proxy
  hosts: reverse_proxy
  become: true
  roles:
    - lxc_base

- name: Configure Reverse Proxy
  hosts: reverse_proxy
  become: true
  roles:
    - reverse_proxy
    # fail2ban + metrics exporter (:9191). Deployed as part of this service so a
    # rebuild of the LXC doesn't silently drop it (previously only installed by the
    # standalone playbooks/fail2ban.yml, which the gated pipeline never runs).
    - fail2ban
