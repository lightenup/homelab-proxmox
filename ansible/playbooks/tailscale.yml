---
- name: Configure Tailscale on Proxmox Hosts
  hosts: proxmox_hosts
  become: true
  roles:
    - role: tailscale_router
      tags: [router, install, config]
    - role: tailscale_audit
      tags: [audit, verify]

- name: Manage Tailscale ACLs
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all/vault.yml
    - ../group_vars/all/vars.yml
  roles:
    - role: tailscale_acl
      tags: [acl, policy]
