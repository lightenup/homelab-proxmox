---
- name: Configure base for Jellyfin
  hosts: jellyfin
  become: true
  roles:
    - lxc_base

- name: Configure Jellyfin
  hosts: jellyfin
  become: true
  vars:
    assertion_results: []

  pre_tasks:
    - name: Initialize assertion results
      ansible.builtin.set_fact:
        assertion_results: []
  roles:
    - shared_nfs_mount
    - jellyfin
    - role: service_backup
      service_backup_name: jellyfin
      when: (deploy_environment | default('prod')) != 'lab'
    # fail2ban + metrics exporter (:9191). Deployed as part of this service so a
    # rebuild of the LXC doesn't silently drop it (previously only installed by the
    # standalone playbooks/fail2ban.yml, which the gated pipeline never runs).
    - fail2ban
    - role: assertion_utils
      vars:
        phase: workload
