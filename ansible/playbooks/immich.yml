---
- name: Configure base for Immich
  hosts: immich
  become: true
  roles:
    - lxc_base

- name: Configure Immich
  hosts: immich
  become: true
  vars:
    immich_require_nas_mount: "{{ (deploy_environment | default('prod')) != 'lab' }}"
  roles:
    - geerlingguy.docker
    - immich
    - immich_backup
