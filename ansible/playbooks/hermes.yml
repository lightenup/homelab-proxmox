---
- name: Configure base for hermes
  hosts: hermes
  become: true
  roles:
    - lxc_base

- name: Configure hermes
  hosts: hermes
  become: true
  roles:
    - geerlingguy.docker
    - hermes
    - role: service_backup
      service_backup_name: hermes
      when: (deploy_environment | default('prod')) != 'lab'
