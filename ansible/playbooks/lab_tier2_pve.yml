---
- name: Lab Tier 2 - Proxmox VE Install & Verification
  hosts: lab
  become: true
  vars:
    pve_repository_url: "http://download.proxmox.com/debian/pve"
    pve_dist: "trixie"
    # Trixie key not yet available, trying Bookworm key as fallback/placeholder
    pve_key_url: "http://download.proxmox.com/debian/proxmox-release-bookworm.gpg"
    pve_keyring_path: "/usr/share/keyrings/proxmox-release-trixie.gpg"
    assertion_results: []

  tasks:
    - name: Initialize assertion results
      set_fact:
        assertion_results: []

    # -------------------------------------------------------------------------
    # Setup Hostname & Hosts
    # -------------------------------------------------------------------------
    - name: Set hostname to inventory hostname
      hostname:
        name: "{{ inventory_hostname }}"

    - name: Ensure hostname in /etc/hosts
      lineinfile:
        path: /etc/hosts
        regexp: "^{{ ansible_facts['default_ipv4']['address'] }}.*{{ inventory_hostname }}"
        line: "{{ ansible_facts['default_ipv4']['address'] }} {{ inventory_hostname }}.lab.local {{ inventory_hostname }} pvelocalhost"
        state: present

    # -------------------------------------------------------------------------
    # Guards
    # -------------------------------------------------------------------------
    - name: GUARD-001 - Check Inventory
      block:
        - name: Assert inventory is lab
          assert:
            that:
              - lab_inventory is defined
              - lab_inventory == true
            fail_msg: "This playbook must only be run against the lab inventory."
      rescue:
        - name: Handle GUARD-001 failure
          debug:
            msg: "GUARD-001 failed: {{ ansible_failed_result.msg | default('Assertion failed') }}"
      always:
        - name: Record GUARD-001 result
          set_fact:
            assertion_results: "{{ assertion_results + [{
              'id': 'GUARD-001',
              'status': 'PASS' if (lab_inventory is defined and lab_inventory == true) else 'FAIL',
              'description': 'Verify playbook is running against lab inventory',
              'details': 'Inventory check passed' if (lab_inventory is defined and lab_inventory == true) else 'Inventory check failed'
            }] }}"

    - name: GUARD-002 - Check Hostname Pattern
      block:
        - name: Assert hostname pattern
          assert:
            that:
              - inventory_hostname is match('^lab-pve-.*')
            fail_msg: "Hostname {{ inventory_hostname }} does not match lab pattern."
      rescue:
        - name: Handle GUARD-002 failure
          debug:
            msg: "GUARD-002 failed: {{ ansible_failed_result.msg | default('Assertion failed') }}"
      always:
        - name: Record GUARD-002 result
          set_fact:
            assertion_results: "{{ assertion_results + [{
              'id': 'GUARD-002',
              'status': 'PASS' if (inventory_hostname is match('^lab-pve-.*')) else 'FAIL',
              'description': 'Verify hostname matches lab pattern',
              'details': 'Hostname ' + inventory_hostname + ' matches pattern' if (inventory_hostname is match('^lab-pve-.*')) else 'Hostname does not match pattern'
            }] }}"

    - name: GUARD-003 - Check OS
      block:
        - name: Assert OS is Debian 13
          assert:
            that:
              - ansible_facts['distribution'] == 'Debian'
              - ansible_facts['distribution_major_version'] == '13'
            fail_msg: "Target OS must be Debian 13 (Trixie). Found {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}."
      rescue:
        - name: Handle GUARD-003 failure
          debug:
            msg: "GUARD-003 failed: {{ ansible_failed_result.msg | default('Assertion failed') }}"
      always:
        - name: Record GUARD-003 result
          set_fact:
            assertion_results: "{{ assertion_results + [{
              'id': 'GUARD-003',
              'status': 'PASS' if (ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_major_version'] == '13') else 'FAIL',
              'description': 'Verify OS is Debian 13',
              'details': 'OS is ' + ansible_facts['distribution'] + ' ' + ansible_facts['distribution_major_version']
            }] }}"

    # -------------------------------------------------------------------------
    # Pre-Configuration
    # -------------------------------------------------------------------------
    - name: Configure needrestart to automatic
      lineinfile:
        path: /etc/needrestart/needrestart.conf
        regexp: '^$nrconf{restart}'
        line: '{restart} = "a";'
        create: true

    - name: Preseed postfix (main_mailer_type)
      debconf:
        name: postfix
        question: postfix/main_mailer_type
        value: 'Local only'
        vtype: select

    - name: Preseed postfix (mailname)
      debconf:
        name: postfix
        question: postfix/mailname
        value: "{{ inventory_hostname }}.lab.local"
        vtype: string

    # -------------------------------------------------------------------------
    # Repo Setup
    # -------------------------------------------------------------------------
    - name: Install Prerequisites
      apt:
        name:
          - wget
          - curl
          - gnupg
        state: present
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive
      retries: 3
      delay: 10
      register: apt_res
      until: apt_res is success

    - name: Download Proxmox Key (from Keyserver)
      shell: |
        gpg --keyserver keyserver.ubuntu.com --recv-keys 24B30F06ECC1836A4E5EFECBA7BCD1420BFE778E
        gpg --export 24B30F06ECC1836A4E5EFECBA7BCD1420BFE778E > {{ pve_keyring_path }}
      args:
        creates: "{{ pve_keyring_path }}"

    - name: Ensure Keyring Permissions
      file:
        path: "{{ pve_keyring_path }}"
        mode: '0644'

    - name: Add Proxmox Repository
      apt_repository:
        repo: "deb [signed-by={{ pve_keyring_path }}] {{ pve_repository_url }} {{ pve_dist }} pve-no-subscription"
        filename: pve-install-repo
        state: present

    - name: Remove Enterprise Repository
      file:
        path: /etc/apt/sources.list.d/pve-enterprise.list
        state: absent

    - name: Validate Repository Availability
      command: apt-cache policy
      register: apt_policy
      changed_when: false
      failed_when: "'pve-no-subscription' not in apt_policy.stdout"

    # -------------------------------------------------------------------------
    # Install
    # -------------------------------------------------------------------------
    - name: Preseed grub-pc (install_devices)
      debconf:
        name: grub-pc
        question: grub-pc/install_devices
        value: /dev/sda
        vtype: multiselect

    - name: Preseed grub-pc (install_devices_empty)
      debconf:
        name: grub-pc
        question: grub-pc/install_devices_empty
        value: "false"
        vtype: boolean

    - name: Install Proxmox VE and Dependencies
      apt:
        name:
          - proxmox-ve
          - postfix
          - open-iscsi
        state: present
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive
      async: 1800           # bound long-running install to 30 minutes
      poll: 15              # poll periodically so hung ssh/control sockets don’t stall forever
      retries: 3
      delay: 10
      register: apt_res
      until: apt_res is success

    # -------------------------------------------------------------------------
    # PVE Assertions (PVE-001 to PVE-005)
    # -------------------------------------------------------------------------
    - name: PVE-001 - Verify PVE packages installed
      block:
        - name: Check installed packages
          shell: dpkg -l | grep -E 'pve-manager|pve-kernel' | wc -l
          register: pve_packages_check
          changed_when: false
        
        - name: Assert PVE packages
          assert:
            that:
              - pve_packages_check.stdout|int >= 2
            fail_msg: "Missing required PVE packages (pve-manager, pve-kernel)"
      rescue:
        - name: Handle PVE-001 failure
          debug:
            msg: "PVE-001 failed: {{ ansible_failed_result.msg | default('Assertion failed') }}"
      always:
        - name: Record PVE-001 result
          set_fact:
            assertion_results: "{{ assertion_results + [{
              'id': 'PVE-001',
              'status': 'PASS' if (pve_packages_check is defined and pve_packages_check.stdout|int >= 2) else 'FAIL',
              'description': 'Proxmox VE packages installed',
              'details': 'pve-manager and pve-kernel packages found' if (pve_packages_check is defined and pve_packages_check.stdout|int >= 2) else 'Missing required PVE packages'
            }] }}"

    # -------------------------------------------------------------------------
    # Network Configuration
    # -------------------------------------------------------------------------
    - name: Purge Cloud-Init to prevent network interference
      apt:
        name: cloud-init
        state: absent
        purge: true

    - name: Remove Netplan configuration
      file:
        path: /etc/netplan
        state: absent

    - name: Disable systemd-networkd
      systemd:
        name: systemd-networkd
        state: stopped
        enabled: false
      ignore_errors: true

    - name: Ensure /etc/network/interfaces.d is empty
      file:
        path: /etc/network/interfaces.d
        state: absent

    - name: Recreate /etc/network/interfaces.d
      file:
        path: /etc/network/interfaces.d
        state: directory
        mode: '0755'

    - name: Ensure ifupdown2 is installed
      apt:
        name: ifupdown2
        state: present

    - name: Ensure networking service is enabled
      systemd:
        name: networking
        enabled: true

    - name: Configure vmbr0 Bridge
      copy:
        dest: /etc/network/interfaces
        content: |
          auto lo
          iface lo inet loopback

            auto {{ ansible_facts['default_ipv4']['interface'] }}
            iface {{ ansible_facts['default_ipv4']['interface'] }} inet manual

          auto vmbr0
          iface vmbr0 inet static
              address {{ ansible_facts['default_ipv4']['address'] }}
              netmask {{ ansible_facts['default_ipv4']['netmask'] }}
              gateway {{ ansible_facts['default_ipv4']['gateway'] }}
              bridge-ports {{ ansible_facts['default_ipv4']['interface'] }}
              bridge-stp off
              bridge-fd 0
              dns-nameservers 1.1.1.1 8.8.8.8
      register: net_config

    - name: Apply Network Configuration (Restart Networking)
      service:
        name: networking
        state: restarted
      async: 60
      poll: 0
      register: restart_networking

    - name: Wait for connectivity
      wait_for_connection:
        delay: 5
        timeout: 60

    - name: Ensure /etc/resolv.conf is valid
      copy:
        dest: /etc/resolv.conf
        content: |
          nameserver 1.1.1.1
          nameserver 8.8.8.8

    # -------------------------------------------------------------------------
    # PVE Service & Config Assertions
    # -------------------------------------------------------------------------
    - name: PVE-002 - Verify PVE services running
      block:
        - name: Check PVE services
          service:
            name: "{{ item }}"
            state: started
            enabled: true
          loop:
            - pveproxy
            - pvedaemon
            - pve-cluster
          register: pve_services
          
        - name: Assert PVE services
          assert:
            that:
              - item.status.ActiveState == 'active'
            fail_msg: "Service {{ item.item }} is not active"
          loop: "{{ pve_services.results }}"
      rescue:
        - name: Handle PVE-002 failure
          debug:
            msg: "PVE-002 failed: {{ ansible_failed_result.msg | default('Assertion failed') }}"
      always:
        - name: Record PVE-002 result
          set_fact:
            assertion_results: "{{ assertion_results + [{
              'id': 'PVE-002',
              'status': 'PASS' if (pve_services is success) else 'FAIL',
              'description': 'PVE services running',
              'details': 'pveproxy, pvedaemon, pve-cluster services active' if (pve_services is success) else 'One or more PVE services not running'
            }] }}"

    - name: PVE-003 - Verify pmxcfs mounted
      block:
        - name: Check /etc/pve mountpoint
          command: mountpoint -q /etc/pve
          register: pmxcfs_mount
          changed_when: false
          
        - name: Assert pmxcfs mounted
          assert:
            that:
              - pmxcfs_mount.rc == 0
            fail_msg: "/etc/pve is not a mountpoint"
      rescue:
        - name: Handle PVE-003 failure
          debug:
            msg: "PVE-003 failed: {{ ansible_failed_result.msg | default('Assertion failed') }}"
      always:
        - name: Record PVE-003 result
          set_fact:
            assertion_results: "{{ assertion_results + [{
              'id': 'PVE-003',
              'status': 'PASS' if (pmxcfs_mount.rc == 0) else 'FAIL',
              'description': 'pmxcfs mounted at /etc/pve',
              'details': '/etc/pve is a valid mountpoint' if (pmxcfs_mount.rc == 0) else '/etc/pve is not mounted'
            }] }}"

    - name: PVE-004 - Verify API reachable
      block:
        - name: Check API version
          command: pvesh get /version --output-format json
          register: api_check
          changed_when: false
          
        - name: Assert API reachable
          assert:
            that:
              - api_check.rc == 0
            fail_msg: "pvesh API not accessible"
            
        - name: Save API response to evidence
          copy:
            content: "{{ api_check.stdout }}"
            dest: "{{ evidence_dir }}/reports/pve_api_version.json"
          delegate_to: localhost
          become: false
          when: evidence_dir is defined and api_check.rc == 0
      rescue:
        - name: Handle PVE-004 failure
          debug:
            msg: "PVE-004 failed: {{ ansible_failed_result.msg | default('Assertion failed') }}"
      always:
        - name: Record PVE-004 result
          set_fact:
            assertion_results: "{{ assertion_results + [{
              'id': 'PVE-004',
              'status': 'PASS' if (api_check.rc == 0) else 'FAIL',
              'description': 'pvesh API reachable',
              'details': 'pvesh API returned version data' if (api_check.rc == 0) else 'pvesh API not accessible'
            }] }}"

    - name: PVE-005 - Verify PVE version
      block:
        - name: Capture PVE Version
          command: pveversion
          register: pve_version_out
          changed_when: false
          
        - name: Assert PVE version
          assert:
            that:
              - pve_version_out.rc == 0
              - "'pve-manager' in pve_version_out.stdout"
            fail_msg: "pveversion command failed or output missing pve-manager"
            
        - name: Save pveversion output to evidence
          copy:
            content: "{{ pve_version_out.stdout }}"
            dest: "{{ evidence_dir }}/reports/pveversion.txt"
          delegate_to: localhost
          become: false
          when: evidence_dir is defined and pve_version_out.rc == 0
      rescue:
        - name: Handle PVE-005 failure
          debug:
            msg: "PVE-005 failed: {{ ansible_failed_result.msg | default('Assertion failed') }}"
      always:
        - name: Record PVE-005 result
          set_fact:
            assertion_results: "{{ assertion_results + [{
              'id': 'PVE-005',
              'status': 'PASS' if (pve_version_out.rc == 0 and 'pve-manager' in pve_version_out.stdout) else 'FAIL',
              'description': 'pveversion reports expected version',
              'details': 'pveversion output contains pve-manager' if (pve_version_out.rc == 0 and 'pve-manager' in pve_version_out.stdout) else 'pveversion command failed'
            }] }}"

    # -------------------------------------------------------------------------
    # Network Validation Checks (NET-001 through NET-004)
    # -------------------------------------------------------------------------
    - name: NET-005 - DNS resolution check
      block:
        - name: Check DNS resolution
          shell: getent hosts deb.debian.org
          register: dns_check
          changed_when: false
          
        - name: Assert DNS resolution
          assert:
            that:
              - dns_check.rc == 0
            fail_msg: "DNS resolution failed for deb.debian.org"
      rescue:
        - name: Handle NET-005 failure
          debug:
            msg: "NET-005 failed: {{ ansible_failed_result.msg | default('Assertion failed') }}"
      always:
        - name: Record NET-005 result
          set_fact:
            assertion_results: "{{ assertion_results + [{
              'id': 'NET-005',
              'status': 'PASS' if (dns_check.rc == 0) else 'FAIL',
              'description': 'DNS resolution working',
              'details': 'Successfully resolved deb.debian.org' if (dns_check.rc == 0) else 'DNS resolution failed'
            }] }}"

    - name: NET-006 - Internet connectivity check
      block:
        - name: Check Internet connectivity
          uri:
            url: https://deb.debian.org
            method: HEAD
            timeout: 10
          register: inet_check
          
        - name: Assert Internet connectivity
          assert:
            that:
              - inet_check.status == 200
            fail_msg: "Failed to reach https://deb.debian.org"
      rescue:
        - name: Handle NET-006 failure
          debug:
            msg: "NET-006 failed: {{ ansible_failed_result.msg | default('Assertion failed') }}"
      always:
        - name: Record NET-006 result
          set_fact:
            assertion_results: "{{ assertion_results + [{
              'id': 'NET-006',
              'status': 'PASS' if (inet_check.status == 200) else 'FAIL',
              'description': 'Internet connectivity working',
              'details': 'Successfully reached https://deb.debian.org' if (inet_check.status == 200) else 'Internet connectivity failed'
            }] }}"

    - name: NET-003 - Check vmbr0 bridge configuration
      block:
        - name: Check vmbr0
          command: ip addr show vmbr0
          register: vmbr0_check
          changed_when: false
          
        - name: Assert vmbr0 config
          assert:
            that:
              - vmbr0_check.rc == 0
              - ansible_facts['default_ipv4']['address'] in vmbr0_check.stdout
            fail_msg: "vmbr0 not configured or missing IP {{ ansible_facts['default_ipv4']['address'] }}"
            
        - name: Save vmbr0 configuration to evidence
          copy:
            content: "{{ vmbr0_check.stdout }}"
            dest: "{{ evidence_dir }}/reports/vmbr0_config.txt"
          delegate_to: localhost
          become: false
          when: evidence_dir is defined and vmbr0_check.rc == 0
      rescue:
        - name: Handle NET-003 failure
          debug:
            msg: "NET-003 failed: {{ ansible_failed_result.msg | default('Assertion failed') }}"
      always:
        - name: Record NET-003 result
          set_fact:
            assertion_results: "{{ assertion_results + [{
              'id': 'NET-003',
              'status': 'PASS' if (vmbr0_check.rc == 0 and ansible_facts['default_ipv4']['address'] in vmbr0_check.stdout) else 'FAIL',
              'description': 'vmbr0 bridge configured with expected IP',
                'details': (vmbr0_check.rc == 0 and ansible_facts['default_ipv4']['address'] in vmbr0_check.stdout)
                  | ternary('vmbr0 bridge configured with ' ~ ansible_facts['default_ipv4']['address'], 'vmbr0 bridge not configured correctly')
            }] }}"

    - name: NET-004 - Test SSH connectivity to lab VM
      block:
        - name: Check SSH port
          wait_for:
            host: "{{ ansible_facts['default_ipv4']['address'] }}"
            port: 22
            timeout: 10
          register: ssh_check
          
        - name: Assert SSH connectivity
          assert:
            that:
              - ssh_check is success
            fail_msg: "SSH port 22 not reachable on {{ ansible_facts['default_ipv4']['address'] }}"
      rescue:
        - name: Handle NET-004 failure
          debug:
            msg: "NET-004 failed: {{ ansible_failed_result.msg | default('Assertion failed') }}"
      always:
        - name: Record NET-004 result
          set_fact:
            assertion_results: "{{ assertion_results + [{
              'id': 'NET-004',
              'status': 'PASS' if (ssh_check is success) else 'FAIL',
              'description': 'Lab VM reachable via SSH',
                'details': (ssh_check is success)
                  | ternary('SSH port 22 reachable on ' ~ ansible_facts['default_ipv4']['address'], 'SSH connectivity check failed')
            }] }}"

    # -------------------------------------------------------------------------
    # Tier 2 Plus: Nested Workload (VM + LXC)
    # -------------------------------------------------------------------------
    - name: Tier 2 Plus - Nested Workload
      block:
        # NEST-001: Check KVM module supports nesting
        - name: NEST-001 - Check KVM nesting support
          block:
            - name: Check KVM module
              shell: |
                if lsmod | grep -q kvm_intel; then
                  cat /sys/module/kvm_intel/parameters/nested
                elif lsmod | grep -q kvm_amd; then
                  cat /sys/module/kvm_amd/parameters/nested
                else
                  echo "N"
                fi
              register: kvm_nesting_check
              changed_when: false
              
            - name: Assert KVM nesting
              assert:
                that:
                  - kvm_nesting_check.stdout|trim in ['Y', '1']
                fail_msg: "KVM nesting not enabled"
          rescue:
            - name: Handle NEST-001 failure
              debug:
                msg: "NEST-001 failed: {{ ansible_failed_result.msg | default('Assertion failed') }}"
          always:
            - name: Record NEST-001 result
              set_fact:
                assertion_results: "{{ assertion_results + [{
                  'id': 'NEST-001',
                  'status': 'PASS' if (kvm_nesting_check.stdout|trim in ['Y', '1']) else 'FAIL',
                  'description': 'Host KVM module supports nesting',
                  'details': 'KVM nesting enabled (' + kvm_nesting_check.stdout|trim + ')' if (kvm_nesting_check.stdout|trim in ['Y', '1']) else 'KVM nesting not enabled'
                }] }}"
        
        # NEST-002: Check /dev/kvm exists
        - name: NEST-002 - Check /dev/kvm exists
          block:
            - name: Check /dev/kvm
              stat:
                path: /dev/kvm
              register: kvm_device_check
              
            - name: Assert /dev/kvm exists
              assert:
                that:
                  - kvm_device_check.stat.exists
                fail_msg: "/dev/kvm device not found"
          rescue:
            - name: Handle NEST-002 failure
              debug:
                msg: "NEST-002 failed: {{ ansible_failed_result.msg | default('Assertion failed') }}"
          always:
            - name: Record NEST-002 result
              set_fact:
                assertion_results: "{{ assertion_results + [{
                  'id': 'NEST-002',
                  'status': 'PASS' if (kvm_device_check.stat.exists) else 'FAIL',
                  'description': 'Guest /dev/kvm exists and accessible',
                  'details': '/dev/kvm device found and accessible' if (kvm_device_check.stat.exists) else '/dev/kvm device not found'
                }] }}"
      
        # 1. Nested VM (KVM Smoke Test)
        - name: Create Nested VM (KVM Check)
          command: >
            qm create 100
            --name nested-kvm
            --memory 512
            --net0 virtio,bridge=vmbr0
            --scsihw virtio-scsi-pci
          register: vm_create
          failed_when: false

        - name: Start Nested VM
          command: qm start 100
          register: vm_start
          failed_when: false

        - name: Wait for VM Running State
          command: qm status 100
          register: vm_status
          retries: 5
          delay: 2
          until: "'status: running' in vm_status.stdout"
          failed_when: false

        # WORK-001: Nested VM running
        - name: WORK-001 - Verify Nested VM running
          block:
            - name: Assert Nested VM running
              assert:
                that:
                  - "'status: running' in vm_status.stdout"
                fail_msg: "Nested VM 100 failed to start"
          rescue:
            - name: Handle WORK-001 failure
              debug:
                msg: "WORK-001 failed: {{ ansible_failed_result.msg | default('Assertion failed') }}"
          always:
            - name: Record WORK-001 result
              set_fact:
                assertion_results: "{{ assertion_results + [{
                  'id': 'WORK-001',
                  'status': 'PASS' if ('status: running' in vm_status.stdout) else 'FAIL',
                  'description': 'Nested VM (KVM) started successfully',
                  'details': 'Nested VM 100 is running' if ('status: running' in vm_status.stdout) else 'Nested VM failed to start'
                }] }}"

        # 2. Nested LXC (Network Check)
        - name: Download LXC Template
          command: pveam download local debian-12-standard_12.12-1_amd64.tar.zst
          args:
            creates: /var/lib/vz/template/cache/debian-12-standard_12.12-1_amd64.tar.zst
          register: lxc_download
          failed_when: false

        - name: Check if Nested LXC exists
          command: pct config 101
          register: lxc_exists
          failed_when: false
          changed_when: false

        - name: Create Nested LXC (if missing)
          command: >
            pct create 101 /var/lib/vz/template/cache/debian-12-standard_12.12-1_amd64.tar.zst
            --hostname nested-lxc
            --memory 256
            --net0 name=eth0,bridge=vmbr0,ip=dhcp
            --features nesting=1,keyctl=1
          when: lxc_exists.rc != 0
          register: lxc_create

        - name: Ensure Nested LXC features (idempotency)
          command: pct set 101 --features nesting=1,keyctl=1
          when: lxc_exists.rc == 0
          register: lxc_update

        - name: Capture LXC Config
          command: pct config 101
          register: lxc_config_out
          changed_when: false
          ignore_errors: true

        - name: Ensure workload evidence directory exists
          file:
            path: "{{ evidence_dir }}/reports/workload"
            state: directory
            mode: '0755'
          delegate_to: localhost
          become: false
          when: evidence_dir is defined

        - name: Save LXC Config Evidence
          copy:
            content: "{{ lxc_config_out.stdout }}"
            dest: "{{ evidence_dir }}/reports/workload/CT-101-config.txt"
          delegate_to: localhost
          become: false
          when: evidence_dir is defined

        - name: Start Nested LXC
          command: pct start 101
          register: lxc_start
          failed_when: false

        - name: Wait for LXC Running State
          command: pct status 101
          register: lxc_status
          retries: 5
          delay: 2
          until: "'status: running' in lxc_status.stdout"
          failed_when: false

        # WORK-002: Nested LXC running
        - name: WORK-002 - Verify Nested LXC running
          block:
            - name: Assert Nested LXC running
              assert:
                that:
                  - "'status: running' in lxc_status.stdout"
                fail_msg: "Nested LXC 101 failed to start"
          rescue:
            - name: Handle WORK-002 failure (Diagnostics)
              block:
                - name: Run pct start for logs
                  command: pct start 101
                  register: pct_start_diag
                  ignore_errors: true
                
                - name: Get journal
                  command: journalctl -u pve-container --no-pager -n 500
                  register: journal_diag
                  ignore_errors: true

                - name: Get active tasks
                  command: cat /var/log/pve/tasks/active
                  register: tasks_diag
                  ignore_errors: true

                - name: Save WORK-002 Evidence
                  copy:
                    content: |
                      PCT START:
                      {{ pct_start_diag.stdout }}
                      {{ pct_start_diag.stderr }}
                      
                      JOURNAL:
                      {{ journal_diag.stdout }}
                      
                      TASKS:
                      {{ tasks_diag.stdout }}
                    dest: "{{ evidence_dir }}/reports/workload/WORK-002-diagnostics.txt"
                  delegate_to: localhost
                  become: false
                  when: evidence_dir is defined

            - name: Fail WORK-002
              debug:
                msg: "WORK-002 failed: {{ ansible_failed_result.msg | default('Assertion failed') }}"
          always:
            - name: Record WORK-002 result
              set_fact:
                assertion_results: "{{ assertion_results + [{
                  'id': 'WORK-002',
                  'status': 'PASS' if ('status: running' in lxc_status.stdout) else 'FAIL',
                  'description': 'Nested LXC started successfully',
                  'details': 'Nested LXC 101 is running' if ('status: running' in lxc_status.stdout) else 'Nested LXC failed to start',
                  'evidence_refs': ['reports/workload/CT-101-config.txt'] + (['reports/workload/WORK-002-diagnostics.txt'] if ('status: running' not in lxc_status.stdout) else [])
                }] }}"

        - name: Wait for LXC Network
          pause:
            seconds: 10

        - name: Verify LXC Connectivity (apt-get update)
          command: pct exec 101 -- apt-get update
          register: lxc_net_check
          failed_when: false

        # WORK-003: Nested LXC network connectivity
        - name: WORK-003 - Verify Nested LXC network
          block:
            - name: Assert LXC network
              assert:
                that:
                  - lxc_net_check.rc == 0
                fail_msg: "Nested LXC 101 has no internet connectivity (apt-get update failed)"
          rescue:
            - name: Handle WORK-003 failure
              debug:
                msg: "WORK-003 failed: {{ ansible_failed_result.msg | default('Assertion failed') }}"
            
            - name: Capture WORK-003 failure evidence
              copy:
                content: "{{ lxc_net_check.stdout }}\n{{ lxc_net_check.stderr }}"
                dest: "{{ evidence_dir }}/reports/workload/WORK-003-apt-update.txt"
              delegate_to: localhost
              become: false
              when: evidence_dir is defined
          always:
            - name: Record WORK-003 result
              set_fact:
                assertion_results: "{{ assertion_results + [{
                  'id': 'WORK-003',
                  'status': 'PASS' if (lxc_net_check.rc == 0) else 'FAIL',
                  'description': 'Nested LXC network connectivity',
                  'details': 'apt-get update successful' if (lxc_net_check.rc == 0) else 'apt-get update failed',
                  'evidence_refs': ['reports/workload/WORK-003-apt-update.txt'] if (lxc_net_check.rc != 0) else []
                }] }}"

        - name: Install Python in LXC
          command: pct exec 101 -- bash -c "apt-get update && apt-get install -y python3"
          register: lxc_install
          retries: 3
          delay: 5
          until: lxc_install is success
          failed_when: false

        - name: Start Mini-Service in LXC
          command: pct exec 101 -- bash -c "nohup python3 -m http.server 8080 >/dev/null 2>&1 &"
          async: 10
          poll: 0
          register: lxc_service_start
          failed_when: false
          
        - name: Wait for service startup
          pause:
            seconds: 3

        - name: Verify Connectivity from Lab VM
          command: nc -z -w 5 10.99.0.11 8080
          register: net_check
          retries: 5
          delay: 2
          until: net_check is success
          failed_when: false
          
        # WORK-004: Service reachability from lab VM to nested LXC
        - name: WORK-004 - Verify Service Reachability
          block:
            - name: Assert Service Reachability
              assert:
                that:
                  - net_check is success
                fail_msg: "HTTP service on LXC 101:8080 not reachable from lab VM"
          rescue:
            - name: Handle WORK-004 failure
              debug:
                msg: "WORK-004 failed: {{ ansible_failed_result.msg | default('Assertion failed') }}"
          always:
            - name: Record WORK-004 result
              set_fact:
                assertion_results: "{{ assertion_results + [{
                  'id': 'WORK-004',
                  'status': 'PASS' if (net_check is success) else 'FAIL',
                  'description': 'Service reachability from lab VM to nested LXC verified',
                  'details': 'HTTP service on LXC 101:8080 reachable from lab VM' if (net_check is success) else 'Service reachability check failed'
                }] }}"

        # Cleanup delegated to harness teardown (020)
        - name: Note harness-managed teardown for Nested LXC/VM
          debug:
            msg: "Teardown handled by harness (TEARDOWN-001/002); skipping Ansible destroy."
          changed_when: false

      when: tier2_mode is defined and tier2_mode == 'plus'
      always:
        # Ensure cleanup happens even if tests fail
        - name: Skip redundant cleanup for nested resources (handled by harness)
          debug:
            msg: "Cleanup already performed by harness teardown; no additional Ansible actions executed."
          changed_when: false
          when: tier2_mode is defined and tier2_mode == 'plus'

    # -------------------------------------------------------------------------
    # Reporting
    # -------------------------------------------------------------------------
    - name: Generate Assertion Report
      include_role:
        name: assertion_utils
        tasks_from: generate_report
      vars:
        phase: "tier2"
