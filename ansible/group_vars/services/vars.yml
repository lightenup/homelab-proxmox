  - git
  - htop
  - vim

# Docker configuration (geerlingguy.docker)
docker_users:
  - root
docker_install_compose_plugin: true
docker_compose_package: docker-compose-plugin
docker_compose_package_state: present

# Service versions
nextcloud_version: "34"
nextcloud_exporter_version: "0.9.0"
adguard_exporter_version: "1.2.1"
immich_version: "v3.0.2"
financial_scenario_version: "0.2.2"
market_model_version: "0.3.0"
eurooffice_version: "v9.3.2"
llm_router_version: "v1.83.3-stable"
llm_router_postgres_version: "17.11-alpine3.24"
llm_router_tailscale_version: "v1.102.3"

# Euro-Office Configuration
eurooffice_ip: "192.168.1.219"
eurooffice_port: 80

# Market Model Configuration
market_model_ip: "192.168.1.218"
market_model_api_port: 8000
market_model_mcp_port: 8001

# LLM Router Configuration (spec 064)
# Tailnet-egress is provided by an in-container tailscaled sidecar (userspace networking,
# no TUN device — see specs/064-llm-router/research.md D-102). No Redis: single worker, no
# consumer for shared cross-worker state (FR-014, research D-104).
llm_router_ip: "192.168.1.220"
llm_router_port: 4000

# Alias -> ordered deployment mapping (FR-003). Local deployments MUST use the Mac's
# MagicDNS name (*.ts.net), never a LAN IP (FR-013).
#
# Model names verified against `ollama list` on the Mac 2026-08-30 — llama3.1:8b and
# gemma4:26b are pulled and present. STILL A PLACEHOLDER: <mac-hostname>.<tailnet>.ts.net
# (x2 below) — the Mac's Tailscale CLI is unreachable behind Zscaler, so read the MagicDNS
# name from the menu-bar icon or admin console. Preflight fails loudly if it is left as-is.
# See specs/064-llm-router/quickstart.md § 0b for the full observed environment state.
llm_router_aliases:
  - name: hermes-fast
    fallback_to: hermes-balanced
    context_window_fallback_to: hermes-deep
    deployments:
      - id: fast-local
        tier: local
        provider_model: "ollama_chat/llama3.1:8b"
        api_base: "http://<mac-hostname>.<tailnet>.ts.net:11434"
        context_window: 32768
        health_checked: true
      - id: fast-hosted
        tier: aggregator
        provider_model: "openrouter/meta-llama/llama-3.1-8b-instruct"
        api_key_env: OPENROUTER_API_KEY
        context_window: 32768
        health_checked: false
  - name: hermes-balanced
    fallback_to: hermes-deep
    context_window_fallback_to: hermes-deep
    deployments:
      - id: balanced-local
        tier: local
        provider_model: "ollama_chat/gemma4:26b"
        api_base: "http://<mac-hostname>.<tailnet>.ts.net:11434"
        context_window: 32768
        health_checked: true
      - id: balanced-hosted
        tier: aggregator
        provider_model: "openrouter/google/gemma-3-27b-it"
        api_key_env: OPENROUTER_API_KEY
        context_window: 32768
        health_checked: false
  - name: hermes-deep
    fallback_to: null
    context_window_fallback_to: null
    deployments:
      - id: deep-frontier
        tier: frontier
        provider_model: "anthropic/claude-sonnet-5"
        api_key_env: ANTHROPIC_API_KEY
        context_window: 1000000
        health_checked: false

# Per-client virtual keys (FR-015). Budgets set against Claude Sonnet 5 LIST pricing
# ($3/$15 per 1M tokens) — NOT the introductory rate, which expires 2026-08-31
# (research D-106). Add one entry per real consumer before first deploy.
llm_router_clients:
  - alias: hermes
    key_env: LLM_ROUTER_CLIENT_HERMES_KEY
    max_budget: 20.00
    budget_duration: "30d"
    rpm_limit: 60
  # Synthetic canary (FR-018) — deliberately modelled as an ordinary client, not a special
  # case, so it rides the same virtual-key provisioning, preflight validation and budget
  # headroom math as every other consumer. Its own tiny budget means a canary loop can't
  # itself become the runaway-client scenario FR-010 exists to prevent.
  - alias: canary
    key_env: LLM_ROUTER_CANARY_KEY
    max_budget: 1.00
    budget_duration: "30d"
    rpm_limit: 10

# Gateway-wide backstop cap (FR-010, SC-012). MUST stay above the sum of client budgets
# with real headroom — the preflight fails the deploy otherwise (data-model.md § Gateway Budget).
llm_router_gateway_budget:
  max_budget: 50.00
  budget_duration: "30d"

# Financial Scenario Configuration
# Only the GUI port is published; the GUI nginx proxies /api, /docs and /mcp.
financial_scenario_ip: "192.168.1.217"
financial_scenario_gui_port: 3000

# Financial Scenario Backup Configuration
# Destination is the in-container path of the host-NFS bind-mount (see
# service_mountpoints.financial-scenario in the environment tfvars and the
# /mnt/nas/homelab_financial_scenario host mount in the proxmox_mounts role).
financial_scenario_backup_path: "/mnt/financial-scenario/backups"
financial_scenario_backup_retention_days: 7
financial_scenario_backup_retention_weeks: 4
financial_scenario_backup_retention_months: 6
financial_scenario_backup_schedule: "*-*-* 04:15:00"

# Immich Configuration
immich_vmid: 101
immich_ip: "192.168.1.213"
immich_port: 2283
immich_install_dir: "/opt/immich-app"
immich_data_dir: "/opt/immich-data"
immich_external_library_mounts:
  - host_path: "/mnt/immich-external/photo"
    container_path: "/mnt/immich-external/photo"
    read_only: true

# Immich Backup Configuration
immich_backup_path: "/mnt/immich/backups"
immich_backup_retention_days: 7
immich_backup_retention_weeks: 4
immich_backup_retention_months: 6
immich_backup_schedule: "*-*-* 04:30:00"
immich_db_container_name: "immich_postgres"
immich_restore_test_port: 2284

# Reverse Proxy
reverse_proxy_ip: "192.168.1.211"

# Nextcloud Configuration
nextcloud_ip: "192.168.1.216"
nextcloud_port: 8080

# Jellyfin Configuration
jellyfin_ip: "192.168.1.215"
jellyfin_port: 8096

# AdGuard Configuration
adguard_ip: "192.168.1.210"
adguard_web_port: 3000

# Home Assistant Configuration
homeassistant_ip: "192.168.1.212"
homeassistant_port: 8123

# Reverse Proxy — backend addresses (needed for Caddy site block templates)
# These are defined here because the reverse_proxy host is in the services group,
# not in the nextcloud or monitoring roles' scope.
monitoring_ip: "192.168.1.214"
grafana_port: 3000

# Shared base domain — single source consumed by reverse_proxy role, monitoring_stack role,
# and any other role that needs to construct *.hus-sky.no URLs.
caddy_base_domain: "hus-sky.no"

# Single declarative source for all services (routes, blackbox targets, landing page cards).
# Fields: host (required), ip/port (required when enabled), title, desc, enabled, user_facing.
# ip/port MUST reference existing central vars to keep IPs defined in exactly one place.
caddy_services:
  - host: grafana
    ip: "{{ monitoring_ip }}"
    port: "{{ grafana_port }}"
    title: "Grafana"
    desc: "Monitoring dashboards"
    enabled: true
    user_facing: true
  - host: immich
    ip: "{{ immich_ip }}"
    port: "{{ immich_port }}"
    title: "Immich"
    desc: "Photo library"
    enabled: true
    user_facing: true
  - host: nextcloud
    ip: "{{ nextcloud_ip }}"
    port: "{{ nextcloud_port }}"
    title: "Nextcloud"
    desc: "Files and collaboration"
    enabled: true
    user_facing: true
  - host: jellyfin
    ip: "{{ jellyfin_ip }}"
    port: "{{ jellyfin_port }}"
    title: "Jellyfin"
    desc: "Media server"
    enabled: true
    user_facing: true
  - host: market-model
    ip: "{{ market_model_ip }}"
    port: "{{ market_model_api_port }}"
    mcp_port: "{{ market_model_mcp_port }}"
    title: "Market Model"
    desc: "Market path-set API"
    enabled: true
    user_facing: true
  - host: financial-scenario
    ip: "{{ financial_scenario_ip }}"
    port: "{{ financial_scenario_gui_port }}"
    title: "Financial Scenario"
    desc: "Savings scenario projections"
    enabled: true
    user_facing: true
  - host: eurooffice
    ip: "{{ eurooffice_ip }}"
    port: "{{ eurooffice_port }}"
    title: "Euro-Office"
    desc: "Online document editing"
    enabled: true
    user_facing: true
    proxy_timeout: "300s"
    link: "https://nextcloud.hus-sky.no/apps/files"
  - host: adguard
    ip: "{{ adguard_ip }}"
    port: "{{ adguard_web_port }}"
    title: "AdGuard"
    desc: "DNS ad blocking"
    enabled: false
    user_facing: true
  - host: ha
    ip: "{{ homeassistant_ip }}"
    port: "{{ homeassistant_port }}"
    title: "Home Assistant"
    desc: "Home automation"
    enabled: false
    user_facing: true
