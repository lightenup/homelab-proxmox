# LLM Router Configuration (spec 064)
# No tailscaled sidecar as of 2026-09-15: every backend leg is direct (local tier over the
# LAN, metered tiers over the internet), and FR-008's tailnet reach to the gateway comes
# from the PVE host's 192.168.1.0/24 subnet route. See FR-017 as amended. No Redis: single
# worker, no consumer for shared cross-worker state (FR-014, research D-104).
llm_router_ip: "192.168.1.220"
llm_router_port: 4000

# Alias -> ordered deployment mapping (FR-003). Local deployments MUST address the Mac by
# its stable mDNS .local name, never a DHCP-assigned IP (FR-013 as amended).
#
# Local tier amended 2026-09-14: oMLX on the LAN, not Ollama over the tailnet — the Mac
# the original mapping targeted is being returned. Model IDs verified served by
# `GET /v1/models` on the replacement Mac. Addressed by mDNS per docs/naming-and-mdns.md,
# never a DHCP-assigned IP (FR-013). See specs/064-llm-router/amendment-local-tier-omlx.md.
# See specs/064-llm-router/quickstart.md § 0b for the full observed environment state.
llm_router_aliases:
  # Re-chained 2026-09-15: the metered tiers are gone and every alias resolves to
  # the Mac's own LiteLLM on :4000, not to oMLX on :8000. oMLX stays bound to
  # 127.0.0.1 and is reached only by that LiteLLM, so exactly one process is
  # exposed to the LAN and it is the one that enforces keys and access groups.
  #
  # This withdraws SC-001. With no remote tier there is nothing to fall back to,
  # so the gateway FAILS CLEAN when the Mac is away rather than degrading to a
  # paid backend. That is the trade the simplification buys.
  #
  # fallback_to is null throughout on purpose. Cross-alias fallback within one
  # host is theatre: if the Mac is away every alias is away together, and if a
  # model is merely evicted, silently serving hermes-fast from the 8-bit is
  # SLOWER, which defeats the only reason a caller asked for fast.
  #
  # context_window_fallback_to is likewise null: the Mac's own router already
  # escalates oversized input (its `reasoner` alias falls through to a 262k
  # profile), so duplicating that here would second-guess the hop that can
  # actually act on it. hermes-deep declares 262144 to expose that reach.
  - name: hermes-fast
    fallback_to: null
    context_window_fallback_to: null
    deployments:
      - id: fast-local
        tier: local
        # Mac alias `fast` -> 4-bit sibling, ~59 tok/s.
        provider_model: "openai/fast"
        api_base: "https://xmjdvvw39y2t.local:4443/v1"
        api_key_env: MAC_LITELLM_KEY
        context_window: 131072
        # 1200s on every alias, not just deep. The operating requirement is that nothing in
        # the value chain cuts a request for at least 20 minutes, and a slower model behind
        # `fast` would otherwise be cut by this gateway rather than by the network. The old
        # 180s here existed to bound a dead backend, which cooldown now handles instead.
        timeout: 1200
        health_checked: true
  - name: hermes-balanced
    fallback_to: null
    context_window_fallback_to: null
    deployments:
      - id: balanced-local
        tier: local
        # Mac alias `coder` -> 8-bit, thinking off, validated for code at N=1.
        provider_model: "openai/coder"
        api_base: "https://xmjdvvw39y2t.local:4443/v1"
        api_key_env: MAC_LITELLM_KEY
        context_window: 131072
        timeout: 1200
        health_checked: true
  - name: hermes-deep
    fallback_to: null
    context_window_fallback_to: null
    deployments:
      - id: deep-local
        tier: local
        # Mac alias `reasoner` -> 8-bit with thinking on and an 8k budget.
        # Replaces the Anthropic frontier tier. 262144 because the Mac's router
        # escalates this alias to a 262k profile above its own 131k window.
        # Caveat: that escalation (Mac-side context_window_fallback to qwen-long)
        # runs thinking OFF at temp 0.3, so crossing 131k trades reasoning depth
        # for window. See amendment-drop-metered-tiers.md § The new mapping.
        provider_model: "openai/reasoner"
        api_base: "https://xmjdvvw39y2t.local:4443/v1"
        api_key_env: MAC_LITELLM_KEY
        context_window: 262144
        # 1200s, and the declared context_window above is why. Measured 2026-09-20: a COLD
        # 108k-token prefill on the 8-bit 27B takes ~397s, so at the role's 180s default this
        # alias returned 408 Timeout on a request well inside its own advertised window —
        # the capability was advertised and unreachable. Extrapolating to the full 262k lands
        # near 950s; 1200 leaves margin.
        #
        # The cost is bounded by the cooldown fix: with allowed_fails: 0 a dead backend cools
        # down on the FIRST failure, so exactly one request pays this timeout and everything
        # after it fails in ~0.03s until the cooldown lapses. Before that fix a long timeout
        # here would have been charged to every request.
        #
        # A repeat of an identical prompt is far cheaper — oMLX caches the prefill (3.8s for
        # the same 108k prompt). Size this for the cold path; the warm path is free.
        timeout: 1200
        health_checked: true
  # Added for spec 065 (Hermes retrieval, FR-015/016, research R-002).
  #
  # LANDED 2026-09-21. The Mac-side work (T055/T056) is done: oMLX serves
  # Qwen3-Embedding-0.6B-8bit (1024 dims) and Qwen3-Reranker-0.6B-mxfp8, exposed as the
  # `embed` and `rerank` role aliases in ~/Development/private/local-llm/proxy/litellm-config.yaml,
  # both carrying access_groups: ["local"] so this gateway's key may call them.
  #
  # NOTE the two different providers below, which is not a style inconsistency:
  # LiteLLM's rerank API accepts only a fixed provider set and `openai` is NOT in it —
  # `openai/rerank` fails at CALL time with "Unsupported provider: openai", not at load.
  # `infinity/` is the one that works, for a URL-construction reason: it appends `/rerank`
  # to api_base, and api_base already ends in `/v1`, giving `/v1/rerank` — exactly the route
  # the Mac's LiteLLM serves. `litellm_proxy/` looks like the obvious choice for chaining to
  # another LiteLLM proxy and is WRONG: there is no litellm_proxy.rerank module, so it falls
  # through to a generic path and the Mac answers 404. Verified both, 2026-09-21.
  # Embeddings have no such restriction, so `openai/` stays there and matches every chat
  # alias above.
  #
  # No per-client scope change needed: virtual_keys.yml scopes every client key to ALL
  # `llm_router_aliases` names uniformly, so adding these two here IS "extending the Hermes
  # client key's permitted model scope" (data-model.md's rule 3) — nothing else to edit.
  #
  # health_checked: false, deliberately unlike every chat alias above. The background health
  # check (config.yaml.j2's background_health_check_model_groups) probes with a chat-style
  # call; sending that against an embeddings/rerank-only deployment is untested against this
  # pinned LiteLLM version and risks a noisy, meaningless failure rather than a real signal.
  # Absence is still caught at first real use (FR-009), which is the behaviour that matters.
  - name: hermes-embed
    fallback_to: null
    context_window_fallback_to: null
    deployments:
      - id: embed-local
        tier: local
        provider_model: "openai/embed"
        api_base: "https://xmjdvvw39y2t.local:4443/v1"
        api_key_env: MAC_LITELLM_KEY
        context_window: 8192
        timeout: 300
        health_checked: false
  - name: hermes-rerank
    fallback_to: null
    context_window_fallback_to: null
    deployments:
      - id: rerank-local
        tier: local
        provider_model: "infinity/rerank"
        api_base: "https://xmjdvvw39y2t.local:4443/v1"
        api_key_env: MAC_LITELLM_KEY
        context_window: 8192
        timeout: 300
        health_checked: false

llm_router_clients:
  - alias: hermes
    key_env: LLM_ROUTER_CLIENT_HERMES_KEY
    max_budget: 20.00
    budget_duration: "30d"
    rpm_limit: 60
  # Synthetic canary (FR-018) — deliberately modelled as an ordinary client, not a special
  # case, so it rides the same virtual-key provisioning, preflight validation and budget
  # headroom math as every other consumer. Its own tiny budget means a canary loop can't
  # itself become the runaway-client scenario FR-010 exists to prevent.
  - alias: canary
    key_env: LLM_ROUTER_CANARY_KEY
    max_budget: 1.00
    budget_duration: "30d"
    rpm_limit: 10
  # Agent runtime (spec 083, R-003). Its own client so the agent's inference is metered and
  # capped separately from Open WebUI's `hermes` client — a runaway agent turn cannot exhaust
  # the workspace's allowance, and the gateway can show the two apart.
  - alias: hermes_agent
    key_env: LLM_ROUTER_CLIENT_HERMES_AGENT_KEY
    max_budget: 5.00
    budget_duration: "30d"
    rpm_limit: 20

# Gateway-wide backstop (FR-010, SC-012). Two caps with OPPOSITE sizing rules — see below.
llm_router_gateway_budget:
  # Spend cap. MUST stay ABOVE the sum of client budgets with real headroom: a cap at or
  # below the sum turns normal usage into a homelab-wide outage. Preflight enforces it.
  # Currently inert — local tiers carry no pricing, so spend is 0.0 forever (SC-012 is
  # marked not-verifiable). Kept declared so a priced tier re-arms it.
  max_budget: 50.00
  budget_duration: "30d"

  # Rate cap — added 2026-09-20, backlog 071. This is the ONLY gateway-wide guard that
  # actually bites, because the spend cap above cannot.
  #
  # THE SIZING RULE INVERTS HERE, and that is the whole trap. A gateway-wide rate cap
  # ABOVE the sum of client rates can never bind, so it would be decoration. It has to sit
  # inside this band, which the preflight asserts:
  #
  #     max(client rpm_limit)  <=  gateway rpm_limit  <  sum(client rpm_limit)
  #            60              <=          65         <         90
  #
  # Lower bound: at least the largest single client, so one compliant client is never
  # refused by the GATEWAY cap — its own limit should always bind first, otherwise the
  # two levels are indistinguishable in practice and the error tells the operator nothing.
  #
  # Upper bound: strictly below the sum, so clients COMBINING can trip it. That is the
  # scenario this exists for: `hermes` (60), `canary` (10) and `hermes_agent` (20, spec
  # 083) are each well-behaved and together are 90 requests/minute of real inference
  # against a single Mac.
  #
  # 65 rather than 60 deliberately: at exactly 60, a fully-loaded `hermes` would consume
  # the entire gateway allowance and starve the synthetic canary (FR-018), blinding the
  # monitoring that exists to notice outages. 5 rpm of headroom keeps the canary — which
  # needs one request an hour — able to run while hermes is at full rate.
  rpm_limit: 65

# Hermes Configuration (spec 065) — a self-hosted AI workspace (Open WebUI + a SearXNG
# sidecar) reaching models only through the 064 gateway (contracts/gateway-usage.md).
# hermes_version / hermes_searxng_version live in the versions block above, next to every
# other service's pin (047's consolidation).
hermes_ip: "192.168.1.221"
hermes_port: 8080
hermes_install_dir: "/opt/hermes"
# Agent runtime (spec 083, R-002/R-008). The agent sits on its own compose network with a
# fixed address so the egress allowlist can filter by source /32; the subnet must not
# collide with any existing Docker network on this LXC.
hermes_agent_subnet: "172.30.83.0/24"
hermes_agent_ip: "172.30.83.10"
# Egress probe (spec 083, SC-009): destinations the agent MUST NOT reach. The deploy runs
# a TCP probe from inside the agent container against each of these and fails on any that
# connects. Single central list — LAB and PROD are the same real LXC at the same real IPs
# (backlog 067), so there is no environment split (research R-011 note).
hermes_agent_egress_probe_blocked:
  - name: proxmox-host
    host: "{{ proxmox_host_ip }}"
    port: 8006
  - name: nas
    host: "{{ synology_nas_ip }}"
    port: 5000
  - name: lan-router
    host: "{{ lan_router_ip }}"
    port: 80
# Local disk only — never NFS (FR-019, data-model.md). SQLite, uploaded documents and the
# vector index all live under here; the financial-scenario split, for the same reason
# (locking failures / corruption over NFS for a single-writer SQLite store).
hermes_data_dir: "/opt/hermes-data"

# Capability aliases, never provider model IDs or the inference host directly
# (contracts/gateway-usage.md § What Hermes may do). All three MUST exist in
# llm_router_aliases above — preflight asserts it.
hermes_gateway_base_url: "http://{{ llm_router_ip }}:{{ llm_router_port }}/v1"
hermes_task_alias: "hermes-fast"        # cheapest alias — housekeeping calls (FR-011, R-004)
hermes_embedding_alias: "hermes-embed"
hermes_reranking_alias: "hermes-rerank"

# Embedding batch size. Open WebUI's default is 1 — one gateway request PER CHUNK — which
# measured out as ~2,800 requests for a single 2.5MB PDF and exhausted the client's 60 rpm
# allowance outright, returning "No sources found" (observed 2026-09-21). Measured through the
# full chain the same day: batch 1 = 739ms/chunk, batch 32 = 23ms, batch 128 = 13ms. Request
# overhead dominates entirely, so this is a 57x improvement per chunk AND turns that PDF into
# ~22 requests.
#
# 128 rather than higher: oMLX batches internally at scheduler.embedding_batch_size = 32, so
# this is four internal batches per request — large enough that overhead is gone, small enough
# that one request stays well inside the gateway's per-deployment timeout.
#
# NOTE this is the fix for the rate-limit exhaustion, NOT a bigger allowance.
# contracts/gateway-usage.md is explicit that raising the limit before measuring hides the
# problem; the measurement says the allowance was never the problem.
hermes_embedding_batch_size: 128

# Open WebUI config keys this deployment OWNS, reconciled into its database on every deploy.
#
# Why this exists: these are PersistentConfig keys. Open WebUI seeds them from the environment
# on FIRST boot only and the database wins ever after, so editing the compose and redeploying
# is silently a no-op. Proven by drill T040 — the compose said `hermes-balanced` while the
# running system still said `hermes-fast` — and it bit for real the first time a PDF was
# uploaded, because rag.embedding_batch_size could not be changed from its default of 1.
#
# Deliberately a CURATED list, not everything in the compose file. Each entry is a key whose
# value we have actually needed to change, or whose silent reversion would matter. Adding a
# key here is a small ongoing obligation, so the bar is "would inertness hurt".
#
# Secrets are deliberately ABSENT. rag.openai.api_key and the reranker key were seeded
# correctly on first boot and have never needed changing; managing them here would mean
# putting credentials through another code path for a case that has not occurred.
# One exception (083 R-010): the model connections (openai.api_base_urls/api_keys) must
# change for the agent connection to appear at all, so they are reconciled in a separate
# no_log task fed on stdin ("Reconcile the Open WebUI model connections"), not listed here.
hermes_managed_config:
  # Security posture — a silent reversion here is the one that actually matters (FR-003).
  ui.enable_signup: "{{ hermes_enable_signup }}"
  # Capability aliases: the whole point of FR-013/SC-004 is that these are config changes.
  task.model.external: "{{ hermes_task_alias }}"
  rag.embedding_engine: "openai"
  rag.embedding_model: "{{ hermes_embedding_alias }}"
  rag.reranking_engine: "external"
  rag.reranking_model: "{{ hermes_reranking_alias }}"
  rag.enable_hybrid_search: true
  # The one that cost a drill.
  rag.embedding_batch_size: "{{ hermes_embedding_batch_size | int }}"
  # An integration we do not use and that cannot work here. Persisted, so the env var alone
  # would not turn it off on an existing deploy.
  ollama.enable: false
  # Web search: engine choice must not silently revert to a commercial provider (FR-022).
  web.search.enable: true
  web.search.engine: "searxng"

# Title generation stays ON: pointing TASK_MODEL_EXTERNAL at the cheapest alias already
# bounds its cost (R-004); disabling it as well would drop a real feature to solve a problem
# the alias redirection already solves. Revisit downward if T078's measurement says otherwise.
hermes_enable_title_generation: true

# MCP server registrations (data-model.md § Entity: MCP server registration). Rendered into
# TOOL_SERVER_CONNECTIONS (Open WebUI's env-seeded tool-server list — verified against
# backend/open_webui/config.py and utils/tools.py, 2026-09-20; not documented on
# docs.openwebui.com, which describes only the admin-UI path). `market-model` is the only
# entry at launch (research R-008, decided 2026-09-20) — `financial-scenario` is omitted
# because its MCP secret is baked into a third-party image this repo does not hold.
#
# The `auth: bearer` branch is exercised by NO entry below on purpose. It is still validated
# in preflight (T036) so the schema — not a code change — is what adding a credentialed
# server later costs (FR-013).
hermes_mcp_servers:
  - name: "market-model"
    url: "http://{{ market_model_ip }}:{{ market_model_mcp_port }}/mcp"
    auth: none
    credential_env: null
    enabled: true
  # Re-arm when the personal-financial-scenarios image makes its MCP secret configurable
  # (research R-008). At that point this is the one list entry FR-013 promises:
  # - name: "financial-scenario"
  #   url: "http://{{ financial_scenario_ip }}:{{ financial_scenario_gui_port }}/mcp"
  #   auth: bearer
  #   credential_env: HERMES_MCP_FINANCIAL_SCENARIO_KEY
  #   enabled: true

# Web search (FR-022) — SearXNG as a sidecar in the same compose stack (research R-005), not
# published to the LAN. Reached by Hermes over the compose network only.
hermes_searxng_install_dir: "{{ hermes_install_dir }}/searxng"

# Backup (US-4, data-model.md § Workspace state). Destination is the in-container path of
# the host-NFS bind-mount, the same pattern as financial-scenario (see
# service_mountpoints.hermes in the environment tfvars and proxmox_mounts).
hermes_backup_path: "/mnt/hermes/backups"
hermes_backup_retention_days: 7
hermes_backup_retention_weeks: 4
hermes_backup_retention_months: 6
hermes_backup_schedule: "*-*-* 04:45:00"
# Port for the non-destructive restore drill's throwaway instance
