# Shared vars for service LXCs
service_base_packages:
  - curl
  - git
  - htop
  - vim

# Docker configuration (geerlingguy.docker)
docker_users:
  - root
docker_install_compose_plugin: true
docker_compose_package: docker-compose-plugin
docker_compose_package_state: present

# Financial Scenario Configuration
financial_scenario_ip: "192.168.1.217"
financial_scenario_gui_port: 3000
financial_scenario_api_port: 8000
financial_scenario_mcp_port: 8001
financial_scenario_version: "1.0.0"

# Immich Configuration
immich_vmid: 101
immich_ip: "192.168.1.213"
immich_port: 2283
immich_install_dir: "/opt/immich-app"
immich_data_dir: "/opt/immich-data"
immich_version: "v2.4.0"
immich_external_library_mounts:
  - host_path: "/mnt/immich-external/photo"
    container_path: "/mnt/immich-external/photo"
    read_only: true

# Immich Backup Configuration
immich_backup_path: "/mnt/immich/backups"
immich_backup_retention_days: 7
immich_backup_retention_weeks: 4
immich_backup_retention_months: 6
immich_backup_schedule: "*-*-* 04:30:00"
immich_db_container_name: "immich_postgres"
immich_restore_test_port: 2284

# Reverse Proxy
reverse_proxy_ip: "192.168.1.211"

# Nextcloud Configuration
nextcloud_ip: "192.168.1.216"
nextcloud_port: 8080

# Jellyfin Configuration
jellyfin_ip: "192.168.1.215"
jellyfin_port: 8096

# AdGuard Configuration
adguard_ip: "192.168.1.210"
adguard_web_port: 3000

# Home Assistant Configuration
homeassistant_ip: "192.168.1.212"
homeassistant_port: 8123

# Reverse Proxy — backend addresses (needed for Caddy site block templates)
# These are defined here because the reverse_proxy host is in the services group,
# not in the nextcloud or monitoring roles' scope.
monitoring_ip: "192.168.1.214"
grafana_port: 3000

# Shared base domain — single source consumed by reverse_proxy role, monitoring_stack role,
# and any other role that needs to construct *.hus-sky.no URLs.
caddy_base_domain: "hus-sky.no"

# Single declarative source for all services (routes, blackbox targets, landing page cards).
# Fields: host (required), ip/port (required when enabled), title, desc, enabled, user_facing.
# ip/port MUST reference existing central vars to keep IPs defined in exactly one place.
caddy_services:
  - host: grafana
    ip: "{{ monitoring_ip }}"
    port: "{{ grafana_port }}"
    title: "Grafana"
    desc: "Monitoring dashboards"
    enabled: true
    user_facing: true
  - host: immich
    ip: "{{ immich_ip }}"
    port: "{{ immich_port }}"
    title: "Immich"
    desc: "Photo library"
    enabled: true
    user_facing: true
  - host: nextcloud
    ip: "{{ nextcloud_ip }}"
    port: "{{ nextcloud_port }}"
    title: "Nextcloud"
    desc: "Files and collaboration"
    enabled: true
    user_facing: true
  - host: jellyfin
    ip: "{{ jellyfin_ip }}"
    port: "{{ jellyfin_port }}"
    title: "Jellyfin"
    desc: "Media server"
    enabled: true
    user_facing: true
  - host: adguard
    ip: "{{ adguard_ip }}"
    port: "{{ adguard_web_port }}"
    title: "AdGuard"
    desc: "DNS ad blocking"
    enabled: false
    user_facing: true
  - host: ha
    ip: "{{ homeassistant_ip }}"
    port: "{{ homeassistant_port }}"
    title: "Home Assistant"
    desc: "Home automation"
    enabled: false
    user_facing: true
