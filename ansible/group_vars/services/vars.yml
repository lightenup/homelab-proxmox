# LLM Router Configuration (spec 064)
# No tailscaled sidecar as of 2026-09-15: every backend leg is direct (local tier over the
# LAN, metered tiers over the internet), and FR-008's tailnet reach to the gateway comes
# from the PVE host's 192.168.1.0/24 subnet route. See FR-017 as amended. No Redis: single
# worker, no consumer for shared cross-worker state (FR-014, research D-104).
llm_router_ip: "192.168.1.220"
llm_router_port: 4000

# Alias -> ordered deployment mapping (FR-003). Local deployments MUST address the Mac by
# its stable mDNS .local name, never a DHCP-assigned IP (FR-013 as amended).
#
# Local tier amended 2026-09-14: oMLX on the LAN, not Ollama over the tailnet — the Mac
# the original mapping targeted is being returned. Model IDs verified served by
# `GET /v1/models` on the replacement Mac. Addressed by mDNS per docs/naming-and-mdns.md,
# never a DHCP-assigned IP (FR-013). See specs/064-llm-router/amendment-local-tier-omlx.md.
# See specs/064-llm-router/quickstart.md § 0b for the full observed environment state.
llm_router_aliases:
  # Re-chained 2026-09-15: the metered tiers are gone and every alias resolves to
  # the Mac's own LiteLLM on :4000, not to oMLX on :8000. oMLX stays bound to
  # 127.0.0.1 and is reached only by that LiteLLM, so exactly one process is
  # exposed to the LAN and it is the one that enforces keys and access groups.
  #
  # This withdraws SC-001. With no remote tier there is nothing to fall back to,
  # so the gateway FAILS CLEAN when the Mac is away rather than degrading to a
  # paid backend. That is the trade the simplification buys.
  #
  # fallback_to is null throughout on purpose. Cross-alias fallback within one
  # host is theatre: if the Mac is away every alias is away together, and if a
  # model is merely evicted, silently serving hermes-fast from the 8-bit is
  # SLOWER, which defeats the only reason a caller asked for fast.
  #
  # context_window_fallback_to is likewise null: the Mac's own router already
  # escalates oversized input (its `reasoner` alias falls through to a 262k
  # profile), so duplicating that here would second-guess the hop that can
  # actually act on it. hermes-deep declares 262144 to expose that reach.
  - name: hermes-fast
    fallback_to: null
    context_window_fallback_to: null
    deployments:
      - id: fast-local
        tier: local
        # Mac alias `fast` -> 4-bit sibling, ~59 tok/s.
        provider_model: "openai/fast"
        api_base: "http://xmjdvvw39y2t.local:4000/v1"
        api_key_env: MAC_LITELLM_KEY
        context_window: 131072
        # Fast is the alias whose whole point is latency — a caller asking for it wants an
        # answer or an error, not a long wait. Keeps the role default.
        timeout: 180
        health_checked: true
  - name: hermes-balanced
    fallback_to: null
    context_window_fallback_to: null
    deployments:
      - id: balanced-local
        tier: local
        # Mac alias `coder` -> 8-bit, thinking off, validated for code at N=1.
        provider_model: "openai/coder"
        api_base: "http://xmjdvvw39y2t.local:4000/v1"
        api_key_env: MAC_LITELLM_KEY
        context_window: 131072
        timeout: 300
        health_checked: true
  - name: hermes-deep
    fallback_to: null
    context_window_fallback_to: null
    deployments:
      - id: deep-local
        tier: local
        # Mac alias `reasoner` -> 8-bit with thinking on and an 8k budget.
        # Replaces the Anthropic frontier tier. 262144 because the Mac's router
        # escalates this alias to a 262k profile above its own 131k window.
        # Caveat: that escalation (Mac-side context_window_fallback to qwen-long)
        # runs thinking OFF at temp 0.3, so crossing 131k trades reasoning depth
        # for window. See amendment-drop-metered-tiers.md § The new mapping.
        provider_model: "openai/reasoner"
        api_base: "http://xmjdvvw39y2t.local:4000/v1"
        api_key_env: MAC_LITELLM_KEY
        context_window: 262144
        # 1200s, and the declared context_window above is why. Measured 2026-09-20: a COLD
        # 108k-token prefill on the 8-bit 27B takes ~397s, so at the role's 180s default this
        # alias returned 408 Timeout on a request well inside its own advertised window —
        # the capability was advertised and unreachable. Extrapolating to the full 262k lands
        # near 950s; 1200 leaves margin.
        #
        # The cost is bounded by the cooldown fix: with allowed_fails: 0 a dead backend cools
        # down on the FIRST failure, so exactly one request pays this timeout and everything
        # after it fails in ~0.03s until the cooldown lapses. Before that fix a long timeout
        # here would have been charged to every request.
        #
        # A repeat of an identical prompt is far cheaper — oMLX caches the prefill (3.8s for
        # the same 108k prompt). Size this for the cold path; the warm path is free.
        timeout: 1200
        health_checked: true

llm_router_clients:
  - alias: hermes
    key_env: LLM_ROUTER_CLIENT_HERMES_KEY
    max_budget: 20.00
    budget_duration: "30d"
    rpm_limit: 60
  # Synthetic canary (FR-018) — deliberately modelled as an ordinary client, not a special
  # case, so it rides the same virtual-key provisioning, preflight validation and budget
  # headroom math as every other consumer. Its own tiny budget means a canary loop can't
  # itself become the runaway-client scenario FR-010 exists to prevent.
  - alias: canary
    key_env: LLM_ROUTER_CANARY_KEY
    max_budget: 1.00
    budget_duration: "30d"
    rpm_limit: 10

# Gateway-wide backstop cap (FR-010, SC-012). MUST stay above the sum of client budgets
# with real headroom — the preflight fails the deploy otherwise (data-model.md § Gateway Budget).
llm_router_gateway_budget:
  max_budget: 50.00
  budget_duration: "30d"

# Financial Scenario Configuration
# Only the GUI port is published; the GUI nginx proxies /api, /docs and /mcp.
financial_scenario_ip: "192.168.1.217"
financial_scenario_gui_port: 3000

# Financial Scenario Backup Configuration
# Destination is the in-container path of the host-NFS bind-mount (see
# service_mountpoints.financial-scenario in the environment tfvars and the
# /mnt/nas/homelab_financial_scenario host mount in the proxmox_mounts role).
financial_scenario_backup_path: "/mnt/financial-scenario/backups"
financial_scenario_backup_retention_days: 7
financial_scenario_backup_retention_weeks: 4
financial_scenario_backup_retention_months: 6
financial_scenario_backup_schedule: "*-*-* 04:15:00"

# Immich Configuration
immich_vmid: 101
immich_ip: "192.168.1.213"
immich_port: 2283
immich_install_dir: "/opt/immich-app"
immich_data_dir: "/opt/immich-data"
immich_external_library_mounts:
  - host_path: "/mnt/immich-external/photo"
    container_path: "/mnt/immich-external/photo"
    read_only: true

# Immich Backup Configuration
immich_backup_path: "/mnt/immich/backups"
immich_backup_retention_days: 7
immich_backup_retention_weeks: 4
immich_backup_retention_months: 6
immich_backup_schedule: "*-*-* 04:30:00"
immich_db_container_name: "immich_postgres"
immich_restore_test_port: 2284

# Reverse Proxy
reverse_proxy_ip: "192.168.1.211"

# Nextcloud Configuration
nextcloud_ip: "192.168.1.216"
nextcloud_port: 8080

# Jellyfin Configuration
jellyfin_ip: "192.168.1.215"
jellyfin_port: 8096

# AdGuard Configuration
adguard_ip: "192.168.1.210"
adguard_web_port: 3000

# Home Assistant Configuration
homeassistant_ip: "192.168.1.212"
homeassistant_port: 8123

# Reverse Proxy — backend addresses (needed for Caddy site block templates)
# These are defined here because the reverse_proxy host is in the services group,
# not in the nextcloud or monitoring roles' scope.
monitoring_ip: "192.168.1.214"
grafana_port: 3000

# Shared base domain — single source consumed by reverse_proxy role, monitoring_stack role,
# and any other role that needs to construct *.hus-sky.no URLs.
caddy_base_domain: "hus-sky.no"

# Single declarative source for all services (routes, blackbox targets, landing page cards).
# Fields: host (required), ip/port (required when enabled), title, desc, enabled, user_facing.
# ip/port MUST reference existing central vars to keep IPs defined in exactly one place.
# Landing-page entries that are deliberately NOT reverse-proxied (045-landing-page,
# FR-008 of spec 064). An entry in caddy_services below gets BOTH a public vhost
# ({host}.hus-sky.no, real cert, proxying to {ip}:{port}) AND — if user_facing — a tile.
# The two are coupled: `user_facing: false` still creates the public route, it only hides
# the tile, which is the wrong half for a service that must stay off the internet.
#
# These entries produce a tile and nothing else. No vhost, no DNS name, no route. Used for
# services that should be VISIBLE on the front page while remaining unreachable from
# outside the LAN — the link points somewhere already gated, not at the service.
caddy_landing_links:
  - title: "LLM Router"
    desc: "Local LLM gateway — dashboards in Grafana"
    # Grafana, not the gateway: hus-sky.no is public, and FR-008/SC-007 keep the gateway
    # off the internet. The click-through is gated by Grafana's own auth. Precedent: the
    # eurooffice card already links to Nextcloud rather than to itself.
    link: "https://grafana.hus-sky.no/d/llm-router"
    # Matches the `instance` label of the blackbox probe that llm-router's
    # monitoring_contract.liveness_targets declares, which is what /api/status returns.
    probe: "llm-router-readiness"
    enabled: true

caddy_services:
  - host: grafana
    ip: "{{ monitoring_ip }}"
    port: "{{ grafana_port }}"
    title: "Grafana"
    desc: "Monitoring dashboards"
    enabled: true
    user_facing: true
  - host: immich
    ip: "{{ immich_ip }}"
    port: "{{ immich_port }}"
    title: "Immich"
    desc: "Photo library"
    enabled: true
    user_facing: true
  - host: nextcloud
    ip: "{{ nextcloud_ip }}"
    port: "{{ nextcloud_port }}"
    title: "Nextcloud"
    desc: "Files and collaboration"
    enabled: true
    user_facing: true
  - host: jellyfin
    ip: "{{ jellyfin_ip }}"
    port: "{{ jellyfin_port }}"
    title: "Jellyfin"
    desc: "Media server"
    enabled: true
    user_facing: true
  - host: market-model
    ip: "{{ market_model_ip }}"
    port: "{{ market_model_api_port }}"
    mcp_port: "{{ market_model_mcp_port }}"
    title: "Market Model"
    desc: "Market path-set API"
    enabled: true
    user_facing: true
  - host: financial-scenario
    ip: "{{ financial_scenario_ip }}"
    port: "{{ financial_scenario_gui_port }}"
    title: "Financial Scenario"
    desc: "Savings scenario projections"
    enabled: true
    user_facing: true
  - host: eurooffice
    ip: "{{ eurooffice_ip }}"
    port: "{{ eurooffice_port }}"
    title: "Euro-Office"
    desc: "Online document editing"
    enabled: true
    user_facing: true
    proxy_timeout: "300s"
    link: "https://nextcloud.hus-sky.no/apps/files"
  - host: adguard
    ip: "{{ adguard_ip }}"
    port: "{{ adguard_web_port }}"
    title: "AdGuard"
    desc: "DNS ad blocking"
    enabled: false
    user_facing: true
  - host: ha
    ip: "{{ homeassistant_ip }}"
    port: "{{ homeassistant_port }}"
    title: "Home Assistant"
    desc: "Home automation"
    enabled: false
    user_facing: true
