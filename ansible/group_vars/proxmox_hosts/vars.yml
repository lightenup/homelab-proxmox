# Optional: Opt-in for sensitive data (default: false)
# proxmox_backup_include_tailscale_state: false
# proxmox_backup_include_rclone_conf: false

# Retention policy
proxmox_backup_retention_daily: 30
proxmox_backup_retention_monthly: 12

# Notifications (spec 089): failures are published to ntfy (spec 082 publisher contract).
# The account, topic and token belong to ntfy's `pve_backup` entry in
# roles/ntfy/defaults/main.yml; the token is in group_vars/services/vault.yml and read
# here through the ntfy host so it is defined once. Empty token = notifications off.
proxmox_backup_notify_on_success: false
proxmox_backup_ntfy_url: "https://ntfy.{{ hostvars['ntfy'].caddy_base_domain }}"
proxmox_backup_ntfy_topic: "pve-backup"
proxmox_backup_ntfy_token: "{{ hostvars['ntfy']['ntfy_pve_backup_token'] | default('') }}"
