---
ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

# Estate infrastructure addresses (Constitution: IPs defined centrally, in exactly one
# place). Consumed by the monitoring stack (SNMP/telegraf), the hermes egress probe
# (spec 083) and anything else that needs to name the NAS, the LAN router or the Proxmox
# host.
synology_nas_ip: "192.168.1.109"
lan_router_ip: "192.168.1.1"
proxmox_host_ip: "192.168.1.112"
monitoring_host_ip: "192.168.1.214"
# LAN and tailnet address ranges (spec 092). LAN addresses are DHCP, so login/alert rules
# match the range rather than a literal address (research R3).
lan_cidr: "192.168.1.0/24"
tailnet_cidr: "100.64.0.0/10"

# node_exporter on every LXC (role node_exporter via lxc_base). Single pin (spec 090).
node_exporter_version: "1.12.1"

# Alloy log collector on every host incl. pve, spec 092.
alloy_version: "1.21.2"
# Collector HTTP/metrics port; read by the alloy role and Prometheus' alloy job (spec 092).
alloy_http_port: 12345

# Service backups (091)
# The key is the `backup` label and the stem of the unit, archive and snapshot names. The same
# map drives BackupStale's expected set. `dir` is equal to `mount` or beneath it.
service_backups:
  nextcloud:
    host: nextcloud
    mount: /mnt/nextcloud
    dir: /mnt/nextcloud/backups
    schedule: "*-*-* 04:00:00"
  financial-scenario:
    host: financial-scenario
    mount: /mnt/financial-scenario/backups
    dir: /mnt/financial-scenario/backups
    schedule: "*-*-* 04:15:00"
  immich:
    host: immich
    mount: /mnt/immich
    dir: /mnt/immich/backups
    schedule: "*-*-* 04:30:00"
  hermes:
    host: hermes
    mount: /mnt/hermes/backups
    dir: /mnt/hermes/backups
    schedule: "*-*-* 04:45:00"
  jellyfin:
    host: jellyfin
    mount: /mnt/jellyfin/backups
    dir: /mnt/jellyfin/backups
    schedule: "*-*-* 05:00:00"
  homeassistant:
    host: homeassistant
    mount: /mnt/homeassistant/backups
    dir: /mnt/homeassistant/backups
    schedule: "*-*-* 05:15:00"

# Tailscale Configuration
tailscale_tailnet_name: "-" # Use "-" to automatically detect tailnet from API key
tailscale_safe_mode: true
