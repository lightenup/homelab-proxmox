---
# Monitoring Stack Configuration
# Feature: 017-synology-metrics
# Purpose: Default configuration for Prometheus, Grafana, SNMP Exporter, Alertmanager

# Service versions
prometheus_version: "v3.13.5"  # Upgraded from v3.8.1 (2026-10-22, spec 090)
grafana_version: "13.2.4"  # Upgraded from 12.3.1 (2026-10-22, spec 090)
telegraf_version: "1.40.2"  # Upgraded from 1.37.0 (2026-10-22, spec 090)
alertmanager_version: "v0.34.1"  # Upgraded from v0.30.0 (2026-10-22, spec 090)
blackbox_exporter_version: "v0.29.1"  # Upgraded from v0.28.0 (2026-10-22, spec 090)

# Monitoring LXC
monitoring_ip: "192.168.1.214"
monitoring_hostname: "monitoring"

# Synology NAS targets — synology_nas_ip lives in group_vars/all/vars.yml (central, spec
# 083); the hostname is monitoring-specific.
synology_nas_hostname: "nas.local"

# Prometheus configuration
prometheus_scrape_interval: "30s"
prometheus_scrape_timeout: "10s"
prometheus_retention_time: "15d"
prometheus_port: 9090

# Grafana configuration
grafana_port: 3000
grafana_domain: "grafana.hus-sky.no"
grafana_protocol: "https"
grafana_datasource_name: "Prometheus"
grafana_admin_user: "admin"
# grafana_admin_password → vault.yml

# Telegraf configuration
telegraf_port: 9273
snmp_security_level: "authPriv"
# snmp_username, snmp_auth_protocol, snmp_auth_password,
# snmp_priv_protocol, snmp_priv_password → vault.yml

# Alertmanager configuration
alertmanager_port: 9093
alertmanager_group_wait: "30s"
alertmanager_group_interval: "5m"
alertmanager_repeat_interval: "4h"
smtp_require_tls: true
smtp_port: 587
# smtp_server, smtp_username, smtp_password, smtp_from_address, alert_email_recipient → vault.yml
# pushover_user_key, pushover_api_token → vault.yml (when pushover_enabled=true)
pushover_enabled: true
# ntfy dual delivery (spec 082, contracts/alertmanager-webhook.md). When true, each
# Pushover receiver also posts to the ntfy webhook. Keep false until the template has
# been validated against synthetic payloads (T033, passed 2026-10-17) — a broken template would put
# malformed alerts on the phone for the whole trial window.
# ntfy_alertmanager_token → group_vars/services/vault.yml
ntfy_enabled: true

# Backup configuration
backup_retention_days: 30
backup_schedule_hour: 3
backup_schedule_minute: 0
backup_path: "/mnt/nas/backups/monitoring"

# NFS mount configuration
monitoring_nfs_enabled: false  # Disable until NFS share is configured on Synology
nfs_server: "{{ synology_nas_ip }}"
nfs_export_path: "/volume1/backups"
nfs_mount_point: "/mnt/nas/backups"
nfs_mount_options: "defaults,_netdev,rw,hard,intr,timeo=600,retrans=2"
backup_subdir: "monitoring"

# Docker compose paths
monitoring_base_path: "/opt/monitoring"
compose_file_path: "{{ monitoring_base_path }}/docker-compose.yml"
prometheus_config_path: "{{ monitoring_base_path }}/prometheus"
grafana_provisioning_path: "{{ monitoring_base_path }}/grafana/provisioning"
grafana_dashboards_path: "{{ monitoring_base_path }}/grafana/dashboards"
snmp_config_path: "{{ monitoring_base_path }}/snmp"
alertmanager_config_path: "{{ monitoring_base_path }}/alertmanager"

# Off-inventory scrape targets (rendered by prometheus.yml.j2).
# llm-queue: local-llm repo proxy/llm_queue.py (FINDINGS §38) on the Mac that serves
# oMLX. Metrics-only listener; inference stays on the Mac's loopback. The Mac is a
# laptop: expect `up == 0` whenever it is asleep or off the LAN, so no alert keys
# on `up` for this job. `instance` is a fixed label so the LAN address is not
# what gets published.
prometheus_external_scrape_targets:
  - job_name: "llm-queue"
    address: "192.168.1.177:9464"
    instance: "llm-mac"
    scrape_interval: "15s"
    # The Mac is a laptop that sleeps: without this, generic ServiceDown paged at critical
    # 55 times in 3 days (2026-10-18). Mac-away is reported silently by LlmRouterLocalTierDown.
    alert_on_down: false

# Blackbox exporter configuration
# Feature: 042-monitoring-tier-c (FR-001, FR-003)
blackbox_exporter_port: 9115
# Generated from caddy_services (group_vars/services/vars.yml) — the single source of truth.
# Add/remove services there; this list follows automatically.
blackbox_https_targets: >-
  {{ caddy_services
     | selectattr('enabled')
     | selectattr('user_facing')
     | map(attribute='host')
     | map('regex_replace', '^(.+)$', 'https://\1.' ~ caddy_base_domain)
     | list }}
# Every Caddy name (all ENABLED services, not only user_facing, plus the apex) pinned to the
# reverse proxy in the blackbox container's /etc/hosts. Public DNS answers 192.168.1.211 for
# all of them anyway, but resolving that meant a round trip to 1.1.1.1 over the WAN: three
# 2–3 minute DNS blips on 2026-10-15/16 paged EndpointDown at critical for every site at
# once while Caddy was serving normally. Probes now test Caddy -> TLS -> backend over the
# LAN; public DNS is covered on its own by the blackbox-dns job (PublicDnsResolutionFailing).
# Also covers the contract liveness probes that use public names (hermes, ntfy-health, ...).
blackbox_static_hosts: >-
  {{ ([caddy_base_domain]
      + (caddy_services
         | selectattr('enabled')
         | map(attribute='host')
         | map('regex_replace', '^(.+)$', '\1.' ~ caddy_base_domain)
         | list))
     | map('regex_replace', '$', ':' ~ reverse_proxy_ip)
     | list }}
# Resolvers the blackbox-dns job queries. Mirrors the LXCs' `nameserver` (Terraform), so
# this alerts on the same DNS the services themselves depend on.
blackbox_dns_resolvers:
  - "1.1.1.1"
