[pytest]
pythonpath =
    python/src
testpaths =
    python/tests
# Callers run from the repo root, where testpaths does not apply (rootdir is python/), so pytest
# collects from the current directory. Keep mutmut's mutants/ (copied tests) out of that; the rest
# is pytest's default list.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} mutants
addopts =
    -ra
    --cov=homelab_proxmox_orchestrator.orchestrator
    --cov=homelab_proxmox_orchestrator.evidence
    --cov=homelab_proxmox_orchestrator.summary_from_evidence
    --cov=homelab_proxmox_orchestrator.summary_markdown
    --cov=homelab_proxmox_orchestrator.version_currency
    --cov-report=term-missing
