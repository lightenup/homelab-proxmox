# Mirrors the PROD agent-config.yaml.j2 where it matters for memory: custom provider through
# the gateway (here: the logging proxy), built-in memory on, approvals fail closed.
_config_version: 50
model:
  default: coder
  provider: custom
  base_url: "http://llmproxy:4000/v1"
  key_env: AUXILIARY_HERMES_API_KEY
  context_length: 131072
timezone: "Europe/Oslo"
approvals:
  mode: manual
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny
terminal:
  backend: local
  env_passthrough: []
memory:
  memory_enabled: true
  provider: mnemosyne
  # Plugin config (mnemosyne-hermes 0.7.7 reads memory.mnemosyne.*). Defaults are auto_sleep on
  # and sleep_threshold 50 working-memory items; the spike lowers the threshold so the ~12-turn
  # dataset actually triggers consolidation and its LLM cost is measured. PROD would keep 50.
  mnemosyne:
    auto_sleep: true
    sleep_threshold: 8
# User plugins are opt-in (as in PROD): the provider hooks (pre_llm_call, on_session_start,
# post_tool_call) come from the hermes_agent.plugins entry point, which must be enabled here.
plugins:
  enabled:
    - mnemosyne
