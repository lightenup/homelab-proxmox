# Mirrors the PROD agent-config.yaml.j2 where it matters for memory: custom provider through
# the gateway (here: the logging proxy), built-in memory on, approvals fail closed.
_config_version: 50
model:
  default: coder
  provider: custom
  base_url: "http://llmproxy:4000/v1"
  key_env: AUXILIARY_HERMES_API_KEY
  context_length: 131072
timezone: "Europe/Oslo"
approvals:
  mode: manual
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny
terminal:
  backend: local
  env_passthrough: []
# As agent-config.yaml.j2: the recall block must not be spilled to a file.
hooks:
  output_spill:
    max_chars: 16000
# As agent-config.yaml.j2: hard-stop tool loops after 5 identical failures.
tool_loop_guardrails:
  hard_stop_enabled: true
# As agent-config.yaml.j2 (097 § 8): built-in notes off, owner profile on.
memory:
  memory_enabled: false
  user_profile_enabled: true
  provider: hindsight
# As PROD's hermes_mcp_servers `memory` entry (097 R-009), on the compose network: SOUL.md tells
# the agent to correct and forget with these tools, and without them it went looking for them
# (terminal, web_extract, a browser download; SC-004 FAIL on 2026-11-01).
mcp_servers:
  memory:
    url: "http://hindsight:8888/mcp/owner/"
    headers:
      Authorization: "Bearer ${AUXILIARY_MCP_MEMORY_API_KEY}"
