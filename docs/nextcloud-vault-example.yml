---
# Nextcloud secrets — vault file template
#
# Location: ansible/group_vars/services/vault.yml (gitignored by **/vault.yml)
#
# These are NEW secrets you must generate. They do not exist anywhere yet.
# Generate strong random values (e.g., openssl rand -base64 32).
#
# Quick setup:
#   cp docs/nextcloud-vault-example.yml ansible/group_vars/services/vault.yml
#   # Edit: replace every GENERATE_* placeholder with a real value
#   # Then encrypt if using ansible-vault:
#   ansible-vault encrypt ansible/group_vars/services/vault.yml
#
# The Nextcloud role preflight will fail-fast if any of these are missing.
# -------------------------------------------------------------------

# MariaDB database password (used by Nextcloud app to connect to its DB)
nextcloud_db_password: "GENERATE_STRONG_RANDOM_PASSWORD"

# MariaDB root password (used for DB admin, backups, and mysqldump)
nextcloud_db_root_password: "GENERATE_STRONG_RANDOM_PASSWORD"

# Redis password (used for Nextcloud session/cache locking)
nextcloud_redis_password: "GENERATE_STRONG_RANDOM_PASSWORD"

# Nextcloud admin account password (the initial web login)
nextcloud_admin_password: "GENERATE_STRONG_RANDOM_PASSWORD"

# -------------------------------------------------------------------
# HOW TO GENERATE:
#
#   openssl rand -base64 32    # produces a 44-char random string
#
# Generate a DIFFERENT value for each variable above.
#
# -------------------------------------------------------------------
# WHERE THIS FILE GOES:
#
# Developer laptop:
#   ansible/group_vars/services/vault.yml   (gitignored, plaintext or encrypted)
#
# PVE host (for CI/GitHub Actions):
#   /var/lib/homelab-proxmox/vault/group_vars/services/vault.yml
#   (the CI deploy script symlinks this into the repo checkout automatically)
#
# If using ansible-vault encryption:
#   - Locally: ansible/.vault-pass.txt contains the password (gitignored)
#   - CI: the ANSIBLE_VAULT_PASSWORD GitHub Actions secret provides it
#
# -------------------------------------------------------------------
# NON-SECRET VARIABLES (already defined, no action needed):
#
#   nextcloud_admin_user   → defaults to "admin" in roles/nextcloud/defaults/main.yml
#   nextcloud_version      → defined in group_vars/services/vars.yml
#   nextcloud_nfs_mount    → defined in group_vars/services/vars.yml
# -------------------------------------------------------------------
