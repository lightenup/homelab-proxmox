name: Version currency

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the report, do not publish"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate system Python (self-hosted)
        run: |
          set -euo pipefail
          python3 --version
          python3 -c "import sys; assert sys.version_info[:2] >= (3, 11), sys.version"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv venv --python 3.11 --clear
          uv pip sync --python .venv/bin/python --require-hashes python/requirements-nightly.lock.txt

      - name: Read ntfy token
        if: ${{ !inputs.dry_run }}
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          f="$(mktemp)"
          trap 'rm -f "$f"' EXIT
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > "$f"
          tok="$(.venv/bin/ansible-vault view --vault-password-file "$f" \
            ansible/group_vars/services/vault.yml \
            | .venv/bin/python -c 'import sys, yaml; print(yaml.safe_load(sys.stdin).get("ntfy_version_check_token") or "")')"
          if [ -z "$tok" ]; then
            echo "::error::ntfy_version_check_token not found in vault"
            exit 2
          fi
          echo "::add-mask::$tok"
          echo "NTFY_TOKEN=$tok" >> "$GITHUB_ENV"

      - name: Run version currency check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: python/src
        run: .venv/bin/python -m homelab_proxmox_orchestrator.version_currency ${{ inputs.dry_run && '--dry-run' || '' }}
