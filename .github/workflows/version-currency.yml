name: Version currency check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print report without publishing to ntfy"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run version currency check
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: python/src
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN:-false}" = "true" ]; then
            python -m homelab_proxmox_orchestrator.version_currency --dry-run
            exit 0
          fi
          umask 077
          pwfile="$(mktemp)"
          trap 'rm -f "$pwfile"' EXIT
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > "$pwfile"
          NTFY_TOKEN="$(ansible-vault view --vault-password-file "$pwfile" \
            ansible/group_vars/services/vault.yml \
            | python -c 'import sys, yaml; print(yaml.safe_load(sys.stdin).get("ntfy_version_check_token", ""))')"
          if [ -z "$NTFY_TOKEN" ]; then
            echo "ntfy_version_check_token not found in vault" >&2
            exit 2
          fi
          echo "::add-mask::$NTFY_TOKEN"
          export NTFY_TOKEN
          python -m homelab_proxmox_orchestrator.version_currency
