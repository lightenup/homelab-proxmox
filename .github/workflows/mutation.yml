name: Mutation gate

"on":
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Single shared PVE/Pi host: queue per PR branch, never cancel a running job.
concurrency:
  group: mutation-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap path guard so non-Python PRs skip the (heavy) self-hosted run while the
  # required `result` check still reports. Do NOT use a top-level paths: filter —
  # that would leave a required check permanently pending on non-Python PRs.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect mutation-relevant changes
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ -z "${HEAD:-}" ]; then
            # Non-PR dispatch: run by default.
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          base_ref="$(git merge-base "$BASE" "$HEAD")"
          includes="$(mktemp)"
          excludes="$(mktemp)"
          trap 'rm -f "$includes" "$excludes"' EXIT
          while IFS= read -r line; do
            case "$line" in
              ''|\#*) continue ;;
              '!'*) printf '%s\n' "${line#\!}" >>"$excludes" ;;
              *) printf '%s\n' "$line" >>"$includes" ;;
            esac
          done < scripts/ci/mutation-gate-paths.txt
          if [ ! -s "$includes" ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base_ref" "$HEAD")"
          if [ -s "$excludes" ]; then
            changed="$(printf '%s\n' "$changed" | grep -vEf "$excludes" || true)"
          fi
          if printf '%s\n' "$changed" | grep -qEf "$includes"; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
          fi

  mutation:
    needs: gate
    # The self-hosted runner has sudo and SSH to the PVE host, so only the owner's own PRs may
    # reach it: not forks, and not same-repo bots (Dependabot bumps the lock file this job
    # installs, so a compromised PyPI release would execute here; Copilot pushes here too).
    if: >-
      ${{ needs.gate.outputs.run == 'true' &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login == github.repository_owner)) }}
    runs-on: [self-hosted]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Ensure rsync/ssh
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y rsync openssh-client
          fi

      - name: Sync repo to PVE
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'artifacts/' \
            --exclude '.venv' \
            --exclude 'mutants/' \
            ./ ci@pve:/home/ci/homelab-proxmox/

      - name: Prepare Python venv on PVE
        run: |
          set -euo pipefail
          ssh ci@pve 'set -euo pipefail; \
            if ! command -v uv >/dev/null 2>&1; then \
              curl -LsSf https://astral.sh/uv/install.sh | sh; \
            fi; \
            export PATH="$HOME/.local/bin:$PATH"; \
            if ! command -v python3.11 >/dev/null 2>&1; then \
              uv python install 3.11; \
            fi; \
            cd /home/ci/homelab-proxmox && \
            uv venv --python 3.11 --clear && \
            uv pip sync --python .venv/bin/python --require-hashes python/requirements-nightly.lock.txt'

      - name: Run mutation gate on PVE
        id: gate_run
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          ssh ci@pve "cd /home/ci/homelab-proxmox && PYTHON_BIN=.venv/bin/python MUTMUT_COMMIT='${HEAD_SHA}' bash scripts/ci/mutmut-threshold.sh"
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Fetch mutation report
        if: always()
        run: |
          set -euo pipefail
          scp ci@pve:/home/ci/homelab-proxmox/mutants/report.json ci@pve:/home/ci/homelab-proxmox/mutants/survivors.txt . || true
          if [ -f report.json ]; then
            python3 -c "
            import json
            with open('report.json') as f:
                r = json.load(f)
            c = r['counts']
            print('| Metric | Value |')
            print('|---|---|')
            print(f\"| Score | {r['score']:.2f}% |\")
            print(f\"| Floor | {r['floor']:.2f}% |\")
            print(f\"| Margin | {r['margin']:.2f} |\")
            print(f\"| Gate | {r['gate']:.2f}% |\")
            print(f\"| Killed | {c['killed']} |\")
            print(f\"| Survived | {c['survived']} |\")
            print(f\"| No tests | {c['no_tests']} |\")
            print(f\"| Total | {c['total']} |\")
            " >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Top survivor modules" >> "$GITHUB_STEP_SUMMARY"
            head -10 survivors.txt >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Gate result
        run: |
          exit "${{ steps.gate_run.outputs.rc }}"

  # Single required status check. Always runs; passes when mutation was skipped
  # (non-Python PR) and fails only when the mutation job actually failed.
  result:
    needs: [gate, mutation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate mutation gate
        run: |
          set -euo pipefail
          echo "gate.run=${{ needs.gate.outputs.run }}  mutation.result=${{ needs.mutation.result }}"
          case "${{ needs.mutation.result }}" in
            failure|cancelled)
              echo "::error::Mutation gate failed."
              exit 1
              ;;
            *)
              echo "Mutation gate OK (skipped or passed)."
              ;;
          esac
