name: LXC Promote (LEGACY - DO NOT USE)

on:
  workflow_dispatch:
    inputs:
      service:
        description: "LEGACY workflow: do not use. Use LXC Promote (LAB) or LXC Promote (PROD) instead."
        required: true
        type: choice
        options:
          - adguard
          - homeassistant
          - immich
          - jellyfin
          - monitoring
          - reverse_proxy

jobs:
  deprecated:
    name: Deprecated workflow guard
    runs-on: [self-hosted]
    steps:
      - name: This workflow is deprecated
        run: |
          echo "ERROR: .github/workflows/lxc-promote.yml is deprecated and intentionally disabled." >&2
          echo "Use one of:" >&2
          echo "  - .github/workflows/lxc-promote-lab.yml (LAB-only promote)" >&2
          echo "  - .github/workflows/lxc-promote-prod.yml (PROD promotion pipeline)" >&2
          exit 1
