name: LXC Promote (LAB → PROD)

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to promote"
        required: true
        type: choice
        options:
          - adguard
          - homeassistant
          - immich
          - jellyfin
          - monitoring
          - reverse_proxy
      confirm_destructive_lab:
        description: "Required when LAB plan is destructive: set to 'apply-lab-destructive'"
        required: false
        type: string
        default: ""
      confirm_destructive_prod:
        description: "Required when PROD plan is destructive: set to 'deploy-prod-destructive'"
        required: false
        type: string
        default: ""

jobs:
  plan_lab:
    name: Plan (LAB)
    runs-on: [self-hosted]
    outputs:
      run_id: ${{ steps.capture_run_id.outputs.run_id }}
      destructive: ${{ steps.detect_destructive.outputs.destructive }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail fast on forbidden inputs
        run: |
          set -euo pipefail
          vals=(
            "${{ github.event.inputs.service }}"
          )
          for v in "${vals[@]}"; do
            if [[ "${v}" == *"-target"* ]]; then
              echo "ERROR: Forbidden target-like input detected (-target)." >&2
              exit 1
            fi
          done

      - name: Allowlist runtime validation
        run: |
          set -euo pipefail
          service="${{ github.event.inputs.service }}"
          jq -e --arg s "${service}" 'has($s)' ./scripts/lab/service-scope-allowlist.json >/dev/null

      - name: Sync repo to PVE
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'terraform/.terraform/' \
            --exclude 'terraform/.terraform.lock.hcl' \
            --exclude 'terraform/terraform.tfstate' \
            --exclude 'terraform/terraform.tfstate.backup' \
            --exclude 'scripts/lab/artifacts/' \
            --exclude 'artifacts/' \
            ./ "ci@${PROXMOX_HOST:-pve}:/home/ci/homelab-proxmox/"

      - name: Plan on PVE (LAB)
        id: plan_on_pve
        continue-on-error: true
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          set -euo pipefail

          service="${{ github.event.inputs.service }}"

          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          if [[ -n "${ANSIBLE_VAULT_PASSWORD:-}" ]]; then
            ssh ${ssh_opts} "${ssh_target}" "set -euo pipefail; umask 077; pwfile=\"\$(mktemp -t ansible-vault.XXXXXX)\"; cat >\"\${pwfile}\"; export ANSIBLE_VAULT_PASSWORD_FILE=\"\${pwfile}\"; cd /home/ci/homelab-proxmox/scripts/lab && GIT_REF='${{ github.ref }}' GIT_REF_NAME='${{ github.ref_name }}' ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars VAULT_ID=lab ./pve-service-deploy plan --environment lab --service '${service}'; rm -f \"\${pwfile}\"" <<<"${ANSIBLE_VAULT_PASSWORD}"
          else
            ssh ${ssh_opts} "${ssh_target}" "cd /home/ci/homelab-proxmox/scripts/lab && GIT_REF='${{ github.ref }}' GIT_REF_NAME='${{ github.ref_name }}' ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars VAULT_ID=lab ./pve-service-deploy plan --environment lab --service '${service}'"
          fi

      - name: Capture RUN_ID (LAB plan)
        id: capture_run_id
        if: always()
        run: |
          set -euo pipefail
          service="${{ github.event.inputs.service }}"

          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          RUN_ID="$(ssh ${ssh_opts} "${ssh_target}" "cd /var/lib/homelab-proxmox/artifacts/service-deploy-runs && ls -1td \"lab-${service}-\"*/ 2>/dev/null | head -1 | sed 's:/*$::'" | tr -d '\r\n')"
          RUN_ID="${RUN_ID%/}"
          RUN_ID="${RUN_ID%:}"
          test -n "${RUN_ID}"
          echo "RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Fetch evidence pack (LAB plan)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence/lab

          RUN_ID="${{ steps.capture_run_id.outputs.run_id }}"
          test -n "${RUN_ID}"

          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          ssh ${ssh_opts} "${ssh_target}" "tar czf /tmp/service-deploy-lab-plan.tgz -C /var/lib/homelab-proxmox/artifacts/service-deploy-runs \"${RUN_ID}\""
          scp ${ssh_opts} "${ssh_target}:/tmp/service-deploy-lab-plan.tgz" evidence/lab/
          tar xzf evidence/lab/service-deploy-lab-plan.tgz -C evidence/lab/

      - name: Verify evidence pack (offline)
        if: always()
        run: ./scripts/lab/ci-verify.sh evidence/lab/${{ steps.capture_run_id.outputs.run_id }}

      - name: Generate LAB plan UI summary JSON
        if: steps.plan_on_pve.outcome == 'success'
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.capture_run_id.outputs.run_id }}"
          python3 ./scripts/lab/plan_ui_summary.py \
            --blast-radius "evidence/lab/${RUN_ID}/blast-radius.json" \
            --output "evidence/lab/${RUN_ID}/plan-ui-summary.json" \
            --limit 50

      - name: Publish LAB plan summary to run UI
        if: steps.plan_on_pve.outcome == 'success'
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.capture_run_id.outputs.run_id }}"
          ./scripts/lab/render_github_summary.sh "evidence/lab/${RUN_ID}/plan-ui-summary.json" >>"$GITHUB_STEP_SUMMARY"

      - name: Detect destructive blast radius
        id: detect_destructive
        if: steps.plan_on_pve.outcome == 'success'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          run_id = os.environ.get('RUN_ID')
          if not run_id:
              raise SystemExit('Missing RUN_ID')

          path = os.path.join('evidence', 'lab', run_id, 'blast-radius.json')
          with open(path, 'r', encoding='utf-8') as f:
              doc = json.load(f)

          destructive = bool(doc.get('destructive'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"destructive={'true' if destructive else 'false'}\n")

          print(f"destructive={destructive}")
          PY

      - name: Enforce LAB destructive confirmation
        if: |
          steps.plan_on_pve.outcome == 'success' &&
          steps.detect_destructive.outputs.destructive == 'true' &&
          github.event.inputs.confirm_destructive_lab != 'apply-lab-destructive'
        run: |
          ./scripts/lab/render_github_annotations.sh \
            --level error \
            --title "LAB destructive plan blocked" \
            --message "LAB plan is destructive (replace/destroy). Re-run with confirm_destructive_lab=apply-lab-destructive to proceed."
          echo "ERROR: LAB plan is destructive (replace/destroy)." >&2
          echo "Re-run with confirm_destructive_lab=apply-lab-destructive to proceed." >&2
          exit 1

      - name: Fail job if LAB plan failed
        if: steps.plan_on_pve.outcome != 'success'
        run: |
          echo "ERROR: LAB plan failed" >&2
          exit 1

      - name: Summarize LAB plan outcome
        if: always()
        run: |
          set -euo pipefail
          outcome="${{ steps.plan_on_pve.outcome }}"
          run_id="${{ steps.capture_run_id.outputs.run_id }}"

          if [[ "${outcome}" != "success" ]]; then
            ./scripts/lab/render_github_annotations.sh \
              --level error \
              --title "LAB plan failed" \
              --message "LAB plan failed. See evidence pack for details (RUN_ID=${run_id})."
            {
              echo "## LAB plan failed"
              echo "- RUN_ID: \`${run_id}\`"
              echo "- Evidence dir: \`/var/lib/homelab-proxmox/artifacts/service-deploy-runs/${run_id}\`"
            } >>"$GITHUB_STEP_SUMMARY"

            bash ./scripts/lab/render_failure_evidence.sh \
              --evidence-dir "evidence/lab/${run_id}" \
              --max-lines 120 >>"$GITHUB_STEP_SUMMARY" || true
          fi

  apply_lab:
    name: Apply (LAB)
    runs-on: [self-hosted]
    needs: [plan_lab]
    concurrency:
      group: lxc-promote-lab-${{ github.event.inputs.service }}
      cancel-in-progress: false
    outputs:
      run_id: ${{ steps.capture_run_id.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Allowlist runtime validation
        run: |
          set -euo pipefail
          service="${{ github.event.inputs.service }}"
          jq -e --arg s "${service}" 'has($s)' ./scripts/lab/service-scope-allowlist.json >/dev/null

      - name: Sync repo to PVE
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'terraform/.terraform/' \
            --exclude 'terraform/.terraform.lock.hcl' \
            --exclude 'terraform/terraform.tfstate' \
            --exclude 'terraform/terraform.tfstate.backup' \
            --exclude 'scripts/lab/artifacts/' \
            --exclude 'artifacts/' \
            ./ "ci@${PROXMOX_HOST:-pve}:/home/ci/homelab-proxmox/"

      - name: Apply on PVE (LAB)
        id: apply_on_pve
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          set -euo pipefail

          service="${{ github.event.inputs.service }}"

          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          if [[ -n "${ANSIBLE_VAULT_PASSWORD:-}" ]]; then
            ssh ${ssh_opts} "${ssh_target}" "set -euo pipefail; umask 077; pwfile=\"\$(mktemp -t ansible-vault.XXXXXX)\"; cat >\"\${pwfile}\"; export ANSIBLE_VAULT_PASSWORD_FILE=\"\${pwfile}\"; cd /home/ci/homelab-proxmox/scripts/lab && GIT_REF='${{ github.ref }}' GIT_REF_NAME='${{ github.ref_name }}' ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars VAULT_ID=lab ./pve-service-deploy apply --environment lab --service '${service}'; rm -f \"\${pwfile}\"" <<<"${ANSIBLE_VAULT_PASSWORD}"
          else
            ssh ${ssh_opts} "${ssh_target}" "cd /home/ci/homelab-proxmox/scripts/lab && GIT_REF='${{ github.ref }}' GIT_REF_NAME='${{ github.ref_name }}' ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars VAULT_ID=lab ./pve-service-deploy apply --environment lab --service '${service}'"
          fi

      - name: Capture RUN_ID (LAB apply)
        id: capture_run_id
        if: always()
        run: |
          set -euo pipefail
          service="${{ github.event.inputs.service }}"

          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          RUN_ID="$(ssh ${ssh_opts} "${ssh_target}" "cd /var/lib/homelab-proxmox/artifacts/service-deploy-runs && ls -1td \"lab-${service}-\"*/ 2>/dev/null | head -1 | sed 's:/*$::'" | tr -d '\r\n')"
          RUN_ID="${RUN_ID%/}"
          RUN_ID="${RUN_ID%:}"
          test -n "${RUN_ID}"
          echo "RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Fetch evidence pack (LAB apply)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence/lab

          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          RUN_ID="${{ steps.capture_run_id.outputs.run_id }}"
          test -n "${RUN_ID}"
          ssh ${ssh_opts} "${ssh_target}" "tar czf /tmp/service-deploy-lab-apply.tgz -C /var/lib/homelab-proxmox/artifacts/service-deploy-runs \"${RUN_ID}\""
          scp ${ssh_opts} "${ssh_target}:/tmp/service-deploy-lab-apply.tgz" evidence/lab/
          tar xzf evidence/lab/service-deploy-lab-apply.tgz -C evidence/lab/

      - name: Verify evidence pack (offline)
        if: always()
        run: ./scripts/lab/ci-verify.sh evidence/lab/${{ steps.capture_run_id.outputs.run_id }}

      - name: Surface LAB state-backup outcome
        if: always()
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.capture_run_id.outputs.run_id }}"
          test -n "${RUN_ID}"

          preflight="evidence/lab/${RUN_ID}/preflight.txt"
          backup_txt="evidence/lab/${RUN_ID}/reports/apply/state-backup.txt"

          backup_status="unknown"
          if [[ -f "${preflight}" ]]; then
            if grep -q "state backup succeeded" "${preflight}"; then
              backup_status="success"
            elif grep -q "state backup failed" "${preflight}"; then
              backup_status="failure"
            fi
          fi

          {
            echo "## LAB state backup"
            echo "- RUN_ID: \`${RUN_ID}\`"
            echo "- status: **${backup_status}**"
            if [[ -f "${backup_txt}" ]]; then
              echo "- details: \`${backup_txt}\`"
            else
              echo "- details: (missing)"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

          if [[ "${backup_status}" == "failure" ]]; then
            ./scripts/lab/render_github_annotations.sh \
              --level warning \
              --title "LAB state backup failed (non-fatal)" \
              --message "LAB apply completed but state backup failed (non-fatal). See reports/apply/state-backup.txt in the evidence pack."
          fi

      - name: Summarize LAB apply outcome
        if: always()
        run: |
          set -euo pipefail
          outcome="${{ steps.apply_on_pve.outcome }}"
          run_id="${{ steps.capture_run_id.outputs.run_id }}"

          if [[ "${outcome}" != "success" ]]; then
            ./scripts/lab/render_github_annotations.sh \
              --level error \
              --title "LAB apply failed" \
              --message "LAB apply failed. See evidence pack for details (RUN_ID=${run_id})."
            {
              echo "## LAB apply failed"
              echo "- RUN_ID: \`${run_id}\`"
              echo "- Evidence dir: \`/var/lib/homelab-proxmox/artifacts/service-deploy-runs/${run_id}\`"
            } >>"$GITHUB_STEP_SUMMARY"

            bash ./scripts/lab/render_failure_evidence.sh \
              --evidence-dir "evidence/lab/${run_id}" \
              --max-lines 120 >>"$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Upload LAB evidence (plan + apply)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-evidence-${{ github.event.inputs.service }}-${{ needs.plan_lab.outputs.run_id }}-${{ steps.capture_run_id.outputs.run_id }}
          path: evidence/lab/

  plan_prod:
    name: Plan (PROD)
    runs-on: [self-hosted]
    needs: [apply_lab]
    outputs:
      run_id: ${{ steps.capture_run_id.outputs.run_id }}
      destructive: ${{ steps.detect_destructive.outputs.destructive }}
      summary_published: ${{ steps.publish_summary.outputs.summary_published }}
    steps:
      - uses: actions/checkout@v4

      - name: Allowlist runtime validation
        run: |
          set -euo pipefail
          service="${{ github.event.inputs.service }}"
          jq -e --arg s "${service}" 'has($s)' ./scripts/lab/service-scope-allowlist.json >/dev/null

      - name: Sync repo to PVE
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'terraform/.terraform/' \
            --exclude 'terraform/.terraform.lock.hcl' \
            --exclude 'terraform/terraform.tfstate' \
            --exclude 'terraform/terraform.tfstate.backup' \
            --exclude 'scripts/lab/artifacts/' \
            --exclude 'artifacts/' \
            ./ "ci@${PROXMOX_HOST:-pve}:/home/ci/homelab-proxmox/"

      - name: Plan on PVE (PROD)
        id: plan_on_pve
        continue-on-error: true
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          PROXMOX_API_TOKEN_SECRET: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}
        run: |
          set -euo pipefail

          service="${{ github.event.inputs.service }}"

          token_secret="${PROXMOX_API_TOKEN_SECRET:-${PROXMOX_TOKEN_SECRET:-}}"

          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          if [[ -n "${ANSIBLE_VAULT_PASSWORD:-}" ]]; then
            payload="$(printf '%s\n%s' "${ANSIBLE_VAULT_PASSWORD}" "${token_secret}")"
            ssh ${ssh_opts} "${ssh_target}" "set -euo pipefail; umask 077; pwfile=\"\$(mktemp -t ansible-vault.XXXXXX)\"; tokfile=\"\$(mktemp -t proxmox-token.XXXXXX)\"; IFS= read -r vault_pw || true; cat >\"\${tokfile}\"; printf '%s' \"\${vault_pw}\" >\"\${pwfile}\"; export ANSIBLE_VAULT_PASSWORD_FILE=\"\${pwfile}\"; export PROXMOX_API_TOKEN_SECRET=\"\$(tr -d '\\n' <\"\${tokfile}\")\"; cd /home/ci/homelab-proxmox/scripts/lab && GIT_REF='${{ github.ref }}' GIT_REF_NAME='${{ github.ref_name }}' ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars VAULT_ID=prod ./pve-service-deploy plan --environment prod --service '${service}'; rm -f \"\${pwfile}\" \"\${tokfile}\"" <<<"${payload}"
          else
            ssh ${ssh_opts} "${ssh_target}" "cd /home/ci/homelab-proxmox/scripts/lab && PROXMOX_API_TOKEN_SECRET='${token_secret}' GIT_REF='${{ github.ref }}' GIT_REF_NAME='${{ github.ref_name }}' ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars VAULT_ID=prod ./pve-service-deploy plan --environment prod --service '${service}'"
          fi

      - name: Capture RUN_ID (PROD plan)
        id: capture_run_id
        if: always()
        run: |
          set -euo pipefail
          service="${{ github.event.inputs.service }}"

          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          RUN_ID="$(ssh ${ssh_opts} "${ssh_target}" "cd /var/lib/homelab-proxmox/artifacts/service-deploy-runs && ls -1td \"prod-${service}-\"*/ 2>/dev/null | head -1 | sed 's:/*$::'" | tr -d '\r\n')"
          RUN_ID="${RUN_ID%/}"
          RUN_ID="${RUN_ID%:}"
          test -n "${RUN_ID}"
          echo "RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Fetch evidence pack (PROD plan)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence/prod

          RUN_ID="${{ steps.capture_run_id.outputs.run_id }}"
          test -n "${RUN_ID}"

          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          ssh ${ssh_opts} "${ssh_target}" "tar czf /tmp/service-deploy-prod-plan.tgz -C /var/lib/homelab-proxmox/artifacts/service-deploy-runs \"${RUN_ID}\""
          scp ${ssh_opts} "${ssh_target}:/tmp/service-deploy-prod-plan.tgz" evidence/prod/
          tar xzf evidence/prod/service-deploy-prod-plan.tgz -C evidence/prod/

      - name: Verify evidence pack (offline)
        if: always()
        run: ./scripts/lab/ci-verify.sh evidence/prod/${{ steps.capture_run_id.outputs.run_id }}

      - name: Generate PROD plan UI summary JSON
        if: steps.plan_on_pve.outcome == 'success'
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.capture_run_id.outputs.run_id }}"
          python3 ./scripts/lab/plan_ui_summary.py \
            --blast-radius "evidence/prod/${RUN_ID}/blast-radius.json" \
            --output "evidence/prod/${RUN_ID}/plan-ui-summary.json" \
            --limit 50

      - name: Publish PROD plan summary to run UI
        id: publish_summary
        if: steps.plan_on_pve.outcome == 'success'
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.capture_run_id.outputs.run_id }}"
          ./scripts/lab/render_github_summary.sh "evidence/prod/${RUN_ID}/plan-ui-summary.json" >>"$GITHUB_STEP_SUMMARY"
          echo "summary_published=true" >>"$GITHUB_OUTPUT"

      - name: Summarize PROD plan failure (preflight + plan)
        if: steps.plan_on_pve.outcome != 'success'
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.capture_run_id.outputs.run_id }}"
          test -n "${RUN_ID}"

          ./scripts/lab/render_github_annotations.sh \
            --level error \
            --title "PROD plan failed" \
            --message "PROD plan failed. See evidence pack for details (RUN_ID=${RUN_ID})."

          echo "ERROR: PROD plan failed on PVE. Showing evidence excerpts."

          echo "--- evidence/prod/${RUN_ID} (files) ---"
          find "evidence/prod/${RUN_ID}" -maxdepth 4 -type f -print | sort || true

          preflight="evidence/prod/${RUN_ID}/preflight.txt"
          plan_txt="evidence/prod/${RUN_ID}/reports/plan/plan.txt"
          plan_summary="evidence/prod/${RUN_ID}/reports/plan/summary.txt"
          plan_run_txt="evidence/prod/${RUN_ID}/reports/plan/terraform-plan.txt"
          events_log="evidence/prod/${RUN_ID}/logs/events.jsonl"
          tfvars_provisioning="evidence/prod/${RUN_ID}/reports/prod-tfvars/provisioning.txt"
          tfvars_validation="evidence/prod/${RUN_ID}/reports/prod-tfvars/validation.json"

          echo "--- preflight.txt (error-ish lines) ---"
          if [[ -f "${preflight}" ]]; then
            grep -nE '(^ERROR:|^WARN:|Error:|error:|Failed|failed)' "${preflight}" | tail -n 200 || true
          else
            echo "MISSING: ${preflight}"
          fi

          echo "--- plan.txt (error-ish lines) ---"
          if [[ -f "${plan_txt}" ]]; then
            grep -nE '(^Error:|^ERROR:|error:|Error\b|Failed|failed|Forbidden|forbidden|No such file|not found)' "${plan_txt}" | tail -n 200 || true
          else
            echo "MISSING: ${plan_txt}"
          fi

          echo "--- reports/plan/summary.txt ---"
          if [[ -f "${plan_summary}" ]]; then
            cat "${plan_summary}" || true
          else
            echo "MISSING: ${plan_summary}"
          fi

          echo "--- reports/plan/terraform-plan.txt (error-ish lines) ---"
          if [[ -f "${plan_run_txt}" ]]; then
            grep -nE '(^Error:|^ERROR:|error:|Error\b|Failed|failed|Forbidden|forbidden|No such file|not found)' "${plan_run_txt}" | tail -n 200 || true
          else
            echo "MISSING: ${plan_run_txt}"
          fi

          echo "--- reports/prod-tfvars/provisioning.txt (tail) ---"
          tail -n 120 "${tfvars_provisioning}" 2>/dev/null || true

          echo "--- reports/prod-tfvars/validation.json ---"
          cat "${tfvars_validation}" 2>/dev/null || true

          echo "--- logs/events.jsonl (tail) ---"
          tail -n 200 "${events_log}" 2>/dev/null || true

          echo "--- preflight.txt (tail) ---"
          tail -n 120 "${preflight}" 2>/dev/null || true

          echo "--- plan.txt (tail) ---"
          tail -n 200 "${plan_txt}" 2>/dev/null || true

      - name: Upload PROD plan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-plan-evidence-${{ github.event.inputs.service }}-${{ steps.capture_run_id.outputs.run_id }}
          path: evidence/prod/

      - name: Detect destructive blast radius
        id: detect_destructive
        if: steps.plan_on_pve.outcome == 'success'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          run_id = os.environ.get('RUN_ID')
          if not run_id:
              raise SystemExit('Missing RUN_ID')

          path = os.path.join('evidence', 'prod', run_id, 'blast-radius.json')
          with open(path, 'r', encoding='utf-8') as f:
              doc = json.load(f)

          destructive = bool(doc.get('destructive'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"destructive={'true' if destructive else 'false'}\n")

          print(f"destructive={destructive}")
          PY

      - name: Enforce PROD destructive confirmation
        if: |
          steps.plan_on_pve.outcome == 'success' &&
          steps.detect_destructive.outputs.destructive == 'true' &&
          github.event.inputs.confirm_destructive_prod != 'deploy-prod-destructive'
        run: |
          ./scripts/lab/render_github_annotations.sh \
            --level error \
            --title "PROD destructive plan blocked" \
            --message "PROD plan is destructive (replace/destroy). Re-run with confirm_destructive_prod=deploy-prod-destructive to proceed."
          echo "ERROR: PROD plan is destructive (replace/destroy)." >&2
          echo "Re-run with confirm_destructive_prod=deploy-prod-destructive to proceed." >&2
          exit 1

      - name: Fail job if PROD plan failed
        if: steps.plan_on_pve.outcome != 'success'
        run: |
          echo "ERROR: PROD plan failed" >&2
          exit 1

      - name: Summarize PROD plan outcome
        if: always()
        run: |
          set -euo pipefail
          outcome="${{ steps.plan_on_pve.outcome }}"
          run_id="${{ steps.capture_run_id.outputs.run_id }}"

          if [[ "${outcome}" != "success" ]]; then
            {
              echo "## PROD plan failed"
              echo "- RUN_ID: \`${run_id}\`"
              echo "- Evidence dir: \`/var/lib/homelab-proxmox/artifacts/service-deploy-runs/${run_id}\`"
              echo "- Next: fix the cause, then re-run promotion (PROD approval will not be requested)."
            } >>"$GITHUB_STEP_SUMMARY"

            bash ./scripts/lab/render_failure_evidence.sh \
              --evidence-dir "evidence/prod/${run_id}" \
              --max-lines 120 >>"$GITHUB_STEP_SUMMARY" || true
          fi

  approve_prod:
    name: Approval (PROD)
    runs-on: [self-hosted]
    needs: [plan_prod]
    if: needs.plan_prod.outputs.summary_published == 'true'
    environment: prod
    steps:
      - name: Await PROD approval
        run: |
          echo "Approved: proceeding to PROD apply"

  apply_prod:
    name: Apply (PROD)
    runs-on: [self-hosted]
    needs: [approve_prod, plan_prod]
    concurrency:
      group: lxc-promote-prod-${{ github.event.inputs.service }}
      cancel-in-progress: false
    outputs:
      run_id: ${{ steps.capture_run_id.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Allowlist runtime validation
        run: |
          set -euo pipefail
          service="${{ github.event.inputs.service }}"
          jq -e --arg s "${service}" 'has($s)' ./scripts/lab/service-scope-allowlist.json >/dev/null

      - name: Sync repo to PVE
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'terraform/.terraform/' \
            --exclude 'terraform/.terraform.lock.hcl' \
            --exclude 'terraform/terraform.tfstate' \
            --exclude 'terraform/terraform.tfstate.backup' \
            --exclude 'scripts/lab/artifacts/' \
            --exclude 'artifacts/' \
            ./ "ci@${PROXMOX_HOST:-pve}:/home/ci/homelab-proxmox/"

      - name: Validate PROD plan RUN_ID present
        run: |
          set -euo pipefail
          plan_run_id="${{ needs.plan_prod.outputs.run_id }}"
          if [[ -z "${plan_run_id}" ]]; then
            ./scripts/lab/render_github_annotations.sh \
              --level error \
              --title "Missing PROD plan RUN_ID" \
              --message "Missing needs.plan_prod.outputs.run_id; cannot apply from saved plan. Re-run Plan(PROD) or investigate plan_prod job outputs."
            {
              echo "## PROD apply blocked"
              echo "- Missing PROD plan RUN_ID from plan_prod job"
              echo "- Next: re-run the workflow and ensure Plan(PROD) completes successfully"
            } >>"$GITHUB_STEP_SUMMARY"
            exit 2
          fi

      - name: Apply on PVE (PROD)
        id: apply_on_pve
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          PROXMOX_API_TOKEN_SECRET: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}
        run: |
          set -euo pipefail

          service="${{ github.event.inputs.service }}"
          plan_run_id="${{ needs.plan_prod.outputs.run_id }}"
          test -n "${plan_run_id}"

          token_secret="${PROXMOX_API_TOKEN_SECRET:-${PROXMOX_TOKEN_SECRET:-}}"

          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          if [[ -n "${ANSIBLE_VAULT_PASSWORD:-}" ]]; then
            payload="$(printf '%s\n%s' "${ANSIBLE_VAULT_PASSWORD}" "${token_secret}")"
            ssh ${ssh_opts} "${ssh_target}" "set -euo pipefail; umask 077; pwfile=\"\$(mktemp -t ansible-vault.XXXXXX)\"; tokfile=\"\$(mktemp -t proxmox-token.XXXXXX)\"; IFS= read -r vault_pw || true; cat >\"\${tokfile}\"; printf '%s' \"\${vault_pw}\" >\"\${pwfile}\"; export ANSIBLE_VAULT_PASSWORD_FILE=\"\${pwfile}\"; export PROXMOX_API_TOKEN_SECRET=\"\$(tr -d '\\n' <\"\${tokfile}\")\"; cd /home/ci/homelab-proxmox/scripts/lab && GIT_REF='${{ github.ref }}' GIT_REF_NAME='${{ github.ref_name }}' ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars ALLOW_PROD_APPLY=1 VAULT_ID=prod ./pve-service-deploy apply --environment prod --service '${service}' --confirm 'deploy-prod' --from-plan-run-id '${plan_run_id}'; rm -f \"\${pwfile}\" \"\${tokfile}\"" <<<"${payload}"
          else
            ssh ${ssh_opts} "${ssh_target}" "cd /home/ci/homelab-proxmox/scripts/lab && PROXMOX_API_TOKEN_SECRET='${token_secret}' GIT_REF='${{ github.ref }}' GIT_REF_NAME='${{ github.ref_name }}' ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars ALLOW_PROD_APPLY=1 VAULT_ID=prod ./pve-service-deploy apply --environment prod --service '${service}' --confirm 'deploy-prod' --from-plan-run-id '${plan_run_id}'"
          fi

      - name: Capture RUN_ID (PROD apply)
        id: capture_run_id
        if: always()
        run: |
          set -euo pipefail
          service="${{ github.event.inputs.service }}"

          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          RUN_ID="$(ssh ${ssh_opts} "${ssh_target}" "cd /var/lib/homelab-proxmox/artifacts/service-deploy-runs && ls -1td \"prod-${service}-\"*/ 2>/dev/null | head -1 | sed 's:/*$::'" | tr -d '\r\n')"
          RUN_ID="${RUN_ID%/}"
          RUN_ID="${RUN_ID%:}"
          test -n "${RUN_ID}"
          echo "RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Fetch evidence pack (PROD apply)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence/prod

          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          RUN_ID="${{ steps.capture_run_id.outputs.run_id }}"
          test -n "${RUN_ID}"
          ssh ${ssh_opts} "${ssh_target}" "tar czf /tmp/service-deploy-prod-apply.tgz -C /var/lib/homelab-proxmox/artifacts/service-deploy-runs \"${RUN_ID}\""
          scp ${ssh_opts} "${ssh_target}:/tmp/service-deploy-prod-apply.tgz" evidence/prod/
          tar xzf evidence/prod/service-deploy-prod-apply.tgz -C evidence/prod/

      - name: Verify evidence pack (offline)
        if: always()
        run: ./scripts/lab/ci-verify.sh evidence/prod/${{ steps.capture_run_id.outputs.run_id }}

      - name: Summarize PROD apply outcome
        if: always()
        run: |
          set -euo pipefail
          outcome="${{ steps.apply_on_pve.outcome }}"
          run_id="${{ steps.capture_run_id.outputs.run_id }}"

          if [[ "${outcome}" != "success" ]]; then
            ./scripts/lab/render_github_annotations.sh \
              --level error \
              --title "PROD apply failed" \
              --message "PROD apply failed. Evidence pack will contain details. No rollback was performed."
            {
              echo "## PROD apply failed"
              echo "- RUN_ID: \`${run_id}\`"
              echo "- Evidence dir: \`/var/lib/homelab-proxmox/artifacts/service-deploy-runs/${run_id}\`"
              echo "- State was preserved (no automatic rollback)"
              echo "- Next: inspect evidence pack on PVE and consider re-running after remediation"
            } >>"$GITHUB_STEP_SUMMARY"

            bash ./scripts/lab/render_failure_evidence.sh \
              --evidence-dir "evidence/prod/${run_id}" \
              --max-lines 120 >>"$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Upload PROD evidence (plan + apply)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-evidence-${{ github.event.inputs.service }}-${{ needs.plan_prod.outputs.run_id }}-${{ steps.capture_run_id.outputs.run_id }}
          path: evidence/prod/
