name: LXC Promote (LAB → PROD)

"on":
    workflow_dispatch:
        inputs:
            service:
                description: "Service to promote"
                required: true
                type: choice
                options:
                    - adguard
                    - homeassistant
                    - immich
                    - jellyfin
                    - monitoring
                    - reverse_proxy
            confirm_destructive_lab:
              description: "Required when LAB plan is destructive: check to allow apply"
              required: false
              type: boolean
              default: false
            confirm_destructive_prod:
              description: "Required when PROD plan is destructive: check to allow apply"
              required: false
              type: boolean
              default: false
            hotfix_override:
                description: "Hotfix override (required when running from main branch)"
                required: true
                type: boolean
                default: false

jobs:
    plan_lab:
        name: Plan (LAB)
        runs-on: [self-hosted]
        outputs:
            run_id: ${{ steps.capture_run_id.outputs.run_id }}
            destructive: ${{ steps.detect_destructive.outputs.destructive }}
        steps:
            - uses: actions/checkout@v4

            - name: Hotfix override gate (main branch)
              run: |
                  set -euo pipefail
                  if [[ "${GITHUB_REF:-}" == "refs/heads/main" ]]; then
                    if [[ "${{ github.event.inputs.hotfix_override }}" != "true" ]]; then
                      echo "ERROR: PROD deploy on main requires hotfix_override=true" >&2
                      echo "If this is intentional, rerun workflow with hotfix_override=true" >&2
                      exit 1
                    fi
                    echo "WARN: HOTFIX MODE enabled (main branch)" >&2
                  fi

            - name: Fail fast on forbidden inputs
              run: |
                  set -euo pipefail
                  vals=(
                    "${{ github.event.inputs.service }}"
                  )
                  for v in "${vals[@]}"; do
                    if [[ "${v}" == *"-target"* ]]; then
                      echo "ERROR: Forbidden target-like input detected (-target)." >&2
                      exit 1
                    fi
                  done

            - name: Allowlist runtime validation
              run: |
                  set -euo pipefail
                  service="${{ github.event.inputs.service }}"
                  jq -e --arg s "${service}" 'has($s)' ./scripts/lab/service-scope-allowlist.json >/dev/null

            - name: Sync repo to PVE
              run: |
                  set -euo pipefail
                  rsync -az --delete \
                    --exclude '.git' \
                    --exclude 'terraform/.terraform/' \
                    --exclude 'terraform/.terraform.lock.hcl' \
                    --exclude 'terraform/terraform.tfstate' \
                    --exclude 'terraform/terraform.tfstate.backup' \
                    --exclude 'scripts/lab/artifacts/' \
                    --exclude 'artifacts/' \
                    ./ "ci@${PROXMOX_HOST:-pve}:/home/ci/homelab-proxmox/"

            - name: Plan on PVE (LAB)
              id: plan_on_pve
              continue-on-error: true
              env:
                  ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
              run: |
                  set -euo pipefail

                  service="${{ github.event.inputs.service }}"

                  ssh_target="ci@${PROXMOX_HOST:-pve}"
                  ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

                  if [[ -n "${ANSIBLE_VAULT_PASSWORD:-}" ]]; then
                    ssh ${ssh_opts} "${ssh_target}" "set -euo pipefail; umask 077; pwfile=\"\$(mktemp -t ansible-vault.XXXXXX)\"; cat >\"\${pwfile}\"; export ANSIBLE_VAULT_PASSWORD_FILE=\"\${pwfile}\"; cd /home/ci/homelab-proxmox/scripts/lab && HOTFIX_OVERRIDE='${{ github.event.inputs.hotfix_override }}' GIT_REF='${{ github.ref }}' GIT_REF_NAME='${{ github.ref_name }}' ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars VAULT_ID=lab ./pve-service-deploy plan --environment lab --service '${service}'; rm -f \"\${pwfile}\"" <<<"${ANSIBLE_VAULT_PASSWORD}"
                  else
                    ssh ${ssh_opts} "${ssh_target}" "cd /home/ci/homelab-proxmox/scripts/lab && HOTFIX_OVERRIDE='${{ github.event.inputs.hotfix_override }}' GIT_REF='${{ github.ref }}' GIT_REF_NAME='${{ github.ref_name }}' ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars VAULT_ID=lab ./pve-service-deploy plan --environment lab --service '${service}'"
                  fi

            - name: Capture RUN_ID (LAB plan)
              id: capture_run_id
              if: always()
              run: |
                  set -euo pipefail
                  service="${{ github.event.inputs.service }}"

                  ssh_target="ci@${PROXMOX_HOST:-pve}"
                  ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

                  RUN_ID="$(ssh ${ssh_opts} "${ssh_target}" "cd /var/lib/homelab-proxmox/artifacts/service-deploy-runs && ls -1t lab-${service}-* 2>/dev/null | head -1" | tr -d '\r\n')"
                  RUN_ID="${RUN_ID%:}"
                  test -n "${RUN_ID}"
                  echo "RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
                  echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

            - name: Fetch evidence pack (LAB plan)
              if: always()
              run: |
                  set -euo pipefail
                  mkdir -p evidence/lab

                  RUN_ID="${{ steps.capture_run_id.outputs.run_id }}"
                  test -n "${RUN_ID}"

                  ssh_target="ci@${PROXMOX_HOST:-pve}"
                  ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

                  ssh ${ssh_opts} "${ssh_target}" "tar czf /tmp/service-deploy-lab-plan.tgz -C /var/lib/homelab-proxmox/artifacts/service-deploy-runs \"${RUN_ID}\""
                  scp ${ssh_opts} "${ssh_target}:/tmp/service-deploy-lab-plan.tgz" evidence/lab/
                  tar xzf evidence/lab/service-deploy-lab-plan.tgz -C evidence/lab/

            - name: Verify evidence pack (offline)
              if: always()
              run: ./scripts/lab/ci-verify.sh evidence/lab/${{ steps.capture_run_id.outputs.run_id }}

            - name: Detect destructive blast radius
              id: detect_destructive
              if: steps.plan_on_pve.outcome == 'success'
              run: |
                  set -euo pipefail
                  python3 - <<'PY'
                  import json
                  import os

                  run_id = os.environ.get('RUN_ID')
                  if not run_id:
                      raise SystemExit('Missing RUN_ID')

                  path = os.path.join('evidence', 'lab', run_id, 'blast-radius.json')
                  with open(path, 'r', encoding='utf-8') as f:
                      doc = json.load(f)

                  destructive = bool(doc.get('destructive'))
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
                      out.write(f"destructive={'true' if destructive else 'false'}\n")

                  print(f"destructive={destructive}")
                  PY

            - name: Enforce LAB destructive confirmation
              if: |
                  steps.plan_on_pve.outcome == 'success' &&
                  steps.detect_destructive.outputs.destructive == 'true' &&
                  github.event.inputs.confirm_destructive_lab != 'true'
              run: |
                  echo "ERROR: LAB plan is destructive (replace/destroy)." >&2
                  echo "Rerun with confirm_destructive_lab=true to proceed." >&2
                  exit 1

            - name: Fail job if LAB plan failed
              if: steps.plan_on_pve.outcome != 'success'
              run: |
                  echo "ERROR: LAB plan failed" >&2
                  exit 1

    apply_lab:
        name: Apply (LAB)
        runs-on: [self-hosted]
        needs: [plan_lab]
        concurrency:
            group: lxc-promote-lab-${{ github.event.inputs.service }}
            cancel-in-progress: false
        outputs:
            run_id: ${{ steps.capture_run_id.outputs.run_id }}
        steps:
            - uses: actions/checkout@v4

            - name: Allowlist runtime validation
              run: |
                  set -euo pipefail
                  service="${{ github.event.inputs.service }}"
                  jq -e --arg s "${service}" 'has($s)' ./scripts/lab/service-scope-allowlist.json >/dev/null

            - name: Sync repo to PVE
              run: |
                  set -euo pipefail
                  rsync -az --delete \
                    --exclude '.git' \
                    --exclude 'terraform/.terraform/' \
                    --exclude 'terraform/.terraform.lock.hcl' \
                    --exclude 'terraform/terraform.tfstate' \
                    --exclude 'terraform/terraform.tfstate.backup' \
                    --exclude 'scripts/lab/artifacts/' \
                    --exclude 'artifacts/' \
                    ./ "ci@${PROXMOX_HOST:-pve}:/home/ci/homelab-proxmox/"

            - name: Apply on PVE (LAB)
              id: apply_on_pve
              env:
                  ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
              run: |
                  set -euo pipefail

                  service="${{ github.event.inputs.service }}"

                  ssh_target="ci@${PROXMOX_HOST:-pve}"
                  ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

                  if [[ -n "${ANSIBLE_VAULT_PASSWORD:-}" ]]; then
                    ssh ${ssh_opts} "${ssh_target}" "set -euo pipefail; umask 077; pwfile=\"\$(mktemp -t ansible-vault.XXXXXX)\"; cat >\"\${pwfile}\"; export ANSIBLE_VAULT_PASSWORD_FILE=\"\${pwfile}\"; cd /home/ci/homelab-proxmox/scripts/lab && HOTFIX_OVERRIDE='${{ github.event.inputs.hotfix_override }}' GIT_REF='${{ github.ref }}' GIT_REF_NAME='${{ github.ref_name }}' ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars VAULT_ID=lab ./pve-service-deploy apply --environment lab --service '${service}'; rm -f \"\${pwfile}\"" <<<"${ANSIBLE_VAULT_PASSWORD}"
                  else
                    ssh ${ssh_opts} "${ssh_target}" "cd /home/ci/homelab-proxmox/scripts/lab && HOTFIX_OVERRIDE='${{ github.event.inputs.hotfix_override }}' GIT_REF='${{ github.ref }}' GIT_REF_NAME='${{ github.ref_name }}' ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars VAULT_ID=lab ./pve-service-deploy apply --environment lab --service '${service}'"
                  fi

            - name: Capture RUN_ID (LAB apply)
              id: capture_run_id
              if: always()
              run: |
                  set -euo pipefail
                  service="${{ github.event.inputs.service }}"

                  ssh_target="ci@${PROXMOX_HOST:-pve}"
                  ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

                  RUN_ID="$(ssh ${ssh_opts} "${ssh_target}" "cd /var/lib/homelab-proxmox/artifacts/service-deploy-runs && ls -1t lab-${service}-* 2>/dev/null | head -1" | tr -d '\r\n')"
                  RUN_ID="${RUN_ID%:}"
                  test -n "${RUN_ID}"
                  echo "RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
                  echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

            - name: Fetch evidence pack (LAB apply)
              if: always()
              run: |
                  set -euo pipefail
                  mkdir -p evidence/lab

                  ssh_target="ci@${PROXMOX_HOST:-pve}"
                  ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

                  RUN_ID="${{ steps.capture_run_id.outputs.run_id }}"
                  test -n "${RUN_ID}"
                  ssh ${ssh_opts} "${ssh_target}" "tar czf /tmp/service-deploy-lab-apply.tgz -C /var/lib/homelab-proxmox/artifacts/service-deploy-runs \"${RUN_ID}\""
                  scp ${ssh_opts} "${ssh_target}:/tmp/service-deploy-lab-apply.tgz" evidence/lab/
                  tar xzf evidence/lab/service-deploy-lab-apply.tgz -C evidence/lab/

            - name: Verify evidence pack (offline)
              if: always()
              run: ./scripts/lab/ci-verify.sh evidence/lab/${{ steps.capture_run_id.outputs.run_id }}

            - name: Upload LAB evidence (plan + apply)
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: lab-evidence-${{ github.event.inputs.service }}-${{ needs.plan_lab.outputs.run_id }}-${{ steps.capture_run_id.outputs.run_id }}
                  path: evidence/lab/

    approve_prod:
        name: Approval (PROD)
        runs-on: [self-hosted]
        needs: [apply_lab]
        environment: prod
        steps:
            - name: Await PROD approval
              run: |
                  echo "Approved: proceeding to PROD plan/apply"

    plan_prod:
        name: Plan (PROD)
        runs-on: [self-hosted]
        needs: [approve_prod]
        outputs:
            run_id: ${{ steps.capture_run_id.outputs.run_id }}
            destructive: ${{ steps.detect_destructive.outputs.destructive }}
        steps:
            - uses: actions/checkout@v4

            - name: Allowlist runtime validation
              run: |
                  set -euo pipefail
                  service="${{ github.event.inputs.service }}"
                  jq -e --arg s "${service}" 'has($s)' ./scripts/lab/service-scope-allowlist.json >/dev/null

            - name: Sync repo to PVE
              run: |
                  set -euo pipefail
                  rsync -az --delete \
                    --exclude '.git' \
                    --exclude 'terraform/.terraform/' \
                    --exclude 'terraform/.terraform.lock.hcl' \
                    --exclude 'terraform/terraform.tfstate' \
                    --exclude 'terraform/terraform.tfstate.backup' \
                    --exclude 'scripts/lab/artifacts/' \
                    --exclude 'artifacts/' \
                    ./ "ci@${PROXMOX_HOST:-pve}:/home/ci/homelab-proxmox/"

            - name: Plan on PVE (PROD)
              id: plan_on_pve
              continue-on-error: true
              env:
                  ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
                  PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}
              run: |
                  set -euo pipefail

                  service="${{ github.event.inputs.service }}"

                  ssh_target="ci@${PROXMOX_HOST:-pve}"
                  ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

                  if [[ -n "${ANSIBLE_VAULT_PASSWORD:-}" ]]; then
                    payload="$(printf '%s\n%s' "${ANSIBLE_VAULT_PASSWORD}" "${PROXMOX_TOKEN_SECRET:-}")"
                    ssh ${ssh_opts} "${ssh_target}" "set -euo pipefail; umask 077; pwfile=\"\$(mktemp -t ansible-vault.XXXXXX)\"; tokfile=\"\$(mktemp -t proxmox-token.XXXXXX)\"; IFS= read -r vault_pw || true; cat >\"\${tokfile}\"; printf '%s' \"\${vault_pw}\" >\"\${pwfile}\"; export ANSIBLE_VAULT_PASSWORD_FILE=\"\${pwfile}\"; export PROXMOX_API_TOKEN_SECRET=\"\$(tr -d '\n' <\"\${tokfile}\")\"; cd /home/ci/homelab-proxmox/scripts/lab && HOTFIX_OVERRIDE='${{ github.event.inputs.hotfix_override }}' GIT_REF='${{ github.ref }}' GIT_REF_NAME='${{ github.ref_name }}' ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars VAULT_ID=prod ./pve-service-deploy plan --environment prod --service '${service}'; rm -f \"\${pwfile}\" \"\${tokfile}\"" <<<"${payload}"
                  else
                    ssh ${ssh_opts} "${ssh_target}" "cd /home/ci/homelab-proxmox/scripts/lab && PROXMOX_API_TOKEN_SECRET='${PROXMOX_TOKEN_SECRET:-}' HOTFIX_OVERRIDE='${{ github.event.inputs.hotfix_override }}' GIT_REF='${{ github.ref }}' GIT_REF_NAME='${{ github.ref_name }}' ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars VAULT_ID=prod ./pve-service-deploy plan --environment prod --service '${service}'"
                  fi

            - name: Capture RUN_ID (PROD plan)
              id: capture_run_id
              if: always()
              run: |
                  set -euo pipefail
                  service="${{ github.event.inputs.service }}"

                  ssh_target="ci@${PROXMOX_HOST:-pve}"
                  ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

                  RUN_ID="$(ssh ${ssh_opts} "${ssh_target}" "cd /var/lib/homelab-proxmox/artifacts/service-deploy-runs && ls -1t prod-${service}-* 2>/dev/null | head -1" | tr -d '\r\n')"
                  RUN_ID="${RUN_ID%:}"
                  test -n "${RUN_ID}"
                  echo "RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
                  echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

            - name: Fetch evidence pack (PROD plan)
              if: always()
              run: |
                  set -euo pipefail
                  mkdir -p evidence/prod

                  RUN_ID="${{ steps.capture_run_id.outputs.run_id }}"
                  test -n "${RUN_ID}"

                  ssh_target="ci@${PROXMOX_HOST:-pve}"
                  ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

                  ssh ${ssh_opts} "${ssh_target}" "tar czf /tmp/service-deploy-prod-plan.tgz -C /var/lib/homelab-proxmox/artifacts/service-deploy-runs \"${RUN_ID}\""
                  scp ${ssh_opts} "${ssh_target}:/tmp/service-deploy-prod-plan.tgz" evidence/prod/
                  tar xzf evidence/prod/service-deploy-prod-plan.tgz -C evidence/prod/

            - name: Verify evidence pack (offline)
              if: always()
              run: ./scripts/lab/ci-verify.sh evidence/prod/${{ steps.capture_run_id.outputs.run_id }}

            - name: Summarize PROD plan failure (preflight + plan)
              if: steps.plan_on_pve.outcome != 'success'
              run: |
                  set -euo pipefail
                  RUN_ID="${{ steps.capture_run_id.outputs.run_id }}"
                  test -n "${RUN_ID}"

                  echo "ERROR: PROD plan failed on PVE. Showing evidence excerpts."

                  echo "--- evidence/prod/${RUN_ID} (files) ---"
                  find "evidence/prod/${RUN_ID}" -maxdepth 4 -type f -print | sort || true

                  preflight="evidence/prod/${RUN_ID}/preflight.txt"
                  plan_txt="evidence/prod/${RUN_ID}/reports/plan/plan.txt"

                  echo "--- preflight.txt (error-ish lines) ---"
                  if [[ -f "${preflight}" ]]; then
                    grep -nE '(^ERROR:|^WARN:|Error:|error:|Failed|failed)' "${preflight}" | tail -n 200 || true
                  else
                    echo "MISSING: ${preflight}"
                  fi

                  echo "--- plan.txt (error-ish lines) ---"
                  if [[ -f "${plan_txt}" ]]; then
                    grep -nE '(^Error:|^ERROR:|error:|Error\b|Failed|failed|Forbidden|forbidden|No such file|not found)' "${plan_txt}" | tail -n 200 || true
                  else
                    echo "MISSING: ${plan_txt}"
                  fi

                  echo "--- preflight.txt (tail) ---"
                  tail -n 120 "${preflight}" 2>/dev/null || true

                  echo "--- plan.txt (tail) ---"
                  tail -n 200 "${plan_txt}" 2>/dev/null || true

            - name: Upload PROD plan evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: prod-plan-evidence-${{ github.event.inputs.service }}-${{ steps.capture_run_id.outputs.run_id }}
                  path: evidence/prod/

            - name: Detect destructive blast radius
              id: detect_destructive
              if: steps.plan_on_pve.outcome == 'success'
              run: |
                  set -euo pipefail
                  python3 - <<'PY'
                  import json
                  import os

                  run_id = os.environ.get('RUN_ID')
                  if not run_id:
                      raise SystemExit('Missing RUN_ID')

                  path = os.path.join('evidence', 'prod', run_id, 'blast-radius.json')
                  with open(path, 'r', encoding='utf-8') as f:
                      doc = json.load(f)

                  destructive = bool(doc.get('destructive'))
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
                      out.write(f"destructive={'true' if destructive else 'false'}\n")

                  print(f"destructive={destructive}")
                  PY

            - name: Enforce PROD destructive confirmation
              if: |
                  steps.plan_on_pve.outcome == 'success' &&
                  steps.detect_destructive.outputs.destructive == 'true' &&
                  github.event.inputs.confirm_destructive_prod != 'true'
              run: |
                  echo "ERROR: PROD plan is destructive (replace/destroy)." >&2
                  echo "Rerun with confirm_destructive_prod=true to proceed." >&2
                  exit 1

            - name: Fail job if PROD plan failed
              if: steps.plan_on_pve.outcome != 'success'
              run: |
                  echo "ERROR: PROD plan failed" >&2
                  exit 1

    apply_prod:
        name: Apply (PROD)
        runs-on: [self-hosted]
        needs: [plan_prod]
        concurrency:
            group: lxc-promote-prod-${{ github.event.inputs.service }}
            cancel-in-progress: false
        outputs:
            run_id: ${{ steps.capture_run_id.outputs.run_id }}
        steps:
            - uses: actions/checkout@v4

            - name: Allowlist runtime validation
              run: |
                  set -euo pipefail
                  service="${{ github.event.inputs.service }}"
                  jq -e --arg s "${service}" 'has($s)' ./scripts/lab/service-scope-allowlist.json >/dev/null

            - name: Sync repo to PVE
              run: |
                  set -euo pipefail
                  rsync -az --delete \
                    --exclude '.git' \
                    --exclude 'terraform/.terraform/' \
                    --exclude 'terraform/.terraform.lock.hcl' \
                    --exclude 'terraform/terraform.tfstate' \
                    --exclude 'terraform/terraform.tfstate.backup' \
                    --exclude 'scripts/lab/artifacts/' \
                    --exclude 'artifacts/' \
                    ./ "ci@${PROXMOX_HOST:-pve}:/home/ci/homelab-proxmox/"

            - name: Apply on PVE (PROD)
              id: apply_on_pve
              env:
                  ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
                  PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}
              run: |
                  set -euo pipefail

                  service="${{ github.event.inputs.service }}"

                  ssh_target="ci@${PROXMOX_HOST:-pve}"
                  ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

                  if [[ -n "${ANSIBLE_VAULT_PASSWORD:-}" ]]; then
                    payload="$(printf '%s\n%s' "${ANSIBLE_VAULT_PASSWORD}" "${PROXMOX_TOKEN_SECRET:-}")"
                    ssh ${ssh_opts} "${ssh_target}" "set -euo pipefail; umask 077; pwfile=\"\$(mktemp -t ansible-vault.XXXXXX)\"; tokfile=\"\$(mktemp -t proxmox-token.XXXXXX)\"; IFS= read -r vault_pw || true; cat >\"\${tokfile}\"; printf '%s' \"\${vault_pw}\" >\"\${pwfile}\"; export ANSIBLE_VAULT_PASSWORD_FILE=\"\${pwfile}\"; export PROXMOX_API_TOKEN_SECRET=\"\$(tr -d '\n' <\"\${tokfile}\")\"; cd /home/ci/homelab-proxmox/scripts/lab && HOTFIX_OVERRIDE='${{ github.event.inputs.hotfix_override }}' GIT_REF='${{ github.ref }}' GIT_REF_NAME='${{ github.ref_name }}' ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars ALLOW_PROD_APPLY=1 VAULT_ID=prod ./pve-service-deploy apply --environment prod --service '${service}' --confirm 'deploy-prod'; rm -f \"\${pwfile}\" \"\${tokfile}\"" <<<"${payload}"
                  else
                    ssh ${ssh_opts} "${ssh_target}" "cd /home/ci/homelab-proxmox/scripts/lab && PROXMOX_API_TOKEN_SECRET='${PROXMOX_TOKEN_SECRET:-}' HOTFIX_OVERRIDE='${{ github.event.inputs.hotfix_override }}' GIT_REF='${{ github.ref }}' GIT_REF_NAME='${{ github.ref_name }}' ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars ALLOW_PROD_APPLY=1 VAULT_ID=prod ./pve-service-deploy apply --environment prod --service '${service}' --confirm 'deploy-prod'"
                  fi

            - name: Capture RUN_ID (PROD apply)
              id: capture_run_id
              if: always()
              run: |
                  set -euo pipefail
                  service="${{ github.event.inputs.service }}"

                  ssh_target="ci@${PROXMOX_HOST:-pve}"
                  ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

                  RUN_ID="$(ssh ${ssh_opts} "${ssh_target}" "cd /var/lib/homelab-proxmox/artifacts/service-deploy-runs && ls -1t prod-${service}-* 2>/dev/null | head -1" | tr -d '\r\n')"
                  RUN_ID="${RUN_ID%:}"
                  test -n "${RUN_ID}"
                  echo "RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
                  echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

            - name: Fetch evidence pack (PROD apply)
              if: always()
              run: |
                  set -euo pipefail
                  mkdir -p evidence/prod

                  ssh_target="ci@${PROXMOX_HOST:-pve}"
                  ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

                  RUN_ID="${{ steps.capture_run_id.outputs.run_id }}"
                  test -n "${RUN_ID}"
                  ssh ${ssh_opts} "${ssh_target}" "tar czf /tmp/service-deploy-prod-apply.tgz -C /var/lib/homelab-proxmox/artifacts/service-deploy-runs \"${RUN_ID}\""
                  scp ${ssh_opts} "${ssh_target}:/tmp/service-deploy-prod-apply.tgz" evidence/prod/
                  tar xzf evidence/prod/service-deploy-prod-apply.tgz -C evidence/prod/

            - name: Verify evidence pack (offline)
              if: always()
              run: ./scripts/lab/ci-verify.sh evidence/prod/${{ steps.capture_run_id.outputs.run_id }}

            - name: Upload PROD evidence (plan + apply)
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: prod-evidence-${{ github.event.inputs.service }}-${{ needs.plan_prod.outputs.run_id }}-${{ steps.capture_run_id.outputs.run_id }}
                  path: evidence/prod/
