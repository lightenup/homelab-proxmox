name: Proxmox Apply + Verify

on:
  workflow_dispatch:
  # push trigger temporarily disabled

concurrency:
    # Shared with lab-rig.yml: both drive the same pve-lab VM (spec 095 R-015).
    group: pve-lab
    cancel-in-progress: false

jobs:
    apply:
        runs-on: [self-hosted]
        steps:
            - uses: actions/checkout@v4

            - name: Install rsync/ssh (act fallback)
              if: env.ACT == 'true'
              run: |
                  if ! command -v rsync >/dev/null 2>&1; then
                    apt-get update
                    apt-get install -y rsync openssh-client
                  fi

            - name: Validate CI IaC posture
              run: ./scripts/lab/ci-validate-iac.sh

            - name: Offline fixtures (pre-flight)
              run: ./scripts/lab/ci-verify.sh fixtures/evidence-packs/valid

            - name: Ensure artifact root on PVE
              run: |
                  SSH_USER=ci PROXMOX_HOST=pve ./scripts/lab/guardrails.sh ensure-artifacts

            - name: Sync repo to PVE
              run: |
                  rsync -az --delete \
                    --exclude '.git' \
                    --exclude 'scripts/lab/artifacts/' \
                    --exclude 'artifacts/' \
                    ./ ci@pve:/home/ci/homelab-proxmox/

            # The harness starts with CLEANUP-PRE-001, which destroys any lab VM. Outside a running
            # harness a lab VM is a kept LAB rig (lab-rig.yml), possibly mid-gate (spec 095 R-015).
            - name: Refuse while a kept LAB rig exists
              run: |
                  status="$(ssh ci@pve "cd /home/ci/homelab-proxmox/scripts/lab && ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ./pve-lab status")"
                  echo "${status}"
                  if grep -q 'Found Lab VM' <<<"${status}"; then
                    echo "::error::A kept LAB rig exists; run lab-rig.yml with action=down (confirm=destroy-lab-rig) first"
                    exit 1
                  fi

            - name: Apply + verify on PVE
              env:
                  ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
              run: |
                  vault_env=""
                  if [[ -n "${ANSIBLE_VAULT_PASSWORD:-}" ]]; then
                    # Forward vault secret to pve without printing it (bash %q keeps it shell-safe)
                    vault_env="ANSIBLE_VAULT_PASSWORD=$(printf '%q' "$ANSIBLE_VAULT_PASSWORD")"
                  fi
                  ssh ci@pve "cd /home/ci/homelab-proxmox/scripts/lab && ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ${vault_env} ./pve-lab rebuild --apply --verify --apply-sudoers"
                  echo "RUN_ID=$(ssh ci@pve 'ls -1t /var/lib/homelab-proxmox/artifacts/lab-runs | head -1')" >> $GITHUB_ENV

            - name: Sudo smoke checks
              run: |
                  ssh ci@pve <<'EOF'
                  set -e
                  sudo -n /usr/sbin/qm list >/dev/null
                  sudo -n /usr/bin/pveversion >/dev/null
                  if sudo -n bash -c 'echo should-fail' 2>/dev/null; then
                    echo "sudo allowed bash escalation (expected deny)"
                    exit 1
                  fi
                  EOF

            - name: Fetch evidence pack
              run: |
                  mkdir -p evidence
                  ssh ci@pve "tar czf /tmp/evidence.tgz -C /var/lib/homelab-proxmox/artifacts/lab-runs ${RUN_ID}"
                  scp ci@pve:/tmp/evidence.tgz evidence/
                  tar xzf evidence/evidence.tgz -C evidence/

            - name: Verify evidence pack (offline)
              run: ./scripts/lab/ci-verify.sh evidence/${RUN_ID}

            - name: Offline fixtures (post-deploy)
              run: ./scripts/lab/ci-verify.sh fixtures/evidence-packs/valid

            - uses: actions/upload-artifact@v4
              if: env.ACT != 'true'
              with:
                  name: evidence-${{ env.RUN_ID }}
                  # plan.tfplan holds every Terraform variable in plaintext; it stays on pve.
                  path: |
                    evidence
                    !evidence/**/*.tfplan
