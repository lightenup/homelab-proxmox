name: Prod 1 - LXC Promote
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to promote; workflow checks out this ref"
        required: true
        type: string
      service:
        description: "Service to promote"
        required: true
        type: choice
        options:
          - financial-scenario
          - eurooffice
          - hermes
          - market-model
          - homeassistant
          - immich
          - jellyfin
          - llm-router
          - monitoring
          - nextcloud
          - ntfy
          - reverse_proxy
      allow_override_failed_lab_gate:
        description: "Allow proceeding to PROD apply if LAB deploy or confidence suite fails"
        required: false
        type: boolean
        default: false
      confirm_destructive_lab:
        description: "Required when LAB plan is destructive: set to 'apply-lab-destructive'"
        required: false
        type: string
        default: ""
      run_confidence_suite:
        description: "Force-run the confidence suite even if the path gate would skip it (best-effort)"
        required: false
        type: boolean
        default: false

jobs:
  setup:
    name: Setup (ref + validations)
    runs-on: [self-hosted]
    outputs:
      checked_sha: ${{ steps.capture_sha.outputs.checked_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Fail fast on forbidden inputs
        run: |
          set -euo pipefail
          vals=(
            "${{ github.event.inputs.service }}"
            "${{ github.event.inputs.ref }}"
          )
          for v in "${vals[@]}"; do
            if [[ "${v}" == *"-target"* ]]; then
              echo "ERROR: Forbidden target-like input detected (-target)." >&2
              exit 1
            fi
          done

      - name: Allowlist runtime validation
        run: |
          set -euo pipefail
          service="${{ github.event.inputs.service }}"
          jq -e --arg s "${service}" 'has($s)' ./scripts/lab/service-scope-allowlist.json >/dev/null

      - name: Capture checked-out SHA
        id: capture_sha
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "checked_sha=${sha}" >>"$GITHUB_OUTPUT"
          echo "CHECKED_SHA=${sha}" >>"$GITHUB_ENV"

      - name: Publish recent commits (ref helper)
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.ref }}"
          sha="${{ steps.capture_sha.outputs.checked_sha }}"
          {
            echo "## Ref context"
            echo "- Ref input: \`${ref}\`"
            echo "- Checked-out SHA: \`${sha}\`"
            echo ""
            echo "### Recent commits (top 10)"
            echo "\`\`\`"
            git --no-pager log -n 10 --date=short --decorate=short --pretty=format:'%h %ad %s'
            echo "\`\`\`"
          } >>"$GITHUB_STEP_SUMMARY"

  confidence_gate:
    name: Confidence gate (path check)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read earlier promote runs and their metadata artifact (FR-009, the last verified SHA).
      actions: read
    needs: [setup]
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether the confidence suite must run
        id: decide
        env:
          FORCE: ${{ github.event.inputs.run_confidence_suite }}
          SHA: ${{ needs.setup.outputs.checked_sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          decide() {
            echo "run=$1" >>"$GITHUB_OUTPUT"
            echo "- Confidence gate: run=$1 ($2)" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # Operator force-run wins (FR-003).
          if [[ "${FORCE}" == "true" ]]; then
            decide true "forced by run_confidence_suite"
          fi

          # Fail-safe: no SHA to diff from ⇒ run (FR-007).
          if [[ -z "${SHA}" ]]; then
            decide true "no checked SHA"
          fi

          # Base, first choice (FR-009, 2026-10-18): the newest commit the suite actually
          # VERIFIED and that is an ancestor of SHA. The merge-base below is empty whenever
          # the promoted ref is main itself — the normal flow since PRs merge before they
          # promote — and the empty diff then always fell through to the fail-safe, so the
          # gate never skipped a promote of main. Diffing from the last verified commit also
          # covers provisioning changes merged to main but not yet promoted, which a
          # merge-base diff of a branch cannot see.
          #
          # "Verified" means the suite job concluded success AND the run's metadata records
          # suite_ok=true (the suite's steps are continue-on-error, so the job conclusion
          # alone does not say the suite passed). A skipped suite never counts. Metadata
          # past artifact retention is simply not found, which falls back below.
          verified=""
          run_ids="$(gh api "repos/${REPO}/actions/workflows/lxc-promote-prod.yml/runs?status=completed&per_page=30" \
            --jq '.workflow_runs[].id' 2>/dev/null || true)"
          for id in ${run_ids}; do
            ran="$(gh api "repos/${REPO}/actions/runs/${id}/jobs?per_page=30" \
              --jq '.jobs[] | select(.name == "Confidence suite (best-effort)") | .conclusion' 2>/dev/null || true)"
            [[ "${ran}" == "success" ]] || continue
            meta="$(mktemp -d)"
            gh run download "${id}" -R "${REPO}" -n prod-promotion-metadata -D "${meta}" >/dev/null 2>&1 || continue
            candidate="$(jq -r 'select(.suite_ok == "true") | .checked_sha // empty' "${meta}/promotion-metadata.json" 2>/dev/null || true)"
            if [[ -n "${candidate}" ]] && git merge-base --is-ancestor "${candidate}" "${SHA}" 2>/dev/null; then
              verified="${candidate}"
              echo "- Confidence gate: last verified ${verified:0:8} (promote run ${id})" >>"$GITHUB_STEP_SUMMARY"
              break
            fi
          done

          if [[ -n "${verified}" ]]; then
            # An empty diff here is a SHA the suite already passed on — a second service
            # promoted from the same commit — so it skips rather than fails safe.
            diff="$(git diff --name-only "${verified}" "${SHA}")" || decide true "diff from the verified commit failed"
          else
            # Fallback: the original 063 base (FR-001), with its fail-safes.
            base="$(git merge-base origin/main "${SHA}" 2>/dev/null || true)"
            if [[ -z "${base}" ]]; then
              decide true "no verified commit and no merge-base"
            fi
            diff="$(git diff --name-only "${base}" "${SHA}" 2>/dev/null || true)"
            if [[ -z "${diff}" ]]; then
              decide true "no verified commit and an empty merge-base diff"
            fi
          fi

          # Paths the confidence suite reads — specs/086-confidence-suite-trim (prefer false-run over false-skip).
          patterns="$(mktemp)"
          grep -vE '^[[:space:]]*(#|$)' scripts/ci/confidence-suite-paths.txt >"${patterns}" 2>/dev/null || true
          if [[ ! -s "${patterns}" ]]; then
            decide true "confidence-suite path list missing or empty"
          fi
          if printf '%s\n' "${diff}" | grep -qEf "${patterns}"; then
            decide true "confidence-suite paths changed"
          else
            decide false "no confidence-suite paths changed"
          fi

  apply_lab:
    name: Apply (LAB)
    runs-on: [self-hosted]
    needs: [setup]
    outputs:
      run_id: ${{ steps.capture_run_id.outputs.run_id }}
      ok: ${{ steps.outcome.outputs.ok }}
      sha_ok: ${{ steps.sha_check.outputs.sha_ok }}
    concurrency:
      group: lxc-promote-prod-lab-${{ github.event.inputs.service }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Sync repo to PVE
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'terraform/.terraform/' \
            --exclude 'terraform/.terraform.lock.hcl' \
            --exclude 'terraform/terraform.tfstate' \
            --exclude 'terraform/terraform.tfstate.backup' \
            --exclude 'scripts/lab/artifacts/' \
            --exclude 'artifacts/' \
            ./ "ci@${PROXMOX_HOST:-pve}:/home/ci/homelab-proxmox/"

      - name: Apply on PVE (LAB)
        id: apply_on_pve
        continue-on-error: true
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          PROXMOX_API_TOKEN_SECRET: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
        run: |
          set -euo pipefail

          service="${{ github.event.inputs.service }}"
          ref="${{ github.event.inputs.ref }}"
          checked_sha="${{ needs.setup.outputs.checked_sha }}"

          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          printf '%s\n%s\n' "${ANSIBLE_VAULT_PASSWORD:-}" "${PROXMOX_API_TOKEN_SECRET:-}" | \
          ssh ${ssh_opts} "${ssh_target}" "set -euo pipefail; umask 077; read -r _vault_pw; read -r _tf_secret; if [ -n \"\${_vault_pw}\" ]; then pwfile=\"\$(mktemp -t ansible-vault.XXXXXX)\"; printf '%s' \"\${_vault_pw}\" >\"\${pwfile}\"; export ANSIBLE_VAULT_PASSWORD_FILE=\"\${pwfile}\"; fi; if [ -n \"\${_tf_secret}\" ]; then export TF_VAR_proxmox_api_token_id='terraform@pve!terraform-token'; export TF_VAR_proxmox_api_token_secret=\"\${_tf_secret}\"; export PROXMOX_API_TOKEN_SECRET=\"\${_tf_secret}\"; fi; cd /home/ci/homelab-proxmox && git fetch --all --tags --prune && git checkout --force '${checked_sha}' && git reset --hard '${checked_sha}'; cd /home/ci/homelab-proxmox/scripts/lab && GIT_REF='${ref}' GIT_REF_NAME='${ref}' GIT_SHA='${checked_sha}' ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars VAULT_ID=lab ./pve-service-deploy apply --environment lab --service '${service}'; rm -f \"\${pwfile:-}\""

      - name: Capture RUN_ID (LAB apply)
        id: capture_run_id
        if: always()
        run: |
          set -euo pipefail
          service="${{ github.event.inputs.service }}"

          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          RUN_ID="$(ssh ${ssh_opts} "${ssh_target}" "cd /var/lib/homelab-proxmox/artifacts/service-deploy-runs && ls -1td \"lab-${service}-\"*/ 2>/dev/null | head -1 | sed 's:/*$::'" | tr -d '\r\n')"
          RUN_ID="${RUN_ID%/}"
          RUN_ID="${RUN_ID%:}"
          test -n "${RUN_ID}"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Fetch evidence pack (LAB apply)
        if: always()
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.capture_run_id.outputs.run_id }}"
          test -n "${RUN_ID}"
          ./scripts/lab/fetch_evidence_pack.sh --environment lab --run-id "${RUN_ID}" >/dev/null

      - name: Verify evidence pack (offline)
        id: verify_evidence
        if: always()
        run: |
          set -euo pipefail
          run_id="${{ steps.capture_run_id.outputs.run_id }}"
          ./scripts/lab/ci-verify.sh "evidence/lab/${run_id}"
          summary="evidence/lab/${run_id}/summary.json"
          verified=false
          if [[ -f "${summary}" ]]; then
            status="$(jq -r '.verification.status // empty' "${summary}" 2>/dev/null || true)"
            if [[ "${status}" == "PASS" ]]; then
              verified=true
            fi
          fi
          echo "verified=${verified}" >>"$GITHUB_OUTPUT"

      - name: Validate LAB apply evidence SHA
        id: sha_check
        if: always()
        run: |
          set -euo pipefail

          run_id="${{ steps.capture_run_id.outputs.run_id }}"
          checked_sha="${{ needs.setup.outputs.checked_sha }}"
          prov="evidence/lab/${run_id}/provenance.json"

          sha_ok=false
          got=""
          if [[ -f "${prov}" ]]; then
            got="$(jq -r '.git_sha // empty' "${prov}" 2>/dev/null || true)"
          fi

          if [[ -n "${got}" ]]; then
            if [[ "${checked_sha}" == "${got}" || "${checked_sha}" == "${got}"* || "${got}" == "${checked_sha}"* ]]; then
              sha_ok=true
            fi
          fi

          echo "sha_ok=${sha_ok}" >>"$GITHUB_OUTPUT"

          if [[ "${sha_ok}" != "true" ]]; then
            ./scripts/lab/render_github_annotations.sh \
              --level error \
              --title "LAB apply provenance SHA mismatch" \
              --message "LAB apply evidence git SHA did not match checked-out SHA. expected=${checked_sha} got=${got:-missing}"
          fi

      - name: Record LAB apply outcome
        id: outcome
        if: always()
        run: |
          set -euo pipefail
          ok=false
          sha_ok="${{ steps.sha_check.outputs.sha_ok }}"
          if [[ "${sha_ok}" == "true" ]]; then
            if [[ "${{ steps.apply_on_pve.outcome }}" == "success" ]]; then
              ok=true
            elif [[ "${{ steps.verify_evidence.outputs.verified }}" == "true" ]]; then
              ok=true
            fi
          fi
          echo "ok=${ok}" >>"$GITHUB_OUTPUT"

      - name: Summarize LAB apply outcome
        if: always()
        run: |
          set -euo pipefail
          outcome="${{ steps.apply_on_pve.outcome }}"
          run_id="${{ steps.capture_run_id.outputs.run_id }}"

          if [[ "${outcome}" != "success" ]]; then
            ./scripts/lab/render_github_annotations.sh \
              --level error \
              --title "LAB apply failed" \
              --message "LAB apply failed. See evidence pack for details (RUN_ID=${run_id})."
            {
              echo "## LAB apply failed"
              echo "- RUN_ID: \`${run_id}\`"
              echo "- Evidence dir: \`/var/lib/homelab-proxmox/artifacts/service-deploy-runs/${run_id}\`"
            } >>"$GITHUB_STEP_SUMMARY"

            bash ./scripts/lab/render_failure_evidence.sh \
              --evidence-dir "evidence/lab/${run_id}" \
              --max-lines 120 >>"$GITHUB_STEP_SUMMARY" || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-pipeline-lab-apply-evidence-${{ github.event.inputs.service }}-${{ steps.capture_run_id.outputs.run_id }}
          # plan.tfplan holds every Terraform variable in plaintext; it stays on pve.
          path: |
            evidence/lab/${{ steps.capture_run_id.outputs.run_id }}
            !evidence/lab/${{ steps.capture_run_id.outputs.run_id }}/**/*.tfplan

  confidence_suite:
    name: Confidence suite (best-effort)
    runs-on: [self-hosted]
    needs: [setup, apply_lab, confidence_gate]
    if: ${{ needs.confidence_gate.outputs.run == 'true' }}
    outputs:
      run_id: ${{ steps.suite_on_pve.outputs.run_id }}
      ok: ${{ steps.outcome.outputs.ok }}
      sha_ok: ${{ steps.sha_check.outputs.sha_ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Sync repo to PVE
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'scripts/lab/artifacts/' \
            --exclude 'artifacts/' \
            ./ "ci@${PROXMOX_HOST:-pve}:/home/ci/homelab-proxmox/"

      # pve-lab confidence (via pve-lab run) starts with CLEANUP-PRE-001, which destroys any lab
      # VM, so an unguarded run here would kill a LAB rig mid-gate (spec 095 R-016, condition 3;
      # same guard and message as .github/workflows/proxmox-apply.yml).
      - name: Refuse while a kept LAB rig exists
        run: |
          status="$(ssh ci@pve "cd /home/ci/homelab-proxmox/scripts/lab && ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ./pve-lab status")"
          echo "${status}"
          if grep -q 'Found Lab VM' <<<"${status}"; then
            echo "::error::A kept LAB rig exists; run lab-rig.yml with action=down (confirm=destroy-lab-rig) first"
            exit 1
          fi

      - name: Run confidence suite on PVE
        id: suite_on_pve
        continue-on-error: true
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          set -euo pipefail

          ref="${{ github.event.inputs.ref }}"
          checked_sha="${{ needs.setup.outputs.checked_sha }}"

          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          log_file="${RUNNER_TEMP}/confidence-suite-${GITHUB_RUN_ID}.log"
          rm -f "${log_file}" || true

          set +e
          if [[ -n "${ANSIBLE_VAULT_PASSWORD:-}" ]]; then
            ssh ${ssh_opts} "${ssh_target}" "set -euo pipefail; umask 077; pwfile=\"\$(mktemp -t ansible-vault.XXXXXX)\"; cat >\"\${pwfile}\"; export ANSIBLE_VAULT_PASSWORD=\"\$(cat \"\${pwfile}\")\"; rm -f \"\${pwfile}\"; cd /home/ci/homelab-proxmox/scripts/lab && CI_EMIT_RUN_ID=1 LOCK_WAIT_SECONDS=300 GIT_REF='${ref}' GIT_REF_NAME='${ref}' GIT_SHA='${checked_sha}' ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=lab-runs ./pve-lab confidence" <<<"${ANSIBLE_VAULT_PASSWORD}" 2>&1 | tee "${log_file}"
          else
            ssh ${ssh_opts} "${ssh_target}" "set -euo pipefail; cd /home/ci/homelab-proxmox/scripts/lab && CI_EMIT_RUN_ID=1 LOCK_WAIT_SECONDS=300 GIT_REF='${ref}' GIT_REF_NAME='${ref}' GIT_SHA='${checked_sha}' ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=lab-runs ./pve-lab confidence" 2>&1 | tee "${log_file}"
          fi
          rc=${PIPESTATUS[0]}
          set -e

          run_id="$(grep -E '^RUN_ID=' "${log_file}" | tail -1 | cut -d= -f2- | tr -d '\r\n')"
          echo "run_id=${run_id}" >>"$GITHUB_OUTPUT"

          exit ${rc}

      - name: Fetch evidence pack (confidence suite)
        if: always()
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.suite_on_pve.outputs.run_id }}"
          if [[ -z "${RUN_ID}" ]]; then
            echo "No RUN_ID captured for confidence suite; skipping evidence fetch."
            exit 0
          fi
          ARTIFACT_RUNS_DIR=lab-runs ./scripts/lab/fetch_evidence_pack.sh --environment lab --run-id "${RUN_ID}" >/dev/null

      - name: Verify evidence pack (offline)
        if: always()
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.suite_on_pve.outputs.run_id }}"
          if [[ -z "${RUN_ID}" ]]; then
            echo "No RUN_ID captured for confidence suite; skipping offline verification."
            exit 0
          fi
          ./scripts/lab/ci-verify.sh "evidence/lab/${RUN_ID}"

      - name: Validate confidence suite evidence SHA
        id: sha_check
        if: always()
        run: |
          set -euo pipefail

          run_id="${{ steps.suite_on_pve.outputs.run_id }}"
          checked_sha="${{ needs.setup.outputs.checked_sha }}"
          prov=""
          if [[ -n "${run_id}" ]]; then
            prov="evidence/lab/${run_id}/provenance.json"
          fi

          sha_ok=false
          got=""
          if [[ -n "${prov}" && -f "${prov}" ]]; then
            got="$(jq -r '.git.commit // empty' "${prov}" 2>/dev/null || true)"
          fi

          if [[ -n "${got}" ]]; then
            if [[ "${checked_sha}" == "${got}" || "${checked_sha}" == "${got}"* || "${got}" == "${checked_sha}"* ]]; then
              sha_ok=true
            fi
          fi

          echo "sha_ok=${sha_ok}" >>"$GITHUB_OUTPUT"

          if [[ "${sha_ok}" != "true" ]]; then
            ./scripts/lab/render_github_annotations.sh \
              --level error \
              --title "Confidence suite provenance SHA mismatch" \
              --message "Confidence suite evidence git commit did not match checked-out SHA. expected=${checked_sha} got=${got:-missing} run_id=${run_id:-missing}"
          fi

      - name: Record confidence suite outcome
        id: outcome
        if: always()
        run: |
          set -euo pipefail
          ok=false
          if [[ "${{ steps.suite_on_pve.outcome }}" == "success" && "${{ steps.sha_check.outputs.sha_ok }}" == "true" ]]; then
            ok=true
          fi
          echo "ok=${ok}" >>"$GITHUB_OUTPUT"

      - name: Summarize confidence suite outcome
        if: always()
        run: |
          set -euo pipefail
          outcome="${{ steps.suite_on_pve.outcome }}"
          run_id="${{ steps.suite_on_pve.outputs.run_id }}"
          if [[ "${outcome}" != "success" ]]; then
            ./scripts/lab/render_github_annotations.sh \
              --level error \
              --title "Confidence suite failed" \
              --message "Confidence suite failed. See evidence pack for details (RUN_ID=${run_id})."
            {
              echo "## Confidence suite failed"
              echo "- RUN_ID: \`${run_id}\`"
              echo "- Evidence dir: \`/var/lib/homelab-proxmox/artifacts/lab-runs/${run_id}\`"
            } >>"$GITHUB_STEP_SUMMARY"

            bash ./scripts/lab/render_failure_evidence.sh \
              --evidence-dir "evidence/lab/${run_id}" \
              --max-lines 120 >>"$GITHUB_STEP_SUMMARY" || true
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.suite_on_pve.outputs.run_id != '' }}
        with:
          name: prod-pipeline-confidence-evidence-${{ steps.suite_on_pve.outputs.run_id }}
          # plan.tfplan holds every Terraform variable in plaintext; it stays on pve.
          path: |
            evidence/lab/${{ steps.suite_on_pve.outputs.run_id }}
            !evidence/lab/${{ steps.suite_on_pve.outputs.run_id }}/**/*.tfplan

  plan_prod:
    name: Plan (PROD)
    runs-on: [self-hosted]
    needs: [setup]
    if: always()
    outputs:
      run_id: ${{ steps.capture_run_id.outputs.run_id }}
      ok: ${{ steps.outcome.outputs.ok }}
      sha_ok: ${{ steps.sha_check.outputs.sha_ok }}
      destructive: ${{ steps.plan_flags.outputs.destructive }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Sync repo to PVE
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'terraform/.terraform/' \
            --exclude 'terraform/.terraform.lock.hcl' \
            --exclude 'terraform/terraform.tfstate' \
            --exclude 'terraform/terraform.tfstate.backup' \
            --exclude 'scripts/lab/artifacts/' \
            --exclude 'artifacts/' \
            ./ "ci@${PROXMOX_HOST:-pve}:/home/ci/homelab-proxmox/"

      - name: Plan on PVE (PROD)
        id: plan_on_pve
        continue-on-error: true
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          PROXMOX_API_TOKEN_SECRET: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
        run: |
          set -euo pipefail

          service="${{ github.event.inputs.service }}"
          ref="${{ github.event.inputs.ref }}"
          checked_sha="${{ needs.setup.outputs.checked_sha }}"

          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          printf '%s\n%s\n' "${ANSIBLE_VAULT_PASSWORD:-}" "${PROXMOX_API_TOKEN_SECRET:-}" | \
          ssh ${ssh_opts} "${ssh_target}" "set -euo pipefail; umask 077; read -r _vault_pw; read -r _tf_secret; if [ -n \"\${_vault_pw}\" ]; then pwfile=\"\$(mktemp -t ansible-vault.XXXXXX)\"; printf '%s' \"\${_vault_pw}\" >\"\${pwfile}\"; export ANSIBLE_VAULT_PASSWORD_FILE=\"\${pwfile}\"; fi; if [ -n \"\${_tf_secret}\" ]; then export TF_VAR_proxmox_api_token_id='terraform@pve!terraform-token'; export TF_VAR_proxmox_api_token_secret=\"\${_tf_secret}\"; export PROXMOX_API_TOKEN_SECRET=\"\${_tf_secret}\"; fi; cd /home/ci/homelab-proxmox && git fetch --all --tags --prune && git checkout --force '${checked_sha}' && git reset --hard '${checked_sha}'; cd /home/ci/homelab-proxmox/scripts/lab && GIT_REF='${ref}' GIT_REF_NAME='${ref}' GIT_SHA='${checked_sha}' ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars VAULT_ID=prod ./pve-service-deploy plan --environment prod --service '${service}'; rm -f \"\${pwfile:-}\""

      - name: Capture RUN_ID (PROD plan)
        id: capture_run_id
        if: always()
        run: |
          set -euo pipefail
          service="${{ github.event.inputs.service }}"

          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          RUN_ID="$(ssh ${ssh_opts} "${ssh_target}" "cd /var/lib/homelab-proxmox/artifacts/service-deploy-runs && ls -1td \"prod-${service}-\"*/ 2>/dev/null | head -1 | sed 's:/*$::'" | tr -d '\r\n')"
          RUN_ID="${RUN_ID%/}"
          RUN_ID="${RUN_ID%:}"
          test -n "${RUN_ID}"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Fetch evidence pack (PROD plan)
        if: always()
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.capture_run_id.outputs.run_id }}"
          test -n "${RUN_ID}"
          ./scripts/lab/fetch_evidence_pack.sh --environment prod --run-id "${RUN_ID}" >/dev/null

      - name: Verify evidence pack (offline)
        if: always()
        run: ./scripts/lab/ci-verify.sh evidence/prod/${{ steps.capture_run_id.outputs.run_id }}

      - name: Validate PROD plan evidence SHA
        id: sha_check
        if: always()
        run: |
          set -euo pipefail

          run_id="${{ steps.capture_run_id.outputs.run_id }}"
          checked_sha="${{ needs.setup.outputs.checked_sha }}"
          prov="evidence/prod/${run_id}/provenance.json"

          sha_ok=false
          got=""
          if [[ -f "${prov}" ]]; then
            got="$(jq -r '.git_sha // empty' "${prov}" 2>/dev/null || true)"
          fi

          if [[ -n "${got}" ]]; then
            if [[ "${checked_sha}" == "${got}" || "${checked_sha}" == "${got}"* || "${got}" == "${checked_sha}"* ]]; then
              sha_ok=true
            fi
          fi

          echo "sha_ok=${sha_ok}" >>"$GITHUB_OUTPUT"

          if [[ "${sha_ok}" != "true" ]]; then
            ./scripts/lab/render_github_annotations.sh \
              --level error \
              --title "PROD plan provenance SHA mismatch" \
              --message "PROD plan evidence git SHA did not match checked-out SHA. expected=${checked_sha} got=${got:-missing}"
          fi

      - name: Compute PROD plan flags (destructive)
        id: plan_flags
        if: always()
        run: |
          set -euo pipefail
          run_id="${{ steps.capture_run_id.outputs.run_id }}"
          blast="evidence/prod/${run_id}/blast-radius.json"

          destructive=false
          if [[ -f "${blast}" ]]; then
            destructive="$(jq -r '.destructive // false' "${blast}" 2>/dev/null || echo false)"
          fi
          if [[ "${destructive}" != "true" ]]; then
            destructive=false
          fi
          echo "destructive=${destructive}" >>"$GITHUB_OUTPUT"

      - name: Generate PROD plan UI summary JSON
        if: steps.plan_on_pve.outcome == 'success'
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.capture_run_id.outputs.run_id }}"
          python3 ./scripts/lab/plan_ui_summary.py \
            --blast-radius "evidence/prod/${RUN_ID}/blast-radius.json" \
            --output "evidence/prod/${RUN_ID}/plan-ui-summary.json" \
            --limit 50

      - name: Publish PROD plan summary to run UI
        if: steps.plan_on_pve.outcome == 'success'
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.capture_run_id.outputs.run_id }}"
          ./scripts/lab/render_github_summary.sh "evidence/prod/${RUN_ID}/plan-ui-summary.json" >>"$GITHUB_STEP_SUMMARY"

          plan_json="evidence/prod/${RUN_ID}/reports/plan/plan.json"
          if [[ -f "${plan_json}" ]]; then
            {
              echo ""
              echo "## Planned Terraform changes (PROD)"
              echo "(From saved plan evidence; no values printed)"
              echo ""
              echo "\`\`\`"
              python3 ./scripts/lab/render_plan_changes.py \
                --plan-json "${plan_json}" \
                --max-resources 50 \
                --max-paths 12 \
                --max-lines 120 2>/dev/null || true
              echo "\`\`\`"
            } >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Record PROD plan outcome
        id: outcome
        if: always()
        run: |
          set -euo pipefail
          ok=false
          if [[ "${{ steps.plan_on_pve.outcome }}" == "success" && "${{ steps.sha_check.outputs.sha_ok }}" == "true" ]]; then
            ok=true
          fi
          echo "ok=${ok}" >>"$GITHUB_OUTPUT"

      - name: Fail job if PROD plan failed or SHA mismatched
        if: steps.plan_on_pve.outcome != 'success' || steps.sha_check.outputs.sha_ok != 'true'
        run: |
          echo "ERROR: PROD plan failed or evidence SHA mismatched" >&2
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-pipeline-prod-plan-evidence-${{ github.event.inputs.service }}-${{ steps.capture_run_id.outputs.run_id }}
          # plan.tfplan holds every Terraform variable in plaintext; it stays on pve.
          path: |
            evidence/prod/${{ steps.capture_run_id.outputs.run_id }}
            !evidence/prod/${{ steps.capture_run_id.outputs.run_id }}/**/*.tfplan

  summarize_before_approval:
    name: Summary (before approval)
    runs-on: [self-hosted]
    needs: [setup, apply_lab, confidence_suite, plan_prod]
    if: always()
    outputs:
      lab_ok: ${{ steps.compute_gate.outputs.lab_ok }}
      suite_ok: ${{ steps.compute_gate.outputs.suite_ok }}
      lab_gate_failed: ${{ steps.compute_gate.outputs.lab_gate_failed }}
      sha_all_ok: ${{ steps.compute_gate.outputs.sha_all_ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Fetch evidence packs (for summary)
        if: always()
        run: |
          set -euo pipefail

          lab_run_id="${{ needs.apply_lab.outputs.run_id }}"
          suite_run_id="${{ needs.confidence_suite.outputs.run_id }}"
          prod_plan_run_id="${{ needs.plan_prod.outputs.run_id }}"

          if [[ -n "${lab_run_id}" ]]; then
            ./scripts/lab/fetch_evidence_pack.sh --environment lab --run-id "${lab_run_id}" >/dev/null || true
          fi

          if [[ -n "${suite_run_id}" ]]; then
            ARTIFACT_RUNS_DIR=lab-runs ./scripts/lab/fetch_evidence_pack.sh --environment lab --run-id "${suite_run_id}" >/dev/null || true
          fi

          if [[ -n "${prod_plan_run_id}" ]]; then
            ./scripts/lab/fetch_evidence_pack.sh --environment prod --run-id "${prod_plan_run_id}" >/dev/null || true
          fi

      - name: Compute LAB gate state
        id: compute_gate
        run: |
          set -euo pipefail
          lab_ok="${{ needs.apply_lab.outputs.ok }}"
          suite_ok="${{ needs.confidence_suite.outputs.ok }}"

          lab_sha_ok="${{ needs.apply_lab.outputs.sha_ok }}"
          suite_sha_ok="${{ needs.confidence_suite.outputs.sha_ok }}"
          plan_sha_ok="${{ needs.plan_prod.outputs.sha_ok }}"

          # A path-gated skip is a pass, not a failure: a skipped job emits empty
          # outputs, so without this both suite_ok and suite_sha_ok would wrongly
          # read as not-true and block PROD apply. See specs/063-ci-confidence-path-gate/spec.md (FR-005).
          if [[ "${{ needs.confidence_suite.result }}" == "skipped" ]]; then
            suite_ok=true
            suite_sha_ok=true
          fi

          lab_gate_failed=false
          if [[ "${lab_ok}" != "true" || "${suite_ok}" != "true" ]]; then
            lab_gate_failed=true
          fi

          sha_all_ok=false
          if [[ "${lab_sha_ok}" == "true" && "${suite_sha_ok}" == "true" && "${plan_sha_ok}" == "true" ]]; then
            sha_all_ok=true
          fi

          echo "lab_ok=${lab_ok}" >>"$GITHUB_OUTPUT"
          echo "suite_ok=${suite_ok}" >>"$GITHUB_OUTPUT"
          echo "lab_gate_failed=${lab_gate_failed}" >>"$GITHUB_OUTPUT"
          echo "sha_all_ok=${sha_all_ok}" >>"$GITHUB_OUTPUT"

      - name: Publish combined run summary
        if: always()
        run: |
          set -euo pipefail

          service="${{ github.event.inputs.service }}"
          ref="${{ github.event.inputs.ref }}"
          checked_sha="${{ needs.setup.outputs.checked_sha }}"

          lab_run_id="${{ needs.apply_lab.outputs.run_id }}"
          suite_run_id="${{ needs.confidence_suite.outputs.run_id }}"
          prod_plan_run_id="${{ needs.plan_prod.outputs.run_id }}"

          lab_ok="${{ needs.apply_lab.outputs.ok }}"
          suite_ok="${{ needs.confidence_suite.outputs.ok }}"
          lab_gate_failed="${{ steps.compute_gate.outputs.lab_gate_failed }}"

          lab_sha_ok="${{ needs.apply_lab.outputs.sha_ok }}"
          suite_sha_ok="${{ needs.confidence_suite.outputs.sha_ok }}"
          plan_sha_ok="${{ needs.plan_prod.outputs.sha_ok }}"
          sha_all_ok="${{ steps.compute_gate.outputs.sha_all_ok }}"

          destructive="${{ needs.plan_prod.outputs.destructive }}"
          override="${{ github.event.inputs.allow_override_failed_lab_gate }}"

          {
            echo "## PROD promotion pipeline (pre-approval)"
            echo "- Service: \`${service}\`"
            echo "- Ref: \`${ref}\`"
            echo "- Checked-out SHA: \`${checked_sha}\`"
            echo "- LAB apply RUN_ID: \`${lab_run_id}\` (ok=${lab_ok})"
            echo "- Confidence suite RUN_ID: \`${suite_run_id}\` (ok=${suite_ok})"
            echo "- PROD plan RUN_ID (plan reference): \`${prod_plan_run_id}\`"
            echo "- SHA alignment (lab/suite/plan): ${lab_sha_ok}/${suite_sha_ok}/${plan_sha_ok}"
            echo "- PROD plan destructive: ${destructive:-unknown}"
          } >>"$GITHUB_STEP_SUMMARY"

          # Approval-friendly effective change summary from evidence packs.
          python3 ./scripts/lab/render_effective_changes_summary.py \
            --service "${service}" \
            --lab-evidence "evidence/lab/${lab_run_id}" \
            --prod-plan-evidence "evidence/prod/${prod_plan_run_id}" \
            >>"$GITHUB_STEP_SUMMARY" || true

          if [[ "${lab_gate_failed}" == "true" ]]; then
            {
              echo ""
              echo "### LAB gate failed"
              echo "LAB deploy and/or confidence suite failed. PROD plan is still available above."
              echo "To allow PROD apply, re-run with allow_override_failed_lab_gate=true (and still approve the PROD environment)."
            } >>"$GITHUB_STEP_SUMMARY"
          fi

          if [[ "${sha_all_ok}" != "true" ]]; then
            {
              echo ""
              echo "### SHA alignment failed"
              echo "One or more stages produced evidence that does not match the checked-out SHA."
              echo "Approval/apply will be blocked until this is resolved."
            } >>"$GITHUB_STEP_SUMMARY"
          fi

          if [[ "${destructive}" == "true" && "${override}" != "true" ]]; then
            {
              echo ""
              echo "### Destructive PROD plan"
              echo "This PROD plan is destructive. Review carefully before running the manual PROD apply workflow."
            } >>"$GITHUB_STEP_SUMMARY"
          fi

          {
            echo ""
            echo "### Next step: manual PROD apply"
            echo "This repo's billing plan does not support GitHub Environment required reviewers, so we cannot pause interactively in-workflow."
            echo "To deploy, run the 'LXC Apply (PROD)' workflow with:"
            echo "- promotion_run_id: ${{ github.run_id }}"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Write promotion metadata (for manual apply workflow)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p promotion-metadata
          cat > promotion-metadata/promotion-metadata.json <<'JSON'
          {
            "promotion_run_id": "${{ github.run_id }}",
            "service": "${{ github.event.inputs.service }}",
            "ref": "${{ github.event.inputs.ref }}",
            "checked_sha": "${{ needs.setup.outputs.checked_sha }}",
            "lab_run_id": "${{ needs.apply_lab.outputs.run_id }}",
            "suite_run_id": "${{ needs.confidence_suite.outputs.run_id }}",
            "lab_ok": "${{ needs.apply_lab.outputs.ok }}",
            "suite_ok": "${{ needs.confidence_suite.outputs.ok }}",
            "lab_gate_failed": "${{ steps.compute_gate.outputs.lab_gate_failed }}",
            "sha_all_ok": "${{ steps.compute_gate.outputs.sha_all_ok }}",
            "prod_plan_run_id": "${{ needs.plan_prod.outputs.run_id }}",
            "prod_plan_ok": "${{ needs.plan_prod.outputs.ok }}",
            "prod_plan_sha_ok": "${{ needs.plan_prod.outputs.sha_ok }}",
            "prod_plan_destructive": "${{ needs.plan_prod.outputs.destructive }}"
          }
          JSON

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-promotion-metadata
          path: promotion-metadata/promotion-metadata.json
