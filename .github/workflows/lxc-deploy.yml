name: DEPRECATED - LXC Deploy (Gated)

"on":
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target environment"
        required: true
        type: choice
        options:
          - lab
          - prod
      service:
        description: "Service slug (e.g. jellyfin)"
        required: true
        type: string
      confirm:
        description: "Only for prod: type 'deploy-prod'"
        required: false
        type: string
      confirm_destructive:
        description: "Only when plan has replace/destroy: lab='apply-lab-destructive', prod='deploy-prod-destructive'"
        required: false
        type: string

jobs:
  plan:
    name: Plan (no changes)
    runs-on: [self-hosted]
    outputs:
      run_id: ${{ steps.capture_run_id.outputs.run_id }}
      destructive: ${{ steps.detect_destructive.outputs.destructive }}
    steps:
      - uses: actions/checkout@v4

      - name: Deprecation notice
        run: |
          echo "WARNING: This workflow is deprecated." >&2
          echo "Use: 'LXC Deploy (LAB)' (.github/workflows/lxc-deploy-lab.yml)" >&2
          echo "  or: 'LXC Promote (LAB → PROD)' (.github/workflows/lxc-promote.yml)" >&2

      - name: Fail fast on forbidden inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          vals=(
            "${{ github.event.inputs.service }}"
            "${{ github.event.inputs.confirm }}"
            "${{ github.event.inputs.confirm_destructive }}"
          )
          for v in "${vals[@]}"; do
            if [[ "${v}" == *"-target"* ]]; then
              echo "ERROR: Forbidden target-like input detected (-target)." >&2
              exit 1
            fi
          done

      - name: Install rsync/ssh (act fallback)
        if: env.ACT == 'true'
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            apt-get update
            apt-get install -y rsync openssh-client
          fi

      - name: Validate CI IaC posture
        run: ./scripts/lab/ci-validate-iac.sh

      - name: Offline fixtures (pre-flight)
        run: ./scripts/lab/ci-verify.sh fixtures/evidence-packs/valid

      - name: Ensure artifact root on PVE
        run: |
          SSH_USER=ci PROXMOX_HOST="${PROXMOX_HOST:-pve}" ./scripts/lab/guardrails.sh ensure-artifacts

      - name: Least privilege smoke checks (PVE)
        run: |
          set -euo pipefail
          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          who="$(ssh ${ssh_opts} "${ssh_target}" 'whoami')"
          if [[ "${who}" == "root" ]]; then
            echo "ERROR: remote whoami returned root; refusing"
            exit 1
          fi
          ssh ${ssh_opts} "${ssh_target}" 'id'
          ssh ${ssh_opts} "${ssh_target}" 'sudo -n -l || true'

          # Deny shell escalation via sudo.
          if ssh ${ssh_opts} "${ssh_target}" 'sudo -n bash -lc "true"' >/dev/null 2>&1; then
            echo "ERROR: sudo allows launching a shell (sudo -n bash)"
            exit 1
          fi

      - name: Sync repo to PVE
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'terraform/.terraform/' \
            --exclude 'terraform/.terraform.lock.hcl' \
            --exclude 'terraform/terraform.tfstate' \
            --exclude 'terraform/terraform.tfstate.backup' \
            --exclude 'scripts/lab/artifacts/' \
            --exclude 'artifacts/' \
            ./ "ci@${PROXMOX_HOST:-pve}:/home/ci/homelab-proxmox/"

      - name: Plan on PVE
        id: plan_on_pve
        continue-on-error: true
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          environment="lab"
          service="jellyfin"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            environment="${{ github.event.inputs.environment }}"
            service="${{ github.event.inputs.service }}"
          fi

          if [[ -n "${ANSIBLE_VAULT_PASSWORD:-}" ]]; then
            # Avoid placing secrets in the SSH command line; stream via stdin into a temp file.
            ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"
            ssh ${ssh_opts} "ci@${PROXMOX_HOST:-pve}" "set -euo pipefail; umask 077; pwfile=\"\$(mktemp -t ansible-vault.XXXXXX)\"; cat >\"\${pwfile}\"; export ANSIBLE_VAULT_PASSWORD_FILE=\"\${pwfile}\"; cd /home/ci/homelab-proxmox/scripts/lab && ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars VAULT_ID='${environment}' ./pve-service-deploy plan --environment '${environment}' --service '${service}'; rm -f \"\${pwfile}\"" <<<"${ANSIBLE_VAULT_PASSWORD}"
          else
            ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"
            ssh ${ssh_opts} "ci@${PROXMOX_HOST:-pve}" "cd /home/ci/homelab-proxmox/scripts/lab && ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars VAULT_ID='${environment}' ./pve-service-deploy plan --environment '${environment}' --service '${service}'"
          fi

      - name: Capture RUN_ID
        id: capture_run_id
        if: always()
        run: |
          set -euo pipefail
          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"
          RUN_ID="$(ssh ${ssh_opts} "${ssh_target}" 'ls -1t /var/lib/homelab-proxmox/artifacts/service-deploy-runs | head -1')"
          test -n "${RUN_ID}"
          echo "RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Fetch evidence pack
        if: always()
        run: |
          mkdir -p evidence
          set -euo pipefail
          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"
          ssh ${ssh_opts} "${ssh_target}" "tar czf /tmp/service-deploy-evidence.tgz -C /var/lib/homelab-proxmox/artifacts/service-deploy-runs ${RUN_ID}"
          scp ${ssh_opts} "${ssh_target}:/tmp/service-deploy-evidence.tgz" evidence/
          tar xzf evidence/service-deploy-evidence.tgz -C evidence/

      - name: Verify evidence pack (offline)
        if: always()
        run: ./scripts/lab/ci-verify.sh evidence/${RUN_ID}

      - name: Detect destructive blast radius
        id: detect_destructive
        if: steps.plan_on_pve.outcome == 'success'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          run_id = os.environ.get('RUN_ID')
          if not run_id:
            raise SystemExit('Missing RUN_ID')
          path = os.path.join('evidence', run_id, 'blast-radius.json')
          with open(path, 'r', encoding='utf-8') as f:
            doc = json.load(f)
          destructive = bool(doc.get('destructive'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
            out.write(f"destructive={'true' if destructive else 'false'}\n")
          print(f"destructive={destructive}")
          PY

      - name: Offline fixtures (post-run)
        if: always()
        run: ./scripts/lab/ci-verify.sh fixtures/evidence-packs/valid

      - name: Debug summary (on plan failure)
        if: steps.plan_on_pve.outcome != 'success'
        run: |
          set -euo pipefail
          echo "--- DEBUG: evidence/${RUN_ID}/reports/plan/tfvars.txt ---"
          cat "evidence/${RUN_ID}/reports/plan/tfvars.txt" 2>/dev/null || true

          echo "--- DEBUG: evidence/${RUN_ID}/preflight.txt ---"
          cat "evidence/${RUN_ID}/preflight.txt" 2>/dev/null || true

          echo "--- DEBUG: evidence/${RUN_ID}/reports/plan/summary.txt ---"
          cat "evidence/${RUN_ID}/reports/plan/summary.txt" 2>/dev/null || true

          echo "--- DEBUG: tail plan output ---"
          tail -n 200 "evidence/${RUN_ID}/reports/plan/plan.txt" 2>/dev/null || true

      - name: Fail job if plan failed
        if: steps.plan_on_pve.outcome != 'success'
        run: |
          echo "ERROR: Plan on PVE failed" >&2
          exit 1

      - uses: actions/upload-artifact@v4
        if: env.ACT != 'true'
        with:
          name: service-deploy-evidence-${{ env.RUN_ID }}
          path: evidence/

  apply_lab:
    name: Apply (LAB) + Idempotency
    runs-on: [self-hosted]
    needs: [plan]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'lab'
    concurrency:
      group: lxc-deploy-${{ github.event.inputs.environment }}-${{ github.event.inputs.service }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Fail fast on forbidden inputs
        run: |
          set -euo pipefail
          vals=(
            "${{ github.event.inputs.service }}"
            "${{ github.event.inputs.confirm_destructive }}"
          )
          for v in "${vals[@]}"; do
            if [[ "${v}" == *"-target"* ]]; then
              echo "ERROR: Forbidden target-like input detected (-target)." >&2
              exit 1
            fi
          done

      - name: Destructive confirm gate (LAB)
        run: |
          set -euo pipefail
          destructive="${{ needs.plan.outputs.destructive }}"
          confirm_destructive="${{ github.event.inputs.confirm_destructive }}"
          if [[ "${destructive}" == "true" ]]; then
            if [[ "${confirm_destructive}" != "apply-lab-destructive" ]]; then
              echo "ERROR: Plan is destructive (replace/destroy)." >&2
              echo "Remediation: rerun workflow with confirm_destructive=apply-lab-destructive" >&2
              exit 1
            fi
          fi

      - name: Install rsync/ssh (act fallback)
        if: env.ACT == 'true'
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            apt-get update
            apt-get install -y rsync openssh-client
          fi

      - name: Validate CI IaC posture
        run: ./scripts/lab/ci-validate-iac.sh

      - name: Ensure artifact root on PVE
        run: |
          SSH_USER=ci PROXMOX_HOST="${PROXMOX_HOST:-pve}" ./scripts/lab/guardrails.sh ensure-artifacts

      - name: Least privilege smoke checks (PVE)
        run: |
          set -euo pipefail
          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          who="$(ssh ${ssh_opts} "${ssh_target}" 'whoami')"
          if [[ "${who}" == "root" ]]; then
            echo "ERROR: remote whoami returned root; refusing"
            exit 1
          fi
          ssh ${ssh_opts} "${ssh_target}" 'id'
          ssh ${ssh_opts} "${ssh_target}" 'sudo -n -l || true'

          if ssh ${ssh_opts} "${ssh_target}" 'sudo -n bash -lc "true"' >/dev/null 2>&1; then
            echo "ERROR: sudo allows launching a shell (sudo -n bash)"
            exit 1
          fi

      - name: Sync repo to PVE
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'terraform/.terraform/' \
            --exclude 'terraform/.terraform.lock.hcl' \
            --exclude 'terraform/terraform.tfstate' \
            --exclude 'terraform/terraform.tfstate.backup' \
            --exclude 'scripts/lab/artifacts/' \
            --exclude 'artifacts/' \
            ./ "ci@${PROXMOX_HOST:-pve}:/home/ci/homelab-proxmox/"

      - name: Apply 1 (LAB)
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          service="${{ github.event.inputs.service }}"
          if [[ -n "${ANSIBLE_VAULT_PASSWORD:-}" ]]; then
            ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"
            ssh ${ssh_opts} "ci@${PROXMOX_HOST:-pve}" "set -euo pipefail; umask 077; pwfile=\"\$(mktemp -t ansible-vault.XXXXXX)\"; cat >\"\${pwfile}\"; export ANSIBLE_VAULT_PASSWORD_FILE=\"\${pwfile}\"; cd /home/ci/homelab-proxmox/scripts/lab && ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars VAULT_ID=lab ./pve-service-deploy apply --environment lab --service '${service}'; rm -f \"\${pwfile}\"" <<<"${ANSIBLE_VAULT_PASSWORD}"
          else
            ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"
            ssh ${ssh_opts} "ci@${PROXMOX_HOST:-pve}" "cd /home/ci/homelab-proxmox/scripts/lab && ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars VAULT_ID=lab ./pve-service-deploy apply --environment lab --service '${service}'"
          fi

      - name: Capture RUN_ID (apply 1)
        run: |
          set -euo pipefail
          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"
          RUN_ID_1="$(ssh ${ssh_opts} "${ssh_target}" 'ls -1t /var/lib/homelab-proxmox/artifacts/service-deploy-runs | head -1')"
          test -n "${RUN_ID_1}"
          echo "RUN_ID_1=${RUN_ID_1}" >> "$GITHUB_ENV"

      - name: Fetch evidence pack (apply 1)
        run: |
          mkdir -p evidence
          set -euo pipefail
          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"
          ssh ${ssh_opts} "${ssh_target}" "tar czf /tmp/service-deploy-evidence-1.tgz -C /var/lib/homelab-proxmox/artifacts/service-deploy-runs ${RUN_ID_1}"
          scp ${ssh_opts} "${ssh_target}:/tmp/service-deploy-evidence-1.tgz" evidence/
          tar xzf evidence/service-deploy-evidence-1.tgz -C evidence/

      - name: Verify evidence pack (offline) (apply 1)
        run: ./scripts/lab/ci-verify.sh evidence/${RUN_ID_1}

      - name: Apply 2 (LAB) (idempotency)
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          service="${{ github.event.inputs.service }}"
          if [[ -n "${ANSIBLE_VAULT_PASSWORD:-}" ]]; then
            ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"
            ssh ${ssh_opts} "ci@${PROXMOX_HOST:-pve}" "set -euo pipefail; umask 077; pwfile=\"\$(mktemp -t ansible-vault.XXXXXX)\"; cat >\"\${pwfile}\"; export ANSIBLE_VAULT_PASSWORD_FILE=\"\${pwfile}\"; cd /home/ci/homelab-proxmox/scripts/lab && ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars VAULT_ID=lab ./pve-service-deploy apply --environment lab --service '${service}'; rm -f \"\${pwfile}\"" <<<"${ANSIBLE_VAULT_PASSWORD}"
          else
            ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"
            ssh ${ssh_opts} "ci@${PROXMOX_HOST:-pve}" "cd /home/ci/homelab-proxmox/scripts/lab && ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars VAULT_ID=lab ./pve-service-deploy apply --environment lab --service '${service}'"
          fi

      - name: Capture RUN_ID (apply 2)
        run: |
          set -euo pipefail
          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"
          RUN_ID_2="$(ssh ${ssh_opts} "${ssh_target}" 'ls -1t /var/lib/homelab-proxmox/artifacts/service-deploy-runs | head -1')"
          test -n "${RUN_ID_2}"
          echo "RUN_ID_2=${RUN_ID_2}" >> "$GITHUB_ENV"

      - name: Assert idempotency (apply 2 plan has no changes)
        run: |
          set -euo pipefail
          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"
          exitcode=$(ssh ${ssh_opts} "${ssh_target}" "cat /var/lib/homelab-proxmox/artifacts/service-deploy-runs/${RUN_ID_2}/reports/plan/exitcode.txt")
          if [[ "$exitcode" != "0" ]]; then
            echo "Expected plan exit code 0 on second apply, got $exitcode"
            exit 1
          fi

      - name: Fetch evidence pack (apply 2)
        run: |
          set -euo pipefail
          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"
          ssh ${ssh_opts} "${ssh_target}" "tar czf /tmp/service-deploy-evidence-2.tgz -C /var/lib/homelab-proxmox/artifacts/service-deploy-runs ${RUN_ID_2}"
          scp ${ssh_opts} "${ssh_target}:/tmp/service-deploy-evidence-2.tgz" evidence/
          tar xzf evidence/service-deploy-evidence-2.tgz -C evidence/

      - name: Verify evidence pack (offline) (apply 2)
        run: ./scripts/lab/ci-verify.sh evidence/${RUN_ID_2}

      - uses: actions/upload-artifact@v4
        if: env.ACT != 'true'
        with:
          name: service-deploy-evidence-lab-${{ env.RUN_ID_1 }}-${{ env.RUN_ID_2 }}
          path: evidence/

  apply_prod:
    name: Apply (PROD) (gated)
    runs-on: [self-hosted]
    needs: [plan]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod' && github.event.inputs.confirm == 'deploy-prod'
    environment: prod
    concurrency:
      group: lxc-deploy-${{ github.event.inputs.environment }}-${{ github.event.inputs.service }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Fail fast on forbidden inputs
        run: |
          set -euo pipefail
          vals=(
            "${{ github.event.inputs.service }}"
            "${{ github.event.inputs.confirm }}"
            "${{ github.event.inputs.confirm_destructive }}"
          )
          for v in "${vals[@]}"; do
            if [[ "${v}" == *"-target"* ]]; then
              echo "ERROR: Forbidden target-like input detected (-target)." >&2
              exit 1
            fi
          done

      - name: Destructive confirm gate (PROD)
        run: |
          set -euo pipefail
          destructive="${{ needs.plan.outputs.destructive }}"
          confirm_destructive="${{ github.event.inputs.confirm_destructive }}"
          if [[ "${destructive}" == "true" ]]; then
            if [[ "${confirm_destructive}" != "deploy-prod-destructive" ]]; then
              echo "ERROR: Plan is destructive (replace/destroy)." >&2
              echo "Remediation: rerun workflow with confirm_destructive=deploy-prod-destructive" >&2
              exit 1
            fi
          fi

      - name: Install rsync/ssh (act fallback)
        if: env.ACT == 'true'
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            apt-get update
            apt-get install -y rsync openssh-client
          fi

      - name: Validate CI IaC posture
        run: ./scripts/lab/ci-validate-iac.sh

      - name: Ensure artifact root on PVE
        run: |
          SSH_USER=ci PROXMOX_HOST="${PROXMOX_HOST:-pve}" ./scripts/lab/guardrails.sh ensure-artifacts

      - name: Least privilege smoke checks (PVE)
        run: |
          set -euo pipefail
          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          who="$(ssh ${ssh_opts} "${ssh_target}" 'whoami')"
          if [[ "${who}" == "root" ]]; then
            echo "ERROR: remote whoami returned root; refusing"
            exit 1
          fi
          ssh ${ssh_opts} "${ssh_target}" 'id'
          ssh ${ssh_opts} "${ssh_target}" 'sudo -n -l || true'

          if ssh ${ssh_opts} "${ssh_target}" 'sudo -n bash -lc "true"' >/dev/null 2>&1; then
            echo "ERROR: sudo allows launching a shell (sudo -n bash)"
            exit 1
          fi

      - name: Sync repo to PVE
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'terraform/.terraform/' \
            --exclude 'terraform/.terraform.lock.hcl' \
            --exclude 'terraform/terraform.tfstate' \
            --exclude 'terraform/terraform.tfstate.backup' \
            --exclude 'scripts/lab/artifacts/' \
            --exclude 'artifacts/' \
            ./ "ci@${PROXMOX_HOST:-pve}:/home/ci/homelab-proxmox/"

      - name: Apply (PROD)
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          service="${{ github.event.inputs.service }}"
          confirm="${{ github.event.inputs.confirm }}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          if [[ -n "${ANSIBLE_VAULT_PASSWORD:-}" ]]; then
            ssh ${ssh_opts} "ci@${PROXMOX_HOST:-pve}" "set -euo pipefail; umask 077; pwfile=\"\$(mktemp -t ansible-vault.XXXXXX)\"; cat >\"\${pwfile}\"; export ANSIBLE_VAULT_PASSWORD_FILE=\"\${pwfile}\"; cd /home/ci/homelab-proxmox/scripts/lab && ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars ALLOW_PROD_APPLY=1 VAULT_ID=prod ./pve-service-deploy apply --environment prod --service '${service}' --confirm '${confirm}'; rm -f \"\${pwfile}\"" <<<"${ANSIBLE_VAULT_PASSWORD}"
          else
            ssh ${ssh_opts} "ci@${PROXMOX_HOST:-pve}" "cd /home/ci/homelab-proxmox/scripts/lab && ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars ALLOW_PROD_APPLY=1 VAULT_ID=prod ./pve-service-deploy apply --environment prod --service '${service}' --confirm '${confirm}'"
          fi

      - name: Capture RUN_ID (prod)
        run: |
          set -euo pipefail
          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"
          RUN_ID_PROD="$(ssh ${ssh_opts} "${ssh_target}" 'ls -1t /var/lib/homelab-proxmox/artifacts/service-deploy-runs | head -1')"
          test -n "${RUN_ID_PROD}"
          echo "RUN_ID_PROD=${RUN_ID_PROD}" >> "$GITHUB_ENV"

      - name: Fetch evidence pack (prod)
        run: |
          mkdir -p evidence
          set -euo pipefail
          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"
          ssh ${ssh_opts} "${ssh_target}" "tar czf /tmp/service-deploy-evidence-prod.tgz -C /var/lib/homelab-proxmox/artifacts/service-deploy-runs ${RUN_ID_PROD}"
          scp ${ssh_opts} "${ssh_target}:/tmp/service-deploy-evidence-prod.tgz" evidence/
          tar xzf evidence/service-deploy-evidence-prod.tgz -C evidence/

      - name: Verify evidence pack (offline) (prod)
        run: ./scripts/lab/ci-verify.sh evidence/${RUN_ID_PROD}

      - uses: actions/upload-artifact@v4
        if: env.ACT != 'true'
        with:
          name: service-deploy-evidence-prod-${{ env.RUN_ID_PROD }}
          path: evidence/
