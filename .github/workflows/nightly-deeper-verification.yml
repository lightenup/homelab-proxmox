name: Nightly deeper verification

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      run_on_pve:
        description: "Run heavy steps on PVE via SSH"
        type: boolean
        default: true

jobs:
  deeper:
    runs-on: [self-hosted]
    steps:
            - uses: actions/checkout@v4

            - name: Setup Python (GitHub-hosted only)
              if: ${{ contains(runner.name, 'GitHub Actions') }}
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Validate system Python (self-hosted)
              if: ${{ !contains(runner.name, 'GitHub Actions') }}
              run: |
                  set -euo pipefail
                  python3 --version
                  python3 -c "import sys; assert sys.version_info[:2] >= (3, 11), sys.version"

            - name: Setup uv
              uses: astral-sh/setup-uv@v3

            - name: Cache uv
              uses: actions/cache@v4
              with:
                  path: ~/.cache/uv
                  key: uv-${{ runner.os }}-${{ hashFiles('python/requirements-nightly.lock.txt') }}

            - name: Install rsync/ssh (PVE remote)
              if: ${{ inputs.run_on_pve }}
              run: |
                  if ! command -v rsync >/dev/null 2>&1; then
                    sudo apt-get update
                    sudo apt-get install -y rsync openssh-client
                  fi

            - name: Install nightly dependencies
              run: |
                  uv venv --python 3.11
                  uv pip sync --python .venv/bin/python --require-hashes python/requirements-nightly.lock.txt

            - name: Install Ansible Galaxy deps
              run: |
                  .venv/bin/ansible-galaxy role install -r ansible/requirements.yml
                  .venv/bin/ansible-galaxy collection install -r ansible/requirements.yml

            - name: Ensure artifact root on PVE
              if: ${{ inputs.run_on_pve }}
              run: |
                  SSH_USER=ci PROXMOX_HOST=pve ./scripts/lab/guardrails.sh ensure-artifacts

            - name: Sync repo to PVE
              if: ${{ inputs.run_on_pve }}
              run: |
                  rsync -az --delete \
                    --exclude '.git' \
                    --exclude 'artifacts/' \
                    ./ ci@pve:/home/ci/homelab-proxmox/

            - name: Debug runner + mounts
              run: |
                  set -euo pipefail
                  echo "Runner name: ${RUNNER_NAME:-unknown}"
                  echo "Runner OS: ${RUNNER_OS:-unknown}"
                  echo "Runner arch: ${RUNNER_ARCH:-unknown}"
                  uname -a
                  echo "--- /etc/os-release ---"
                  cat /etc/os-release || true
                  echo "--- mounts (grep nas) ---"
                  mount | grep -i nas || true
                  echo "--- /mnt ---"
                  ls -la /mnt || true
                  echo "--- /mnt/nas ---"
                  ls -la /mnt/nas || true

            - name: Prepare mutmut shared cache
              if: ${{ !inputs.run_on_pve }}
              run: |
                  set -euo pipefail

                  cache_root="/mnt/nas/homelab_ci/mutmut-cache"
                  cache_path="$cache_root/${GITHUB_REF_NAME:-unknown}"

                  if [ ! -d "/mnt/nas/homelab_ci" ]; then
                    echo "::error::Shared cache mount missing at /mnt/nas/homelab_ci. Mount the NAS share and ensure it is writable."
                    exit 1
                  fi

                  mkdir -p "$cache_root"
                  if ! touch "$cache_path"; then
                    echo "::error::Shared cache path is not writable: $cache_path"
                    exit 1
                  fi

                  rm -f .mutmut-cache
                  ln -sfn "$cache_path" .mutmut-cache

            - name: Mutation testing (mutmut) on PVE
              if: ${{ inputs.run_on_pve }}
              run: |
                  ssh ci@pve "cd /home/ci/homelab-proxmox && \
                    .venv/bin/mutmut run \
                      --CI \
                      --no-progress \
                      --paths-to-mutate python/src/homelab_proxmox_orchestrator \
                      --tests-dir python/tests \
                      --runner \"env PYTHONPATH=python/src .venv/bin/python -m pytest -q -c python/pytest.ini -n auto\" && \
                    .venv/bin/mutmut results"

            - name: Mutation testing (mutmut)
              if: ${{ !inputs.run_on_pve }}
              run: |
                  .venv/bin/mutmut run \
                    --CI \
                    --no-progress \
                    --paths-to-mutate python/src/homelab_proxmox_orchestrator \
                    --tests-dir python/tests \
                    --runner "env PYTHONPATH=python/src .venv/bin/python -m pytest -q -c python/pytest.ini -n auto"
                  .venv/bin/mutmut results
                  echo "::group::Mutmut survivors/timeouts"
                  .venv/bin/mutmut result-ids survived || true
                  .venv/bin/mutmut result-ids timeout || true
                  .venv/bin/mutmut result-ids suspicious || true
                  echo "::endgroup::"

            - name: Molecule test (adguard)
              run: |
                  set -euxo pipefail

                  source .venv/bin/activate
                  which python
                  python --version
                  which ansible-playbook
                  ansible --version
                  python -c "import docker; print('docker sdk:', docker.__version__)"
                  docker version

                  cd ansible/roles/adguard

                  # Force Molecule to place ephemeral state/logs in-repo so we can dump/upload them.
                  export MOLECULE_EPHEMERAL_DIRECTORY="$PWD/.molecule"
                  mkdir -p "$MOLECULE_EPHEMERAL_DIRECTORY"

                  molecule --debug test || {
                    rc=$?
                    echo "::group::Molecule log dump"
                    echo "MOLECULE_EPHEMERAL_DIRECTORY=$MOLECULE_EPHEMERAL_DIRECTORY"
                    echo "PWD=$PWD"

                    ls -la "$MOLECULE_EPHEMERAL_DIRECTORY" || true
                    find "$MOLECULE_EPHEMERAL_DIRECTORY" -maxdepth 8 -type f -print || true
                    find "$MOLECULE_EPHEMERAL_DIRECTORY" -maxdepth 8 -type f \( -name "*.log" -o -name "*.txt" -o -name "*.yml" -o -name "*.yaml" \) -print0 \
                      | xargs -0 -I{} sh -c 'echo "----- {} -----"; tail -n 200 "{}" || true'

                    # Also dump common fallback locations used by Molecule/Ansible on GitHub runners.
                    if [ -d "$HOME/.cache/molecule" ]; then
                      echo "::group::~/.cache/molecule (tail)"
                      find "$HOME/.cache/molecule" -maxdepth 6 -type f \( -name "*.log" -o -name "*.txt" -o -name "*.yml" -o -name "*.yaml" \) -print0 \
                        | xargs -0 -I{} sh -c 'echo "----- {} -----"; tail -n 200 "{}" || true'
                      echo "::endgroup::"
                    fi

                    if [ -d "$HOME/.ansible/tmp" ]; then
                      echo "::group::~/.ansible/tmp (molecule inventories)"
                      find "$HOME/.ansible/tmp" -maxdepth 3 -type f -name inventory -print0 \
                        | xargs -0 -I{} sh -c 'echo "----- {} -----"; tail -n 200 "{}" || true'
                      echo "::endgroup::"
                    fi

                    echo "::endgroup::"
                    exit $rc
                  }

            - name: Upload artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: nightly-deeper-artifacts
                  if-no-files-found: ignore
                  include-hidden-files: true
                  path: |
                      .mutmut-cache
                      mutants/
                      ansible/roles/adguard/.molecule/
                      ansible/roles/adguard/molecule/
                      python/mutmut.ini
