name: Nightly deeper verification

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      min_score:
        description: "Override the floor for this run (alert test); empty = committed floor"
        type: string
        required: false
        default: ""

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Decide whether to run
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=not-main" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Manual dispatches always run (e.g. a min_score alert test on an unchanged main).
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual-dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/nightly-deeper-verification.yml/runs?branch=main&status=success&per_page=1"
          last_sha=$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "$api" \
            | python -c 'import json,sys; data=json.load(sys.stdin); runs=data.get("workflow_runs", []); print(runs[0]["head_sha"] if runs else "")')

          if [ -z "$last_sha" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=first-run" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$last_sha" = "$GITHUB_SHA" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-new-commits" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "reason=new-commits" >> "$GITHUB_OUTPUT"

  deeper:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: [self-hosted]
    timeout-minutes: 30
    env:
      MUTMUT_MIN_SCORE: ${{ inputs.min_score }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate system Python (self-hosted)
        if: ${{ !contains(runner.name, 'GitHub Actions') }}
        run: |
          set -euo pipefail
          python3 --version
          python3 -c "import sys; assert sys.version_info[:2] >= (3, 11), sys.version"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('python/requirements-nightly.lock.txt') }}

      - name: Install rsync/ssh (PVE remote)
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y rsync openssh-client
          fi

      - name: Install nightly dependencies
        run: |
          uv venv --python 3.11 --clear
          uv pip sync --python .venv/bin/python --require-hashes python/requirements-nightly.lock.txt

      - name: Sync repo to PVE
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'artifacts/' \
            --exclude 'mutants/' \
            ./ ci@pve:/home/ci/homelab-proxmox/

      - name: Prepare Python venv on PVE
        run: |
          ssh ci@pve 'set -euo pipefail; \
            if ! command -v uv >/dev/null 2>&1; then \
              curl -LsSf https://astral.sh/uv/install.sh | sh; \
            fi; \
            export PATH="$HOME/.local/bin:$PATH"; \
            if ! command -v python3.11 >/dev/null 2>&1; then \
              uv python install 3.11; \
            fi; \
            cd /home/ci/homelab-proxmox && \
            uv venv --python 3.11 --clear; \
            .venv/bin/python --version; \
            uv pip sync --python .venv/bin/python --require-hashes python/requirements-nightly.lock.txt'

      - name: Check NAS mount on PVE
        run: |
          set -euo pipefail
          if ! ssh ci@pve 'test -d /mnt/nas/homelab_ci && touch /mnt/nas/homelab_ci/.write-test && rm /mnt/nas/homelab_ci/.write-test'; then
            echo "::error::Shared mount missing at /mnt/nas/homelab_ci on PVE."
            exit 1
          fi

      - name: Validate min_score
        run: |
          set -euo pipefail
          if [ -n "${MUTMUT_MIN_SCORE:-}" ]; then
            # Anchored match on the whole value: grep would accept a multiline input with one
            # numeric line, and this value is interpolated into the remote ssh command.
            if [[ ! "$MUTMUT_MIN_SCORE" =~ ^[0-9]{1,3}(\.[0-9]+)?$ ]]; then
              echo "::error::min_score must be a number such as 61 or 61.5"
              exit 1
            fi
          fi

      - name: Run mutation gate on PVE
        id: gate_run
        run: |
          set +e
          ssh ci@pve "cd /home/ci/homelab-proxmox && PYTHON_BIN=.venv/bin/python MUTMUT_COMMIT='${GITHUB_SHA}' MUTMUT_MIN_SCORE='${MUTMUT_MIN_SCORE}' bash scripts/ci/mutmut-threshold.sh"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          set -e
          exit 0

      - name: Fetch mutation report
        if: always()
        run: |
          set -euo pipefail
          scp ci@pve:/home/ci/homelab-proxmox/mutants/report.json ci@pve:/home/ci/homelab-proxmox/mutants/survivors.txt . || true
          if [ -f report.json ]; then
            python3 << 'PYEOF' >> "$GITHUB_STEP_SUMMARY"
            import json
            with open("report.json") as f:
                r = json.load(f)
            c = r["counts"]
            print(f"| Metric | Value |")
            print(f"|---|---|")
            print(f"| Score | {r['score']:.2f}% |")
            print(f"| Floor | {r['floor']:.2f}% |")
            print(f"| Margin | {r['margin']:.2f} |")
            print(f"| Gate | {r['gate']:.2f}% |")
            print(f"| Killed | {c['killed']} |")
            print(f"| Survived | {c['survived']} |")
            print(f"| No tests | {c['no_tests']} |")
            print(f"| Total | {c['total']} |")
            PYEOF
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Top survivor modules" >> "$GITHUB_STEP_SUMMARY"
            head -10 survivors.txt >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Publish main results to NAS
        id: publish
        if: ${{ steps.gate_run.outputs.rc == '0' || steps.gate_run.outputs.rc == '1' }}
        run: |
          ssh ci@pve bash -s <<'EOF'
          set -euo pipefail
          root=/mnt/nas/homelab_ci/mutmut
          ts="$(date -u +%Y%m%dT%H%M%SZ)"
          dest="$root/main-$ts"
          mkdir -p "$dest"

          cd /home/ci/homelab-proxmox/mutants
          find . -name '*.meta' -print0 | rsync -a --from0 --files-from=- ./ "$dest/"
          cp mutmut-stats.json mutmut-cicd-stats.json survivors.txt "$dest/"
          cp report.json "$dest/"

          ln -sfn "main-$ts" "$root/main.tmp" && mv -T "$root/main.tmp" "$root/main"

          ls -1d "$root"/main-* | sort | head -n -2 | xargs -r rm -rf

          readlink "$root/main"
          EOF

      - name: Fail on gate result
        if: always()
        run: |
          set -euo pipefail
          rc="${{ steps.gate_run.outputs.rc }}"
          if [ "$rc" != "0" ]; then
            echo "::error::Mutation gate failed with rc=$rc"
            exit 1
          fi
          echo "Mutation gate passed."
