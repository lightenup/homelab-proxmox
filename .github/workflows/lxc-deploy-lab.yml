name: Lab 2 - LXC Deploy

env:
  # Optional internal toggle to call the Python runner on PVE.
  # Set repository variable USE_PY_RUNNER=true to enable.
  USE_PY_RUNNER: ${{ vars.USE_PY_RUNNER }}

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy"
        required: true
        type: choice
        options:
          - eurooffice
          - financial-scenario
          - hermes
          - market-model
          - homeassistant
          - immich
          - jellyfin
          - llm-router
          - monitoring
          - nextcloud
          - ntfy
          - reverse_proxy
      apply:
        description: "Run plan+apply (true) or plan-only (false)"
        required: true
        type: boolean
        default: false
      confirm_destructive:
        description: "Only when plan has replace/destroy: check to allow apply"
        required: false
        type: boolean
        default: false

jobs:
  plan:
    name: Plan (LAB)
    runs-on: [self-hosted]
    outputs:
      run_id: ${{ steps.capture_run_id.outputs.run_id }}
      destructive: ${{ steps.detect_destructive.outputs.destructive }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail fast on forbidden inputs
        run: |
          set -euo pipefail
          vals=(
            "${{ github.event.inputs.service }}"
          )
          for v in "${vals[@]}"; do
            if [[ "${v}" == *"-target"* ]]; then
              echo "ERROR: Forbidden target-like input detected (-target)." >&2
              exit 1
            fi
          done

      - name: Allowlist runtime validation
        run: |
          set -euo pipefail
          service="${{ github.event.inputs.service }}"
          jq -e --arg s "${service}" 'has($s)' ./scripts/lab/service-scope-allowlist.json >/dev/null

      - name: Sync repo to PVE
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'terraform/.terraform/' \
            --exclude 'terraform/.terraform.lock.hcl' \
            --exclude 'terraform/terraform.tfstate' \
            --exclude 'terraform/terraform.tfstate.backup' \
            --exclude 'scripts/lab/artifacts/' \
            --exclude 'artifacts/' \
            ./ "ci@${PROXMOX_HOST:-pve}:/home/ci/homelab-proxmox/"

      - name: Plan on PVE
        id: plan_on_pve
        continue-on-error: true
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          PROXMOX_API_TOKEN_SECRET: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
        run: |
          set -euo pipefail

          service="${{ github.event.inputs.service }}"

          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          if [[ "${USE_PY_RUNNER:-}" == "true" ]]; then
            remote_cmd="cd /home/ci/homelab-proxmox && ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars VAULT_ID=lab bash scripts/lab/python.sh -m homelab_proxmox_orchestrator.cli plan --environment lab --service '${service}' --evidence-root /var/lib/homelab-proxmox/artifacts --runner-script-path ./scripts/lab/pve-service-deploy"
          else
            remote_cmd="cd /home/ci/homelab-proxmox/scripts/lab && ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars VAULT_ID=lab ./pve-service-deploy plan --environment lab --service '${service}'"
          fi

          # Stream secrets via stdin (line 1 = vault pw, line 2 = proxmox token secret).
          printf '%s\n%s\n' "${ANSIBLE_VAULT_PASSWORD:-}" "${PROXMOX_API_TOKEN_SECRET:-}" | \
          ssh ${ssh_opts} "${ssh_target}" "set -euo pipefail; umask 077; read -r _vault_pw; read -r _tf_secret; if [ -n \"\${_vault_pw}\" ]; then pwfile=\"\$(mktemp -t ansible-vault.XXXXXX)\"; printf '%s' \"\${_vault_pw}\" >\"\${pwfile}\"; export ANSIBLE_VAULT_PASSWORD_FILE=\"\${pwfile}\"; fi; if [ -n \"\${_tf_secret}\" ]; then export TF_VAR_proxmox_api_token_id='terraform@pve!terraform-token'; export TF_VAR_proxmox_api_token_secret=\"\${_tf_secret}\"; export PROXMOX_API_TOKEN_SECRET=\"\${_tf_secret}\"; fi; ${remote_cmd}; rm -f \"\${pwfile:-}\""

      - name: Capture RUN_ID
        id: capture_run_id
        if: always()
        run: |
          set -euo pipefail
          service="${{ github.event.inputs.service }}"

          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          RUN_ID="$(ssh ${ssh_opts} "${ssh_target}" "cd /var/lib/homelab-proxmox/artifacts/service-deploy-runs && ls -1td \"lab-${service}-\"*/ 2>/dev/null | head -1 | sed 's:/*$::'" | tr -d '\r\n')"
          RUN_ID="${RUN_ID%/}"
          RUN_ID="${RUN_ID%:}"
          test -n "${RUN_ID}"
          echo "RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Fetch evidence pack
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence

          RUN_ID="${{ steps.capture_run_id.outputs.run_id }}"
          test -n "${RUN_ID}"

          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          ssh ${ssh_opts} "${ssh_target}" "tar czf /tmp/service-deploy-evidence.tgz -C /var/lib/homelab-proxmox/artifacts/service-deploy-runs \"${RUN_ID}\""
          scp ${ssh_opts} "${ssh_target}:/tmp/service-deploy-evidence.tgz" evidence/
          tar xzf evidence/service-deploy-evidence.tgz -C evidence/

      - name: Verify evidence pack (offline)
        if: always()
        run: ./scripts/lab/ci-verify.sh evidence/${{ steps.capture_run_id.outputs.run_id }}

      - name: Detect destructive blast radius
        id: detect_destructive
        if: steps.plan_on_pve.outcome == 'success'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          run_id = os.environ.get('RUN_ID')
          if not run_id:
              raise SystemExit('Missing RUN_ID')

          path = os.path.join('evidence', run_id, 'blast-radius.json')
          with open(path, 'r', encoding='utf-8') as f:
              doc = json.load(f)

          destructive = bool(doc.get('destructive'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"destructive={'true' if destructive else 'false'}\n")

          print(f"destructive={destructive}")
          PY

      - name: Enforce destructive confirmation (apply requested)
        if: |
          steps.plan_on_pve.outcome == 'success' &&
          github.event.inputs.apply == 'true' &&
          steps.detect_destructive.outputs.destructive == 'true' &&
          github.event.inputs.confirm_destructive != 'true'
        run: |
          echo "ERROR: Plan is destructive (replace/destroy)." >&2
          echo "Rerun with confirm_destructive=true to allow apply." >&2
          exit 1

      - name: Fail job if plan failed
        if: steps.plan_on_pve.outcome != 'success'
        run: |
          echo "ERROR: LAB plan failed" >&2
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: lab-evidence-${{ github.event.inputs.service }}-${{ steps.capture_run_id.outputs.run_id }}
          # plan.tfplan holds every Terraform variable in plaintext; it stays on pve.
          path: |
            evidence
            !evidence/**/*.tfplan

  apply:
    name: Apply (LAB)
    runs-on: [self-hosted]
    needs: [plan]
    if: |
      github.event.inputs.apply == 'true' &&
      (needs.plan.outputs.destructive != 'true' || github.event.inputs.confirm_destructive == 'true')
    concurrency:
      group: lxc-deploy-lab-${{ github.event.inputs.service }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Allowlist runtime validation
        run: |
          set -euo pipefail
          service="${{ github.event.inputs.service }}"
          jq -e --arg s "${service}" 'has($s)' ./scripts/lab/service-scope-allowlist.json >/dev/null

      - name: Sync repo to PVE
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'terraform/.terraform/' \
            --exclude 'terraform/.terraform.lock.hcl' \
            --exclude 'terraform/terraform.tfstate' \
            --exclude 'terraform/terraform.tfstate.backup' \
            --exclude 'scripts/lab/artifacts/' \
            --exclude 'artifacts/' \
            ./ "ci@${PROXMOX_HOST:-pve}:/home/ci/homelab-proxmox/"

      - name: Apply on PVE
        id: apply_on_pve
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          PROXMOX_API_TOKEN_SECRET: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
        run: |
          set -euo pipefail

          service="${{ github.event.inputs.service }}"

          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          if [[ "${USE_PY_RUNNER:-}" == "true" ]]; then
            remote_cmd="cd /home/ci/homelab-proxmox && ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars VAULT_ID=lab bash scripts/lab/python.sh -m homelab_proxmox_orchestrator.cli apply --environment lab --service '${service}' --evidence-root /var/lib/homelab-proxmox/artifacts --runner-script-path ./scripts/lab/pve-service-deploy"
          else
            remote_cmd="cd /home/ci/homelab-proxmox/scripts/lab && ARTIFACT_ROOT=/var/lib/homelab-proxmox/artifacts ARTIFACT_RUNS_DIR=service-deploy-runs TFVARS_DIR=/var/lib/homelab-proxmox/tfvars VAULT_ID=lab ./pve-service-deploy apply --environment lab --service '${service}'"
          fi

          printf '%s\n%s\n' "${ANSIBLE_VAULT_PASSWORD:-}" "${PROXMOX_API_TOKEN_SECRET:-}" | \
          ssh ${ssh_opts} "${ssh_target}" "set -euo pipefail; umask 077; read -r _vault_pw; read -r _tf_secret; if [ -n \"\${_vault_pw}\" ]; then pwfile=\"\$(mktemp -t ansible-vault.XXXXXX)\"; printf '%s' \"\${_vault_pw}\" >\"\${pwfile}\"; export ANSIBLE_VAULT_PASSWORD_FILE=\"\${pwfile}\"; fi; if [ -n \"\${_tf_secret}\" ]; then export TF_VAR_proxmox_api_token_id='terraform@pve!terraform-token'; export TF_VAR_proxmox_api_token_secret=\"\${_tf_secret}\"; export PROXMOX_API_TOKEN_SECRET=\"\${_tf_secret}\"; fi; ${remote_cmd}; rm -f \"\${pwfile:-}\""

      - name: Capture RUN_ID
        id: capture_run_id
        if: always()
        run: |
          set -euo pipefail
          service="${{ github.event.inputs.service }}"

          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          RUN_ID="$(ssh ${ssh_opts} "${ssh_target}" "cd /var/lib/homelab-proxmox/artifacts/service-deploy-runs && ls -1td \"lab-${service}-\"*/ 2>/dev/null | head -1 | sed 's:/*$::'" | tr -d '\r\n')"
          RUN_ID="${RUN_ID%/}"
          RUN_ID="${RUN_ID%:}"
          test -n "${RUN_ID}"
          echo "RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Fetch evidence pack
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence

          RUN_ID="${{ steps.capture_run_id.outputs.run_id }}"
          test -n "${RUN_ID}"

          ssh_target="ci@${PROXMOX_HOST:-pve}"
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o CheckHostIP=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null"

          ssh ${ssh_opts} "${ssh_target}" "tar czf /tmp/service-deploy-evidence.tgz -C /var/lib/homelab-proxmox/artifacts/service-deploy-runs \"${RUN_ID}\""
          scp ${ssh_opts} "${ssh_target}:/tmp/service-deploy-evidence.tgz" evidence/
          tar xzf evidence/service-deploy-evidence.tgz -C evidence/

      - name: Verify evidence pack (offline)
        if: always()
        run: ./scripts/lab/ci-verify.sh evidence/${{ steps.capture_run_id.outputs.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: lab-evidence-${{ github.event.inputs.service }}-${{ steps.capture_run_id.outputs.run_id }}
          # plan.tfplan holds every Terraform variable in plaintext; it stays on pve.
          path: |
            evidence
            !evidence/**/*.tfplan
