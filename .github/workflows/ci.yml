name: CI

"on":
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Guardrail: protected paths must not change"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const cfgPath = path.join(process.env.GITHUB_WORKSPACE, '.guardrails', 'protected-paths.json');
            const cfg = JSON.parse(fs.readFileSync(cfgPath, 'utf8'));

            const protectedGlobs = cfg.protectedPathGlobs || [];
            const allowLabel = cfg.allowLabel || 'allow-protected-path-changes';

            const labels = (context.payload.pull_request.labels || []).map(l => l.name);
            if (labels.includes(allowLabel)) {
              core.info(`PR has label '${allowLabel}'; skipping protected-path guardrail.`);
              return;
            }

            function matchesProtected(filePath) {
              return protectedGlobs.some((g) => {
                if (g.endsWith('/**')) {
                  return filePath.startsWith(g.slice(0, -3));
                }
                return filePath === g;
              });
            }

            const pr = context.payload.pull_request;
            const changed = [];
            for await (const resp of github.paginate.iterator(
              github.rest.pulls.listFiles,
              { owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, per_page: 100 }
            )) {
              for (const f of resp.data) {
                if (matchesProtected(f.filename)) changed.push(f.filename);
              }
            }

            if (changed.length > 0) {
              core.setFailed(
                `Protected paths were modified:\n` +
                changed.map(f => `- ${f}`).join('\n') +
                `\n\nIf this is intentional, add the PR label '${allowLabel}'.`
              );
            }

      - name: IaC posture checks
        run: bash scripts/lab/ci-validate-iac.sh

      - name: Verify evidence fixtures
        run: bash scripts/lab/ci-verify.sh scripts/lab/fixtures/evidence-packs/valid

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt/validate
        run: bash scripts/ci/terraform-validate.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('python/requirements-test.lock.txt') }}

      - name: Install Python test dependencies
        run: |
          uv venv --python 3.11
          uv pip sync --python .venv/bin/python --require-hashes python/requirements-test.lock.txt

      - name: Python tests + coverage
        run: bash scripts/ci/python-tests.sh
